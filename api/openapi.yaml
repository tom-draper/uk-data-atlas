  /areas/{geography}/{release}/{code}/citation:
    get:
      operationId: getAreaCitation
      tags: ["Governance"]
      summary: Assemble a citation bundle for one exact area identity
      description: >
        Returns what a caller needs to cite an area as served by this Atlas
        release: the immutable Atlas release, the content hash of the area
        identity artifact, the boundary release's publisher, licence and
        metadata hash, geometry provenance, the validation results for the
        release and any cited crosswalk, and an attribution block.

        Name a `measure` to cite the observation artifacts, with their content
        hashes, that hold a value for this area in a source partition assessed
        against this exact boundary release. Only those partitions' datasets
        are attributed, together with any dataset a derived measure is
        calculated from. Name a `crosswalk` to cite one that publishes a
        relationship for this area. A resource that supplies nothing for the
        area is refused rather than cited.

        Per-area geometry hashes are not compiled yet and are reported as
