  /areas/{geography}/{release}/{code}/capabilities:
    get:
      operationId: getAreaCapabilities
      tags: ["Start here"]
      summary: Report what the Atlas can serve for one exact area identity
      description: >
        Reports geometry, published relationship and crosswalk edges,
        direct-code named-location membership, and every measure's capability
        for this exact area, each in the capability vocabulary described by
        `CapabilityStatus`: `available`, `partial`, `requires-conversion`,
        `unsupported` or `not-built`, with a `reason` on every status but
        `available`.


        A measure is `available` when a source partition published on this
        release has a value for the area in every period, and `partial` when
        it has one in only some periods or its codes only partly join the
        release. It `requires-conversion` when no partition is published on
        the release but a published crosswalk converts one onto it: each entry
        in `conversions` names the crosswalk, the source partition and period,
        and a ready `href` to the convert route. A conversion is only offered
        after that exact conversion has been run on the source's latest period
        and accepted, and only if it reaches this area. A measure whose values
        do not add over areas is never offered a conversion.


        `data.measures` lists the available, partial and convertible measures;
        `data.counts` counts every measure by status, the unsupported ones
        included. Compatibility is based on area-code membership only and does
        not assert equal geometry.
