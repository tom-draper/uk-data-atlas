  /areas/{geography}/{release}/{code}/children/geometry:
    get:
      operationId: getAreaChildrenGeometry
      summary: Get every child of an area as one GeoJSON FeatureCollection
      description: >
        Returns the geometry of every area a published crosswalk names as
        contained by this one, as a single FeatureCollection: all the wards in
        a local authority in one request rather than one request each. Each
        feature carries its own identity, the crosswalk that places it in the
        collection, and its geometry provenance.


        Membership is a published crosswalk's claim, not a geometric test run
        at request time, so this returns what the Atlas has published rather
        than what a point-in-polygon sweep would find. An area with no
        published containment relationship is a 404, not an empty collection.


        `tier` generalises every member, exactly as on the geometry route, and
        is the reason this endpoint is usable at all for a large authority.
        The method is reported once for the collection rather than on each
        member; each member reports only what the tier cost it, so one that
        lost an island can be told from one that did not. Note the caveat that
        travels with it: members are generalised one at a time, so above `full`
        neighbours in the same collection may disagree along a shared border.


        A member that is published as a relationship but has no servable
        geometry is listed in `withoutGeometry` with the reason, rather than
        being passed over. `collection.members` and `collection.withGeometry`
        disagreeing is how a caller tells a partial collection from a complete
        one; the response is still a 200.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: The official source code for the parent area.
        - name: tier
          in: query
          required: false
          schema:
            type: string
            enum: [full, high, medium, low]
            default: full
          description: >
            The generalisation tier applied to every member, as on the geometry
            route.
      responses:
        "200":
          description: >
            The children as a FeatureCollection, with any that could not be
            drawn listed beside it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaChildrenGeometryEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:24a500c55416bd7d58c28b1fc8cc4931d4a2fd831addafa3116556a91f2c4857"
