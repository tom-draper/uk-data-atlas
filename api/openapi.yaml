  /data/{measure-id}/convert:
    get:
      operationId: convertSourceExactMeasure
      tags: ["Trend"]
      summary: Regroup an extensive measure onto a published crosswalk's target areas
      description: >
        Converts a source partition onto another geography or code vintage
        using the crosswalk the caller names. The route never selects a
        conversion path: `GET /crosswalks` lists the published ones, and the
        response repeats the chosen crosswalk's method, quality, weighting and
        content hash.


        The crosswalk decides the target areas, so this route selects no
        geometry release: passing `release` is refused rather than ignored.
        Ask `/data/{measure-id}` with a compatible `release` to join geometry
        to source-exact values instead.

        Only a measure declared extensive may be converted, because conversion
        works by adding values up. An intensive measure is rejected: a share or
        a rank cannot be regrouped by summing, and weighting one by area
        produces a number with no meaning.

        The reported `method` distinguishes the two outcomes. `exact` means
        every source area sits wholly within one target, so the conversion is a
        regrouping and the partition total is unchanged. `area-weighted` means
        some sources were split in proportion to overlapping area, which is an
        estimate that assumes the measure is spread evenly across each source.

        A source code the crosswalk does not carry, or a split source with no
        published weight, is rejected rather than partially converted.
      parameters:
        - $ref: "#/components/parameters/MeasureId"
        - name: crosswalk
          in: query
          required: true
          schema:
            type: string
          description: A crosswalk id returned by `GET /crosswalks`.
        - $ref: "#/components/parameters/SourcePeriod"
        - $ref: "#/components/parameters/SourceGeography"
        - $ref: "#/components/parameters/SourceBoundaryYear"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: >
            Cursor-paginated derived values on the crosswalk's target areas,
            with the conversion method and the crosswalk's own provenance.
