  /areas/{geography}/{release}/{code}/geometry:
    get:
      operationId: getAreaGeometry
      tags: ["Map"]
      summary: Get one compiled area's raw geometry as a GeoJSON Feature
      description: >
        Serves the area's own geometry from its raw, cached source GeoJSON,
        not a generalised or simplified derivative, always in WGS84. A source
        in British National Grid (EPSG:27700) is reprojected per area through
        EPSG:1314, OSGB36 to WGS 84 (6), a Helmert transformation EPSG states
        as accurate to 2 m in Great Britain; `properties.geometrySource`
        records the source CRS and any transformation applied. Northern
        Ireland areas in the releases that declare `northern-ireland-offset`
        are first moved by that correction, which the ONS's grid files need
        there, and `geometrySource.corrections` names it when applied. A code that
        maps to more than one feature fragment in the source (e.g. an area
        split across islands) is returned as a single GeometryCollection
        rather than picking one fragment.


        `tier` generalises the geometry before it is served, for callers that
        do not need every vertex: Highland is 45,124 of them. A tier is the
        side of the smallest square of detail kept, and the rule is
        Visvalingam-Whyatt, dropping the vertex whose triangle with its
        neighbours is smallest until none below the tier's threshold remains.
        Triangles are measured in the EPSG:6933 equal-area projection, so a
        tier means the same thing anywhere in the country. A part or hole
        smaller than the threshold is dropped whole rather than left as a
        triangle, and `properties.generalisation` reports the vertex and part
        counts both before and after.


        A tier bounds the size of feature dropped; it does not promise that no
        vertex moves further than its tolerance, since the same deviation
        spans a larger triangle the further apart its neighbours lie. Each area
        is generalised on its own, so above `full` two neighbours drawn
        together may disagree along the border they share. Ask for `full` where
        borders must meet exactly. This is still per-request simplification,
        not the vector tiles the full proposal describes.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: The official source code for this area on this boundary release.
        - name: tier
          in: query
          required: false
          schema:
            type: string
            enum: [full, high, medium, low]
            default: full
          description: >
            The generalisation tier, as the side in metres of the smallest
            square of detail kept: `full` (every vertex), `high` (10 m),
            `medium` (100 m), `low` (1000 m).
      responses:
        "200":
          description: The matching area as a GeoJSON Feature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaGeometryEnvelope"
              x-example-request: "/v1/areas/constituency/2024-07-uk-bgc/E14001262/geometry"
              example:
                apiVersion: v1
                atlasRelease: "sha256:24a500c55416bd7d58c28b1fc8cc4931d4a2fd831addafa3116556a91f2c4857"
                data:
                  type: Feature
                  id: constituency/2024-07-uk-bgc/E14001262
                  properties:
                    id: constituency/2024-07-uk-bgc/E14001262
                    geography: constituency
                    boundaryRelease: 2024-07-uk-bgc
                    code: E14001262
                    name: Halifax
                    generalisation:
                      tier: full
                      toleranceM: 0
                      minEffectiveAreaM2: 0
                      vertices: 1204
                      verticesAtFullResolution: 1204
                      parts: 1
                      partsAtFullResolution: 1
                    geometrySource: { sourceCrs: "EPSG:4326" }
                  geometry:
                    type: Polygon
                    coordinates: [[[-1.9269, 53.7874], [-1.9146, 53.7815]]]
                meta:
                  nextCursor: null
        "400":
          description: The `tier` requested is not one of the named tiers.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: >
            Either no compiled area matches that identity, the area exists but
            no feature for its code was found in the raw geometry source, or
            every part of it is smaller than the requested tier keeps.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/GeometryUnavailable"

  /areas/{geography}/{release}/{code}/geometry/metadata:
    get:
      operationId: getAreaGeometryMetadata
      tags: ["Map"]
      summary: Measure one area's geometry without transferring its coordinates
      description: >
        Returns the bounding box, centroid, label point, area and perimeter of
        an area's geometry, so a caller can size, place or label an area
        without downloading its rings. The same source, reprojection and
        declared grid corrections apply as for the geometry itself, and
        `geometrySource` records them.


        Area is ellipsoidal, taken through EPSG:6933 (WGS 84 / NSIDC EASE-Grid
        2.0 Global), a Lambert cylindrical equal-area projection on the WGS 84
        ellipsoid, so projected area is area on the ellipsoid and no correction
        is applied; holes are subtracted. Perimeter sums every ring, holes
        included, each edge's ground length coming from the ellipsoid's radii
        of curvature at its mid-latitude. The centroid is the centre of area in
        that same projection, inverted back to WGS 84.


        `labelPoint` is guaranteed to lie inside the geometry: the centroid
        where that falls within the area, otherwise the midpoint of the widest
        run of interior found on latitudes sampled across the bounding box.
        `labelPointMethod` says which was used, so a caller can tell a centre of
        mass from a point merely known to be inside.


        These figures describe the boundary as that release publishes it, at its
        own generalisation. They are not a published land-area statistic: a
        coastline-clipped boundary still encloses inland water, so they differ
        from the ONS Standard Area Measurement that `population-density` uses as
        its denominator. The `method` block repeats this with every response.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: The official source code for this area on this boundary release.
      responses:
        "200":
          description: The area's measurements, with the method that produced them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaGeometryMetadataEnvelope"
              x-example-request: "/v1/areas/localAuthority/2023-05-uk-bgc-v2/E06000046/geometry/metadata"
              example:
                apiVersion: v1
                atlasRelease: "sha256:24a500c55416bd7d58c28b1fc8cc4931d4a2fd831addafa3116556a91f2c4857"
                data:
                  id: localAuthority/2023-05-uk-bgc-v2/E06000046
                  geography: localAuthority
                  boundaryRelease: 2023-05-uk-bgc-v2
                  code: E06000046
                  name: Isle of Wight
                  boundingBox: [-1.5874, 50.5753, -1.0703, 50.7671]
                  centroid: [-1.2977, 50.6746]
                  labelPoint: [-1.2977, 50.6746]
                  labelPointMethod: centroid
                  area:
                    m2: 379890000
                    hectares: 37989
                    km2: 379.89
                  perimeter:
                    m: 188700
                    km: 188.7
                  geometryExtent:
                    parts: 2
                    rings: 2
                    vertices: 1589
                  geometrySource: { sourceCrs: "EPSG:4326" }
                meta:
                  nextCursor: null
        "404":
          description: >
            Either no compiled area matches that identity, or the area exists
            but no feature for its code was found in the raw geometry source.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: >
            The area's geometry carries no polygon to measure, such as a
            release held only as points. It can still be served by the geometry
            endpoint; it is reported rather than measured as zero.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/GeometryUnavailable"

  /relationship-paths:
    get:
      operationId: findRelationshipPaths
      tags: ["Geography"]
      summary: Find the published paths from one boundary release to another for a purpose
      description: >
        Says whether a published crosswalk path relates a source release to a
        target release for `identity` (the same area under a new code or
        boundary), `membership` (containment) or `apportion` (weighted
        overlap). It never builds or chooses a path at request time: each path
        is compiled from published crosswalks, in either direction, with every
        step's method and the weakest step's quality.


        `status` is `available` when at least one path is published and
        `unsupported` when none is, with a `reason`. When none is published for
        the purpose asked but one is for another purpose between the same
        releases, `alternatives` links to it, since a caller asking for an
        identity where only membership exists usually wants to know that.
      parameters:
        - { name: sourceGeography, in: query, required: true, schema: { type: string } }
        - { name: sourceRelease, in: query, required: true, schema: { type: string } }
        - { name: targetGeography, in: query, required: true, schema: { type: string } }
        - { name: targetRelease, in: query, required: true, schema: { type: string } }
        - name: purpose
          in: query
          required: true
          schema:
            type: string
            enum: [identity, membership, apportion]
      responses:
        "200":
          description: The published paths, or why there are none.
          content:
            application/json:
              schema: { type: object }
              examples:
                available:
                  x-example-request: "/v1/relationship-paths?sourceGeography=ward&sourceRelease=2023-05-uk-bgc&targetGeography=localAuthority&targetRelease=2023-05-uk-bgc-v2&purpose=membership"
                  value:
