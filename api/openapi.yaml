  /locations/{location-id}/members:
    get:
      operationId: getNamedLocationMembers
      tags: ["Geography"]
      summary: Resolve a named location's members in one geography and release
      x-likely-refusal:
        status: 400
        when: "No `release` is given. Members are resolved in one named release, never the latest by default."
        x-example-request: "/v1/locations/north-west/members"
      description: >
        `release` is required because location definitions may include legacy
        codes. Missing members are returned explicitly; this route never
        applies an implicit historical conversion. A `coverage` object counts
        resolved and unresolved members and classifies each unresolved code
        against the compiled releases of its geography as `superseded`,
        `not-yet-current`, `absent-from-release` or `unknown`, naming the
        releases that are the evidence. The classification is relative to the
        requested release and reports code membership only; it asserts nothing
        about geometry.


        A location declares the geography of its member codes, so asking for
        that geography matches them directly and `membership` is
        `direct-code-match`. Any other geography has to be reached through a
        published crosswalk, named with `via`: the wards of North Wales, the
        constituencies of Merseyside. Asking without `via` returns a 400 that
        lists the crosswalks published for that geography and release, so the
        choice is the caller's and is made from what exists.


        What membership means depends on the crosswalk named, and the response
        says which. Through a `clean-containment` crosswalk it is
        `fully-contained`: the publisher places each area wholly inside one
        parent, so no area is counted in part. Through an `area-overlap`
        crosswalk it is `weighted-overlap`: an area straddling the edge of the
        location carries the `weight` lying inside and is marked `partial`,
        and `partialMembers` counts them. Shares in two members of the same
        location are added, so an area split between them is whole and not
        partial.


        Each member names the defining area it was found `through`, and
        `parentBoundaryRelease` names the release the location's own codes were
        resolved against, which is the release the crosswalk ends at rather
        than the one asked for. Each member's `relation` is `within` when the
        whole area lies inside the location and `partly-within` when only its
        `weight` does; only the first may be counted whole.


        `reach` says which of the location's authorities the crosswalk places
        any area under. A crosswalk covering fewer countries than the location
        spans, such as LSOAs for a Scottish city, leaves authorities in
        `unreached`, and the members under them are missing from the answer
        rather than absent from the ground.
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - name: geography
          in: query
          schema:
            type: string
          description: >
            The geography to resolve members in. Omit it to use the location's
            declared `memberGeography`; any other geography requires `via`.
        - name: release
          in: query
          required: true
          schema: { type: string }
          description: >
            The boundary release to resolve members in, which fixes the vintage
            of the codes returned.
        - name: via
          in: query
          required: false
          schema: { type: string }
          description: >
            The published crosswalk to resolve through, required for any
            geography other than the location's `memberGeography`. Omit it to
            be told which are available.
          example: ward-2023-05-uk-bgc-to-local-authority-2023-05-uk-bgc-v2-clean-containment
      responses:
        "400":
          description: >
            `release` is missing, or a geography other than the location's
            `memberGeography` was asked for without `via`. The detail lists
            the crosswalks
            published for that geography and release.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: >
            Resolved members, explicitly unresolved codes, and the coverage
            that explains each one.
          content:
            application/json:
              schema: { type: object }
              x-example-request: "/v1/locations/north-wales/members?geography=ward&release=2024-12-uk-bgc&via=ward-2024-12-uk-bgc-to-local-authority-2024-12-uk-bgc-clean-containment"
              example:
                apiVersion: v1
                atlasRelease: sha256:5c4aa4529cbfbd5e4c844c55cddba1ef04a7bf76f3eaa085a357fff401af6d0c
                data:
                  location:
                    id: north-wales
                    label: North Wales
                    kind: editorial-grouping
                    definitionRevision: 1
                    memberGeography: localAuthority
                    memberCodes:
                      - W06000001
                    validity: { from: null, to: null }
                    bbox:
                      - -4.8
                  geography: ward
                  boundaryRelease: 2024-12-uk-bgc
                  reach:
                    memberCount: 6
                    reachedCount: 6
                    unreached: []
                    complete: true
                meta:
                  nextCursor: null
        "404":
          $ref: "#/components/responses/NotFound"

  /locations/{location-id}/parents:
    get:
      operationId: getNamedLocationParents
      tags: ["Geography"]
      summary: Find the areas of a coarser geography a named location covers or meets
      x-likely-refusal:
        status: 400
        when: "`geography` is given without `release`."
        x-example-request: "/v1/locations/north-west/parents?geography=localAuthority"
      description: >
        The other direction from `members`: which regions, counties, combined
        authorities or countries a location lies in, and whether it takes in
        each one whole. A location is defined by codes in its declared
        `memberGeography`, so a parent geography is reached through a published
        crosswalk out of that geography, named with `via`; asking without it
        lists the crosswalks
        published for that geography and release.


        Each parent's `relation` is `covers` when the location takes in all of
        it and `intersects` when it takes in only part. Through a containment
        or membership lookup that is decided by count, and
        `parentMemberCount` says how many authorities the publisher places in
        the parent. Through an area-overlap crosswalk it is decided by area,
        and `coveredShare` is the share of the parent the location's members
        cover, with 0.99 or more counting as cover. `members` lists the
        location's own authorities in each parent.


        `locationWithin` names the single parent holding every member, and is
        null when the members fall in several parents or the crosswalk places
        any of them in none. Those are listed in `unplaced`: a Welsh authority
        under an English region lookup, or a district outside every combined
        authority. `coverage` classifies the location's codes against the
        authority release the crosswalk starts from, exactly as on `members`.


        Every answer is compiled in advance for each location and crosswalk,
        so this reads a projection rather than walking a crosswalk per request.
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - name: geography
          in: query
          required: true
          schema: { type: string }
          description: The coarser geography to find parents in, such as `region`.
        - name: release
          in: query
          required: true
          schema: { type: string }
          description: The boundary release of that geography.
        - name: via
          in: query
          required: false
          schema: { type: string }
          description: >
            The published crosswalk from the location's declared
            `memberGeography` to that geography. Omit it to be told which are
            available.
      responses:
        "200":
          description: The parents the location covers or meets, and any members placed in none.
          content:
            application/json:
              schema: { type: object }
              x-example-request: "/v1/locations/greater-manchester/parents?geography=combinedAuthority&release=2025-12-en-bgc&via=local-authority-2025-12-uk-bgc-to-combined-authority-2025-12-en-bgc-official-lookup"
              example:
                apiVersion: v1
                atlasRelease: sha256:5c4aa4529cbfbd5e4c844c55cddba1ef04a7bf76f3eaa085a357fff401af6d0c
                data:
                  geography: combinedAuthority
                  boundaryRelease: 2025-12-en-bgc
                  via:
                    id: local-authority-2025-12-uk-bgc-to-combined-authority-2025-12-en-bgc-official-lookup
                    method: clean-containment
                    quality: publisher-supplied
                  memberGeography: localAuthority
                  memberBoundaryRelease: 2025-12-uk-bgc
                  locationWithin:
                    id: combinedAuthority/2025-12-en-bgc/E47000001
                    code: E47000001
                    name: Greater Manchester
                  parents:
                    - id: combinedAuthority/2025-12-en-bgc/E47000001
                      code: E47000001
                      name: Greater Manchester
                      relation: covers
                      members:
                        - id: localAuthority/2025-12-uk-bgc/E08000003
                          code: E08000003
                          name: Manchester
                      parentMemberCount: 10
                  unplaced: []
                meta:
                  nextCursor: null
        "400":
          description: >
            `geography` or `release` is missing, or `via` is not given; the
            detail lists the crosswalks published for that geography and
            release.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    PointLookupCrs:
      name: crs
      in: query
      required: false
      schema:
        enum: [EPSG:4326, EPSG:27700, EPSG:29902]
        default: EPSG:4326
      description: >
        The input coordinate reference system. The default `EPSG:4326` uses
        `lng` and `lat`; `EPSG:27700` uses British National Grid `easting` and
        `northing` or an Ordnance Survey `gridref`; `EPSG:29902` uses Irish
        Grid `easting` and `northing`.
    CoordinateTargetCrs:
      name: to
      in: query
      required: false
      schema:
        enum: [EPSG:4326, EPSG:27700, EPSG:29902]
        default: EPSG:4326
      description: >
        The requested output CRS. `point` is always WGS 84; choose a national
        grid here to add `target` with easting and northing. The API rejects a
        point that falls outside its supported range for the requested grid.
    BritishGridReferenceDigits:
      name: gridrefDigits
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 5, default: 5 }
      description: >
        With `to=EPSG:27700`, the maximum number of digits per coordinate in
        `target.gridReference`. The API may return fewer digits when the input
        or transformation uncertainty requires a coarser cell. It is invalid
        with another target CRS.
    PointLookupEasting:
      name: easting
      in: query
      required: false
      schema: { type: string, pattern: "^[+-]?\\d+(\\.\\d+)?$" }
      description: >
        Easting in grid metres. Required with `crs=EPSG:27700` or
        `crs=EPSG:29902`; do not combine it with WGS 84 `lng`/`lat`.
    PointLookupNorthing:
      name: northing
      in: query
      required: false
      schema: { type: string, pattern: "^[+-]?\\d+(\\.\\d+)?$" }
      description: >
        Northing in grid metres. Required with `crs=EPSG:27700` or
        `crs=EPSG:29902`; do not combine it with WGS 84 `lng`/`lat`.
    PointLookupGridReference:
      name: gridref
      in: query
      required: false
      schema: { type: string, pattern: "^[A-Za-z]{2}(?:[\\s-]*\\d[\\d\\s-]*)?$" }
      description: >
        A two-letter Ordnance Survey National Grid reference, followed by an
        even number of digits from 2 to 10, for example `TQ 30000 80000`.
        Use only with `crs=EPSG:27700`; do not combine it with `easting` or
        `northing`. A grid reference denotes a square, represented by its cell
        centre with the cell's half-diagonal included in uncertainty.
    PointLookupGeography:
      name: geography
      in: query
      required: false
      schema:
        type: array
        maxItems: 4
        items: { type: string }
      style: form
      explode: true
      description: >
        A geography to look the point up in. Repeat for up to four. A geography
        named only in a pinned `release` need not be repeated here.
    PointLookupRelease:
      name: release
      in: query
      required: false
      schema:
        type: array
        items: { type: string }
      style: form
      explode: true
      description: >
        A release to pin, as `{geography}/{release}`, such as
        `ward/2025-12-uk-bgc`. A bare release id is accepted when exactly one
        geography is requested. A pinned release is used whatever `date` says.
    PointLookupDate:
      name: date
      in: query
      required: false
      schema: { type: string, pattern: "^\\d{4}-\\d{2}(-\\d{2})?$" }
      description: >
        A calendar date as `YYYY-MM-DD`, or a month as `YYYY-MM`. Every
        geography without a pinned release uses the latest release dated on or
        before it. The country boundaries used to place a point that matches
        nothing are chosen the same way.
    PointLookupAccuracy:
      name: accuracy
      in: query
      required: false
      schema: { type: number, exclusiveMinimum: 0, maximum: 100000 }
      description: >
        How far the true position may lie from the coordinate, in metres, such
        as a GPS fix's reported accuracy. Without it, uncertainty is half the
        coordinate's last written decimal place, which overstates it where a
        client drops trailing zeros.
    Geography:
      name: geography
      in: path
      required: true
      schema:
        type: string
      description: A geography type id, e.g. `constituency` or `ward`.
    Release:
      name: release
      in: path
      required: true
      schema:
        type: string
      description: A boundary release id, e.g. `2024-07-uk-bgc`.
    CrosswalkId:
      name: crosswalk-id
      in: path
      required: true
      schema:
        type: string
      description: A crosswalk id, e.g. `constituency-2010-to-2024-official-lookup-v2`.
    MeasureId:
      name: measure-id
      in: path
      required: true
      schema:
        type: string
      description: A measure id from `GET /v1/measures`, such as `population-estimate`.
    AreaCode:
      name: code
      in: path
      required: true
      schema:
        type: string
      description: An area's official code in that release, e.g. `E05000932`.
    ExportId:
      name: export-id
      in: path
      required: true
      schema:
        type: string
      description: An export id from `GET /v1/exports`; one source partition of one measure.
    LocationId:
      name: location-id
      in: path
      required: true
      schema:
        type: string
      description: A curated named location id from `GET /v1/locations`, e.g. `greater-manchester`.
    SourceGeography:
      name: geography
      in: query
      required: true
      schema:
        enum: [ward, localAuthority, constituency, lsoa, msoa, dataZone, superOutputArea]
      description: >
        The geography the publisher observed the values on. With `boundaryYear`
        it selects one source partition of the measure; it never converts
        values onto another geography.
    SourceBoundaryYear:
      name: boundaryYear
      in: query
      required: true
      schema:
        type: integer
      description: >
        The code vintage the partition's areas are published on, e.g. `2023`.
        This is the source's own vintage, not a boundary release to draw.
    SourcePeriod:
      name: period
      in: query
      required: true
      schema:
        type: string
      description: >
        The observation period as the partition publishes it, e.g. `2022`,
        `2026-04` or `year-ending-2026-03`. A measure's periods are listed in
        its catalogue entry.
    PageCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: >
        The `meta.nextCursor` of the previous page. A cursor is opaque and
        belongs to the query that issued it.
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
      description: How many records to return, 1 to 500.

  responses:
    NotFound:
      description: No resource matches that identity.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidQuery:
      description: A query parameter is malformed or its cursor is not valid for this result set.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CatalogueUnavailable:
      description: The referenced build artifact has not been built yet.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    GeometryUnavailable:
      description: >
        The area exists but its geometry cannot be served: no raw source is
        declared, or its CRS has no transformation to WGS84.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    CapabilityStatus:
      type: string
      enum: [available, partial, requires-conversion, unsupported, not-built]
      description: >
        The one vocabulary every capability answer uses. `available`: served
        directly and completely for what was asked. `partial`: served directly
        for only part of it. `requires-conversion`: not served directly, but a
        published conversion path answers it, and the answer names that path.
        `unsupported`: nothing the Atlas publishes answers it. `not-built`:
        this deployment has not built the artifact that would say. Every status
        but `available` carries a `reason`.

    Capability:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/CapabilityStatus"
        reason:
          type: string
          description: Why the status is not `available`; present on every other status.

    Problem:
      type: object
      description: >
        RFC 9457 Problem Details. Some routes add extension members: a value
        request for an ambiguous place name adds `choices`, one whose place the
        measure cannot answer adds `candidates`, every area route whose
        area identity resolves to nothing says why through `code` and
        `absence`, and a refused conversion does the same.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        choices:
          type: array
          description: >
            On a 409 Ambiguous Place: each place the name could mean, with its
            answer and the request that asks about it alone.
          items:
            type: object
        candidates:
          type: array
          description: >
            On a 422 Place Not Served: each place the name matched, and why the
            measure does not answer it.
          items:
            type: object
        code:
          type: string
          enum:
            - unsupported_geography
            - area_not_in_release
            - aggregation_not_supported
            - conversion_not_available
            - partial_coverage
            - ambiguous_place
            - incompatible_geometry
            - invalid_format
            - invalid_cursor
            - no_release_for_date
            - ambiguous_release
          description: >
            On a 404 from an area or boundary release route: `unsupported_geography` when the
            geography or release is not published or its area identities are
            not compiled, and `area_not_in_release` when the release does not
            hold the code. On a 422 from an aggregate or a conversion:
            `aggregation_not_supported` when the measure's values do not add
            over areas or its weights cannot be used, `conversion_not_available`
            when the named crosswalk or source release cannot carry the
            partition without dropping, splitting or assuming values, and
            `partial_coverage` when a named location or a weight partition
            leaves out areas the sum would need. A partial country or region
            total is not refused; it is a 200 whose coverage says so.
            From a value request for a place: `ambiguous_place` when the name
            means several places the measure answers differently. From an
            observation request: `incompatible_geometry` when the chosen
            boundary release does not hold every source code. On a 400:
            `invalid_format` for a `format` the route does not serve, and
            `invalid_cursor` for a cursor this API did not issue or that
            belongs to another query. From a release resolution:
            `no_release_for_date` and `ambiguous_release`.
        absence:
          type: string
          enum:
            - unknown-geography
            - unknown-release
            - release-not-compiled
            - superseded
            - not-yet-current
            - absent-from-release
            - unknown
            - crosswalk-geography-mismatch
            - source-areas-not-mapped
            - unweighted-split
            - before-first-release
            - country-not-covered
            - no-dated-release
          description: >
            Which absence left the area or conversion unresolved. For a
            conversion, the crosswalk starts at another geography, does not map
            some source areas, or splits some across targets with no published
            weight. For an area, a code is `superseded` when only older
            releases of the geography hold it, `not-yet-current`
            when only newer ones do, `absent-from-release` when releases on
            both sides or undated releases hold it, and `unknown` when no
            compiled release does. The classification uses code membership
            only: a superseded code may have been abolished, merged or recoded,
            and none of those is claimed.
        presentIn:
          type: array
          description: >
            With `area_not_in_release`: the compiled releases that do hold the
            code, with the name it carries in each.
          items:
            type: object
            required: [boundaryRelease, name, href]
            properties:
              boundaryRelease: { type: string }
              name: { type: string }
              href: { type: string }
        areaCount:
          type: integer
          description: >
            With `source-areas-not-mapped` or `unweighted-split`: how many
            source areas the conversion could not carry.
        areaSample:
          type: array
          items: { type: string }
          description: The first of those source area codes, at most ten.
        availableReleases:
          type: array
          description: With `unknown-release`, the releases published for the geography.
          items:
            type: object
            required: [id, href]
            properties:
              id: { type: string }
              href: { type: string }
        links:
          type: object
          additionalProperties: { type: string }
          description: >
            With `unknown-geography`, the geography list; with
            `release-not-compiled`, the boundary release.

    UnsupportedGeographyProblem:
      description: >
        The geography or boundary release is not published, or its area identities are not compiled. A caller can act on `links` or `availableReleases` instead of reading the detail. Produced by `GET /v1/areas/nowhere/2024-12-uk-bgc/E05000932`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, absence]
          properties:
            status:
              enum: [404]
            code:
              const: unsupported_geography
      examples:
        - {"type":"https://api.ukdataatlas.com/problems/not-found","title":"Not Found","status":404,"detail":"No boundary release is published for the geography nowhere.","code":"unsupported_geography","absence":"unknown-geography","links":{"geographies":"/v1/geographies"}}

    AreaNotInReleaseProblem:
      description: >
        The release is published and compiled but does not hold the code; `presentIn` lists releases that do. A caller can act on `presentIn` instead of reading the detail. Produced by `GET /v1/areas/ward/2016-12-gb-bgc/E05013830`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, absence, presentIn]
          properties:
            status:
              enum: [404]
            code:
              const: area_not_in_release
      examples:
        - {"type":"https://api.ukdataatlas.com/problems/not-found","title":"Not Found","status":404,"detail":"E05013830 is held only by newer releases of this geography, so it had not come into use by this release.","code":"area_not_in_release","absence":"not-yet-current","presentIn":[{"boundaryRelease":"2021-12-uk-bgc","name":"Garforth & Swillington","href":"/v1/areas/ward/2021-12-uk-bgc/E05013830"},{"boundaryRelease":"2022-12-uk-bgc","name":"Garforth & Swillington","href":"/v1/areas/ward/2022-12-uk-bgc/E05013830"}]}

    AggregationNotSupportedProblem:
      description: >
        The measure's values do not add over areas, or its weights cannot be used. Produced by `GET /v1/data/house-price-median/aggregate?period=2022&geography=ward&boundaryYear=2020&areaCode=E92000001`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code]
          properties:
            status:
              enum: [422]
            code:
              const: aggregation_not_supported
      examples:
        - {"type":"https://api.ukdataatlas.com/problems/operation-not-supported","title":"Operation Not Supported","status":422,"detail":"This measure is a median and cannot be combined over areas. A median of ward medians is not the median of the underlying sales, and no weight recovers it. Combining areas needs the sales themselves, which this source does not publish.","code":"aggregation_not_supported"}

    ConversionNotAvailableProblem:
      description: >
        The named crosswalk or source release cannot carry the partition without dropping, splitting or assuming values. Produced by `GET /v1/data/population-estimate/convert?period=2022&geography=ward&boundaryYear=2023&crosswalk=constituency-2010-to-2024-official-lookup-v2`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code]
          properties:
            status:
              enum: [422]
            code:
              const: conversion_not_available
      examples:
        - {"type":"https://api.ukdataatlas.com/problems/operation-not-supported","title":"Operation Not Supported","status":422,"detail":"That crosswalk starts at constituency, but this source partition is published on ward areas.","code":"conversion_not_available","absence":"crosswalk-geography-mismatch"}

    PartialCoverageProblem:
      description: >
        A named location or a weight partition leaves out areas the sum would need, so no partial sum is served. Produced by `GET /v1/data/total-jobs/aggregate?period=2024&geography=localAuthority&boundaryYear=2023&locationId=belfast`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code]
          properties:
            status:
              enum: [422]
            code:
              const: partial_coverage
      examples:
        - {"type":"https://api.ukdataatlas.com/problems/operation-not-supported","title":"Operation Not Supported","status":422,"detail":"The named location does not cover this source partition by direct code match: N09000003 (absent-from-release). No conversion or partial sum was applied.","code":"partial_coverage"}

    AmbiguousPlaceProblem:
      description: >
        The place name means more than one place, and the measure answers them differently; `choices` carries each answer and the request that asks about it alone. Produced by `GET /v1/data/population-estimate/value?place=Newport`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, choices]
          properties:
            status:
              enum: [409]
            code:
              const: ambiguous_place
      examples:
        - {"type":"https://api.ukdataatlas.com/problems/ambiguous-place","title":"Ambiguous Place","status":409,"detail":"\"Newport\" names 4 places that population-estimate answers differently. Each choice carries its answer; ask again with the place reference of the one meant.","code":"ambiguous_place","choices":[{"place":"localAuthority/W06000022","kind":"area","name":"Newport","geography":"localAuthority","code":"W06000022","match":"exact","served":true,"method":"source-exact","answer":{"period":"2024","value":167899,"status":"observed","periodDefaulted":true},"via":"/v1/data/population-estimate/series?areaCode=W06000022&geography=localAuthority&boundaryYear=2023","ask":"/v1/data/population-estimate/value?place=localAuthority%2FW06000022"}]}

    IncompatibleGeometryProblem:
      description: >
        The requested boundary release does not hold every source area code of the partition, so no geometry join is offered. The refusal names the releases that would carry it in `alternatives.releases`, and `/v1/measures/{measure-id}/compatibility` has the full evidence. Produced by `GET /v1/data/population-estimate?period=2022&geography=ward&boundaryYear=2023&release=2016-12-gb-bgc`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code]
          properties:
            status:
              enum: [422]
            code:
              const: incompatible_geometry
      examples:
        - {"type":"https://api.ukdataatlas.com/problems/operation-not-supported","title":"Operation Not Supported","status":422,"detail":"2016-12-gb-bgc does not hold every source area code for this partition of population-estimate, so its values cannot be drawn on it. Inspect /v1/measures/population-estimate/compatibility.","code":"incompatible_geometry","alternatives":{"releases":["2023-05-uk-bgc","2023-12-uk-bgc"]}}

    InvalidFormatProblem:
      description: >
        The `format` asked for is not one this route serves. Produced by `GET /v1/data/population-estimate?period=2022&geography=ward&boundaryYear=2023&format=xml`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code]
          properties:
            status:
              enum: [400]
            code:
              const: invalid_format
      examples:
        - {"type":"https://api.ukdataatlas.com/problems/invalid-query","title":"Invalid Query","status":400,"detail":"format must be one of json, csv or ndjson.","code":"invalid_format"}

    InvalidCursorProblem:
      description: >
        The cursor is not one this API issued, or does not belong to the query it was sent with. Ask for the first page again and follow `meta.nextCursor`. Produced by `GET /v1/areas?cursor=not-a-cursor`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code]
          properties:
            status:
              enum: [400]
            code:
              const: invalid_cursor
      examples:
        - {"type":"https://api.ukdataatlas.com/problems/invalid-query","title":"Invalid Query","status":400,"detail":"cursor is invalid.","code":"invalid_cursor"}

    NoReleaseForDateProblem:
      description: >
        No release of the geography was in force on the date; `earliest` names the first there is. A caller can act on `earliest` or `undated` instead of reading the detail. Produced by `GET /v1/boundary-releases:resolve?geography=ward&date=1990-01-01`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, absence]
          properties:
            status:
              enum: [404]
            code:
              const: no_release_for_date
      examples:
        - {"type":"https://api.ukdataatlas.com/problems/not-found","title":"Not Found","status":404,"detail":"The earliest ward boundary release is dated 2011-12, after 1990-01.","code":"no_release_for_date","absence":"before-first-release","earliest":{"id":"2011-12-ew-bgc","month":"2011-12","title":"Wards, December 2011 (England and Wales, generalised, clipped)","countries":["GB-ENG","GB-WLS"],"href":"/v1/boundary-releases/ward/2011-12-ew-bgc"}}

    AmbiguousReleaseProblem:
      description: >
        More than one release of the geography is dated that month and they differ in more than coverage; `choices` lists them. A caller can act on `choices` instead of reading the detail. Produced by `GET /v1/boundary-releases:resolve?geography=dataZone&date=2011-12-15`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, choices]
          properties:
            status:
              enum: [409]
            code:
              const: ambiguous_release
      examples:
        - {"type":"https://api.ukdataatlas.com/problems/ambiguous-release","title":"Ambiguous Release","status":409,"detail":"2 dataZone boundary releases are dated 2011-12 and differ in more than coverage. Choose one by id; each is listed in choices.","code":"ambiguous_release","choices":[{"id":"2011-12-sc-bfc","month":"2011-12","title":"Data zones, December 2011 (Scotland, full resolution, clipped)","countries":["GB-SCT"],"href":"/v1/boundary-releases/dataZone/2011-12-sc-bfc"},{"id":"2011-12-sc-nc","month":"2011-12","title":"Data zones, December 2011 (Scotland, not clipped)","countries":["GB-SCT"],"href":"/v1/boundary-releases/dataZone/2011-12-sc-nc"}]}

    Envelope:
      type: object
      required: [apiVersion, atlasRelease, data, meta]
      properties:
        apiVersion:
          type: string
          const: v1
        atlasRelease:
          type: string
          description: >
            The immutable `/atlas-release` `releaseId` for the artifacts that
            produced this response.
        meta:
          type: object
          required: [nextCursor]
          properties:
            nextCursor:
              oneOf:
                - type: string
                - type: "null"
              description: Opaque cursor for the next page, or null at the end.

    TerrainPointEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TerrainPoint"

    TerrainPoint:
      type: object
      required: [status, x, y, interpolation, unit, value, source]
      properties:
        status:
          type: string
          enum: [ok, outside_coverage, nodata]
        x: { type: number }
        y: { type: number }
        interpolation:
          type: string
          enum: [bilinear, nearest]
        unit:
          const: metres
        value:
          type:
            - number
            - "null"
        source:
          type: object
          required:
            [id, version, tileHash, contentHash, crs, horizontalDatum, verticalDatum, resolutionMetres, noData, uncertainty, coverage]
          properties:
            id: { type: string }
            version: { type: string }
            provenance: { type: string, enum: [local, remote-preview] }
            tileHash: { type: string }
            contentHash: { type: string }
            crs: { const: "EPSG:27700" }
            horizontalDatum: { const: OSGB36 }
            horizontalTransformation: { const: OSTN15 }
            verticalDatum: { const: ODN }
            verticalModel: { const: OSGM15 }
            resolutionMetres: { type: number, exclusiveMinimum: 0 }
            noData:
              type:
                - number
                - "null"
            uncertainty:
              type: object
              required: [metric, valueMetres]
              properties:
                metric:
                  type: string
                  enum: [rmse, stated_accuracy]
                valueMetres: { type: number, minimum: 0 }
            coverage:
              type: object
              required: [kind, bbox, footprintHash]
              properties:
                kind: { const: bbox }
                bbox:
                  type: array
                  minItems: 4
                  maxItems: 4
                  items: { type: number }
                footprintHash: { type: string }

    RootDocument:
      type: object
      required: [name, links]
      properties:
        name:
          type: string
        openapi:
          type: string
          description: This OpenAPI description, the binding contract.
        documentation:
          type: string
          description: The human landing page rendered from it.
        links:
          type: array
          items:
            type: string

    RootEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/RootDocument"

    GeographySummary:
      type: object
      required: [id, latestRelease, releaseCount]
      properties:
        id:
          type: string
        latestRelease:
          type: string
        releaseCount:
          type: integer

    MapResourceSummary:
      type: object
      required: [id, geography, boundaryRelease, title, href]
      properties:
        id:
          type: string
          description: The boundary release identity, `{geography}/{release}`.
        geography:
          type: string
        boundaryRelease:
          type: string
        title:
          type: string
        href:
          type: string

    MapResourceListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/MapResourceSummary"

    MapResourceTiles:
      type: object
      required:
        - artifact
        - href
        - format
        - tileFormat
        - layer
        - minZoom
        - maxZoom
        - zooms
        - tileCount
        - bytes
        - contentHash
      properties:
        artifact:
          type: string
        href:
          type: string
        format:
          type: string
          const: pmtiles-3
        tileFormat:
          type: string
          const: mvt-2.1
        layer:
          type: string
        minZoom:
          type: integer
        maxZoom:
          type: integer
        zooms:
          type: array
          description: Which generalisation tier each band of zooms is drawn from.
          items:
            type: object
            required: [minZoom, maxZoom, tier, toleranceM]
            properties:
              minZoom:
                type: integer
              maxZoom:
                type: integer
              tier:
                type: string
              toleranceM:
                type: number
        tileCount:
          type: integer
        bytes:
          type: integer
        contentHash:
          type: string
          description: SHA-256 of the archive, so a cited map can be checked.

    MapResource:
      type: object
      required:
        - id
        - geography
        - boundaryRelease
        - title
        - topology
        - areaCount
        - arcCount
        - bounds
        - tiles
        - tiers
        - features
        - generalisation
        - geometrySource
        - attribution
      properties:
        id:
          type: string
        geography:
          type: string
        boundaryRelease:
          type: string
        title:
          type: string
        topology:
          type: string
          const: shared-arc
          description: >
            Borders are compiled once and shared by the two areas along them,
            so a tier cannot draw the same border two ways.
        areaCount:
          type: integer
        arcCount:
          type: integer
          description: Distinct boundary arcs the release decomposes into.
        bounds:
          type: array
          description: West, south, east and north, in degrees.
          items:
            type: number
          minItems: 4
          maxItems: 4
        tiles:
          $ref: "#/components/schemas/MapResourceTiles"
        tiers:
          type: array
          items:
            type: object
            required: [tier, toleranceM, coordinates, refinedArcs]
            properties:
              tier:
                type: string
              toleranceM:
                type: number
              coordinates:
                type: integer
              refinedArcs:
                type: integer
                description: >
                  Arcs given back detail because a ring built from them
                  enclosed nothing at this tier, so no part leaves the map.
        features:
          type: array
          description: >
            Every tier as a GeoParquet download, compiled from the same
            shared-arc generalisation as the tiles.
          items:
            type: object
            required: [tier, toleranceM, format, artifact, href, rowCount, coordinates, bytes, contentHash]
            properties:
              tier:
                type: string
                enum: [full, high, medium, low]
              toleranceM:
                type: number
              format:
                type: string
                const: geoparquet-1.1
              artifact:
                type: string
              href:
                type: string
              rowCount:
                type: integer
                description: One row per area in the release.
              coordinates:
                type: integer
                description: Coordinates across the tier's shared arcs, each border counted once.
              bytes:
                type: integer
              contentHash:
                type: string
                description: SHA-256 of the file served at `href`.
        generalisation:
          type: object
          description: The terms the tiers were compiled on, in plain words.
          additionalProperties:
            type: string
        geometrySource:
          type: object
          description: The publisher file behind the shapes, and how it was transformed.
        attribution:
          type: object
          required: [text, publisher, sourceUrl, licence, href]
          properties:
            text:
              type: string
              description: Ready to display beside the map.
            publisher:
              type: string
            sourceUrl:
              type: string
            licence:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Reproduced as the publisher states it, not interpreted.
                url:
                  type: string
            href:
              type: string

    MapResourceJoin:
      type: object
      required: [measure, period, sourceGeography, join, layer, areasWithoutValue, values, provenance]
      properties:
        measure:
          type: object
          required: [id, label]
          properties:
            id:
              type: string
            label:
              type: string
        period:
          type: string
        sourceGeography:
          type: object
          required: [type, boundaryYear]
          properties:
            type:
              type: string
            boundaryYear:
              type: integer
        join:
          type: object
          required: [boundaryRelease, method, compatibility, note]
          properties:
            boundaryRelease:
              type: string
            method:
              type: string
              const: code-match
              description: Codes are matched. No value is converted.
            compatibility:
              type: string
              description: The code-set status the join was accepted on.
            note:
              type: string
        layer:
          type: string
          description: The tile layer these values are numbered for.
        areasWithoutValue:
          type: integer
          description: >
            Areas in the release the measure publishes no value for. They are
            in the tiles and absent from this table, and a renderer should
            draw them as having no data rather than as zero.
        values:
          type: array
          items:
            type: object
            required: [id, code, value, status]
            properties:
              id:
                type: integer
                description: The tile feature id this value belongs to.
              code:
                type: string
              value:
                type: number
              status:
                type: string
                description: >
                  `observed` where a publisher reported it, `derived` where
                  this API computed it.
        provenance:
          type: object
          required: [artifact, contentHash, measure]
          properties:
            artifact:
              type: string
            contentHash:
              type: string
            measure:
              type: string

    MapResourceJoinEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MapResourceJoin"

    MapResourceEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MapResource"

    TileJsonEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              description: TileJSON 3.0, with the archive's content hash added.
              required: [tilejson, tiles, minzoom, maxzoom, bounds, vector_layers]
              properties:
                tilejson:
                  type: string
                name:
                  type: string
                description:
                  type: string
                attribution:
                  type: string
                scheme:
                  type: string
                format:
                  type: string
                tiles:
                  type: array
                  items:
                    type: string
                minzoom:
                  type: integer
                maxzoom:
                  type: integer
                bounds:
                  type: array
                  items:
                    type: number
                center:
                  type: array
                  items:
                    type: number
                vector_layers:
                  type: array
                  items:
                    type: object

    GeographySummaryListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/GeographySummary"

    BoundaryRelease:
      type: object
      required: [id, geography, title, coverage, source, metadataHash]
      properties:
        id:
          type: string
        geography:
          type: string
        title:
          type: string
        description:
          type: string
        temporalCoverage:
          type: string
        coverage:
          type: object
          required: [countries]
          properties:
            countries:
              type: array
              items:
                type: string
        source:
          type: object
          required: [publisher, url, licence]
          properties:
            publisher:
              type: string
            url:
              type: string
              format: uri
            retrievedAt:
              type: string
              format: date
            licence:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                url:
                  type: string
                  format: uri
        metadataHash:
          type: string

    BoundaryReleaseListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/BoundaryRelease"

    BoundaryReleaseEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/BoundaryRelease"

    AreaIdentityCoverage:
      oneOf:
        - type: object
          required: [status, recordCount, artifact]
          properties:
            status:
              const: available
            recordCount:
              type: integer
            artifact:
              type: string
        - type: object
          required: [status, reason]
          properties:
            status:
              const: not-compiled
            reason:
              type: string

    GeographyRelationship:
      type: object
      required: [id, direction, counterpart, method, quality, weighting]
      properties:
        id:
          type: string
        direction:
          enum: [from, to]
        counterpart:
          type: object
          required: [geography, boundaryRelease]
          properties:
            geography:
              type: string
            boundaryRelease:
              type: string
        method:
          $ref: "#/components/schemas/CrosswalkMethod"
        quality:
          $ref: "#/components/schemas/CrosswalkQuality"
        weighting:
          $ref: "#/components/schemas/CrosswalkWeighting"

    RelationshipCoverage:
      oneOf:
        - type: object
          required: [status, crosswalks]
          properties:
            status:
              const: available
            crosswalks:
              type: array
              items:
                $ref: "#/components/schemas/GeographyRelationship"
        - type: object
          required: [status, reason]
          properties:
            status:
              const: not-compiled
            reason:
              type: string

    GeographyReleaseInventory:
      type: object
      required:
        - id
        - geography
        - countries
        - inputFormats
        - areaIdentities
        - relationships
      properties:
        id:
          type: string
        geography:
          type: string
        countries:
          type: array
          items:
            type: string
        inputFormats:
          type: array
          items:
            type: string
        areaIdentities:
          $ref: "#/components/schemas/AreaIdentityCoverage"
        relationships:
          $ref: "#/components/schemas/RelationshipCoverage"

    GeographyInventory:
      type: object
      required:
        - schemaVersion
        - contentHash
        - boundaryRegistryHash
        - releases
        - geographies
      properties:
        schemaVersion:
          const: 1
        contentHash:
          type: string
        boundaryRegistryHash:
          type: string
        releases:
          type: array
          items:
            $ref: "#/components/schemas/GeographyReleaseInventory"
        geographies:
          type: array
          items:
            type: object
            required: [id, countries, releaseCount, capabilities]
            properties:
              id:
                type: string
              countries:
                type: array
                items:
                  type: string
              releaseCount:
                type: integer
              capabilities:
                type: object
                required: [areaIdentities, relationships]
                properties:
                  areaIdentities:
                    type: object
                    required: [availableReleaseCount, unsupportedReleaseCount, availableAreaCount]
                    properties:
                      availableReleaseCount:
                        type: integer
                      unsupportedReleaseCount:
                        type: integer
                      availableAreaCount:
                        type: integer
                  relationships:
                    type: object
                    required: [availableReleaseCount, unsupportedReleaseCount, crosswalkCount]
                    properties:
                      availableReleaseCount:
                        type: integer
                      unsupportedReleaseCount:
                        type: integer
                      crosswalkCount:
                        type: integer

    GeographyInventoryEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/GeographyInventory"

    Area:
      type: object
      required: [id, geography, boundaryRelease, code, name]
      properties:
        id:
          type: string
        geography:
          type: string
        boundaryRelease:
          type: string
        code:
          type: string
        name:
          type: string
        aliases:
          type: array
          items:
            type: string

    AreaRelationship:
      type: object
      required: [relation, counterpart, crosswalk]
      properties:
        relation:
          enum: [within, contains, successor, predecessor, overlaps]
        overlap:
          description: >
            Present only for `overlaps` relationships. Each share is seen from
            this area's side: `shareOfArea` is the overlap as a share of this
            area and `shareOfCounterpart` as a share of the counterpart.
          type: object
          required: [areaM2, shareOfArea, shareOfCounterpart]
          properties:
            areaM2:
              type: integer
            shareOfArea:
              type: number
            shareOfCounterpart:
              type: number
        counterpart:
          type: object
          required: [id, geography, boundaryRelease, code, labels]
          properties:
            id:
              type: string
            geography:
              type: string
            boundaryRelease:
              type: string
            code:
              type: string
            labels:
              type: array
              items:
                type: string
        crosswalk:
          type: object
          required: [id, method, quality, weighting]
          properties:
            id:
              type: string
            method:
              $ref: "#/components/schemas/CrosswalkMethod"
            quality:
              $ref: "#/components/schemas/CrosswalkQuality"
            weighting:
              $ref: "#/components/schemas/CrosswalkWeighting"

    AreaWithRelationships:
      allOf:
        - $ref: "#/components/schemas/Area"
        - type: object
          required: [relationships]
          properties:
            relationships:
              type: array
              items:
                $ref: "#/components/schemas/AreaRelationship"

    GeoJsonGeometry:
      type: object
      description: >
        A GeoJSON geometry object as read from the raw cached source, or a
        GeometryCollection when the source represents one area code as more
        than one feature fragment.
      required: [type]
      properties:
        type:
          type: string
        coordinates:
          description: Present on every geometry type except GeometryCollection.
        geometries:
          type: array
          items:
            $ref: "#/components/schemas/GeoJsonGeometry"
          description: Present only when type is GeometryCollection.

    AreaGeometry:
      type: object
      required: [type, id, properties, geometry]
      properties:
        type:
          const: Feature
        id:
          type: string
        properties:
          allOf:
            - $ref: "#/components/schemas/Area"
            - type: object
              required: [generalisation, geometrySource]
              properties:
                generalisation:
                  $ref: "#/components/schemas/Generalisation"
                geometrySource:
                  $ref: "#/components/schemas/GeometrySource"
        geometry:
          $ref: "#/components/schemas/GeoJsonGeometry"

    AreaNeighbours:
      allOf:
        - $ref: "#/components/schemas/Area"
        - type: object
          required:
            [id, geography, boundaryRelease, touches, border, method, neighbours]
          properties:
            id: { type: string }
            geography: { type: string }
            boundaryRelease: { type: string }
            touches:
              type: string
              enum: [edge, any]
            border:
              type: object
              required:
                [perimeterM, sharedBorderM, unsharedBorderM, pointOnlyTouches]
              properties:
                perimeterM: { type: number }
                sharedBorderM:
                  type: number
                  description: Border shared with the neighbours returned.
                unsharedBorderM:
                  type: number
                  description: >
                    The remainder: coastline, a national boundary, or a border
                    with an area outside this release. Nothing for a landlocked
                    area.
                pointOnlyTouches:
                  type: integer
                  description: >
                    Areas meeting only at a point, counted whether or not
                    `touches` returned them.
            method:
              type: object
              required: [rule, sharedBorder, unshared, limits]
              properties:
                rule: { type: string }
                sharedBorder: { type: string }
                unshared: { type: string }
                limits: { type: string }
            neighbours:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/Area"
                  - type: object
                    required:
                      [
                        id,
                        touch,
                        sharedBorderM,
                        shareOfPerimeter,
                        sharedEdges,
                        sharedVertices,
                      ]
                    properties:
                      id: { type: string }
                      touch:
                        type: string
                        enum: [edge, point]
                      sharedBorderM:
                        type: number
                        description: Zero for a point touch.
                      shareOfPerimeter:
                        type: number
                        description: >
                          The shared border as a fraction of this area's own
                          perimeter.
                      sharedEdges: { type: integer }
                      sharedVertices: { type: integer }

    AreaNeighboursEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AreaNeighbours"

    AreaBoxSearch:
      type: object
      required:
        [
          bbox,
          geography,
          boundaryRelease,
          matched,
          returned,
          limit,
          truncated,
          relationRule,
          matches,
        ]
      properties:
        bbox:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
        geography: { type: string }
        boundaryRelease: { type: string }
        matched:
          type: integer
          description: Areas meeting the box, before the limit is applied.
        returned:
          type: integer
        limit:
          type: integer
        truncated:
          type: boolean
          description: Whether `matched` exceeded `limit`.
        relationRule:
          type: string
        geometry:
          type: string
          description: >
            Present only when no `tier` was asked for, saying how to get the
            coordinates.
        tier:
          type: string
          enum: [full, high, medium, low]
        toleranceM: { type: number }
        minEffectiveAreaM2: { type: number }
        generalisationMethod:
          type: object
          required: [rule, threshold, parts, sharedBorders]
          properties:
            rule: { type: string }
            threshold: { type: string }
            parts: { type: string }
            sharedBorders: { type: string }
        matches:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Area"
              - type: object
                required: [id, relation, boundingBox, geometrySource]
                properties:
                  id: { type: string }
                  relation:
                    type: string
                    enum: [within, overlaps]
                  boundingBox:
                    type: array
                    items: { type: number }
                    minItems: 4
                    maxItems: 4
                  geometrySource:
                    $ref: "#/components/schemas/GeometrySource"
                  generalisation:
                    type: object
                    description: Present only when a `tier` was asked for.
                    properties:
                      vertices: { type: integer }
                      verticesAtFullResolution: { type: integer }
                      parts: { type: integer }
                      partsAtFullResolution: { type: integer }
                  geometry:
                    $ref: "#/components/schemas/GeoJsonGeometry"

    AreaBoxSearchEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AreaBoxSearch"

    LookupPoint:
      type: object
      required: [lng, lat, crs, precision]
      properties:
        lng: { type: number }
        lat: { type: number }
        crs: { const: "EPSG:4326" }
        precision:
          type: object
          required: [decimalPlaces, uncertaintyM, basis]
          properties:
            decimalPlaces:
              oneOf:
                - type: object
                  required: [lng, lat]
                  properties:
                    lng: { type: integer }
                    lat: { type: integer }
                - type: object
                  required: [easting, northing]
                  properties:
                    easting: { type: integer }
                    northing: { type: integer }
                - type: object
                  required: [gridReference]
                  properties:
                    gridReference:
                      type: object
                      required: [easting, northing]
                      properties:
                        easting: { type: integer }
                        northing: { type: integer }
            uncertaintyM:
              type: number
              description: How far the true position may lie from the coordinate, in metres.
            basis:
              type: string
              enum:
                [stated-accuracy, decimal-places, stated-accuracy-and-transformation, decimal-places-and-transformation, grid-reference-and-transformation, stated-accuracy-and-grid-reference-and-transformation]
        input:
          type: object
          description: Present when British National Grid or Irish Grid input was transformed to WGS 84.
          required: [crs, easting, northing, transformation]
          properties:
            crs: { enum: [EPSG:27700, EPSG:29902] }
            easting: { type: number }
            northing: { type: number }
            gridReference:
              type: object
              description: Present when an Ordnance Survey National Grid reference was supplied.
              required: [value, cellSizeM, position]
              properties:
                value: { type: string, example: "TQ 30000 80000" }
                cellSizeM: { type: number }
                position: { const: cell-centre }
            transformation:
              type: object
              required: [name, epsg, accuracyM, areaOfUse]
              properties:
                name: { type: string }
                epsg: { type: string }
                accuracyM: { type: number }
                areaOfUse: { type: string }

    CoordinateConversion:
      type: object
      required: [point, targetCrs, note]
      properties:
        point:
          $ref: "#/components/schemas/LookupPoint"
        targetCrs: { enum: [EPSG:4326, EPSG:27700, EPSG:29902] }
        target:
          type: object
          description: >
            Present when `to` requests a national grid. The named EPSG
            transformation is used in its inverse direction from WGS 84.
          required: [crs, easting, northing, transformation, uncertaintyM]
          properties:
            crs: { enum: [EPSG:27700, EPSG:29902] }
            easting: { type: number }
            northing: { type: number }
            uncertaintyM:
              type: number
              description: Input uncertainty plus the transformation's stated accuracy, in metres.
            gridReference:
              type: object
              description: >
                A British National Grid cell containing the target coordinate,
                present only for an encodable EPSG:27700 target. Its cell is no
                finer than the target uncertainty permits.
              required: [value, digits, cellSizeM, position]
              properties:
                value: { type: string, example: "TQ 3000 8000" }
                digits: { type: integer, minimum: 1, maximum: 5 }
                cellSizeM: { type: number }
                position: { const: containing-cell }
            transformation:
              type: object
              required: [name, epsg, accuracyM, areaOfUse, direction]
              properties:
                name: { type: string }
                epsg: { type: string }
                accuracyM: { type: number }
                areaOfUse: { type: string }
                direction: { const: inverse }
        note: { type: string }

    CoordinateConversionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CoordinateConversion"

    PointCountry:
      type: object
      description: >
        The UK country the point lies in. `area-code` reads it from a matched
        area's GSS code; `country-boundary` tests the point against a country
        release, and a null `code` there means no UK country contains it.
      required: [code, determinedBy]
      properties:
        code:
          type: ["string", "null"]
          enum: [GB-ENG, GB-NIR, GB-SCT, GB-WLS, null]
        determinedBy:
          type: string
          enum: [area-code, country-boundary, undetermined]
        area: { type: string }
        boundaryRelease: { type: string }
        detail: { type: string }

    PointLookupRelease:
      type: object
      description: >
        A requested geography's release and how it was chosen. When no release
        could be read, `status` and `detail` say why and the release-wide
        members are absent.
      required: [geography, selection]
      properties:
        geography: { type: string }
        boundaryRelease: { type: string }
        href: { type: string }
        selection:
          type: object
          required: [policy]
          properties:
            policy:
              type: string
              enum: [pinned, latest-release-dated-on-or-before]
            date: { type: string }
            sameMonth: { type: boolean }
            next:
              oneOf:
                - $ref: "#/components/schemas/ReleaseReference"
                - type: "null"
        coverage:
          type: object
          required: [countries]
          properties:
            countries:
              type: array
              items: { type: string }
        boundaryResolution:
          type: object
          required: [generalisation]
          description: >
            How much the boundary's lines were generalised, read from the ONS
            release name. `undeclared` where the name does not say.
          properties:
            generalisation: { type: string }
            extent:
              type: string
              enum: [clipped-to-coastline, full-extent-of-realm]
            toleranceM: { type: number }
            basis: { const: ons-release-name }
        geometrySource:
          $ref: "#/components/schemas/GeometrySource"
        source:
          type: object
          properties:
            publisher: { type: string }
            licence:
              type: object
              properties:
                name: { type: string }
                url: { type: string }
        status:
          type: string
          enum: [ambiguous-release, no-release-for-date, geometry-unavailable]
        detail: { type: string }
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseReference"
        earliest:
          $ref: "#/components/schemas/ReleaseReference"

    ReleaseReference:
      type: object
      required: [id, month, title, countries, href]
      properties:
        id: { type: string }
        month: { type: string }
        title: { type: string }
        countries:
          type: array
          items: { type: string }
        href: { type: string }

    PointLookupResult:
      type: object
      required: [geography, status, matches]
      properties:
        geography: { type: string }
        boundaryRelease: { type: string }
        status:
          type: string
          enum:
            [
              matched,
              no-match,
              outside-coverage,
              ambiguous-release,
              no-release-for-date,
              geometry-unavailable,
            ]
        reason:
          type: string
          enum: [country-not-covered, outside-uk-boundaries]
        detail: { type: string }
        positionalToleranceM:
          type: number
          description: >
            Coordinate uncertainty, boundary generalisation and transformation
            accuracy added together, in metres.
        matches:
          type: array
          items:
            type: object
            required:
              [id, code, name, containment, distanceToBoundaryM, nearBoundary]
            properties:
              id: { type: string }
              code: { type: string }
              name: { type: string }
              aliases:
                type: array
                items: { type: string }
              containment:
                type: string
                enum: [interior, boundary]
              distanceToBoundaryM:
                type: number
                description: Metres from the point to the area's nearest edge.
              nearBoundary:
                type: boolean
                description: The edge lies within `positionalToleranceM`.
              geometrySource:
                $ref: "#/components/schemas/GeometrySource"
              corrections:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    description: { type: string }

    PointContainment:
      type: object
      required: [point, country, boundaryRule, results, note]
      properties:
        point:
          $ref: "#/components/schemas/LookupPoint"
        date: { type: string }
        country:
          $ref: "#/components/schemas/PointCountry"
        boundaryRule: { const: included }
        results:
          type: array
          description: One per requested geography, in the order requested.
          items:
            allOf:
              - $ref: "#/components/schemas/PointLookupRelease"
              - $ref: "#/components/schemas/PointLookupResult"
        note: { type: string }

    PointContainmentEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/PointContainment"

    PointContainmentBatch:
      type: object
      required: [boundaryRule, releases, summary, points, note]
      properties:
        date: { type: string }
        boundaryRule: { const: included }
        releases:
          type: array
          items:
            $ref: "#/components/schemas/PointLookupRelease"
        summary:
          type: object
          required:
            [points, lookups, matched, noMatch, outsideCoverage, unresolved, nearBoundary]
          properties:
            points: { type: integer }
            lookups: { type: integer }
            matched: { type: integer }
            noMatch: { type: integer }
            outsideCoverage: { type: integer }
            unresolved:
              type: integer
              description: Lookups with no answer about the point, such as an ambiguous release.
            nearBoundary: { type: integer }
        points:
          type: array
          items:
            type: object
            required: [index, point, country, results]
            properties:
              index: { type: integer }
              point:
                $ref: "#/components/schemas/LookupPoint"
              country:
                $ref: "#/components/schemas/PointCountry"
              results:
                type: array
                description: One per entry in releases, in the same order.
                items:
                  $ref: "#/components/schemas/PointLookupResult"
        note: { type: string }

    PointContainmentBatchEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/PointContainmentBatch"

    NearestAreas:
      type: object
      required: [point, within, limit, relation, distanceMethod, results, note]
      properties:
        point:
          $ref: "#/components/schemas/LookupPoint"
        date: { type: string }
        within: { type: integer }
        limit: { type: integer }
        relation: { const: distance }
        distanceMethod: { type: string }
        results:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/PointLookupRelease"
              - type: object
                required: [nearest]
                properties:
                  status:
                    type: string
                    enum:
                      [
                        found,
                        none-within,
                        ambiguous-release,
                        no-release-for-date,
                        geometry-unavailable,
                      ]
                  matched: { type: integer }
                  truncated: { type: boolean }
                  nearest:
                    type: array
                    items:
                      type: object
                      required: [rank, id, code, name, distanceM]
                      properties:
                        rank: { type: integer }
                        id: { type: string }
                        code: { type: string }
                        name: { type: string }
                        distanceM:
                          type: number
                          description: >
                            Metres to the area, zero when the point is on or
                            inside it. Not a containment claim.
                        geometrySource:
                          $ref: "#/components/schemas/GeometrySource"
        note: { type: string }

    NearestAreasEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/NearestAreas"

    AreaChildrenGeometry:
      type: object
      required: [type, id, parent, collection, withoutGeometry, features]
      properties:
        type:
          const: FeatureCollection
        id:
          type: string
        parent:
          $ref: "#/components/schemas/Area"
        collection:
          type: object
          description: >
            What the collection holds and on what terms. `generalisationMethod`
            is present only above the `full` tier.
          required:
            [members, withGeometry, vertices, tier, toleranceM, minEffectiveAreaM2]
          properties:
            members:
              type: integer
              description: Areas the crosswalk names as contained by the parent.
            withGeometry:
              type: integer
              description: Of those, how many could be drawn.
            vertices:
              type: integer
            tier:
              type: string
              enum: [full, high, medium, low]
            toleranceM: { type: number }
            minEffectiveAreaM2: { type: number }
            generalisationMethod:
              type: object
              required: [rule, threshold, parts, sharedBorders]
              properties:
                rule: { type: string }
                threshold: { type: string }
                parts: { type: string }
                sharedBorders: { type: string }
        withoutGeometry:
          type: array
          description: >
            Members published as a relationship that could not be drawn, each
            with the reason. Empty when the collection is complete.
          items:
            type: object
            required: [id, geography, boundaryRelease, code, reason]
            properties:
              id: { type: string }
              geography: { type: string }
              boundaryRelease: { type: string }
              code: { type: string }
              reason: { type: string }
        features:
          type: array
          items:
            $ref: "#/components/schemas/AreaChildGeometryFeature"

    AreaChildGeometryFeature:
      type: object
      required: [type, id, properties, geometry]
      properties:
        type:
          const: Feature
        id:
          type: string
        properties:
          allOf:
            - $ref: "#/components/schemas/Area"
            - type: object
              required: [membership, generalisation, geometrySource]
              properties:
                membership:
                  type: object
                  description: >
                    The published crosswalk that places this area in the
                    collection.
                  required: [id, method, quality]
                  properties:
                    id: { type: string }
                    method: { type: string }
                    quality: { type: string }
                    weighting: { type: object }
                generalisation:
                  type: object
                  description: >
                    What the collection's tier cost this member. The tier
                    itself is stated once, on the collection.
                  required:
                    [vertices, verticesAtFullResolution, parts, partsAtFullResolution]
                  properties:
                    vertices: { type: integer }
                    verticesAtFullResolution: { type: integer }
                    parts: { type: integer }
                    partsAtFullResolution: { type: integer }
                geometrySource:
                  $ref: "#/components/schemas/GeometrySource"
        geometry:
          $ref: "#/components/schemas/GeoJsonGeometry"

    AreaChildrenGeometryEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AreaChildrenGeometry"

    Generalisation:
      type: object
      description: >
        What was done to the geometry before it was served, and at what cost.
        `method` is present only above the `full` tier, where something was
        actually done; it includes the caveat that neighbours generalised
        separately may disagree along a shared border.
      required:
        [
          tier,
          toleranceM,
          minEffectiveAreaM2,
          vertices,
          verticesAtFullResolution,
          parts,
          partsAtFullResolution,
        ]
      properties:
        tier:
          type: string
          enum: [full, high, medium, low]
        toleranceM:
          type: number
          description: The side in metres of the smallest square of detail kept.
        minEffectiveAreaM2:
          type: number
          description: >
            The threshold actually applied, in square metres: a vertex is
            dropped when its triangle is smaller than this.
        vertices:
          type: integer
          description: Vertices in the geometry as served.
        verticesAtFullResolution:
          type: integer
        parts:
          type: integer
        partsAtFullResolution:
          type: integer
        method:
          type: object
          required: [rule, threshold, parts, sharedBorders]
          properties:
            rule: { type: string }
            threshold: { type: string }
            parts: { type: string }
            sharedBorders: { type: string }

    GeometrySource:
      type: object
      description: >
        Where the served WGS84 geometry came from. `transformation` is
        present only when the source was reprojected.
      required: [sourceCrs]
      properties:
        sourceCrs:
          type: string
        transformation:
          type: object
          required: [name, epsg, accuracyM, areaOfUse]
          properties:
            name:
              type: string
            epsg:
              type: string
            accuracyM:
              type: number
              description: EPSG's stated accuracy within the area of use.
            areaOfUse:
              type: string
        corrections:
          type: array
          description: >
            Declared grid corrections that moved this area before it was
            reprojected, such as `northern-ireland-offset`.
          items:
            type: object
            required: [id, description]
            properties:
              id:
                type: string
              description:
                type: string

    AreaGeometryEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AreaGeometry"

    AreaGeometryMetadata:
      allOf:
        - $ref: "#/components/schemas/Area"
        - type: object
          required:
            [
              geography,
              boundaryRelease,
              boundingBox,
              centroid,
              labelPoint,
              labelPointMethod,
              area,
              perimeter,
              geometryExtent,
              method,
              geometrySource,
            ]
          properties:
            geography:
              type: string
            boundaryRelease:
              type: string
            boundingBox:
              type: array
              description: >
                [minLongitude, minLatitude, maxLongitude, maxLatitude] in WGS 84.
              items:
                type: number
              minItems: 4
              maxItems: 4
            centroid:
              type: array
              description: "[longitude, latitude] in WGS 84."
              items:
                type: number
              minItems: 2
              maxItems: 2
            labelPoint:
              type: array
              description: "[longitude, latitude] in WGS 84, always inside the geometry."
              items:
                type: number
              minItems: 2
              maxItems: 2
            labelPointMethod:
              type: string
              enum: [centroid, interior-span]
              description: >
                `centroid` when the centre of area lies inside the geometry,
                `interior-span` when it does not and a point inside was chosen
                instead.
            area:
              type: object
              description: One measurement, in three units.
              required: [m2, hectares, km2]
              properties:
                m2: { type: number }
                hectares: { type: number }
                km2: { type: number }
            perimeter:
              type: object
              required: [m, km]
              properties:
                m: { type: number }
                km: { type: number }
            geometryExtent:
              type: object
              description: >
                How much geometry stands behind the measurements: a mainland
                and its islands are many parts, and a ring of land has more
                rings than parts.
              required: [parts, rings, vertices]
              properties:
                parts: { type: integer }
                rings: { type: integer }
                vertices: { type: integer }
            method:
              type: object
              description: >
                The projection and rule behind each figure, carried with the
                response so a measurement can be read on its own.
              required: [area, perimeter, centroid, labelPoint, caveat]
              properties:
                area: { type: string }
                perimeter: { type: string }
                centroid: { type: string }
                labelPoint: { type: string }
                caveat: { type: string }
            geometrySource:
              $ref: "#/components/schemas/GeometrySource"

    AreaGeometryMetadataEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AreaGeometryMetadata"

    AreaRelationshipsEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AreaWithRelationships"

    AreaListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Area"

    AreaEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Area"

    CrosswalkSide:
      type: object
      required: [geography, boundaryRelease]
      properties:
        geography:
          type: string
        boundaryRelease:
          type: string

    CrosswalkMethod:
      description: >
        `official-lookup` and `clean-containment` read an explicit code pair
        from a published file. `area-overlap` intersects the two releases'
        boundary geometries and weights each source by the area it shares
        with each target.
      enum: [official-lookup, clean-containment, area-overlap]

    CrosswalkQuality:
      description: >
        `publisher-supplied` mappings restate a publisher's own
        correspondence. `derived` mappings are computed by the Atlas.
      enum: [publisher-supplied, derived]

    CrosswalkWeighting:
      oneOf:
        - type: object
          required: [status]
          properties:
            status:
              enum: [not-provided, not-applicable]
        - type: object
          description: >
            Each record's target weights are shares of the source's area
            covered by its published targets, and sum to 1 within rounding.
          required: [status, basis, normalisation]
          properties:
            status:
              const: provided
            basis:
              const: area
            normalisation:
              const: per-source

    CrosswalkSummary:
      type: object
      required:
        - id
        - from
        - to
        - method
        - quality
        - weighting
        - recordCount
        - artifact
        - contentHash
      properties:
        id:
          type: string
        from:
          $ref: "#/components/schemas/CrosswalkSide"
        to:
          $ref: "#/components/schemas/CrosswalkSide"
        method:
          $ref: "#/components/schemas/CrosswalkMethod"
        quality:
          $ref: "#/components/schemas/CrosswalkQuality"
        weighting:
          $ref: "#/components/schemas/CrosswalkWeighting"
        recordCount:
          type: integer
        artifact:
          type: string
        contentHash:
          type: string

    CrosswalkSummaryListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/CrosswalkSummary"

    CrosswalkMetadata:
      type: object
      required:
        - schemaVersion
        - contentHash
        - id
        - method
        - quality
        - weighting
        - from
        - to
        - provenance
        - validation
      properties:
        schemaVersion:
          const: 1
        contentHash:
          type: string
        id:
          type: string
        method:
          $ref: "#/components/schemas/CrosswalkMethod"
        quality:
          $ref: "#/components/schemas/CrosswalkQuality"
        weighting:
          $ref: "#/components/schemas/CrosswalkWeighting"
        from:
          $ref: "#/components/schemas/CrosswalkSide"
        to:
          $ref: "#/components/schemas/CrosswalkSide"
        provenance:
          oneOf:
            - type: object
              description: The one published file the code pairs are read from.
              required: [input, inputHash]
              properties:
                input:
                  type: string
                inputHash:
                  type: string
            - type: object
              description: >
                The two boundary geometries an `area-overlap` crosswalk
                intersects, how areas were measured, and the clipping library
                that computed each intersection.
              required: [inputs, areaProjection, clipping]
              properties:
                inputs:
                  type: array
                  items:
                    type: object
                    required: [side, input, inputHash]
                    properties:
                      side:
                        enum: [from, to]
                      input:
                        type: string
                      inputHash:
                        type: string
                areaProjection:
                  const: EPSG:6933
                  description: >
                    Lambert cylindrical equal-area on the WGS 84 ellipsoid, so
                    every area is an ellipsoidal area in square metres.
                clipping:
                  type: string
                  description: Clipping library and version, e.g. `polygon-clipping@0.15.7`.
        validation:
          type: object
          required: [sourceNameConflicts, endpoints]
          properties:
            overlap:
              $ref: "#/components/schemas/AreaOverlapValidation"
            sourceNameConflicts:
              type: array
              items:
                type: object
                required: [code, names]
                properties:
                  code:
                    type: string
                  names:
                    type: array
                    items:
                      type: string
            endpoints:
              type: object
              required: [from, to]
              properties:
                from:
                  $ref: "#/components/schemas/CrosswalkEndpointValidation"
                to:
                  $ref: "#/components/schemas/CrosswalkEndpointValidation"

    CrosswalkEndpointValidation:
      oneOf:
        - type: object
          required: [status, availableAreaCount, referencedCodeCount]
          properties:
            status:
              const: verified
            availableAreaCount:
              type: integer
            referencedCodeCount:
              type: integer
        - type: object
          required: [status, reason]
          properties:
            status:
              const: not-available
            reason:
              type: string

    AreaOverlapValidation:
      type: object
      description: >
        Present only for `area-overlap` crosswalks. Two independently
        generalised boundaries leave narrow slivers where they disagree. A
        pair whose widest intersecting piece is narrower than `sliverWidthM`
        (twice its area over its perimeter) is dropped as a sliver. The build
        fails unless every sliver is under half that width and every kept
        overlap at least twice it, and unless every source and target area is
        at least `minimumCoverage` covered by kept overlaps.
      required:
        - candidatePairCount
        - intersectingPairCount
        - sliverPairCount
        - sliverWidthM
        - widestSliverWidthM
        - narrowestOverlapWidthM
        - minimumCoverage
        - minimumSourceCoverage
        - minimumTargetCoverage
      properties:
        candidatePairCount:
          type: integer
          description: Pairs whose bounding boxes meet, and so were clipped.
        intersectingPairCount:
          type: integer
        sliverPairCount:
          type: integer
        sliverWidthM:
          type: number
        widestSliverWidthM:
          type: [number, "null"]
        narrowestOverlapWidthM:
          type: number
        minimumCoverage:
          type: number
        minimumSourceCoverage:
          type: number
        minimumTargetCoverage:
          type: number

    CrosswalkMetadataEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CrosswalkMetadata"

    CrosswalkArea:
      type: object
      required: [code, labels]
      properties:
        code:
          type: string
        labels:
          type: array
          items:
            type: string
          description: >
            Non-canonical name candidates. More than one entry means the
            source disagreed with itself about this area's name; it is not
            an alias list to pick from arbitrarily.

    CrosswalkRecord:
      type: object
      required: [source, targets]
      properties:
        source:
          $ref: "#/components/schemas/CrosswalkArea"
        targets:
          type: array
          items:
            $ref: "#/components/schemas/CrosswalkArea"

    AreaOverlapRecord:
      type: object
      description: >
        One `area-overlap` source with the targets it shares area with, after
        slivers are dropped. Areas are ellipsoidal square metres.
      required: [source, targets]
      properties:
        source:
          allOf:
            - $ref: "#/components/schemas/CrosswalkArea"
            - type: object
              required: [areaM2, coverage]
              properties:
                areaM2:
                  type: integer
                coverage:
                  type: number
                  description: Share of the source's area covered by its targets.
        targets:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/CrosswalkArea"
              - type: object
                required:
                  [weight, overlapAreaM2, sourceShare, targetShare]
                properties:
                  weight:
                    type: number
                    description: >
                      Share of the source's covered area. A record's weights
                      sum to 1 within rounding, so they apportion a whole
                      source quantity across its targets.
                  overlapAreaM2:
                    type: integer
                  sourceShare:
                    type: number
                    description: Overlap as a share of the whole source area.
                  targetShare:
                    type: number
                    description: Overlap as a share of the whole target area.

    CrosswalkRecordListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                anyOf:
                  - $ref: "#/components/schemas/CrosswalkRecord"
                  - $ref: "#/components/schemas/AreaOverlapRecord"

    RelationshipCandidateSide:
      type: object
      required: [geography, boundaryRelease, codeProperty, nameProperty]
      properties:
        geography:
          type: string
        boundaryRelease:
          type: string
        codeProperty:
          type: string
        nameProperty:
          type: string

    RelationshipCandidateTarget:
      type: object
      required: [codeProperty, nameProperty]
      properties:
        geography:
          type: string
        boundaryRelease:
          type: string
        codeProperty:
          type: string
        nameProperty:
          type: string
      description: >
        `boundaryRelease` (and sometimes `geography`) are present only when
        exactly one compiled area release already uses this code/name
        property pair.

    RelationshipCandidateEndpointStatus:
      oneOf:
        - type: object
          required: [status, availableAreaCount, referencedCodeCount]
          properties:
            status:
              const: verified
            availableAreaCount:
              type: integer
            referencedCodeCount:
              type: integer
        - type: object
          required: [status, reason]
          properties:
            status:
              const: not-available
            reason:
              type: string

    RelationshipCandidate:
      type: object
      required: [id, input, from, to, status, validation]
      properties:
        id:
          type: string
        input:
          type: string
        from:
          $ref: "#/components/schemas/RelationshipCandidateSide"
        to:
          $ref: "#/components/schemas/RelationshipCandidateTarget"
        status:
          enum: [eligible, needs-review, not-available]
        publishedCrosswalkId:
          type: string
          description: Set when a published crosswalk already covers this candidate.
        validation:
          type: object
          required: [endpoints, relationship, reasons]
          properties:
            endpoints:
              type: object
              required: [from, to]
              properties:
                from:
                  $ref: "#/components/schemas/RelationshipCandidateEndpointStatus"
                to:
                  $ref: "#/components/schemas/RelationshipCandidateEndpointStatus"
            relationship:
              type: object
              required:
                - sourceFeatureCount
                - sourceCodeCount
                - targetCodeCount
                - multiTargetSourceCount
                - missingValueFeatureCount
              properties:
                sourceFeatureCount:
                  type: integer
                sourceCodeCount:
                  type: integer
                targetCodeCount:
                  type: integer
                multiTargetSourceCount:
                  type: integer
                missingValueFeatureCount:
                  type: integer
            reasons:
              type: array
              items:
                type: string

    RelationshipCandidateListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/RelationshipCandidate"

    ValidationCheck:
      type: object
      required: [id, status]
      properties:
        id:
          enum:
            - registry-links
            - release-coverage
            - licence-recorded
            - area-identities
            - geometry-servable
            - candidates-reviewed
            - artifact-integrity
            - endpoints-verified
            - source-names-consistent
            - targets-present
            - single-parent
            - weights-sum-to-one
            - area-coverage
            - sliver-separation
            - measure-definition
            - records-resolve
            - countries-declared
            - values-valid
            - components-sum-to-total
        status:
          enum: [passed, waived]
        detail:
          type: string
          description: What the check found. Present on every waived check.
        measured:
          type: object
          description: Figures the check measured, whether it passed or not.
          additionalProperties:
            type: [number, string, "null"]
        waiver:
          type: object
          required: [reason]
          properties:
            reason:
              type: string

    ValidationResource:
      type: object
      required: [id, kind, status, checks]
      properties:
        id:
          type: string
          description: >
            `atlas` for checks across the Atlas's own artifacts; otherwise
            the validated resource's API path, such as
            `crosswalks/{crosswalk-id}`. A measure source partition is
            identified by the export that serves it, as
            `exports/{export-id}`.
        kind:
          enum: [atlas, boundary-release, crosswalk, measure, measure-source]
        status:
          enum: [passed, waived]
          description: waived when any of its checks is waived.
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ValidationCheck"

    ValidationReport:
      type: object
      required: [schemaVersion, contentHash, inputs, summary, resources]
      properties:
        schemaVersion:
          const: 1
        contentHash:
          type: string
        inputs:
          type: object
          description: Content hashes of the artifacts and waivers the checks read.
          additionalProperties:
            type: string
        summary:
          type: object
          required: [resourceCount, checkCount, passedCount, waivedCount, coverage]
          properties:
            resourceCount:
              type: integer
            checkCount:
              type: integer
            passedCount:
              type: integer
            waivedCount:
              type: integer
            coverage:
              type: object
              description: >
                How many boundary releases each capability reaches.
                servableGeometry counts releases with servable geometry for
                at least some areas; their geometry-servable checks name any
                areas refused. measures and measureSources count the checked
                measures and their source partitions.
              required:
                - boundaryReleases
                - areaIdentities
                - servableGeometry
                - withRelationships
                - crosswalks
                - weightedCrosswalks
                - measures
                - measureSources
              properties:
                boundaryReleases:
                  type: integer
                areaIdentities:
                  type: integer
                servableGeometry:
                  type: integer
                withRelationships:
                  type: integer
                crosswalks:
                  type: integer
                weightedCrosswalks:
                  type: integer
                measures:
                  type: integer
                measureSources:
                  type: integer
        resources:
          type: array
          items:
            $ref: "#/components/schemas/ValidationResource"

    ExportField:
      type: object
      required: [name, type, required]
      properties:
        name:
          type: string
          description: A key of the manifest's `fields`.
        type:
          enum: [string, number, object]
        required:
          type: boolean
          description: True when every record in the artifact carries the field.

    ExportDataset:
      type: object
      required: [publisher, sourceUrl, licence, inputs, href]
      properties:
        publisher:
          type: string
        sourceUrl:
          type: string
        licence:
          type: object
          required: [name]
          properties:
            name:
              type: string
            url:
              type: string
        inputs:
          type: array
          items:
            type: object
            required: [path, sha256]
            properties:
              path:
                type: string
              sha256:
                type: string
        href:
          type: string

    BulkExport:
      type: object
      required:
        - id
        - measureId
        - datasetId
        - periods
        - sourceGeography
        - format
        - artifact
        - contentHash
        - bytes
        - href
        - recordCount
        - recordCountByPeriod
        - schema
        - provenance
      properties:
        id:
          type: string
        measureId:
          type: string
        datasetId:
          type: string
        periods:
          type: array
          items:
            type: string
        sourceGeography:
          type: object
          required: [type, boundaryYear]
          properties:
            type:
              type: string
            boundaryYear:
              type: integer
        format:
          const: json
        artifact:
          type: string
        contentHash:
          type: string
        bytes:
          type: integer
        href:
          type: string
        recordCount:
          type: integer
          description: Records in the artifact, counted from it.
        recordCountByPeriod:
          type: object
          additionalProperties:
            type: integer
        schema:
          type: object
          required: [version, layout, recordType, fields]
          description: >
            The artifact's shape, read from the artifact. `version` is the
            artifact's `schemaVersion`, which increments when a field is
            removed, renamed or changes type or meaning, or the layout changes.
          properties:
            version:
              type: integer
            layout:
              enum: [periods, single-period, table]
              description: >
                `table` is an artifact several measures share, such as a
                census table: one row per area, the area code and then a value
                for each measure in `measures` order, null where none is
                published. Each of its measures exports the whole table.
            measures:
              type: array
              items: { type: string }
              description: For a `table`, the measure each value column serves, in order.
            recordType:
              enum: [numeric, categorical]
            fields:
              type: array
              items:
                $ref: "#/components/schemas/ExportField"
        provenance:
          type: object
          required: [measure, datasets]
          properties:
            measure:
              type: string
            datasets:
              type: array
              description: Each id is described in the manifest's `datasets`.
              items:
                type: object
                required: [id, role]
                properties:
                  id:
                    type: string
                  role:
                    enum: [source, derived-from]

    ExportManifest:
      type: object
      required: [schemaVersion, contentHash, dataCatalogHash, fields, datasets, exports]
      properties:
        schemaVersion:
          const: 1
        contentHash:
          type: string
        dataCatalogHash:
          type: string
        fields:
          type: object
          description: What each record field means.
          additionalProperties:
            type: string
        datasets:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ExportDataset"
        exports:
          type: array
          items:
            $ref: "#/components/schemas/BulkExport"
        note:
          type: string

    ExportManifestEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ExportManifest"

    LookupFormat:
      type: object
      required: [contentType, bytes, contentHash, href]
      properties:
        contentType:
          type: string
        bytes:
          type: integer
        contentHash:
          type: string
          description: SHA-256 of the rendered bytes, which a download is checked against.
        href:
          type: string

    LookupManifest:
      type: object
      required: [schemaVersion, contentHash, lookups]
      properties:
        schemaVersion:
          const: 1
        contentHash:
          type: string
        lookups:
          type: array
          items:
            type: object
            required: [id, kind, title, source, columns, rowCount, formats]
            properties:
              id:
                type: string
              kind:
                enum: [area-identities, crosswalk, named-location-members]
              title:
                type: string
              source:
                type: object
                required: [artifact, contentHash]
                properties:
                  artifact:
                    type: string
                  contentHash:
                    type: string
              columns:
                type: array
                items:
                  type: object
                  required: [name, type, required, description]
                  properties:
                    name:
                      type: string
                    type:
                      enum: [string, number, "string[]"]
                    required:
                      type: boolean
                      description: True when every row has a value, which the build checks.
                    description:
                      type: string
              rowCount:
                type: integer
              formats:
                type: object
                required: [csv, ndjson]
                properties:
                  csv:
                    $ref: "#/components/schemas/LookupFormat"
                  ndjson:
                    $ref: "#/components/schemas/LookupFormat"
        note:
          type: string

    LookupManifestEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/LookupManifest"

    ValidationReportEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ValidationReport"

    ValidationResourceEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ValidationResource"

    AtlasReleaseArtifactRef:
      type: object
      required: [id, path, contentHash]
      properties:
        id:
          type: string
        path:
          type: string
        contentHash:
          type: string

    AtlasRelease:
      type: object
      required: [schemaVersion, releaseId, artifacts]
      properties:
        schemaVersion:
          const: 1
        releaseId:
          type: string
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/AtlasReleaseArtifactRef"
        resources:
          type: object
          description: >
            A fingerprint per resource id for each kind, read from artifacts the
            release already hashes, so it does not enter `releaseId`. A kind
            the release did not record is absent.
          additionalProperties:
            type: object
            additionalProperties:
              type: string

    ResourceChanges:
      oneOf:
        - type: object
          required: [status, added, removed, changed, unchanged]
          properties:
            status:
              const: compared
            added:
              type: array
              items: { type: string }
            removed:
              type: array
              items: { type: string }
            changed:
              type: array
              items: { type: string }
            unchanged:
              type: integer
        - type: object
          required: [status, reason]
          properties:
            status:
              const: not-recorded
            reason:
              type: string

    SemanticResourceChange:
      type: object
      required: [kind, id, fields]
      properties:
        kind:
          enum: [datasets, measures, boundaryReleases, areaIdentities, geometrySources, crosswalks, validationExceptions, namedLocations, exports, lookups]
        id:
          type: string
        fields:
          type: array
          description: >
            Changed dot paths in this published resource entry. Array-valued
            fields are named as one path, and no observation-record paths are
            inferred.
          items: { type: string }

    SemanticReleaseChanges:
      oneOf:
        - type: object
          required: [status, changes]
          properties:
            status:
              const: available
            changes:
              type: array
              items:
                $ref: "#/components/schemas/SemanticResourceChange"
        - type: object
          required: [status, reason]
          properties:
            status:
              const: unavailable
            reason:
              type: string

    AtlasReleaseComparison:
      type: object
      required: [from, to, summary, artifacts, resources, note]
      properties:
        from:
          type: object
        to:
          type: object
        summary:
          type: object
          description: Counts of artifacts added, removed, changed and unchanged.
        artifacts:
          type: object
        resources:
          type: object
          description: >
            For each resource kind, the ids added, removed and changed, or
            `not-recorded` when either release lacks that kind's fingerprints.
          properties:
            datasets: { $ref: "#/components/schemas/ResourceChanges" }
            measures: { $ref: "#/components/schemas/ResourceChanges" }
            boundaryReleases: { $ref: "#/components/schemas/ResourceChanges" }
            areaIdentities: { $ref: "#/components/schemas/ResourceChanges" }
            geometrySources: { $ref: "#/components/schemas/ResourceChanges" }
            crosswalks: { $ref: "#/components/schemas/ResourceChanges" }
            validationExceptions: { $ref: "#/components/schemas/ResourceChanges" }
            namedLocations: { $ref: "#/components/schemas/ResourceChanges" }
            exports: { $ref: "#/components/schemas/ResourceChanges" }
            lookups: { $ref: "#/components/schemas/ResourceChanges" }
        semantic:
          allOf:
            - $ref: "#/components/schemas/SemanticReleaseChanges"
          description: Present only when `detail=fields` was requested.
        note:
          type: string

    AtlasReleaseComparisonEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AtlasReleaseComparison"

    AtlasReleaseEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AtlasRelease"
