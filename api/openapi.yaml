                      publisher: Department for Energy Security and Net Zero
                      sourceUrl: https://www.gov.uk/government/statistics/uk-local-authority-and-regional-greenhouse-gas-emissions-statistics-2005-to-2024
                      licence:
                        name: Open Government Licence v3.0
