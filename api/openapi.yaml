  /relationship-capabilities:
    get:
      operationId: diagnoseRelationshipCapability
      tags: ["Geography"]
      summary: Diagnose whether a geography conversion is usable and complete
      x-likely-refusal:
        status: 400
        when: "The source release is missing, or only part of an exact target conversion was supplied."
        x-example-request: "/v1/relationship-capabilities?sourceGeography=ward"
      description: >
        With only a source geography/release, discovers every declared target
        and purpose. With a complete target conversion, turns that exact
        question into an operational answer. For each
        declared path it reports the published steps, how many source areas the
        first step maps, and whether every step covers its own source release.
        It also explicitly names missing identity or crosswalk artifacts, so a
        `not-built` answer is a repair queue rather than an ambiguous absence.

        Each path also carries a trust assessment: `verified` requires
        publisher-supplied complete steps; `derived`, `partial` and `not-built`
        make the limiting evidence explicit.

        Paths are ranked deterministically without hiding alternatives:
        complete coverage first, then strength of evidence, published-path
        origin and step count. `rank.reasons` makes that ordering inspectable
        to callers rather than treating catalogue order as a recommendation.

        `operations` states the permitted use of the relationship purpose, so
        callers cannot mistake containment membership for weighted allocation
        or an identity lookup.

        Add `measure` to an exact conversion question to preflight the value
        operation as well. Extensive measures can be summed for membership or
        allocated for apportionment only when that operation is published. An
        intensive measure names its required denominator and returns
        `requires-conversion` rather than authorising a sum; categorical and
        non-aggregatable measures are refused. The path capability remains
        separate from this measure-specific assessment.

        The preflight also requires compiled evidence that a published
        measure partition's area codes fit the exact source release. A
        different or partial code set is explicitly refused, with published
        source partitions listed as alternatives. Code compatibility does not
        claim that releases have identical geometry.
        A refused partial or non-overlapping source includes its code-set
        counts and sample unmatched codes, so it can be repaired rather than
        treated as an unexplained unavailable conversion.

        `available` means every path step has complete published coverage;
        `partial` means a published path leaves some areas unmapped; `not-built`
        names a missing prerequisite; and `unsupported` means no declared path
        exists for the requested purpose. The endpoint does not infer paths.
      parameters:
        - { name: sourceGeography, in: query, required: true, schema: { type: string } }
        - { name: sourceRelease, in: query, required: true, schema: { type: string } }
        - { name: targetGeography, in: query, required: false, schema: { type: string } }
        - { name: targetRelease, in: query, required: false, schema: { type: string } }
        - name: purpose
          in: query
          required: false
          schema:
            type: string
            enum: [identity, membership, apportion]
        - name: measure
          in: query
          required: false
          schema: { type: string }
          description: >
            A published measure id to preflight against an exact target
            conversion. Requires targetGeography, targetRelease and purpose.
      responses:
        "200":
          description: The conversion capability, coverage and missing prerequisites.
          content:
            application/json:
              schema: { type: object }
              examples:
                available:
                  x-example-request: "/v1/relationship-capabilities?sourceGeography=ward&sourceRelease=2023-05-uk-bgc&targetGeography=localAuthority&targetRelease=2023-05-uk-bgc-v2&purpose=membership"
                  value:
                    apiVersion: v1
                    atlasRelease: sha256:5c4aa4529cbfbd5e4c844c55cddba1ef04a7bf76f3eaa085a357fff401af6d0c
                    data:
                      purpose: membership
                      status: available
                      paths:
                        - id: ward-2023-05-uk-bgc-to-local-authority-2023-05-uk-bgc-v2-clean-containment/forward/membership
                          operations:
                            permitted: [containment-aggregation, membership-join]
                            prohibited: [weighted-allocation]
                          trust:
                            level: verified
                            reasons: [Every path step is publisher-supplied and has complete compiled coverage.]
                          rank:
                            position: 1
                            reasons: [complete source coverage, verified evidence, crosswalk path, 1 step]
                          coverage:
                            status: complete
                            mappedSourceAreaCount: 8441
                            sourceAreaCount: 8441
                            share: 1
                      missingPrerequisites: []
                    meta:
                      nextCursor: null
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /conversion-plan:
