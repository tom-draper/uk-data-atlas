  /validation/exports/{export-id}:
    get:
      operationId: getMeasureSourceValidation
      tags: ["Governance"]
      summary: Get one measure source partition's checks
      x-likely-refusal:
        status: 404
        when: "A measure id is given where an export id is asked for. An export is one source partition; `/v1/exports` lists them."
        x-example-request: "/v1/validation/exports/population-estimate"
      description: >
        Each export serves one source partition of a measure, and is checked
        from the observation artifact itself. `artifact-integrity`: the
        content reproduces its hash, which matches the export manifest, and
        its measure, geography, periods, latest-period record count and
        unique area codes match the catalogue. `records-resolve`: one
        compiled boundary release of the source geography and boundary year
        holds every area code, in every period. `countries-declared`: the
        codes cover exactly the nations the catalogue declares.
        `values-valid`: every record suits its measure, such as whole,
        non-negative counts, percentages from 0 to 100, deciles from 1 to 10
        and published intervals that contain their value. A measure declared
        as the sum of others adds `components-sum-to-total`, comparing each
        area and period with its components in the same source partitions.
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "200":
          description: The source partition's checks.
          content:
            application/json:
