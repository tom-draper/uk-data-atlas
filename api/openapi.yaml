                      id: ward/2023-05-uk-bgc/E05011118
                      properties:
                        id: ward/2023-05-uk-bgc/E05011118
                        geography: ward
                        boundaryRelease: 2023-05-uk-bgc
                        code: E05011118
                        name: Acocks Green
                        membership:
