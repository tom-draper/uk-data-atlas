              schema:
                $ref: "#/components/schemas/Envelope"
              x-example-request: "/v1/data/population-estimate/convert?period=2022&geography=ward&boundaryYear=2023&crosswalk=ward-2023-05-uk-bgc-to-local-authority-2023-05-uk-bgc-v2-clean-containment&limit=1"
