  /areas:contains:
    get:
      operationId: findContainingAreas
      tags: ["Map"]
      summary: Find the areas containing a WGS84 point in one or more geographies
      description: >
        Tests a point against one boundary release of each requested geography,
        at most four in one request, and says for each what contains it or why
        nothing does.


        Each geography's release is either pinned, as
        `release={geography}/{release}`, or chosen for `date` as the latest one
        dated on or before it, exactly as `/boundary-releases:resolve` chooses.
        A geography with neither is refused. A date no release fits, or one
        several releases of the same month fit equally, is reported in that
        geography's result as `no-release-for-date` or `ambiguous-release`
        rather than failing the whole lookup.


        Points on an exterior or hole ring are included and labelled
        `boundary`, so a point on a shared border returns every area sharing
        it. A result with no match is `outside-coverage` when the point's
        country is outside the release's coverage, or outside every UK country
        boundary, and `no-match` when the release covers the point's country
        but no area of it contains the point. The country comes from a matched
        area's code where one has it, and otherwise from the country
        boundaries, and `country.determinedBy` says which.


        Every result states how far its answer can be trusted.
        `positionalToleranceM` adds the coordinate's uncertainty, taken from
        `accuracy` or else from its written decimal places, the boundary's
        generalisation, read from the ONS release name, and the stated accuracy
        of any transformation from the source CRS to WGS 84. A match whose edge
        lies within that tolerance is `nearBoundary`. The geometry's source
        file, hash, CRS and transformation are given for each release and each
        match.


        Each release is read into memory on first use, which can take a second
        or more for a large release; later lookups against it are fast.
      parameters:
        - name: lng
          in: query
          required: true
          schema: { type: string, pattern: "^[+-]?\\d+(\\.\\d+)?$" }
          description: >
            Longitude in WGS 84 decimal degrees, -180 to 180. Written as a plain
            decimal: its decimal places are read as its precision.
        - name: lat
          in: query
          required: true
          schema: { type: string, pattern: "^[+-]?\\d+(\\.\\d+)?$" }
          description: Latitude in WGS 84 decimal degrees, -90 to 90, as for `lng`.
        - $ref: "#/components/parameters/PointLookupGeography"
        - $ref: "#/components/parameters/PointLookupRelease"
        - $ref: "#/components/parameters/PointLookupDate"
        - $ref: "#/components/parameters/PointLookupAccuracy"
      responses:
        "200":
          description: Each requested geography's containing areas, or why there are none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointContainmentEnvelope"
              x-example-request: "/v1/areas:contains?lng=-3.1791&lat=51.4816&geography=ward&geography=localHealthBoard&geography=combinedAuthority&date=2025-06-01"
              example:
                apiVersion: v1
                atlasRelease: sha256:da4898229392e8fa52cd5098cf24c52f11abf454b0adcab178c6c82e30032c15
                data:
                  point:
                    lng: -3.1791
                    lat: 51.4816
                    crs: EPSG:4326
                    precision:
                      decimalPlaces: { lng: 4, lat: 4 }
                      uncertaintyM: 5.56
                      basis: decimal-places
                  date: "2025-06-01"
                  country:
                    code: GB-WLS
                    determinedBy: area-code
                    area: ward/2025-05-uk-bgc-v2/W05001274
                  boundaryRule: included
                  results:
                    - geography: ward
                      boundaryRelease: 2025-05-uk-bgc-v2
                      href: /v1/boundary-releases/ward/2025-05-uk-bgc-v2
                      selection:
                        policy: latest-release-dated-on-or-before
                        date: "2025-06-01"
                        sameMonth: false
                      boundaryResolution:
                        generalisation: generalised-20m
                        extent: clipped-to-coastline
                        toleranceM: 20
                        basis: ons-release-name
                      geometrySource:
                        sourceCrs: EPSG:4326
                      status: matched
                      positionalToleranceM: 25.56
                      matches:
                        - id: ward/2025-05-uk-bgc-v2/W05001274
                          code: W05001274
                          name: Cathays
                          containment: interior
                          distanceToBoundaryM: 465.67
                          nearBoundary: false
                    - geography: localHealthBoard
                      boundaryRelease: 2023-12-w-bgc
                      coverage:
                        countries: [GB-WLS]
                      status: matched
                      matches:
                        - id: localHealthBoard/2023-12-w-bgc/W11000029
                          code: W11000029
                          name: Cardiff and Vale University Health Board
                          containment: interior
                          nearBoundary: false
                    - geography: combinedAuthority
                      selection:
                        policy: latest-release-dated-on-or-before
                        date: "2025-06-01"
                      status: no-release-for-date
                      detail: The earliest combinedAuthority boundary release is dated 2025-12, after 2025-06.
                      earliest:
                        id: 2025-12-en-bgc
                        month: "2025-12"
                      matches: []
        "400":
          description: >
            The point is missing, malformed or out of range; no geography is
            named; more than four are; a geography has neither a pinned release
            nor a date; a bare release id is given with several geographies; or
            `date` or `accuracy` is malformed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: >
            A pinned release is not published or not compiled, or a geography
            is unknown.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /areas:containsBatch:
    get:
      operationId: findContainingAreasForPoints
      tags: ["Map"]
      summary: Find the areas containing each of a bounded batch of points
      description: >
        The `areas:contains` lookup for up to 100 points at once, each given as
        `point={lng},{lat}` or `point={lng},{lat},{accuracy}`. Geographies,
        release selection and statuses are exactly as for a single point.


        Release-wide facts, including selection, coverage, resolution and
        geometry provenance, are given once in `releases`. Each point then
        lists its country and, per release in the same order, its status and
        matches; a match carries `corrections` only where a declared grid
        correction moved that area. `summary` counts the lookups by outcome
        and how many have a match near a boundary.


        Every release is read once for all the points, so the cost of a batch
        grows with its points rather than with its points times its
        geographies. This is a bounded convenience for a caller's own point
        dataset, not a bulk geocoder: for more points, page through them in
        batches.
      parameters:
        - name: point
          in: query
          required: true
          schema:
            type: array
            maxItems: 100
            items: { type: string }
          style: form
          explode: true
          description: >
            `{lng},{lat}` in plain decimal WGS 84 degrees, optionally followed
            by `,{accuracy}` in metres. Repeat for each point, up to 100.
        - $ref: "#/components/parameters/PointLookupGeography"
        - $ref: "#/components/parameters/PointLookupRelease"
        - $ref: "#/components/parameters/PointLookupDate"
        - $ref: "#/components/parameters/PointLookupAccuracy"
      responses:
        "200":
          description: Each point's containing areas in every requested release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointContainmentBatchEnvelope"
              x-example-request: "/v1/areas:containsBatch?point=-1.5491,53.8008&point=1.0,54.5&geography=localAuthority&date=2025-06-01"
              example:
