      tags: ["Geography"]
      summary: Compare two releases of one geography without inferring geography change from codes
      x-likely-refusal:
        status: 400
        when: "One of geography, from or to is omitted, or from and to name the same release."
        x-example-request: "/v1/boundary-releases:compare?geography=ward&from=2023-05-uk-bgc"
      description: >
        Compares the two compiled code sets, with identifiers present in only
        one release kept distinct from a claim that an area was added or
        removed. Shared codes are called continuous only where a published
        same-code-continuity crosswalk measured their geometry. Its changed,
        indeterminate and unmeasured findings remain review evidence, not
        conversion claims. Other published crosswalks between the releases are
        named separately with their directional code cardinality and bounded
        split/merge-shaped examples. These describe published records, not a
        legal boundary-change finding, and need no runtime polygon comparison.
      parameters:
        - name: geography
          in: query
          required: true
          schema: { type: string }
          description: The shared geography family of both releases.
        - name: from
          in: query
          required: true
          schema: { type: string }
          description: The earlier or source release id.
        - name: to
          in: query
          required: true
          schema: { type: string }
