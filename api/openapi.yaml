                          - { code: N05000014, labels: [South Antrim] }
                    meta:
                      nextCursor: null
                areaOverlap:
                  value:
                    apiVersion: v1
                    atlasRelease: "sha256:c51e3f4ef14b77972061b9c8f08a838975d700adba9d2372c5d1bbbe8edd27a2"
                    data:
                      - source:
                          code: E14001067
                          labels: [Arundel and South Downs]
                          areaM2: 835415269
                          coverage: 0.999884
                        targets:
                          - code: E07000224
                            labels: [Arun]
                            weight: 0.122779
                            overlapAreaM2: 102559824
                            sourceShare: 0.122765
                            targetShare: 0.463915
                          - code: E07000225
                            labels: [Chichester]
                            weight: 0.614952
                            overlapAreaM2: 513680634
                            sourceShare: 0.614881
                            targetShare: 0.652975
                          - code: E07000227
                            labels: [Horsham]
                            weight: 0.262269
                            overlapAreaM2: 219077810
                            sourceShare: 0.262238
                            targetShare: 0.413031
                    meta:
                      nextCursor: null
        "404":
          $ref: "#/components/responses/NotFound"

  /relationship-candidates:
    get:
      operationId: listRelationshipCandidates
      summary: List discovered relationship candidates and their coverage gaps
      description: >
        Scans every compiled area release's raw source for extra code/name
        property pairs beyond the one already used for its own identity, and
        reports whether a matching compiled target release exists. A
        candidate already covered by a published crosswalk carries that
        crosswalk's id in `publishedCrosswalkId`. This is a discovery and gap
        report, not an instruction to auto-publish every `eligible` candidate
        as a crosswalk without review — see the `status` values below.
      responses:
        "200":
          description: The discovered relationship candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipCandidateListEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:24a500c55416bd7d58c28b1fc8cc4931d4a2fd831addafa3116556a91f2c4857"
                data:
                  - id: parish-2019-04-ew-bgc-to-local-authority-unavailable
                    input: boundaries/parish/2019-04-ew-bgc/Parishes_and_Non_Civil_Parished_Areas_April_2019_GCB_EW_2022_7767177223882237005.geojson
                    from:
                      geography: parish
                      boundaryRelease: 2019-04-ew-bgc
                      codeProperty: parncp19cd
                      nameProperty: parncp19nm
                    to:
                      geography: localAuthority
                      codeProperty: lad19cd
                      nameProperty: lad19nm
                    status: not-available
                    validation:
                      endpoints:
                        from: { status: verified, availableAreaCount: 11556, referencedCodeCount: 11556 }
                        to: { status: not-available, reason: "No compiled target release has lad19cd/lad19nm fields." }
                      relationship:
                        sourceFeatureCount: 11556
                        sourceCodeCount: 11556
                        targetCodeCount: 339
                        multiTargetSourceCount: 0
                        missingValueFeatureCount: 0
                      reasons:
                        - "No compiled target release has lad19cd/lad19nm fields."
                meta:
                  nextCursor: null
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /validation:
    get:
      operationId: getValidationReport
      summary: Report every release gate, including waived exceptions
      description: >
        The build checks each boundary release, each crosswalk and the links
        between the Atlas's own artifacts, recomputing what it can from the
        published artifacts rather than trusting each compiler's claims. A
        check either passes or is waived: the build fails on any exception
        without a recorded reason, and on any waiver that no longer matches
        an exception. Waived checks carry what was found and why it was
        accepted.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            enum: [passed, waived]
          description: Return only resources with this status.
      responses:
        "200":
          description: The validation report for the current Atlas release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReportEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:7ae746ebc845f17dced61fe2e49edcd4d4c88a2517238535b32c11a4d1d3cbc0"
                data:
                  schemaVersion: 1
                  inputs:
                    boundaryRegistry: "sha256:72a44d7410092600f56c22491e5a4391e7fe33a64762239e7ae0fd444ecdff44"
                    crosswalkInventory: "sha256:29dc114d1a0d62561345319ac989c88713d60e5630840af11364b42aeafa59c6"
                    waivers: "sha256:69c839c2cd9886dbdef9a598b99e16024ad7e53404a65db5010dccc6d85d23ef"
                  summary:
                    resourceCount: 86
                    checkCount: 357
                    passedCount: 353
                    waivedCount: 4
                    coverage:
                      boundaryReleases: 71
                      areaIdentities: 71
                      servableGeometry: 69
                      withRelationships: 22
                      crosswalks: 14
                      weightedCrosswalks: 1
                  resources:
                    - id: atlas
                      kind: atlas
                      status: passed
                      checks:
                        - id: registry-links
                          status: passed
                        - id: release-coverage
                          status: passed
                          measured: { boundaryReleaseCount: 71 }
                meta:
                  nextCursor: null
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /validation/boundary-releases/{geography}/{release}:
    get:
      operationId: getBoundaryReleaseValidation
      summary: Get one boundary release's checks
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
      responses:
        "200":
          description: The boundary release's checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResourceEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:c51e3f4ef14b77972061b9c8f08a838975d700adba9d2372c5d1bbbe8edd27a2"
                data:
                  id: boundary-releases/dataZone/2011-12-sc-bfc
                  kind: boundary-release
                  status: waived
                  checks:
                    - id: licence-recorded
                      status: passed
                    - id: area-identities
                      status: passed
                      measured: { areaCount: 6976 }
                    - id: geometry-servable
                      status: waived
                      detail: No declared raw GeoJSON source is available.
                      waiver:
                        reason: Held only as Shapefile and MapInfo sources. Identities are read from the Shapefile attribute table, but no compiler reads Shapefile geometry yet.
                    - id: candidates-reviewed
                      status: passed
                meta:
                  nextCursor: null
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /validation/crosswalks/{crosswalkId}:
    get:
      operationId: getCrosswalkValidation
      summary: Get one crosswalk's checks
      description: >
        Every crosswalk is checked for artifact integrity, resolvable
        endpoints, consistent source names and at least one target per
        source. Clean containment must give each source exactly one parent.
        Area overlap must have weights summing to 1, the coverage its adapter
        requires, and clear separation between slivers and real overlaps.
      parameters:
        - $ref: "#/components/parameters/CrosswalkId"
      responses:
        "200":
          description: The crosswalk's checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResourceEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:c51e3f4ef14b77972061b9c8f08a838975d700adba9d2372c5d1bbbe8edd27a2"
                data:
                  id: crosswalks/constituency-2024-07-uk-bgc-to-local-authority-2024-05-uk-bgc-area-overlap
                  kind: crosswalk
                  status: passed
                  checks:
                    - id: artifact-integrity
                      status: passed
                      measured: { recordCount: 650 }
                    - id: endpoints-verified
                      status: passed
                    - id: source-names-consistent
                      status: passed
                    - id: targets-present
                      status: passed
                    - id: weights-sum-to-one
                      status: passed
                      measured: { maxDeviation: 0.000001, tolerance: 0.00001 }
                    - id: area-coverage
                      status: passed
                      measured:
                        minimumCoverage: 0.99
                        minimumSourceCoverage: 0.99606
                        minimumTargetCoverage: 0.997111
                    - id: sliver-separation
                      status: passed
                      measured:
                        sliverWidthM: 100
                        widestSliverWidthM: 15.1
                        narrowestOverlapWidthM: 332.1
                        sliverPairCount: 1381
                meta:
                  nextCursor: null
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"
  /exports:
    get:
      operationId: listBulkExports
      summary: List release-pinned whole observation artifacts
      description: >
        Returns immutable JSON downloads for each published measure-source
        partition. Every entry names the source artifact, its content hash,
        byte size and the Atlas release that pins the export manifest.
      responses:
        "200":
          description: The bulk-export manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /exports/{export-id}:
    get:
      operationId: downloadBulkExport
      summary: Download one immutable source observation artifact
      description: >
        Returns the exact JSON artifact listed by `/exports`, after checking
        its content hash against the manifest. This response is intentionally
        not wrapped in the usual API envelope.
      parameters:
        - name: export-id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The complete source observation artifact.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: Suggested immutable JSON filename.
          content:
            application/json:
              schema: { type: object }
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /atlas-release:
    get:
      operationId: getAtlasRelease
      summary: Get the current immutable atlas release manifest
      description: >
        References the boundary registry, derived boundaries, area
        inventory, named-location inventory, geometry source registry, crosswalk inventory,
        relationship-candidate inventory, geography inventory, validation
        report and source inventory by content hash, plus a single
        `releaseId` hash of that set. Rebuilding without changing any input reproduces the same
        `releaseId`.
      responses:
        "200":
          description: The current atlas release manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtlasReleaseEnvelope"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /atlas-releases:
    get:
      operationId: listAtlasReleases
      summary: List the current and archived immutable Atlas releases
      responses:
        "200":
          description: Release identities with artifact counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /atlas-releases/{release-id}:
    get:
      operationId: getArchivedAtlasRelease
      summary: Get one current or archived Atlas release manifest
      parameters:
        - name: release-id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The immutable release manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtlasReleaseEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"

  /atlas-releases/compare:
    get:
      operationId: compareAtlasReleases
      summary: Compare the hashes in two archived Atlas release manifests
      description: >
        Reports added, removed and changed published artifacts by immutable
        content hash. It is deliberately an artifact-level changelog, not a
        claim about individual records within a changed artifact.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: false
          description: Defaults to the current Atlas release.
          schema: { type: string }
      responses:
        "200":
          description: The immutable artifact-level change summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"

  /translations:
    get:
      operationId: translateAreaCode
      summary: Translate one code through a published crosswalk in either direction
      description: >
        `identity` permits publisher-supplied historical lookups only,
        `membership` permits clean containment only, and `apportion` permits
        area-overlap crosswalks only. The route finds a valid directional
        crosswalk in either direction and marks every result `forward` or
        `reverse`, retaining the original artifact's provenance. Reverse
        area-overlap weights are normalised against the queried target and
        report its source coverage. The route does not treat a shared code
        across releases as proof of unchanged geography.
      parameters:
        - name: sourceGeography
          in: query
          required: true
          schema: { type: string }
        - name: sourceRelease
          in: query
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: targetGeography
          in: query
          required: true
          schema: { type: string }
        - name: targetRelease
          in: query
          required: true
          schema: { type: string }
        - name: purpose
          in: query
          schema:
            type: string
            enum: [identity, membership, apportion]
            default: membership
      responses:
        "200":
          description: Matching published crosswalk records.
          content:
            application/json:
              schema: { type: object }
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "422":
          description: No published conversion supports the requested purpose.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /attribution:
    get:
      operationId: getAttribution
      summary: Assemble the attribution and licence block for named resources
      description: >
        Collects the publisher, source and licence of every resource behind an
        answer, and returns a plain-text block suitable for a map corner, a
        report footer or a bulk-download README. Name at least one of
        `dataset`, `measure`, `boundaryRelease` or `crosswalk`; each may be
        repeated, and a resource named more than one way is listed once.

        A measure is attributed through the datasets its observations come
        from. A crosswalk is compiled by the Atlas rather than obtained, so it
        carries no licence of its own and the boundary releases at its
        endpoints are attributed instead, with the crosswalk listing them in
        `derivedFrom`.

        Licence names are reproduced exactly as the publisher states them and
        are not interpreted. One catalogue source already carries two licences
        across its date range, so which terms govern a combined work is the
        caller's judgement rather than this API's.
      parameters:
        - name: dataset
          in: query
          required: false
          schema:
            type: array
            items: { type: string }
          description: A dataset id from `GET /datasets`. Repeatable.
        - name: measure
          in: query
          required: false
          schema:
            type: array
            items: { type: string }
          description: A measure id from `GET /measures`. Repeatable.
        - name: boundaryRelease
          in: query
          required: false
          schema:
            type: array
            items: { type: string }
          description: >
            A `{geography}/{release}` identity, such as
            `localAuthority/2025-05-uk-bgc-v2`. Repeatable.
        - name: crosswalk
          in: query
          required: false
          schema:
            type: array
            items: { type: string }
          description: A crosswalk id from `GET /crosswalks`. Repeatable.
      responses:
        "200":
          description: >
            The resources, the distinct licences that apply, and a ready-to-use
            plain-text attribution block.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /locations:
    get:
      operationId: listNamedLocations
      summary: List curated Atlas named locations
      description: >
        Locations are editorial groupings of area codes, not automatically
        official administrative geographies. `q` matches an id or label prefix.
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Named location definitions.
          content:
            application/json:
              schema: { type: object }
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /locations/{location-id}:
    get:
      operationId: getNamedLocation
      summary: Get one curated named-location definition
      parameters:
        - name: location-id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The location's editorial definition, source codes and bounds.
          content:
            application/json:
              schema: { type: object }
        "404":
          $ref: "#/components/responses/NotFound"

  /locations/{location-id}/members:
    get:
      operationId: getNamedLocationMembers
      summary: Resolve a named location's members in one geography and release
      description: >
        `release` is required because location definitions may include legacy
        codes. Missing members are returned explicitly; this route never
        applies an implicit historical conversion. A `coverage` object counts
        resolved and unresolved members and classifies each unresolved code
        against the compiled releases of its geography as `superseded`,
        `not-yet-current`, `absent-from-release` or `unknown`, naming the
        releases that are the evidence. The classification is relative to the
        requested release and reports code membership only; it asserts nothing
        about geometry.


        A location is curated as local authority codes, so asking for
        `geography=localAuthority` matches them directly and `membership` is
        `direct-code-match`. Any other geography has to be reached through a
        published crosswalk, named with `via`: the wards of North Wales, the
        constituencies of Merseyside. Asking without `via` returns a 400 that
        lists the crosswalks published for that geography and release, so the
        choice is the caller's and is made from what exists.


        What membership means depends on the crosswalk named, and the response
        says which. Through a `clean-containment` crosswalk it is
        `fully-contained`: the publisher places each area wholly inside one
        parent, so no area is counted in part. Through an `area-overlap`
        crosswalk it is `weighted-overlap`: an area straddling the edge of the
        location carries the `weight` lying inside and is marked `partial`,
        and `partialMembers` counts them. Shares in two members of the same
        location are added, so an area split between them is whole and not
        partial.


        Each member names the authority it was found `through`, and
        `parentBoundaryRelease` names the release the location's own codes were
        resolved against, which is the release the crosswalk ends at rather
        than the one asked for.
      parameters:
        - name: location-id
          in: path
          required: true
          schema: { type: string }
        - name: geography
          in: query
          schema:
            type: string
            default: localAuthority
          description: >
            The geography to resolve members in. Anything other than
            `localAuthority` requires `via`.
        - name: release
          in: query
          required: true
          schema: { type: string }
        - name: via
          in: query
          required: false
          schema: { type: string }
          description: >
            The published crosswalk to resolve through, required for any
            geography other than `localAuthority`. Omit it to be told which are
            available.
          example: ward-2023-05-uk-bgc-to-local-authority-2023-05-uk-bgc-v2-clean-containment
      responses:
        "400":
          description: >
            `release` is missing, or a geography other than `localAuthority`
            was asked for without `via`. The detail lists the crosswalks
            published for that geography and release.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: >
            Resolved members, explicitly unresolved codes, and the coverage
            that explains each one.
          content:
            application/json:
              schema: { type: object }
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    Geography:
      name: geography
      in: path
      required: true
      schema:
        type: string
      description: A geography type id, e.g. `constituency` or `ward`.
    Release:
      name: release
      in: path
      required: true
      schema:
        type: string
      description: A boundary release id, e.g. `2024-07-uk-bgc`.
    CrosswalkId:
      name: crosswalkId
      in: path
      required: true
      schema:
        type: string
      description: A crosswalk id, e.g. `constituency-2010-to-2024-official-lookup-v2`.

  responses:
    NotFound:
      description: No resource matches that identity.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidQuery:
      description: A query parameter is malformed or its cursor is not valid for this result set.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CatalogueUnavailable:
      description: The referenced build artifact has not been built yet.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    GeometryUnavailable:
      description: >
        The area exists but its geometry cannot be served: no raw source is
        declared, or its CRS has no transformation to WGS84.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: >
        RFC 9457 Problem Details. Some routes add extension members: a value
        request for an ambiguous place name adds `choices`, one whose place the
        measure cannot answer adds `candidates`, every area route whose
        area identity resolves to nothing says why through `code` and
        `absence`, and a refused conversion does the same.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        choices:
          type: array
          description: >
            On a 409 Ambiguous Place: each place the name could mean, with its
            answer and the request that asks about it alone.
          items:
            type: object
        candidates:
          type: array
          description: >
            On a 422 Place Not Served: each place the name matched, and why the
            measure does not answer it.
          items:
            type: object
        code:
          type: string
          enum:
            - unsupported_geography
            - area_not_in_release
            - aggregation_not_supported
            - conversion_not_available
          description: >
            On a 404 from an area route: `unsupported_geography` when the
            geography or release is not published or its area identities are
            not compiled, and `area_not_in_release` when the release does not
            hold the code. On a 422 from a conversion:
            `aggregation_not_supported` when the measure's values do not add
            over areas, and `conversion_not_available` when the named crosswalk
            cannot convert the partition without dropping or assuming values.
        absence:
          type: string
          enum:
            - unknown-geography
            - unknown-release
            - release-not-compiled
            - superseded
            - not-yet-current
            - absent-from-release
            - unknown
            - crosswalk-geography-mismatch
            - source-areas-not-mapped
            - unweighted-split
          description: >
            Which absence left the area or conversion unresolved. For a
            conversion, the crosswalk starts at another geography, does not map
            some source areas, or splits some across targets with no published
            weight. For an area, a code is `superseded` when only older
            releases of the geography hold it, `not-yet-current`
            when only newer ones do, `absent-from-release` when releases on
            both sides or undated releases hold it, and `unknown` when no
            compiled release does. The classification uses code membership
            only: a superseded code may have been abolished, merged or recoded,
            and none of those is claimed.
        presentIn:
          type: array
          description: >
            With `area_not_in_release`: the compiled releases that do hold the
            code, with the name it carries in each.
          items:
            type: object
            required: [boundaryRelease, name, href]
            properties:
              boundaryRelease: { type: string }
              name: { type: string }
              href: { type: string }
        areaCount:
          type: integer
          description: >
            With `source-areas-not-mapped` or `unweighted-split`: how many
            source areas the conversion could not carry.
        areaSample:
          type: array
          items: { type: string }
          description: The first of those source area codes, at most ten.
        availableReleases:
          type: array
          description: With `unknown-release`, the releases published for the geography.
          items:
            type: object
            required: [id, href]
            properties:
              id: { type: string }
              href: { type: string }
        links:
          type: object
          additionalProperties: { type: string }
          description: >
            With `unknown-geography`, the geography list; with
            `release-not-compiled`, the boundary release.

    Envelope:
      type: object
      required: [apiVersion, atlasRelease, data, meta]
      properties:
        apiVersion:
          type: string
          const: v1
        atlasRelease:
          type: string
          description: >
            The immutable `/atlas-release` `releaseId` for the artifacts that
            produced this response.
        meta:
          type: object
          required: [nextCursor]
          properties:
            nextCursor:
              oneOf:
                - type: string
                - type: "null"
              description: Opaque cursor for the next page, or null at the end.

    RootDocument:
      type: object
      required: [name, links]
      properties:
        name:
          type: string
        links:
          type: array
          items:
            type: string

    RootEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/RootDocument"

    GeographySummary:
      type: object
      required: [id, latestRelease, releaseCount]
      properties:
        id:
          type: string
        latestRelease:
          type: string
        releaseCount:
          type: integer

    GeographySummaryListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/GeographySummary"

    BoundaryRelease:
      type: object
      required: [id, geography, title, coverage, source, metadataHash]
      properties:
        id:
          type: string
        geography:
          type: string
        title:
          type: string
        description:
          type: string
        temporalCoverage:
          type: string
        coverage:
          type: object
          required: [countries]
          properties:
            countries:
              type: array
              items:
                type: string
        source:
          type: object
          required: [publisher, url, licence]
          properties:
            publisher:
              type: string
            url:
              type: string
              format: uri
            retrievedAt:
              type: string
              format: date
            licence:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                url:
                  type: string
                  format: uri
        metadataHash:
          type: string

    BoundaryReleaseListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/BoundaryRelease"

    BoundaryReleaseEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/BoundaryRelease"

    AreaIdentityCoverage:
      oneOf:
        - type: object
          required: [status, recordCount, artifact]
          properties:
            status:
              const: available
            recordCount:
              type: integer
            artifact:
              type: string
        - type: object
          required: [status, reason]
          properties:
            status:
              const: not-compiled
            reason:
              type: string

    GeographyRelationship:
      type: object
      required: [id, direction, counterpart, method, quality, weighting]
      properties:
        id:
          type: string
        direction:
          enum: [from, to]
        counterpart:
          type: object
          required: [geography, boundaryRelease]
          properties:
            geography:
              type: string
            boundaryRelease:
              type: string
        method:
          $ref: "#/components/schemas/CrosswalkMethod"
        quality:
          $ref: "#/components/schemas/CrosswalkQuality"
        weighting:
          $ref: "#/components/schemas/CrosswalkWeighting"

    RelationshipCoverage:
      oneOf:
        - type: object
          required: [status, crosswalks]
          properties:
            status:
              const: available
            crosswalks:
              type: array
              items:
                $ref: "#/components/schemas/GeographyRelationship"
        - type: object
          required: [status, reason]
          properties:
            status:
              const: not-compiled
            reason:
              type: string

    GeographyReleaseInventory:
      type: object
      required:
        - id
        - geography
        - countries
        - inputFormats
        - areaIdentities
        - relationships
      properties:
        id:
          type: string
        geography:
          type: string
        countries:
          type: array
          items:
            type: string
        inputFormats:
          type: array
          items:
            type: string
        areaIdentities:
          $ref: "#/components/schemas/AreaIdentityCoverage"
        relationships:
          $ref: "#/components/schemas/RelationshipCoverage"

    GeographyInventory:
      type: object
      required:
        - schemaVersion
        - contentHash
        - boundaryRegistryHash
        - releases
        - geographies
      properties:
        schemaVersion:
          const: 1
        contentHash:
          type: string
        boundaryRegistryHash:
          type: string
        releases:
          type: array
          items:
            $ref: "#/components/schemas/GeographyReleaseInventory"
        geographies:
          type: array
          items:
            type: object
            required: [id, countries, releaseCount]
            properties:
              id:
                type: string
              countries:
                type: array
                items:
                  type: string
              releaseCount:
                type: integer

    GeographyInventoryEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/GeographyInventory"

    Area:
      type: object
      required: [id, geography, boundaryRelease, code, name]
      properties:
        id:
          type: string
        geography:
          type: string
        boundaryRelease:
          type: string
        code:
          type: string
        name:
          type: string
        aliases:
          type: array
          items:
            type: string

    AreaRelationship:
      type: object
      required: [relation, counterpart, crosswalk]
      properties:
        relation:
          enum: [within, contains, successor, predecessor, overlaps]
        overlap:
          description: >
            Present only for `overlaps` relationships. Each share is seen from
            this area's side: `shareOfArea` is the overlap as a share of this
            area and `shareOfCounterpart` as a share of the counterpart.
          type: object
          required: [areaM2, shareOfArea, shareOfCounterpart]
          properties:
            areaM2:
              type: integer
            shareOfArea:
              type: number
            shareOfCounterpart:
              type: number
        counterpart:
          type: object
          required: [id, geography, boundaryRelease, code, labels]
          properties:
            id:
              type: string
            geography:
              type: string
            boundaryRelease:
              type: string
            code:
              type: string
            labels:
              type: array
              items:
                type: string
        crosswalk:
          type: object
          required: [id, method, quality, weighting]
          properties:
            id:
              type: string
            method:
              $ref: "#/components/schemas/CrosswalkMethod"
            quality:
              $ref: "#/components/schemas/CrosswalkQuality"
            weighting:
              $ref: "#/components/schemas/CrosswalkWeighting"

    AreaWithRelationships:
      allOf:
        - $ref: "#/components/schemas/Area"
        - type: object
          required: [relationships]
          properties:
            relationships:
              type: array
              items:
                $ref: "#/components/schemas/AreaRelationship"

    GeoJsonGeometry:
      type: object
      description: >
        A GeoJSON geometry object as read from the raw cached source, or a
        GeometryCollection when the source represents one area code as more
        than one feature fragment.
      required: [type]
      properties:
        type:
          type: string
        coordinates:
          description: Present on every geometry type except GeometryCollection.
        geometries:
          type: array
          items:
            $ref: "#/components/schemas/GeoJsonGeometry"
          description: Present only when type is GeometryCollection.

    AreaGeometry:
      type: object
      required: [type, id, properties, geometry]
      properties:
        type:
          const: Feature
        id:
          type: string
        properties:
          allOf:
            - $ref: "#/components/schemas/Area"
            - type: object
              required: [generalisation, geometrySource]
              properties:
                generalisation:
                  $ref: "#/components/schemas/Generalisation"
                geometrySource:
                  $ref: "#/components/schemas/GeometrySource"
        geometry:
          $ref: "#/components/schemas/GeoJsonGeometry"

    AreaNeighbours:
      allOf:
        - $ref: "#/components/schemas/Area"
        - type: object
          required:
            [id, geography, boundaryRelease, touches, border, method, neighbours]
          properties:
            id: { type: string }
            geography: { type: string }
            boundaryRelease: { type: string }
            touches:
              type: string
              enum: [edge, any]
            border:
              type: object
              required:
                [perimeterM, sharedBorderM, unsharedBorderM, pointOnlyTouches]
              properties:
                perimeterM: { type: number }
                sharedBorderM:
                  type: number
                  description: Border shared with the neighbours returned.
                unsharedBorderM:
                  type: number
                  description: >
                    The remainder: coastline, a national boundary, or a border
                    with an area outside this release. Nothing for a landlocked
                    area.
                pointOnlyTouches:
                  type: integer
                  description: >
                    Areas meeting only at a point, counted whether or not
                    `touches` returned them.
            method:
              type: object
              required: [rule, sharedBorder, unshared, limits]
              properties:
                rule: { type: string }
                sharedBorder: { type: string }
                unshared: { type: string }
                limits: { type: string }
            neighbours:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/Area"
                  - type: object
                    required:
                      [
                        id,
                        touch,
                        sharedBorderM,
                        shareOfPerimeter,
                        sharedEdges,
                        sharedVertices,
                      ]
                    properties:
                      id: { type: string }
                      touch:
                        type: string
                        enum: [edge, point]
                      sharedBorderM:
                        type: number
                        description: Zero for a point touch.
                      shareOfPerimeter:
                        type: number
                        description: >
                          The shared border as a fraction of this area's own
                          perimeter.
                      sharedEdges: { type: integer }
                      sharedVertices: { type: integer }

    AreaNeighboursEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AreaNeighbours"

    AreaBoxSearch:
      type: object
      required:
        [
          bbox,
          geography,
          boundaryRelease,
          matched,
          returned,
          limit,
          truncated,
          relationRule,
          matches,
        ]
      properties:
        bbox:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
        geography: { type: string }
        boundaryRelease: { type: string }
        matched:
          type: integer
          description: Areas meeting the box, before the limit is applied.
        returned:
          type: integer
        limit:
          type: integer
        truncated:
          type: boolean
          description: Whether `matched` exceeded `limit`.
        relationRule:
          type: string
        geometry:
          type: string
          description: >
            Present only when no `tier` was asked for, saying how to get the
            coordinates.
        tier:
          type: string
          enum: [full, high, medium, low]
        toleranceM: { type: number }
        minEffectiveAreaM2: { type: number }
        generalisationMethod:
          type: object
          required: [rule, threshold, parts, sharedBorders]
          properties:
            rule: { type: string }
            threshold: { type: string }
            parts: { type: string }
            sharedBorders: { type: string }
        matches:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Area"
              - type: object
                required: [id, relation, boundingBox, geometrySource]
                properties:
                  id: { type: string }
                  relation:
                    type: string
                    enum: [within, overlaps]
                  boundingBox:
                    type: array
                    items: { type: number }
                    minItems: 4
                    maxItems: 4
                  geometrySource:
                    $ref: "#/components/schemas/GeometrySource"
                  generalisation:
                    type: object
                    description: Present only when a `tier` was asked for.
                    properties:
                      vertices: { type: integer }
                      verticesAtFullResolution: { type: integer }
                      parts: { type: integer }
                      partsAtFullResolution: { type: integer }
                  geometry:
                    $ref: "#/components/schemas/GeoJsonGeometry"

    AreaBoxSearchEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AreaBoxSearch"

    AreaChildrenGeometry:
      type: object
      required: [type, id, parent, collection, withoutGeometry, features]
      properties:
        type:
          const: FeatureCollection
        id:
          type: string
        parent:
          $ref: "#/components/schemas/Area"
        collection:
          type: object
          description: >
            What the collection holds and on what terms. `generalisationMethod`
            is present only above the `full` tier.
          required:
            [members, withGeometry, vertices, tier, toleranceM, minEffectiveAreaM2]
          properties:
            members:
              type: integer
              description: Areas the crosswalk names as contained by the parent.
            withGeometry:
              type: integer
              description: Of those, how many could be drawn.
            vertices:
              type: integer
            tier:
              type: string
              enum: [full, high, medium, low]
            toleranceM: { type: number }
            minEffectiveAreaM2: { type: number }
            generalisationMethod:
              type: object
              required: [rule, threshold, parts, sharedBorders]
              properties:
                rule: { type: string }
                threshold: { type: string }
                parts: { type: string }
                sharedBorders: { type: string }
        withoutGeometry:
          type: array
          description: >
            Members published as a relationship that could not be drawn, each
            with the reason. Empty when the collection is complete.
          items:
            type: object
            required: [id, geography, boundaryRelease, code, reason]
            properties:
              id: { type: string }
              geography: { type: string }
              boundaryRelease: { type: string }
              code: { type: string }
              reason: { type: string }
        features:
          type: array
          items:
            $ref: "#/components/schemas/AreaChildGeometryFeature"

    AreaChildGeometryFeature:
      type: object
      required: [type, id, properties, geometry]
      properties:
        type:
          const: Feature
        id:
          type: string
        properties:
          allOf:
            - $ref: "#/components/schemas/Area"
            - type: object
              required: [membership, generalisation, geometrySource]
              properties:
                membership:
                  type: object
                  description: >
                    The published crosswalk that places this area in the
                    collection.
                  required: [id, method, quality]
                  properties:
                    id: { type: string }
                    method: { type: string }
                    quality: { type: string }
                    weighting: { type: object }
                generalisation:
                  type: object
                  description: >
                    What the collection's tier cost this member. The tier
                    itself is stated once, on the collection.
                  required:
                    [vertices, verticesAtFullResolution, parts, partsAtFullResolution]
                  properties:
                    vertices: { type: integer }
                    verticesAtFullResolution: { type: integer }
                    parts: { type: integer }
                    partsAtFullResolution: { type: integer }
                geometrySource:
                  $ref: "#/components/schemas/GeometrySource"
        geometry:
          $ref: "#/components/schemas/GeoJsonGeometry"

    AreaChildrenGeometryEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AreaChildrenGeometry"

    Generalisation:
      type: object
      description: >
        What was done to the geometry before it was served, and at what cost.
        `method` is present only above the `full` tier, where something was
        actually done; it includes the caveat that neighbours generalised
        separately may disagree along a shared border.
      required:
        [
          tier,
          toleranceM,
          minEffectiveAreaM2,
          vertices,
          verticesAtFullResolution,
          parts,
          partsAtFullResolution,
        ]
      properties:
        tier:
          type: string
          enum: [full, high, medium, low]
        toleranceM:
          type: number
          description: The side in metres of the smallest square of detail kept.
        minEffectiveAreaM2:
          type: number
          description: >
            The threshold actually applied, in square metres: a vertex is
            dropped when its triangle is smaller than this.
        vertices:
          type: integer
          description: Vertices in the geometry as served.
        verticesAtFullResolution:
          type: integer
        parts:
          type: integer
        partsAtFullResolution:
          type: integer
        method:
          type: object
          required: [rule, threshold, parts, sharedBorders]
          properties:
            rule: { type: string }
            threshold: { type: string }
            parts: { type: string }
            sharedBorders: { type: string }

    GeometrySource:
      type: object
      description: >
        Where the served WGS84 geometry came from. `transformation` is
        present only when the source was reprojected.
      required: [sourceCrs]
      properties:
        sourceCrs:
          type: string
        transformation:
          type: object
          required: [name, epsg, accuracyM, areaOfUse]
          properties:
            name:
              type: string
            epsg:
              type: string
            accuracyM:
              type: number
              description: EPSG's stated accuracy within the area of use.
            areaOfUse:
              type: string
        corrections:
          type: array
          description: >
            Declared grid corrections that moved this area before it was
            reprojected, such as `northern-ireland-offset`.
          items:
            type: object
            required: [id, description]
            properties:
              id:
                type: string
              description:
                type: string

    AreaGeometryEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AreaGeometry"

    AreaGeometryMetadata:
      allOf:
        - $ref: "#/components/schemas/Area"
        - type: object
          required:
            [
              geography,
              boundaryRelease,
              boundingBox,
              centroid,
              labelPoint,
              labelPointMethod,
              area,
              perimeter,
              geometryExtent,
              method,
              geometrySource,
            ]
          properties:
            geography:
              type: string
            boundaryRelease:
              type: string
            boundingBox:
              type: array
              description: >
                [minLongitude, minLatitude, maxLongitude, maxLatitude] in WGS 84.
              items:
                type: number
              minItems: 4
              maxItems: 4
            centroid:
              type: array
              description: "[longitude, latitude] in WGS 84."
              items:
                type: number
              minItems: 2
              maxItems: 2
            labelPoint:
              type: array
              description: "[longitude, latitude] in WGS 84, always inside the geometry."
              items:
                type: number
              minItems: 2
              maxItems: 2
            labelPointMethod:
              type: string
              enum: [centroid, interior-span]
              description: >
                `centroid` when the centre of area lies inside the geometry,
                `interior-span` when it does not and a point inside was chosen
                instead.
            area:
              type: object
              description: One measurement, in three units.
              required: [m2, hectares, km2]
              properties:
                m2: { type: number }
                hectares: { type: number }
                km2: { type: number }
            perimeter:
              type: object
              required: [m, km]
              properties:
                m: { type: number }
                km: { type: number }
            geometryExtent:
              type: object
              description: >
                How much geometry stands behind the measurements: a mainland
                and its islands are many parts, and a ring of land has more
                rings than parts.
              required: [parts, rings, vertices]
              properties:
                parts: { type: integer }
                rings: { type: integer }
                vertices: { type: integer }
            method:
              type: object
              description: >
                The projection and rule behind each figure, carried with the
                response so a measurement can be read on its own.
              required: [area, perimeter, centroid, labelPoint, caveat]
              properties:
                area: { type: string }
                perimeter: { type: string }
                centroid: { type: string }
                labelPoint: { type: string }
                caveat: { type: string }
            geometrySource:
              $ref: "#/components/schemas/GeometrySource"

    AreaGeometryMetadataEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AreaGeometryMetadata"

    AreaRelationshipsEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AreaWithRelationships"

    AreaListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Area"

    AreaEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Area"

    CrosswalkSide:
      type: object
      required: [geography, boundaryRelease]
      properties:
        geography:
          type: string
        boundaryRelease:
          type: string

    CrosswalkMethod:
      description: >
        `official-lookup` and `clean-containment` read an explicit code pair
        from a published file. `area-overlap` intersects the two releases'
        boundary geometries and weights each source by the area it shares
        with each target.
      enum: [official-lookup, clean-containment, area-overlap]

    CrosswalkQuality:
      description: >
        `publisher-supplied` mappings restate a publisher's own
        correspondence. `derived` mappings are computed by the Atlas.
      enum: [publisher-supplied, derived]

    CrosswalkWeighting:
      oneOf:
        - type: object
          required: [status]
          properties:
            status:
              enum: [not-provided, not-applicable]
        - type: object
          description: >
            Each record's target weights are shares of the source's area
            covered by its published targets, and sum to 1 within rounding.
          required: [status, basis, normalisation]
          properties:
            status:
              const: provided
            basis:
              const: area
            normalisation:
              const: per-source

    CrosswalkSummary:
      type: object
      required:
        - id
        - from
        - to
        - method
        - quality
        - weighting
        - recordCount
        - artifact
        - contentHash
      properties:
        id:
          type: string
        from:
          $ref: "#/components/schemas/CrosswalkSide"
        to:
          $ref: "#/components/schemas/CrosswalkSide"
        method:
          $ref: "#/components/schemas/CrosswalkMethod"
        quality:
          $ref: "#/components/schemas/CrosswalkQuality"
        weighting:
          $ref: "#/components/schemas/CrosswalkWeighting"
        recordCount:
          type: integer
        artifact:
          type: string
        contentHash:
          type: string

    CrosswalkSummaryListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/CrosswalkSummary"

    CrosswalkMetadata:
      type: object
      required:
        - schemaVersion
        - contentHash
        - id
        - method
        - quality
        - weighting
        - from
        - to
        - provenance
        - validation
      properties:
        schemaVersion:
          const: 1
        contentHash:
          type: string
        id:
          type: string
        method:
          $ref: "#/components/schemas/CrosswalkMethod"
        quality:
          $ref: "#/components/schemas/CrosswalkQuality"
        weighting:
          $ref: "#/components/schemas/CrosswalkWeighting"
        from:
          $ref: "#/components/schemas/CrosswalkSide"
        to:
          $ref: "#/components/schemas/CrosswalkSide"
        provenance:
          oneOf:
            - type: object
              description: The one published file the code pairs are read from.
              required: [input, inputHash]
              properties:
                input:
                  type: string
                inputHash:
                  type: string
            - type: object
              description: >
                The two boundary geometries an `area-overlap` crosswalk
                intersects, how areas were measured, and the clipping library
                that computed each intersection.
              required: [inputs, areaProjection, clipping]
              properties:
                inputs:
                  type: array
                  items:
                    type: object
                    required: [side, input, inputHash]
                    properties:
                      side:
                        enum: [from, to]
                      input:
                        type: string
                      inputHash:
                        type: string
                areaProjection:
                  const: EPSG:6933
                  description: >
                    Lambert cylindrical equal-area on the WGS 84 ellipsoid, so
                    every area is an ellipsoidal area in square metres.
                clipping:
                  type: string
                  description: Clipping library and version, e.g. `polygon-clipping@0.15.7`.
        validation:
          type: object
          required: [sourceNameConflicts, endpoints]
          properties:
            overlap:
              $ref: "#/components/schemas/AreaOverlapValidation"
            sourceNameConflicts:
              type: array
              items:
                type: object
                required: [code, names]
                properties:
                  code:
                    type: string
                  names:
                    type: array
                    items:
                      type: string
            endpoints:
              type: object
              required: [from, to]
              properties:
                from:
                  $ref: "#/components/schemas/CrosswalkEndpointValidation"
                to:
                  $ref: "#/components/schemas/CrosswalkEndpointValidation"

    CrosswalkEndpointValidation:
      oneOf:
        - type: object
          required: [status, availableAreaCount, referencedCodeCount]
          properties:
            status:
              const: verified
            availableAreaCount:
              type: integer
            referencedCodeCount:
              type: integer
        - type: object
          required: [status, reason]
          properties:
            status:
              const: not-available
            reason:
              type: string

    AreaOverlapValidation:
      type: object
      description: >
        Present only for `area-overlap` crosswalks. Two independently
        generalised boundaries leave narrow slivers where they disagree. A
        pair whose widest intersecting piece is narrower than `sliverWidthM`
        (twice its area over its perimeter) is dropped as a sliver. The build
        fails unless every sliver is under half that width and every kept
        overlap at least twice it, and unless every source and target area is
        at least `minimumCoverage` covered by kept overlaps.
      required:
        - candidatePairCount
        - intersectingPairCount
        - sliverPairCount
        - sliverWidthM
        - widestSliverWidthM
        - narrowestOverlapWidthM
        - minimumCoverage
        - minimumSourceCoverage
        - minimumTargetCoverage
      properties:
        candidatePairCount:
          type: integer
          description: Pairs whose bounding boxes meet, and so were clipped.
        intersectingPairCount:
          type: integer
        sliverPairCount:
          type: integer
        sliverWidthM:
          type: number
        widestSliverWidthM:
          type: [number, "null"]
        narrowestOverlapWidthM:
          type: number
        minimumCoverage:
          type: number
        minimumSourceCoverage:
          type: number
        minimumTargetCoverage:
          type: number

    CrosswalkMetadataEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CrosswalkMetadata"

    CrosswalkArea:
      type: object
      required: [code, labels]
      properties:
        code:
          type: string
        labels:
          type: array
          items:
            type: string
          description: >
            Non-canonical name candidates. More than one entry means the
            source disagreed with itself about this area's name; it is not
            an alias list to pick from arbitrarily.

    CrosswalkRecord:
      type: object
      required: [source, targets]
      properties:
        source:
          $ref: "#/components/schemas/CrosswalkArea"
        targets:
          type: array
          items:
            $ref: "#/components/schemas/CrosswalkArea"

    AreaOverlapRecord:
      type: object
      description: >
        One `area-overlap` source with the targets it shares area with, after
        slivers are dropped. Areas are ellipsoidal square metres.
      required: [source, targets]
      properties:
        source:
          allOf:
            - $ref: "#/components/schemas/CrosswalkArea"
            - type: object
              required: [areaM2, coverage]
              properties:
                areaM2:
                  type: integer
                coverage:
                  type: number
                  description: Share of the source's area covered by its targets.
        targets:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/CrosswalkArea"
              - type: object
                required:
                  [weight, overlapAreaM2, sourceShare, targetShare]
                properties:
                  weight:
                    type: number
                    description: >
                      Share of the source's covered area. A record's weights
                      sum to 1 within rounding, so they apportion a whole
                      source quantity across its targets.
                  overlapAreaM2:
                    type: integer
                  sourceShare:
                    type: number
                    description: Overlap as a share of the whole source area.
                  targetShare:
                    type: number
                    description: Overlap as a share of the whole target area.

    CrosswalkRecordListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                anyOf:
                  - $ref: "#/components/schemas/CrosswalkRecord"
                  - $ref: "#/components/schemas/AreaOverlapRecord"

    RelationshipCandidateSide:
      type: object
      required: [geography, boundaryRelease, codeProperty, nameProperty]
      properties:
        geography:
          type: string
        boundaryRelease:
          type: string
        codeProperty:
          type: string
        nameProperty:
          type: string

    RelationshipCandidateTarget:
      type: object
      required: [codeProperty, nameProperty]
      properties:
        geography:
          type: string
        boundaryRelease:
          type: string
        codeProperty:
          type: string
        nameProperty:
          type: string
      description: >
        `boundaryRelease` (and sometimes `geography`) are present only when
        exactly one compiled area release already uses this code/name
        property pair.

    RelationshipCandidateEndpointStatus:
      oneOf:
        - type: object
          required: [status, availableAreaCount, referencedCodeCount]
          properties:
            status:
              const: verified
            availableAreaCount:
              type: integer
            referencedCodeCount:
              type: integer
        - type: object
          required: [status, reason]
          properties:
            status:
              const: not-available
            reason:
              type: string

    RelationshipCandidate:
      type: object
      required: [id, input, from, to, status, validation]
      properties:
        id:
          type: string
        input:
          type: string
        from:
          $ref: "#/components/schemas/RelationshipCandidateSide"
        to:
          $ref: "#/components/schemas/RelationshipCandidateTarget"
        status:
          enum: [eligible, needs-review, not-available]
        publishedCrosswalkId:
          type: string
          description: Set when a published crosswalk already covers this candidate.
        validation:
          type: object
          required: [endpoints, relationship, reasons]
          properties:
            endpoints:
              type: object
              required: [from, to]
              properties:
                from:
                  $ref: "#/components/schemas/RelationshipCandidateEndpointStatus"
                to:
                  $ref: "#/components/schemas/RelationshipCandidateEndpointStatus"
            relationship:
              type: object
              required:
                - sourceFeatureCount
                - sourceCodeCount
                - targetCodeCount
                - multiTargetSourceCount
                - missingValueFeatureCount
              properties:
                sourceFeatureCount:
                  type: integer
                sourceCodeCount:
                  type: integer
                targetCodeCount:
                  type: integer
                multiTargetSourceCount:
                  type: integer
                missingValueFeatureCount:
                  type: integer
            reasons:
              type: array
              items:
                type: string

    RelationshipCandidateListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/RelationshipCandidate"

    ValidationCheck:
      type: object
      required: [id, status]
      properties:
        id:
          enum:
            - registry-links
            - release-coverage
            - licence-recorded
            - area-identities
            - geometry-servable
            - candidates-reviewed
            - artifact-integrity
            - endpoints-verified
            - source-names-consistent
            - targets-present
            - single-parent
            - weights-sum-to-one
            - area-coverage
            - sliver-separation
        status:
          enum: [passed, waived]
        detail:
          type: string
          description: What the check found. Present on every waived check.
        measured:
          type: object
          description: Figures the check measured, whether it passed or not.
          additionalProperties:
            type: [number, string, "null"]
        waiver:
          type: object
          required: [reason]
          properties:
            reason:
              type: string

    ValidationResource:
      type: object
      required: [id, kind, status, checks]
      properties:
        id:
          type: string
          description: >
            `atlas` for checks across the Atlas's own artifacts; otherwise
            the validated resource's API path, such as
            `crosswalks/{crosswalkId}`.
        kind:
          enum: [atlas, boundary-release, crosswalk]
        status:
          enum: [passed, waived]
          description: waived when any of its checks is waived.
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ValidationCheck"

    ValidationReport:
      type: object
      required: [schemaVersion, contentHash, inputs, summary, resources]
      properties:
        schemaVersion:
          const: 1
        contentHash:
          type: string
        inputs:
          type: object
          description: Content hashes of the artifacts and waivers the checks read.
          additionalProperties:
            type: string
        summary:
          type: object
          required: [resourceCount, checkCount, passedCount, waivedCount, coverage]
          properties:
            resourceCount:
              type: integer
            checkCount:
              type: integer
            passedCount:
              type: integer
            waivedCount:
              type: integer
            coverage:
              type: object
              description: >
                How many boundary releases each capability reaches.
                servableGeometry counts releases with servable geometry for
                at least some areas; their geometry-servable checks name any
                areas refused.
              required:
                - boundaryReleases
                - areaIdentities
                - servableGeometry
                - withRelationships
                - crosswalks
                - weightedCrosswalks
              properties:
                boundaryReleases:
                  type: integer
                areaIdentities:
                  type: integer
                servableGeometry:
                  type: integer
                withRelationships:
                  type: integer
                crosswalks:
                  type: integer
                weightedCrosswalks:
                  type: integer
        resources:
          type: array
          items:
            $ref: "#/components/schemas/ValidationResource"

    ValidationReportEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ValidationReport"

    ValidationResourceEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ValidationResource"

    AtlasReleaseArtifactRef:
      type: object
      required: [id, path, contentHash]
      properties:
        id:
          type: string
        path:
          type: string
        contentHash:
          type: string

    AtlasRelease:
      type: object
      required: [schemaVersion, releaseId, artifacts]
      properties:
        schemaVersion:
          const: 1
        releaseId:
          type: string
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/AtlasReleaseArtifactRef"

    AtlasReleaseEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AtlasRelease"
