              example:
                apiVersion: v1
                atlasRelease: "sha256:c51e3f4ef14b77972061b9c8f08a838975d700adba9d2372c5d1bbbe8edd27a2"
                data:
                  id: measures/crime-total
                  kind: measure
                  status: passed
                  checks:
                    - id: measure-definition
                      status: passed
                      measured: { sourceCount: 1 }
                meta:
                  nextCursor: null
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /validation/exports/{export-id}:
    get:
      operationId: getMeasureSourceValidation
      tags: ["Governance"]
      summary: Get one measure source partition's checks
      description: >
        Each export serves one source partition of a measure, and is checked
        from the observation artifact itself. `artifact-integrity`: the
        content reproduces its hash, which matches the export manifest, and
        its measure, geography, periods, latest-period record count and
        unique area codes match the catalogue. `records-resolve`: one
        compiled boundary release of the source geography and boundary year
        holds every area code, in every period. `countries-declared`: the
        codes cover exactly the nations the catalogue declares.
        `values-valid`: every record suits its measure, such as whole,
        non-negative counts, percentages from 0 to 100, deciles from 1 to 10
        and published intervals that contain their value. A measure declared
        as the sum of others adds `components-sum-to-total`, comparing each
        area and period with its components in the same source partitions.
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "200":
          description: The source partition's checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResourceEnvelope"
              x-example-request: "/v1/validation/exports/house-price-median-observations"
              example:
                apiVersion: v1
                atlasRelease: "sha256:c51e3f4ef14b77972061b9c8f08a838975d700adba9d2372c5d1bbbe8edd27a2"
                data:
                  id: exports/house-price-median-observations
                  kind: measure-source
                  status: waived
                  checks:
                    - id: artifact-integrity
                      status: passed
                      measured: { periodCount: 28, recordCount: 225225 }
                    - id: records-resolve
                      status: waived
                      detail: "No compiled ward release for 2020 holds every code: 2020-12-uk-bgc lacks 2 (E05013830, E05013831)."
                      measured:
                        areaCodeCount: 8049
                        boundaryRelease: null
                        unresolvedCount: 2
                      waiver:
                        reason: The publisher's workbook gives Leeds's Garforth & Swillington and Temple Newsam their December 2021 codes, E05013830 and E05013831, among otherwise December 2020 codes. Values stay on the codes the publisher used.
                    - id: countries-declared
                      status: passed
                      measured: { countries: "GB-ENG, GB-WLS" }
                    - id: values-valid
                      status: passed
                      measured:
                        recordCount: 225225
                        minimum: 10000
                        maximum: 4041000
                meta:
                  nextCursor: null
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"
