  /areas:intersects:
    get:
      operationId: findAreasIntersectingBox
      tags: ["Map"]
      summary: Find the areas meeting a bounding box in one release
      x-likely-refusal:
        status: 400
        when: "No `release` is given. Geometry differs between releases, so the box is tested against one named release."
        x-example-request: "/v1/areas:intersects?bbox=-2.3,53.4,-2.2,53.5&geography=ward"
      description: >
        Returns every area of one geography and release that meets the given
        WGS 84 box: the query a map makes when it pans, and the one an analysis
        makes to scope a region before asking for anything heavier.


        `relation` says how each area meets the box. `within` means the area
        lies entirely inside it; `overlaps` means it meets the box without
        being contained by it. Both are exact. An area is tested against the
        box itself, not against its own bounding box, so a crescent whose
        bounding box reaches into the query while its land does not is
        excluded, as is a box sitting inside a lake within an area.


        Identities come back by default, each with its own bounding box, and
        the coordinates are opted into with `tier`, which generalises every
        match exactly as the geometry route does. That keeps the cost of a wide
        box bounded whether or not a caller wants geometry with it. The same
        caveat applies: above `full`, matches are generalised one at a time and
        neighbours drawn together may disagree along a shared border.


        Results are capped at `limit`, 200 by default and 1000 at most, and
        `matched` against `returned` with `truncated` says whether the cap bit.
        The cap is on results rather than on the box: a box covering the whole
        country is a reasonable analysis question, and it is the geometry that
        is expensive, not the extent. A box matching nothing is an empty
        answer, not an error; a geography and release the catalogue does not
        carry is a 404.
      parameters:
        - name: bbox
          in: query
          required: true
          schema:
            type: string
          description: >
            `west,south,east,north` in WGS 84 degrees, with west < east and
            south < north.
          example: "-0.51,51.28,0.33,51.69"
        - name: geography
          in: query
          required: true
          schema:
            type: string
          description: The geography of the boundary release to search.
        - name: release
          in: query
          required: true
          schema:
            type: string
          description: >
            The boundary release to search, whose geometry the box is tested
            against.
        - name: tier
          in: query
          required: false
          schema:
            type: string
            enum: [full, high, medium, low]
          description: >
            Omit for identities only. Set to a tier to include each match's
            geometry, generalised to it.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
          description: >
            How many matching areas to return, 1 to 1000. `truncated` says
            whether the cap bit.
      responses:
        "200":
          description: The areas meeting the box, and how each meets it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaBoxSearchEnvelope"
              x-example-request: "/v1/areas:intersects?bbox=-0.51,51.28,0.33,51.69&geography=localAuthority&release=2023-05-uk-bgc-v2"
              example:
                apiVersion: v1
                atlasRelease: "sha256:24a500c55416bd7d58c28b1fc8cc4931d4a2fd831addafa3116556a91f2c4857"
                data:
                  bbox: [-0.51, 51.28, 0.33, 51.69]
                  geography: localAuthority
                  boundaryRelease: 2023-05-uk-bgc-v2
                  matched: 57
                  returned: 57
                  limit: 200
                  truncated: false
                  relationRule: >-
                    within when the area lies entirely inside the box, overlaps
                    when it meets the box without being contained by it. Both
                    are exact: an area is tested against the box itself, not
                    against its bounding box.
                  geometry: >-
                    Not included. Pass tier to receive it, at the cost of the
                    coordinates.
                  matches:
                    - id: localAuthority/2023-05-uk-bgc-v2/E09000007
                      code: E09000007
                      name: Camden
                      relation: within
                      boundingBox: [-0.2137, 51.5124, -0.1052, 51.5729]
                      geometrySource: { sourceCrs: "EPSG:4326" }
        "400":
          description: >
            The box is missing or malformed, the geography or release is
            missing, or `tier` or `limit` is out of range.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: >
            No compiled area release matches the requested geography and
            release.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/GeometryUnavailable"

  /areas:validate:
    get:
      operationId: validateAreaValues
      tags: ["Geography"]
      summary: Validate a batch of area codes or names against one release
      x-likely-refusal:
        status: 400
        when: "No `value` is given to validate."
        x-example-request: "/v1/areas:validate?geography=ward&release=2024-12-uk-bgc"
      description: >
        Checks each `value` against one exact boundary release before a caller
        joins data to it, and says for every value what it names or why it
        names nothing. At most 500 values may be sent in one request.

        A value shaped like an area code is `valid` when the release holds it.
        Otherwise it is `superseded` or `not-yet-current` when only older or
        newer releases of the geography hold it, `absent-from-release` when
        releases on both sides do, `other-geography` when only another
        geography holds it, `unknown` when nothing does, and `malformed-code`
        when it is a letter followed by other than eight digits.

        Any other value is a name. It is `matched` only exactly, through a
        published alias, or with an administrative title such as "City of" set
        aside, never by prefix or similarity. A name meaning several areas is
        `ambiguous` and lists them all; an `unmatched` name lists the other
        releases of the geography where it does match.

        Each result says in `normalised` whether the value was trimmed or
        re-cased to be read, and in `duplicateOf` whether it repeats an earlier
        value. `summary.joinable` is true only when every value names exactly
        one area of the release.
      parameters:
        - name: geography
          in: query
          required: true
          schema: { type: string }
          description: >
            The geography of the boundary release to validate the values
            against.
        - name: release
          in: query
          required: true
          schema: { type: string }
          description: >
            An exact boundary release id. `GET /boundary-releases:resolve`
            selects one for a date.
        - name: value
          in: query
          required: true
          schema:
            type: array
            maxItems: 500
            items: { type: string }
          description: A code or name to validate. Repeatable, in input order.
      responses:
        "200":
          description: A result for every value, in input order, and a summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              x-example-request: "/v1/areas:validate?geography=localAuthority&release=2025-05-uk-bgc-v2&value=Bristol&value=E07000026"
              example:
                apiVersion: v1
                atlasRelease: sha256:5c4aa4529cbfbd5e4c844c55cddba1ef04a7bf76f3eaa085a357fff401af6d0c
                data:
                  geography: localAuthority
                  boundaryRelease: 2025-05-uk-bgc-v2
                  summary:
                    valueCount: 2
                    byStatus:
                      matched: 1
                      superseded: 1
                    duplicateCount: 0
                    normalisedCount: 0
                    joinable: false
                  values:
                    - index: 0
                      value: Bristol
                      kind: name
                      status: matched
                      match: exact-without-title
                      area:
                        id: localAuthority/2025-05-uk-bgc-v2/E06000023
                        code: E06000023
                        name: Bristol, City of
                meta:
                  nextCursor: null
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"

  /areas:contains:
    get:
      operationId: findContainingAreas
      tags: ["Map"]
      summary: Find the areas containing a point in one or more geographies
      x-likely-refusal:
        status: 400
        when: "A geography is named without a release or a date. The point is looked up in one release, which is never chosen for the caller."
        x-example-request: "/v1/areas:contains?lng=-2.24&lat=53.48&geography=ward"
      description: >
        Tests a point against one boundary release of each requested geography,
        at most four in one request, and says for each what contains it or why
        nothing does.


        Supply WGS 84 `lng` and `lat` (the default), or set `crs=EPSG:27700`
        and supply British National Grid `easting` and `northing` or an
        Ordnance Survey `gridref` such as `TQ 30000 80000`. Set
        `crs=EPSG:29902` for Irish Grid metres. A grid reference denotes a
        square, so its answer uses the cell centre and includes its whole
        half-diagonal as uncertainty. Every answer is normalised to WGS 84 and
        retains the input coordinate and named transformation.


        Each geography's release is either pinned, as
        `release={geography}/{release}`, or chosen for `date` as the latest one
        dated on or before it, exactly as `/boundary-releases:resolve` chooses.
        A geography with neither is refused. A date no release fits, or one
        several releases of the same month fit equally, is reported in that
        geography's result as `no-release-for-date` or `ambiguous-release`
        rather than failing the whole lookup.


        Points on an exterior or hole ring are included and labelled
        `boundary`, so a point on a shared border returns every area sharing
        it. A result with no match is `outside-coverage` when the point's
        country is outside the release's coverage, or outside every UK country
        boundary, and `no-match` when the release covers the point's country
        but no area of it contains the point. The country comes from a matched
        area's code where one has it, and otherwise from the country
        boundaries, and `country.determinedBy` says which.


        Every result states how far its answer can be trusted.
        `positionalToleranceM` adds the coordinate's uncertainty, taken from
        `accuracy` or else from its written decimal places, the boundary's
        generalisation, read from the ONS release name, and the stated accuracy
        of any transformation from the source CRS to WGS 84. A match whose edge
        lies within that tolerance is `nearBoundary`. The geometry's source
        file, hash, CRS and transformation are given for each release and each
        match.


        Each release is read into memory on first use, which can take a second
        or more for a large release; later lookups against it are fast.
      parameters:
        - name: lng
          in: query
          required: false
          schema: { type: string, pattern: "^[+-]?\\d+(\\.\\d+)?$" }
          description: >
            Longitude in WGS 84 decimal degrees, -180 to 180. Written as a plain
            decimal: its decimal places are read as its precision.
        - name: lat
          in: query
          required: false
          schema: { type: string, pattern: "^[+-]?\\d+(\\.\\d+)?$" }
          description: Latitude in WGS 84 decimal degrees, -90 to 90, as for `lng`.
        - $ref: "#/components/parameters/PointLookupCrs"
        - $ref: "#/components/parameters/PointLookupEasting"
        - $ref: "#/components/parameters/PointLookupNorthing"
