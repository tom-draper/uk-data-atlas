openapi: 3.1.0
info:
  title: UK Data Atlas API
  version: "0.1.0"
  description: |
    This describes exactly the read-only routes implemented in `src/routes.ts`
    and served by `pnpm start`. It is not the full public API proposed in
    `README.md`: it does not yet cover geography conversion for measures. It
    can sum an extensive measure over a named location only when every curated
    member code occurs directly in the selected source partition. The
    population route is intentionally
    source-exact: it serves only published source code vintages and never
    chooses a geometry release on a caller's behalf. A caller may explicitly
    select a code-compatible release for a map join.

    Every successful response is wrapped in the envelope described by
    `Envelope`. Its `atlasRelease` field is the immutable `releaseId` from
    `GET /atlas-release`, so clients can identify the exact set of artifacts
    that produced a response.
  license:
    name: Proposal; no licence has been assigned yet
servers:
  - url: http://127.0.0.1:3001/v1
    description: Local development server (pnpm start)
paths:
  /:
    get:
      operationId: getRoot
      summary: API discovery
      description: Lists the currently implemented resource paths.
      responses:
        "200":
          description: Discovery document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:9edc254c5d4cd0a90fc5d3b2544e5f64946d6d0e6a8b68860e3aa6f0ac8d0912"
                data:
                  name: UK Data Atlas API
                  links:
                    - /v1/geographies
                    - /v1/boundary-releases
                    - /v1/boundary-releases/{type}/{release}
                    - /v1/geography-inventory
                    - /v1/datasets
                    - /v1/datasets/{dataset-id}
                    - /v1/measures
                    - /v1/measures/{measure-id}
                    - /v1/measures/{measure-id}/compatibility
                    - /v1/measures/{measure-id}/coverage
                    - /v1/measures/{measure-id}/quality
                    - /v1/data/{measure-id}
                    - /v1/data/{measure-id}/series
                    - /v1/data/{measure-id}/rankings
                    - /v1/data/{measure-id}/compare
                    - /v1/data/{measure-id}/aggregate
                    - /v1/areas
                    - /v1/areas/{type}/{release}/{code}
                    - /v1/areas/{type}/{release}/{code}/relationships
                    - /v1/areas/{type}/{release}/{code}/capabilities
                    - /v1/areas/{type}/{release}/{code}/citation
                    - /v1/areas/{type}/{release}/{code}/geometry
                    - /v1/crosswalks
                    - /v1/crosswalks/{crosswalk-id}
                    - /v1/crosswalks/{crosswalk-id}/records
                    - /v1/relationship-candidates
                    - /v1/validation
                    - /v1/validation/boundary-releases/{type}/{release}
                    - /v1/validation/crosswalks/{crosswalk-id}
                    - /v1/exports
                    - /v1/exports/{export-id}
                    - /v1/atlas-release
                    - /v1/atlas-releases
                    - /v1/atlas-releases/{release-id}
                    - /v1/atlas-releases/compare
                meta:
                  nextCursor: null

  /geographies:
    get:
      operationId: listGeographies
      summary: List geography types with their latest boundary release
      responses:
        "200":
          description: One entry per geography type present in the boundary registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeographySummaryListEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:9edc254c5d4cd0a90fc5d3b2544e5f64946d6d0e6a8b68860e3aa6f0ac8d0912"
                data:
                  - id: constituency
                    latestRelease: 2024-07-uk-bgc
                    releaseCount: 1
                meta:
                  nextCursor: null

  /boundary-releases:
    get:
      operationId: listBoundaryReleases
      summary: List every compiled boundary release
      responses:
        "200":
          description: The full boundary registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoundaryReleaseListEnvelope"

  /boundary-releases/{geography}/{release}:
    get:
      operationId: getBoundaryRelease
      summary: Get one boundary release's metadata
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
      responses:
        "200":
          description: The matching boundary release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoundaryReleaseEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:9edc254c5d4cd0a90fc5d3b2544e5f64946d6d0e6a8b68860e3aa6f0ac8d0912"
                data:
                  id: 2024-07-uk-bgc
                  geography: constituency
                  title: Westminster parliamentary constituencies, July 2024 (United Kingdom, generalised, clipped)
                  description: Westminster parliamentary constituencies as published for July 2024, covering the United Kingdom. Generalised to 20 m and clipped to the coastline.
                  temporalCoverage: "2024"
                  coverage:
                    countries: [GB-ENG, GB-NIR, GB-SCT, GB-WLS]
                  source:
                    publisher: Office for National Statistics
                    url: https://geoportal.statistics.gov.uk/
                    licence:
                      name: Open Government Licence v3.0
                      url: http://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
                  metadataHash: "sha256:cb36a990db1b57ae973ebe88874fae7f560a12721fa784cf5e52a9fd5e8466f3"
                meta:
                  nextCursor: null
        "404":
          $ref: "#/components/responses/NotFound"

  /geography-inventory:
    get:
      operationId: getGeographyInventory
      summary: Report area identity and relationship (crosswalk) coverage per boundary release
      description: >
        For every boundary release, states whether an area identity artifact
        has been compiled and which published crosswalks reference it, or an
        explicit reason why neither is available yet. This is the coverage
        report described in the README's domain model, not a promise that
        every release is fully supported.
      responses:
        "200":
          description: The current geography inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeographyInventoryEnvelope"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /datasets:
    get:
      operationId: listDatasets
      summary: List published source datasets and their lineage
      responses:
        "200":
          description: Dataset metadata compiled from the repository dataset manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /datasets/{dataset-id}:
    get:
      operationId: getDataset
      summary: Get one published source dataset and its input hashes
      parameters:
        - name: dataset-id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dataset metadata and source lineage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /measures:
    get:
      operationId: listMeasures
      summary: List measures currently available to query
      responses:
        "200":
          description: Measure definitions, coverage and supported operations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /measures/{measure-id}:
    get:
      operationId: getMeasure
      summary: Get one measure's semantics and availability
      parameters:
        - name: measure-id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The measure definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /measures/{measure-id}/compatibility:
    get:
      operationId: getMeasureCompatibility
      summary: Report source-code compatibility with compiled boundary releases
      description: >
        Compares every source partition's area-code set with compiled boundary
        releases of the same geography and source boundary year. A
        `code-set-compatible` result means every source code occurs in the
        candidate; it does not select that release or assert identical geometry.
      parameters:
        - name: measure-id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Compatibility counts and bounded samples of unmatched source and candidate-only codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /measures/{measure-id}/coverage:
    get:
      operationId: getMeasureCoverage
      summary: Report source and boundary code coverage for a measure
      description: >
        Summarises each source partition's published coverage and the proportion
        of its area codes found in every assessed boundary release. An eligible
        code join means all source codes are present; it does not assert equal
        geometry or perform a geographic conversion.
      parameters:
        - name: measure-id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Source coverage and boundary code-coverage summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /measures/{measure-id}/quality:
    get:
      operationId: getMeasureQuality
      summary: Preflight source, status and boundary quality for a measure
      description: >
        Reports every source partition and period before a data request,
        including source record-status counts, immutable artifact hash,
        aggregation availability and boundary code-set compatibility. It does
        not infer missing areas or claim geometric equivalence from code sets.
      parameters:
        - name: measure-id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The measure-quality matrix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /data/{measure-id}:
    get:
      operationId: getMeasureObservations
      summary: Retrieve a measure's source-exact observations
      description: >
        Serves observed values for one published measure and source partition.
        `population-estimate` covers 2022 Ward 2023 codes in England and Wales,
        2011–2024 Local Authority 2023 codes across all four UK nations, and
        ONS's own mid-2021 and mid-2022 estimates for the July 2024 Westminster
        constituencies in England and Wales.
        `ghg-emissions` covers 2005–2024 Local Authority 2025 codes across all
        four nations, as net territorial emissions in kt CO2e; emissions per
        resident are not served, because a ratio cannot be summed over areas.
        `total-jobs` covers 2011–2024 Local Authority 2023 codes, as jobs
        counted at the workplace and rounded by ONS to the nearest thousand.
        Great Britain is published for every year and Northern Ireland for
        2020 to 2022 only; in the other years Northern Ireland has no records
        rather than zero jobs, so a sum over it is refused, not reported as 0.
        `mobile-4g-coverage` and `mobile-5g-coverage` cover 2025 Local
        Authority 2024 codes across all four nations, as the share of premises
        reached by all four mobile network operators. Both are declared
        intensive: a share does not add over areas, and combining authorities
        needs the premises weight the measure names.
        `house-price-median` covers ward-level median price paid for England
        and Wales, 1995-2022, each period the year ending December, under the
        ward codes the publisher used. It is declared `non-aggregatable` with
        `statistic: median`: a median of medians is not the median of the
        underlying sales, so aggregation and conversion both refuse it.

        `imd-rank` and `imd-decile` cover the English Index of Multiple
        Deprivation 2019 for 32,844 LSOAs on 2011 codes. Both are ordinal and
        `non-aggregatable`, and both are positions within England alone: the
        other nations' indices use different methods and cannot be compared.

        `wimd-rank` and `wimd-decile` cover the Welsh Index of Multiple
        Deprivation 2019 for 1,909 LSOAs on 2011 codes, as published.

        `simd-rank` and `simd-decile` cover the Scottish Index of Multiple
        Deprivation 2020v2 for 6,976 data zones on 2011 codes, as published.

        `nimdm-rank` covers the Northern Ireland Multiple Deprivation Measure
        2017 for 890 super output areas, identified by NISRA codes such as
        `95AA01S1` rather than GSS codes.

        `life-expectancy-male` and `life-expectancy-female` cover life
        expectancy at birth in England, Wales and Northern Ireland for every
        three-year period from 2001 to 2003 to 2020 to 2022, on December 2021
        local-authority codes. They are `non-aggregatable`: a combined
        population's life expectancy has to be recalculated from deaths and
        population, not averaged.

        A measure that declares `uncertainty` carries the publisher's interval
        on each record as `confidenceInterval` (`lower`, `upper`), at the level
        the measure states. Intervals are never computed by this API.

        `population-density` is the one derived measure: mid-year population
        divided by ONS Standard Area Measurement land area, which excludes
        inland water. Its values carry `status: "derived"` rather than
        `observed`, no publisher is answerable for the quotient, and the
        measure names both input datasets in `derivedFrom` so attribution
        covers the denominator. It is intensive, so it neither aggregates nor
        converts.

        The `travel-to-work-*` and `car-availability-*` measures cover Census
        2021 Local Authority 2025 codes for England and Wales, as counts rather
        than shares: a count of people or households adds over areas, and each
        breakdown publishes its own `-total` denominator so a caller can derive
        a share and know what it is a share of.
        This route never selects a May/December boundary release, converts
        values, or aggregates them. A caller may supply `release` only when the
        compatibility report proves that every source code is present; the
        response identifies that caller-selected code join.
        `GET /measures/{measure-id}` declares valid period/geography
        combinations, and `GET /measures/{measure-id}/compatibility` declares
        eligible releases. Every response includes compact provenance linking
        the immutable Atlas release, measure, source dataset and observation
        artifact, along with the selected geography match and an explicit
        statement that no transformation has been applied.
      parameters:
        - name: measure-id
          in: path
          required: true
          schema:
            type: string
          description: >
            A published measure id, for example `population-estimate`,
            `ghg-emissions` or `mobile-5g-coverage`. `GET /measures` lists
            them, each with the aggregation its values permit.
        - name: period
          in: query
          required: true
          schema:
            type: string
          description: A period listed by the measure's matching source partition.
        - name: geography
          in: query
          required: true
          schema:
            enum: [ward, localAuthority, constituency, lsoa, dataZone, superOutputArea]
        - name: boundaryYear
          in: query
          required: true
          schema:
            const: "2023"
        - name: release
          in: query
          required: false
          schema:
            type: string
          description: >
            Caller-selected geometry release. Accepted only when every source
            code is present in a published compatibility candidate; it does
            not convert values or assert equal geometry.
        - name: areaCode
          in: query
          required: false
          schema:
            type: string
          description: Return the one observed source-area code, if present.
        - name: include
          in: query
          required: false
          schema:
            enum: [area]
          description: >
            Add the selected release's canonical area identity, name and
            aliases to each record. Requires a compatible `release`.
        - name: format
          in: query
          required: false
          schema:
            enum: [json, csv, ndjson]
            default: json
          description: >
            `json` returns the API envelope. `csv` and `ndjson` return one
            provenance-bearing row per observation, suitable for downloads and
            line-oriented processing. Each row carries the measure's `unit`, so
            a saved file cannot be read in the wrong one, and ends with
            `lowerBound` and `upperBound`, empty where no interval is published. Tabular responses are paginated like the
            JSON ones, but carry the next page as a `Link` header with
            `rel="next"` because they have no envelope to hold a cursor.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A cursor-paginated JSON page or a source-exact tabular export.
          headers:
            Link:
              description: >
                Present on a tabular page that is not the last. An RFC 8288
                `rel="next"` relation holding the same query with its cursor
                advanced.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
            text/csv:
              schema:
                type: string
            application/x-ndjson:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "422":
          description: The requested operation is not supported for this source-exact measure.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /data/{measure-id}/aggregate:
    get:
      operationId: aggregateSourceExactMeasure
      summary: Aggregate an extensive or explicitly weighted measure
      description: >
        Returns a derived sum for a measure declared extensive, or a weighted
        mean for a measure that publishes an available weight measure. Supply
        exactly one of `locationId`, `areaCode`, or `regionCode`.

        With `locationId`, every curated member code must occur in the
        requested source partition; otherwise the request is rejected rather
        than silently returning a partial total. Named locations are editorial
        code groupings, not claims of official administrative geography.

        With `areaCode`, which currently accepts a country code such as
        `E92000001`, membership follows the first character of the GSS area
        code, which the coding scheme assigns by country. That is definitional
        rather than geometric, so it needs no boundary comparison and cannot
        drift between releases. The sum covers every area of that country the
        partition publishes, which is not a claim of national completeness: a
        partition holding no areas for the country is rejected rather than
        summed to zero. `aggregation.coverage` compares the areas summed with
        the country's areas in each boundary release the partition is assessed
        to match. It is `complete` when every such release is covered,
        `partial` with `code: partial_coverage` and the missing counts when any
        release holds areas the partition has no value for, as a local
        election does for wards that did not go to the polls, and
        `not-assessed` when no matching release is compiled.

        With `regionCode`, callers must also name a code-set-compatible
        `sourceRelease` and a published `crosswalk`. The regional crosswalk
        must show complete one-to-one source-area membership; split or partial
        overlap is rejected rather than used as an implicit conversion.
        `aggregation.coverage` is `partial` when the partition has no value for
        some of the areas the crosswalk places in the region.

        This route does not select a boundary release or perform a code or
        geometry conversion.
      parameters:
        - name: measure-id
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          required: true
          schema:
            type: string
        - name: geography
          in: query
          required: true
          schema:
            enum: [ward, localAuthority, constituency, lsoa, dataZone, superOutputArea]
        - name: boundaryYear
          in: query
          required: true
          schema:
            type: integer
        - name: locationId
          in: query
          required: false
          schema:
            type: string
          description: >
            An id returned by `GET /locations`. Supply exactly one target
            selector.
        - name: areaCode
          in: query
          required: false
          schema:
            type: string
          description: >
            A country code, such as `E92000001`. Supply exactly one target
            selector.
        - name: regionCode
          in: query
          required: false
          schema:
            type: string
          description: >
            An official English region code. Requires `crosswalk` and
            `sourceRelease`; supply exactly one target selector.
        - name: sourceRelease
          in: query
          required: false
          schema:
            type: string
          description: >
            The source boundary release named by the regional crosswalk. It
            must be code-set compatible with the requested measure source.
        - name: crosswalk
          in: query
          required: false
          schema:
            type: string
          description: >
            A regional membership crosswalk returned by `GET /crosswalks`.
      responses:
        "200":
          description: A derived sum with its direct-code membership evidence and source provenance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            The measure is non-aggregatable, aggregation is unavailable, the
            location is not a complete direct match, the regional relationship
            is split or partial, or the partition holds no areas for the
            requested target.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /data/{measure-id}/convert:
    get:
      operationId: convertSourceExactMeasure
      summary: Regroup an extensive measure onto a published crosswalk's target areas
      description: >
        Converts a source partition onto another geography or code vintage
        using the crosswalk the caller names. The route never selects a
        conversion path: `GET /crosswalks` lists the published ones, and the
        response repeats the chosen crosswalk's method, quality, weighting and
        content hash.

        Only a measure declared extensive may be converted, because conversion
        works by adding values up. An intensive measure is rejected: a share or
        a rank cannot be regrouped by summing, and weighting one by area
        produces a number with no meaning.

        The reported `method` distinguishes the two outcomes. `exact` means
        every source area sits wholly within one target, so the conversion is a
        regrouping and the partition total is unchanged. `area-weighted` means
        some sources were split in proportion to overlapping area, which is an
        estimate that assumes the measure is spread evenly across each source.

        A source code the crosswalk does not carry, or a split source with no
        published weight, is rejected rather than partially converted.
      parameters:
        - name: measure-id
          in: path
          required: true
          schema:
            type: string
        - name: crosswalk
          in: query
          required: true
          schema:
            type: string
          description: A crosswalk id returned by `GET /crosswalks`.
        - name: period
          in: query
          required: true
          schema:
            type: string
        - name: geography
          in: query
          required: true
          schema:
            enum: [ward, localAuthority, constituency, lsoa, dataZone, superOutputArea]
        - name: boundaryYear
          in: query
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: >
            Cursor-paginated derived values on the crosswalk's target areas,
            with the conversion method and the crosswalk's own provenance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            The measure is intensive, the crosswalk starts at another
            geography, or the partition cannot be converted completely.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /data/{measure-id}/series:
    get:
      operationId: getSourceExactMeasureSeries
      summary: Retrieve one area's source-exact time series
      description: >
        Returns all published observations for one area code within one source
        geography and code vintage. It does not select a boundary release,
        convert values or aggregate them. Supply `datasetId` when a measure has
        more than one source for the requested geography and boundary year.
      parameters:
        - name: measure-id
          in: path
          required: true
          schema:
            type: string
        - name: areaCode
          in: query
          required: true
          schema:
            type: string
        - name: geography
          in: query
          required: true
          schema:
            enum: [ward, localAuthority, constituency, lsoa, dataZone, superOutputArea]
        - name: boundaryYear
          in: query
          required: true
          schema:
            type: integer
        - name: datasetId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Source-exact observations in ascending source period order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The requested conversion, aggregation or geometry release is not supported.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /data/{measure-id}/rankings:
    get:
      operationId: getSourceExactMeasureRankings
      summary: Rank areas within one source-exact measure partition
      description: >
        Ranks only the observations published for one period, geography and
        code vintage. Uses competition ranking: tied values share a rank and
        the following rank accounts for all preceding observations (1, 1, 3).
        It does not select a boundary release, convert values or aggregate them.
      parameters:
        - name: measure-id
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          required: true
          schema:
            type: string
        - name: geography
          in: query
          required: true
          schema:
            enum: [ward, localAuthority, constituency, lsoa, dataZone, superOutputArea]
        - name: boundaryYear
          in: query
          required: true
          schema:
            type: integer
        - name: order
          in: query
          required: false
          schema:
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Cursor-paginated competition ranks for the source partition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The requested conversion, aggregation or geometry release is not supported.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /places:
    get:
      operationId: resolvePlaces
      summary: Find every place a name could mean
      description: >
        Turns a name into candidate places, each saying what kind of place it
        is. A name is rarely one area: "Manchester" is a local authority, a
        county and unitary authority, a major town, a travel to work area and a
        ward, and "Newport" is thirteen codes across Wales, the Isle of Wight and
        Shropshire. This never chooses among them.


        Names match with case, accents, punctuation and the ampersand set aside,
        so "Brighton & Hove" and "Ynys Mon" find what was published, and an
        alias matches as well as a name. An administrative title is set aside
        too, so "Bristol" finds the authority published as "Bristol, City of",
        reported as `exact-without-title`. Names that merely begin with the
        query follow, as `prefix`, once equal names leave room: "Richmond"
        lists its wards and parish first, then Richmond upon Thames. A bare
        area code, or a place reference, is looked up directly.


        A place held in several releases is returned once, with its releases
        newest first. Equal matches are listed headline geographies first, then
        wards and smaller areas; that is a presentation order and asserts
        nothing about which was meant. Curated named locations appear with
        their member codes.
      parameters:
        - name: q
          in: query
          required: true
          description: A place name, an area code, or a place reference such as `localAuthority/E08000003`.
          schema:
            type: string
          example: Manchester
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 10
      responses:
        "200":
          description: The candidate places, best match first. Empty when nothing matches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:24a500c55416bd7d58c28b1fc8cc4931d4a2fd831addafa3116556a91f2c4857"
                data:
                  query: Bristol
                  candidates:
                    - place: localAuthority/E06000023
                      kind: area
                      name: Bristol, City of
                      geography: localAuthority
                      code: E06000023
                      match: exact-without-title
                      boundaryReleases: [2025-12-uk-bgc, 2023-05-uk-bgc-v2]
                    - place: majorTownAndCity/J01000015
                      kind: area
                      name: Bristol
                      geography: majorTownAndCity
                      code: J01000015
                      match: exact
                      boundaryReleases: [2015-12-en-bgc]
                meta:
                  nextCursor: null
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /data/{measure-id}/value:
    get:
      operationId: getMeasureValueForPlace
      summary: Answer a measure for a place given by name
      description: >
        Answers "what is the population of the North West?" in one call. The
        place may be a name, an area code or a place reference from `/places`;
        the period may be omitted, in which case the latest the chosen
        partition publishes is used and the answer says so.


        Nothing is computed here. Each place the name could mean is put to the
        route that already serves that kind of place: `series` for an area,
        `aggregate` for a curated location or a country. The value, its
        provenance and every refusal are exactly what that route gives, and
        `via` names the call that gives the answer directly, for citing or
        repeating.


        The candidate is chosen by what the measure can answer rather than by
        guessing what was meant. Places matching the name exactly are tried
        first; names merely beginning with it only when no exact match
        answers. Answers resting on the same partition, period and area codes
        are the same ground reached two ways and count once, keeping the
        publisher's own observation over an aggregate of one member: Manchester
        the authority and Manchester the curated location of that authority give
        one answer. The other places the name matched are listed in
        `otherMatches`, answered or not.


        When the name gives more than one distinct answer the response is a 409
        with a `choices` member: each place, its answer, and the request that
        asks about it alone. "Newport" is the Welsh authority and several
        wards. When the name matches places but the measure answers none, the
        response is a 422 with a `candidates` member saying why for each, such
        as a median, which cannot be summed over a region.
      parameters:
        - name: measure-id
          in: path
          required: true
          schema:
            type: string
        - name: place
          in: query
          required: true
          schema:
            type: string
          example: North West
        - name: period
          in: query
          required: false
          description: A published period. Omit for the latest.
          schema:
            type: string
      responses:
        "200":
          description: The answer, the place it is for, and the route that gives it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:24a500c55416bd7d58c28b1fc8cc4931d4a2fd831addafa3116556a91f2c4857"
                data:
                  measure:
                    id: population-estimate
                    label: Population estimate
                    valueKind: count
                    unit: people
                  question: { place: North West, period: "2022" }
                  answer:
                    period: "2022"
                    periodDefaulted: false
                    status: derived
                    value: 7526285
                    unit: people
                  place:
                    place: location/north-west
                    kind: named-location
                    name: North West
                    geography: named-location
                    code: north-west
                    match: exact
                  method: aggregate
                  via: /v1/data/population-estimate/aggregate?locationId=north-west&geography=localAuthority&boundaryYear=2023&period=2022
                  otherMatches:
                    - place: region/E12000002
                      kind: area
                      name: North West
                      geography: region
                      code: E12000002
                      match: exact
                      served: false
                      reason: population-estimate is not published for region areas.
                meta:
                  nextCursor: null
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          description: No published measure has that id, or no place is called or coded that.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >
            The name gives more than one distinct answer. `choices` lists each
            place with its answer and the request that asks about it alone.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: >
            The name matches places, but the measure answers none of them.
            `candidates` says why for each.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /data/{measure-id}/change:
    get:
      operationId: getSourceExactMeasureChange
      summary: Rank areas by change between two periods of one measure partition
      description: >
        Returns how each area changed between two periods, ranked: the question
        "where did population grow fastest between 2011 and 2022?" Pass
        `areaCode` for one area, which keeps its rank among all of them, so
        "Manchester grew 13.2%, 42nd of 361" is a single call.


        Change is measured inside one source partition, never across two. The
        publisher restates every period of a partition on a single set of
        codes, so an area code names the same ground at the start and the end.
        Pairing periods from partitions on different codes would pair areas
        that are not the same place, so it is not offered. Naming no partition
        returns a 400 listing the partitions and how many periods each has.


        `by=absolute` ranks the end value less the start, in the measure's
        unit. `by=relative` ranks that as a proportion of the start, and is
        refused for a ratio: change in a share is read in points, and a rise in
        coverage from 2% to 3% is not usefully called 50%. An area whose start
        is zero has no relative change and is left out of a relative ranking,
        counted in `coverage.withoutRelativeChange`. Currency is nominal and
        not adjusted for inflation.


        Some changes are refused outright. A rank or decile is a position among
        the other areas rather than a quantity, so a move in it is not change in
        the area. A partition publishing one period has nothing to change
        between. Rolling windows that share years, such as life expectancy for
        2017-2019 and 2018-2020, are refused because most of the apparent change
        is the same data counted twice.


        Where the publisher gives intervals, each record says whether the start
        and end intervals overlap. Intervals that do not overlap mean the change
        is unlikely to be chance; intervals that do overlap do not show that it
        is. Areas with a value in only one period are listed in
        `coverage.onlyAtStart` and `coverage.onlyAtEnd` rather than paired with
        anything.
      parameters:
        - name: measure-id
          in: path
          required: true
          schema:
            type: string
        - name: geography
          in: query
          required: true
          schema:
            type: string
        - name: boundaryYear
          in: query
          required: true
          schema:
            type: integer
        - name: startPeriod
          in: query
          required: true
          schema:
            type: string
          example: "2011"
        - name: endPeriod
          in: query
          required: true
          description: A published period of the partition after `startPeriod`.
          schema:
            type: string
          example: "2022"
        - name: by
          in: query
          required: false
          schema:
            enum: [absolute, relative]
            default: absolute
        - name: order
          in: query
          required: false
          description: "`desc` puts the largest rise first, `asc` the largest fall."
          schema:
            enum: [asc, desc]
            default: desc
        - name: areaCode
          in: query
          required: false
          description: Return only this area, with its rank among all of them.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Cursor-paginated competition ranks of change for the source partition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:24a500c55416bd7d58c28b1fc8cc4931d4a2fd831addafa3116556a91f2c4857"
                data:
                  startPeriod: "2011"
                  endPeriod: "2022"
                  change:
                    direction: end-minus-start
                    basis: relative
                    order: desc
                    unit: proportion
                    interpretation: Change in the source-published unit.
                  coverage:
                    areasRanked: 361
                    areasWithBothPeriods: 361
                    onlyAtStart: []
                    onlyAtEnd: []
                    withoutRelativeChange: 0
                  records:
                    - areaCode: E09000001
                      rank: 1
                      tieCount: 1
                      start: { period: "2011", areaCode: E09000001, value: 7412, status: observed }
                      end: { period: "2022", areaCode: E09000001, value: 11615, status: observed }
                      absoluteChange: 4203
                      relativeChange: 0.567
                meta:
                  nextCursor: "RTA5MDAwMDAx"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            The measure is a rank, decile or category; its partition publishes a
            single period; the two periods overlap; or a geometry release,
            conversion or aggregation was asked for.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /data/{measure-id}/compare:
    get:
      operationId: compareSourceExactMeasureAreas
      summary: Compare two areas within one source-exact measure partition
      description: >
        Returns the comparison observation minus the baseline observation for
        one published period, geography and code vintage. The two named areas
        must be in the same source partition. Ratios report a difference on
        their source scale rather than a misleading relative change. The route
        does not select a boundary release, convert values or aggregate them.
      parameters:
        - name: measure-id
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          required: true
          schema:
            type: string
        - name: geography
          in: query
          required: true
          schema:
            enum: [ward, localAuthority, constituency, lsoa, dataZone, superOutputArea]
        - name: boundaryYear
          in: query
          required: true
          schema:
            type: integer
        - name: baselineAreaCode
          in: query
          required: true
          schema:
            type: string
        - name: comparisonAreaCode
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The named source-exact observations and their directed difference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The requested conversion, aggregation or geometry release is not supported.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /areas:
    get:
      operationId: listAreas
      summary: List or search compiled area identities
      description: >
        Searches official codes, names and supplied aliases case-insensitively.
        Exact code matches take precedence over prefix matches, so a bare code
        can safely resolve to every matching geography/release identity. Name,
        alias and non-exact code queries use prefix matching.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Official code, name or alias prefix. Omit to list areas.
        - name: geography
          in: query
          required: false
          schema:
            type: string
          description: Restrict results to one geography type.
        - name: release
          in: query
          required: false
          schema:
            type: string
          description: Restrict results to one boundary release.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor from the previous response's nextCursor.
      responses:
        "200":
          description: A cursor-paginated page of matching area identities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaListEnvelope"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /areas:intersects:
    get:
      operationId: findAreasIntersectingBox
      summary: Find the areas meeting a bounding box in one release
      description: >
        Returns every area of one geography and release that meets the given
        WGS 84 box: the query a map makes when it pans, and the one an analysis
        makes to scope a region before asking for anything heavier.


        `relation` says how each area meets the box. `within` means the area
        lies entirely inside it; `overlaps` means it meets the box without
        being contained by it. Both are exact. An area is tested against the
        box itself, not against its own bounding box, so a crescent whose
        bounding box reaches into the query while its land does not is
        excluded, as is a box sitting inside a lake within an area.


        Identities come back by default, each with its own bounding box, and
        the coordinates are opted into with `tier`, which generalises every
        match exactly as the geometry route does. That keeps the cost of a wide
        box bounded whether or not a caller wants geometry with it. The same
        caveat applies: above `full`, matches are generalised one at a time and
        neighbours drawn together may disagree along a shared border.


        Results are capped at `limit`, 200 by default and 1000 at most, and
        `matched` against `returned` with `truncated` says whether the cap bit.
        The cap is on results rather than on the box: a box covering the whole
        country is a reasonable analysis question, and it is the geometry that
        is expensive, not the extent. A box matching nothing is an empty
        answer, not an error; a geography and release the catalogue does not
        carry is a 404.
      parameters:
        - name: bbox
          in: query
          required: true
          schema:
            type: string
          description: >
            `west,south,east,north` in WGS 84 degrees, with west < east and
            south < north.
          example: "-0.51,51.28,0.33,51.69"
        - name: geography
          in: query
          required: true
          schema:
            type: string
        - name: release
          in: query
          required: true
          schema:
            type: string
        - name: tier
          in: query
          required: false
          schema:
            type: string
            enum: [full, high, medium, low]
          description: >
            Omit for identities only. Set to a tier to include each match's
            geometry, generalised to it.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        "200":
          description: The areas meeting the box, and how each meets it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaBoxSearchEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:24a500c55416bd7d58c28b1fc8cc4931d4a2fd831addafa3116556a91f2c4857"
                data:
                  bbox: [-0.51, 51.28, 0.33, 51.69]
                  geography: localAuthority
                  boundaryRelease: 2023-05-uk-bgc-v2
                  matched: 57
                  returned: 57
                  limit: 200
                  truncated: false
                  relationRule: >-
                    within when the area lies entirely inside the box, overlaps
                    when it meets the box without being contained by it. Both
                    are exact: an area is tested against the box itself, not
                    against its bounding box.
                  geometry: >-
                    Not included. Pass tier to receive it, at the cost of the
                    coordinates.
                  matches:
                    - id: localAuthority/2023-05-uk-bgc-v2/E09000007
                      code: E09000007
                      name: Camden
                      relation: within
                      boundingBox: [-0.2137, 51.5124, -0.1052, 51.5729]
                      geometrySource: { sourceCrs: "EPSG:4326" }
        "400":
          description: >
            The box is missing or malformed, the geography or release is
            missing, or `tier` or `limit` is out of range.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: >
            No compiled area release matches the requested geography and
            release.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/GeometryUnavailable"

  /areas:contains:
    get:
      operationId: findContainingAreas
      summary: Find areas containing a WGS84 point in one boundary release
      description: >
        Uses a cached bounding-box prefilter followed by an exact polygon test.
        Points on exterior or hole rings are included and labelled `boundary`;
        a point on a shared border may therefore return more than one area.
      parameters:
        - name: lng
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: geography
          in: query
          required: true
          schema: { type: string }
        - name: release
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Every area whose geometry contains the point.
          content:
            application/json:
              schema: { type: object }
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/GeometryUnavailable"

  /areas/{geography}/{release}/{code}:
    get:
      operationId: getArea
      summary: Get one compiled area by its full identity
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: The official source code for this area on this boundary release.
      responses:
        "200":
          description: The matching compiled area.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:9edc254c5d4cd0a90fc5d3b2544e5f64946d6d0e6a8b68860e3aa6f0ac8d0912"
                data:
                  id: constituency/2024-07-uk-bgc/E14001262
                  geography: constituency
                  boundaryRelease: 2024-07-uk-bgc
                  code: E14001262
                  name: Halifax
                meta:
                  nextCursor: null
        "404":
          $ref: "#/components/responses/NotFound"

  /areas/{geography}/{release}/{code}/relationships:
    get:
      operationId: getAreaRelationships
      summary: Get published relationships for one compiled area
      description: >
        Returns only relationships from published crosswalks. A
        clean-containment mapping is represented as within from child to parent
        and contains in reverse. An official historical lookup is represented
        as successor from source to target and predecessor in reverse. An
        area-overlap mapping is represented as overlaps in both directions,
        with the shared area and its share of each side.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: The official source code for this area on this boundary release.
      responses:
        "200":
          description: The area identity and its published relationship edges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaRelationshipsEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /areas/{geography}/{release}/{code}/capabilities:
    get:
      operationId: getAreaCapabilities
      summary: Report what the Atlas can serve for one exact area identity
      description: >
        Reports geometry, published relationship and crosswalk edges,
        direct-code named-location membership, and measure sources assessed
        against this exact boundary release. Measure compatibility is based on
        area-code membership only and does not assert equal geometry.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The area identity and its availability matrix.
          content:
            application/json:
              schema: { type: object }
        "404":
          $ref: "#/components/responses/NotFound"

  /areas/{geography}/{release}/{code}/citation:
    get:
      operationId: getAreaCitation
      summary: Assemble a citation bundle for one exact area identity
      description: >
        Returns what a caller needs to cite an area as served by this Atlas
        release: the immutable Atlas release, the content hash of the area
        identity artifact, the boundary release's publisher, licence and
        metadata hash, geometry provenance, the validation results for the
        release and any cited crosswalk, and an attribution block.

        Name a `measure` to cite the observation artifacts, with their content
        hashes, that hold a value for this area in a source partition assessed
        against this exact boundary release. Only those partitions' datasets
        are attributed, together with any dataset a derived measure is
        calculated from. Name a `crosswalk` to cite one that publishes a
        relationship for this area. A resource that supplies nothing for the
        area is refused rather than cited.

        Per-area geometry hashes are not compiled yet and are reported as
        `not-published`. The boundary release's `metadataHash` pins its
        metadata, which names the source file but does not hash its contents.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - name: code
          in: path
          required: true
          schema: { type: string }
        - name: measure
          in: query
          required: false
          schema:
            type: array
            items: { type: string }
          description: A measure id from `GET /measures`. Repeatable.
        - name: crosswalk
          in: query
          required: false
          schema:
            type: array
            items: { type: string }
          description: A crosswalk id from `GET /crosswalks`. Repeatable.
      responses:
        "200":
          description: The area's citation bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            A named measure holds no observation for this area in a source
            assessed against this boundary release, or a named crosswalk
            publishes no relationship for it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /areas/{geography}/{release}/{code}/history:
    get:
      operationId: getAreaHistory
