                    data:
                      purpose: membership
                      status: available
                      paths:
                        - id: ward-2023-05-uk-bgc-to-local-authority-2023-05-uk-bgc-v2-clean-containment/forward/membership
                          quality: publisher-supplied
                          steps:
                            - crosswalkId: ward-2023-05-uk-bgc-to-local-authority-2023-05-uk-bgc-v2-clean-containment
                              direction: forward
