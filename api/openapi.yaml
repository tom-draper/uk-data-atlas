                    data:
                      purpose: membership
                      status: available
                      paths:
                        - id: ward-2023-05-uk-bgc-to-local-authority-2023-05-uk-bgc-v2-clean-containment/forward/membership
                          quality: publisher-supplied
                          origin: crosswalk
                          steps:
                            - crosswalkId: ward-2023-05-uk-bgc-to-local-authority-2023-05-uk-bgc-v2-clean-containment
                              direction: forward
                              method: clean-containment
                              purpose: membership
                    meta:
                      nextCursor: null
                unsupported:
                  x-example-request: "/v1/relationship-paths?sourceGeography=ward&sourceRelease=2023-05-uk-bgc&targetGeography=localAuthority&targetRelease=2023-05-uk-bgc-v2&purpose=identity"
                  value:
                    apiVersion: v1
                    atlasRelease: sha256:5c4aa4529cbfbd5e4c844c55cddba1ef04a7bf76f3eaa085a357fff401af6d0c
                    data:
                      purpose: identity
                      status: unsupported
                      reason: No path is published from ward/2023-05-uk-bgc to localAuthority/2023-05-uk-bgc-v2 for identity; one is published for membership.
                      paths: []
                      alternatives:
                        - purpose: membership
                          href: /v1/relationship-paths?sourceGeography=ward&sourceRelease=2023-05-uk-bgc&targetGeography=localAuthority&targetRelease=2023-05-uk-bgc-v2&purpose=membership
                    meta:
                      nextCursor: null
        "400":
