  /areas:resolve:
    get:
      operationId: resolveAreaIdentifier
      tags: ["Start here"]
      summary: Resolve a code, name or alias to every exact area identity it can mean
      x-likely-refusal:
        status: 400
        when: "No `q` is supplied. The Atlas cannot resolve an omitted identifier."
        x-example-request: "/v1/areas:resolve"
      description: >
        Resolves an official code, official name or supplied alias, returning
        every exact candidate and a link to each candidate's geography dossier.
        Codes match case insensitively. Names and aliases also set aside case,
        accents, punctuation, ampersands and administrative titles such as
        "City of"; each candidate states which rule matched. It never selects
        a geography or a boundary release from catalogue order. An equal name
        and alias are both retained. An empty candidate list is an honest
        no-match.


        Optional geography and release filters narrow the candidate set. Give
        `date` with a geography instead of a release to select the latest
        dated release on or before that date; `country` can restrict this
        selection. The response explains the selected snapshot and any
        same-month releases set aside. For prefix matching, use `/areas`,
        whose paginated result is linked in every response.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Official area code, exact official name or supplied alias.
        - name: geography
          in: query
          required: false
          schema:
            type: string
          description: Restrict candidates to one geography type.
        - name: release
          in: query
          required: false
          schema:
            type: string
          description: Restrict candidates to one boundary release.
        - name: date
          in: query
          required: false
          schema:
            type: string
          description: >
            Calendar date (`YYYY-MM-DD`) or month (`YYYY-MM`) used to select
            a release. Requires `geography` and cannot be combined with
            `release`.
        - name: country
          in: query
          required: false
          schema:
            enum: [GB-ENG, GB-NIR, GB-SCT, GB-WLS]
          description: Restrict a date-selected release to one country.
      responses:
        "200":
          description: Every exact identity the supplied identifier can mean, without an implicit choice.
          content:
            application/json:
              schema: { type: object }
              x-example-request: "/v1/areas:resolve?q=E08000025"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: More than one equally suitable boundary release was selected for the requested date.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

