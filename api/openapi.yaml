  /translations:
    get:
      operationId: translateAreaCode
      tags: ["Geography"]
      summary: Translate one code through a published conversion path in either direction
      x-likely-refusal:
        status: 422
        when: "No crosswalk is published for this source, target and purpose. A shared code is never taken as proof of the same area."
        x-example-request: "/v1/translations?sourceGeography=ward&sourceRelease=2023-05-uk-bgc&code=E05000932&targetGeography=constituency&targetRelease=2024-07-uk-bgc"
      description: >
        `identity` permits publisher-supplied historical lookups only,
        `membership` permits clean containment only, and `apportion` permits
        area-overlap crosswalks only. The resolver selects every published
        path with that purpose, ranking direct paths before reviewed and then
        discovered compositions. `paths` records every step used. A direct
        result retains its directional crosswalk and provenance; a composed
        result carries its full `path` instead, so it cannot be mistaken for
        a direct lookup. A composed result's targets carry only their code,
        labels and, for `apportion`, the weight multiplied along the path: a
        step's shares, overlap area and population describe the areas that
        step joins, not the queried one. Reverse area-overlap weights are normalised against
        the queried target and report its source coverage. The route does not
        treat a shared code across releases as proof of unchanged geography.
      parameters:
        - name: sourceGeography
          in: query
          required: true
          schema: { type: string }
          description: The geography the code belongs to.
        - name: sourceRelease
          in: query
          required: true
          schema: { type: string }
          description: The boundary release the code belongs to.
        - name: code
          in: query
          required: true
          schema: { type: string }
          description: >
            The area code to translate, as published in the source release.
        - name: targetGeography
          in: query
          required: true
          schema: { type: string }
          description: The geography to translate into.
        - name: targetRelease
          in: query
          required: true
          schema: { type: string }
          description: The boundary release to translate into.
        - name: purpose
          in: query
          schema:
            type: string
            enum: [identity, membership, apportion]
            default: membership
          description: >
            What the translation is for: official historical `identity`, clean
            `membership`, or area-overlap `apportion`. A crosswalk is used only
            where its method suits the purpose.
