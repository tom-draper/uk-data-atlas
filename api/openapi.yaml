  /lookups/{lookup-id}:
    get:
      operationId: downloadBulkLookup
      tags: ["Sync"]
      summary: Download one whole lookup table as CSV or NDJSON
      description: >
        Renders the lookup from its source artifact and returns it only if
        the bytes match the hash its manifest lists for the format. In CSV a
        list column is joined with " | " and a cell is quoted only when it
        holds a comma, quote or line break; in NDJSON each line is one row
        with every column, lists as arrays and empty values as null. This
        response is intentionally not wrapped in the usual API envelope.
      parameters:
        - name: lookup-id
          in: path
          required: true
          schema: { type: string }
          description: >
            A lookup id from `GET /v1/lookups`, such as
            `areas-ward-2024-12-uk-bgc`.
        - name: format
          in: query
          required: false
          schema:
            enum: [csv, ndjson]
            default: csv
          description: >
            The representation to download. Both are rendered from the same
            artifact and hashed in the lookup manifest.
      responses:
        "200":
          description: The whole lookup table.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: Suggested filename, the lookup id with the format's extension.
          content:
            text/csv:
              schema: { type: string }
              x-example-request: "/v1/lookups/areas-combinedAuthority-2025-12-en-bgc?format=csv"
              example: |
