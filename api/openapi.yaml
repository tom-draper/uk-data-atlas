  /data/{measure-id}/aggregate:
    get:
      operationId: aggregateSourceExactMeasure
      tags: ["Trend"]
      summary: Aggregate an extensive or explicitly weighted measure
      x-likely-refusal:
        status: 422
        code: aggregation_not_supported
        when: "The measure is a rank, median or share that cannot be combined over areas. Only a measure declared additive is aggregated."
        x-example-request: "/v1/data/imd-rank/aggregate?period=2019&locationId=north-west"
      description: >
        Returns a derived sum for a measure declared extensive, or a weighted
        mean for a measure that publishes an available weight measure. Supply
        exactly one of `locationId`, `areaCode`, or `targetCode`.

        With `locationId`, the location's member codes are matched in the
        requested source partition. A location lists every code it has been
        made of, so a code of another vintage, whose successor or predecessor
        the partition holds instead, is passed over, as is a legacy code
        naming no compiled area; both are listed in
        `aggregation.memberCodesNotInPartition`. Any other missing member is
        refused with `code: partial_coverage` rather than silently returning a
        partial total, and a location none of whose codes is in the partition
        is refused with its reason. Named locations are editorial code
        groupings, not claims of official administrative geography.

        With `areaCode`, which currently accepts a country code such as
        `E92000001`, membership follows the first character of the GSS area
        code, which the coding scheme assigns by country. That is definitional
        rather than geometric, so it needs no boundary comparison and cannot
        drift between releases. The sum covers every area of that country the
        partition publishes, which is not a claim of national completeness: a
        partition holding no areas for the country is rejected rather than
        summed to zero. `aggregation.coverage` compares the areas summed with
        the country's areas in each boundary release the partition is assessed
        to match. It is `complete` when every such release is covered,
        `partial` with `code: partial_coverage` and the missing counts when any
        release holds areas the partition has no value for, as a local
        election does for wards that did not go to the polls, and
        `not-assessed` when no matching release is compiled.

        With `targetCode`, callers must also name a code-set-compatible
        `sourceRelease` and a published `crosswalk`; the target's geography is
        the crosswalk's, so a combined authority, county, integrated care
        board or any other published membership target is summed the same way
        a region is. The crosswalk must declare membership: a clean-containment
        or full area-overlap crosswalk is membership by construction, an
        official lookup only where it declares `relationshipPurpose:
        membership`, and an identity lookup never, because it relates two
        vintages of one area rather than the parts of a larger one. It must
        then show complete one-to-one source-area membership for the target;
        split or partial overlap is rejected rather than used as an implicit
        conversion, and a target the crosswalk never mentions is `404` rather
        than a sum of nothing. `aggregation.membership` names which of those
        claims the total rests on, and `aggregation.coverage` is `partial` when
        the partition has no value for some of the areas the crosswalk places
        in the target.

        `regionCode` is the original spelling of `targetCode`, from when a
        region was the only membership target. It still selects the same way,
        and is answered with `region` beside `target` in the response; it
        refuses a crosswalk that maps to any other geography.


        A published relationship path may be named with `path` in place of
        `crosswalk`, to reach a target no single crosswalk maps to, such as
        wards summed into a region through their local authorities. Every step
        must run forward and declare membership, as a crosswalk must, or be a
        same-code continuity step, which carries an area onto itself in a later
        release; an identity lookup or a reversed step is refused. A source
        area is a member only if every step carries it wholly into one area and
        the last of those is the target, and any source that reaches the target
        another way refuses the whole sum. `aggregation.membership` is then
        `composed-membership-path`, and `aggregation.path` lists each step's
        crosswalk and membership claim.

        This route does not select a boundary release or perform a code or
        geometry conversion.
      parameters:
        - $ref: "#/components/parameters/MeasureId"
        - $ref: "#/components/parameters/SourcePeriod"
        - $ref: "#/components/parameters/SourceGeography"
        - $ref: "#/components/parameters/SourceBoundaryYear"
        - name: locationId
          in: query
          required: false
          schema:
            type: string
          description: >
            An id returned by `GET /locations`. Supply exactly one target
            selector.
        - name: areaCode
          in: query
          required: false
          schema:
            type: string
          description: >
            A country code, such as `E92000001`. Supply exactly one target
            selector.
        - name: targetCode
          in: query
          required: false
          schema:
            type: string
          description: >
            The code of the area to sum onto, in the geography the named
            crosswalk maps to, such as `E47000006` for the Tees Valley combined
            authority. Requires `crosswalk` and `sourceRelease`; supply exactly
            one target selector.
        - name: regionCode
          in: query
          required: false
          schema:
            type: string
          description: >
            An official English region code. The original spelling of
            `targetCode`, kept for callers that use it; it refuses a crosswalk
            that maps to any geography but `region`. Requires `crosswalk` and
            `sourceRelease`; supply exactly one target selector.
        - name: sourceRelease
          in: query
          required: false
          schema:
            type: string
          description: >
            The source boundary release the membership crosswalk maps from. It
            must be code-set compatible with the requested measure source.
        - name: crosswalk
          in: query
          required: false
          schema:
            type: string
          description: >
            A membership crosswalk returned by `GET /crosswalks`. Name either
            this or `path` with `targetCode`.
        - name: path
          in: query
          required: false
          schema:
            type: string
          description: >
            A relationship path id from `GET /relationship-paths` whose every
            step establishes membership, in place of `crosswalk`.
      responses:
        "200":
          description: A derived sum with its direct-code membership evidence and source provenance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              x-example-request: "/v1/data/population-estimate/aggregate?period=2022&geography=localAuthority&boundaryYear=2023&areaCode=W92000004"
              example:
                apiVersion: v1
                atlasRelease: sha256:5c4aa4529cbfbd5e4c844c55cddba1ef04a7bf76f3eaa085a357fff401af6d0c
                data:
                  measure:
                    id: population-estimate
                    label: Population estimate
                    valueKind: count
                    unit: people
                    aggregation:
                      kind: extensive
                      operation: sum
                      available: true
                    sources:
                      - datasetId: population
                        periods:
                          - "2022"
                        sourceGeography:
                          type: ward
                          boundaryYear: 2023
                        coverage:
                          kind: partial
                          countries:
                            - GB-ENG
                          recordCount: 7608
                          note: Published source records are available for England and Wales only; this endpoint does not infer Scottish or Northern Irish values.
