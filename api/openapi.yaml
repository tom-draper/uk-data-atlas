  /areas/{geography}/{release}/{code}/neighbours:
    get:
      operationId: getAreaNeighbours
      summary: List the areas whose boundary meets this one's
      description: >
        Returns the areas next to this one within the same geography and
        release, each with the length of the border they share. This supports
        local comparison, map navigation and spatial modelling: "how does this
        ward compare with the ones around it" needs to know which those are.


        Neighbours are found from shared vertices, not from a distance
        threshold. Adjacent areas in one published release are drawn from the
        same vertices, so a common border is the same coordinates on both sides
        and matches exactly; the shared length is summed over those edges, each
        counted once, with ground length from the ellipsoid's radii of
        curvature. Nobody picks a tolerance, and nothing is approximate.


        `touches` decides whether areas meeting at a single point count.
        `edge`, the default, returns only areas sharing a border with length;
        `any` also returns those meeting at a corner, whose `sharedBorderM` is
        zero. Four areas at a crossroads are not neighbours of each other in
        any sense useful for comparison or for colouring a map, so they are
        excluded unless asked for; `border.pointOnlyTouches` counts them either
        way, so their exclusion is visible rather than silent. They are real:
        none occur between local authorities, while about 3% of ward
        adjacencies are corners.


        `border` totals the perimeter, the border shared with the neighbours
        returned, and the remainder. For a landlocked area the remainder is
        nothing; otherwise it is coastline, a national boundary, or a border
        with an area outside this release. Birmingham shares 100% of its
        perimeter across seven neighbours; the Isle of Wight has none, and all
        188.7 km of its boundary is its own.


        Within one geography and release only. Two areas that genuinely touch
        on the ground but were drawn from different vertices are not found,
        which is why this is not offered across releases.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: The official source code for this area on this boundary release.
        - name: touches
          in: query
          required: false
          schema:
            type: string
            enum: [edge, any]
            default: edge
          description: >
            `edge` for areas sharing a border with length; `any` to include
            areas meeting only at a point.
      responses:
        "200":
          description: The neighbouring areas, ordered by shared border, longest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaNeighboursEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:24a500c55416bd7d58c28b1fc8cc4931d4a2fd831addafa3116556a91f2c4857"
                data:
                  id: localAuthority/2023-05-uk-bgc-v2/E08000025
                  geography: localAuthority
                  boundaryRelease: 2023-05-uk-bgc-v2
                  code: E08000025
                  name: Birmingham
                  touches: edge
                  border:
                    perimeterM: 104147.22
                    sharedBorderM: 104147.22
                    unsharedBorderM: 0
                    pointOnlyTouches: 0
                  neighbours:
                    - id: localAuthority/2023-05-uk-bgc-v2/E08000029
                      code: E08000029
                      name: Solihull
                      touch: edge
                      sharedBorderM: 26694.1
                      shareOfPerimeter: 0.2563
                      sharedEdges: 153
                      sharedVertices: 154
                meta:
                  nextCursor: null
        "400":
          description: "`touches` is neither `edge` nor `any`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: >
            Either no compiled area matches that identity, or the area exists
            but no feature for its code was found in the raw geometry source.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/GeometryUnavailable"

  /areas/{geography}/{release}/{code}/overlap:
    get:
      operationId: getAreaOverlap
      summary: Measure how one area overlaps another
      description: >
        Intersects this area with the area named in `with`, which may be of
        another geography or boundary release, and returns the shared area,
        each area's share of it, and a relation, so a constituency and a local
        authority can be compared without downloading either geometry.

        The relation follows the rules the published area-overlap crosswalks
        are compiled with, stated in `method`. The intersection is judged by
        its widest piece: narrower than `sliverWidthM` it is where two
        independently generalised borders disagree, and the relation is
        `boundary-only`; within a factor of two of that width it is
        `indeterminate`, because a crosswalk compile would refuse to decide.
        Otherwise an area covered to `minimumCoverage` is `within` the other,
        the other `contains` it, both covered is `same-extent`, and anything
        else `overlaps`. Areas that do not meet are `disjoint`.

        This measures the generalised boundaries as published and is not an
        official statement of how the areas relate. `publishedRelationships`
        lists any published crosswalk relationship between the two, with its
        method and quality.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - name: code
          in: path
          required: true
          schema: { type: string }
        - name: with
          in: query
          required: true
          schema: { type: string }
          description: >
            The other area as `{geography}/{release}/{code}`, such as
            `localAuthority/2024-05-uk-bgc/E07000092`.
      responses:
        "200":
          description: Both areas, the overlap, its relation and the method.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /areas/{geography}/{release}/{code}/geometry:
    get:
      operationId: getAreaGeometry
      summary: Get one compiled area's raw geometry as a GeoJSON Feature
      description: >
        Serves the area's own geometry from its raw, cached source GeoJSON,
        not a generalised or simplified derivative, always in WGS84. A source
        in British National Grid (EPSG:27700) is reprojected per area through
        EPSG:1314, OSGB36 to WGS 84 (6), a Helmert transformation EPSG states
        as accurate to 2 m in Great Britain; `properties.geometrySource`
        records the source CRS and any transformation applied. Northern
        Ireland areas in the releases that declare `northern-ireland-offset`
        are first moved by that correction, which the ONS's grid files need
        there, and `geometrySource.corrections` names it when applied. A code that
        maps to more than one feature fragment in the source (e.g. an area
        split across islands) is returned as a single GeometryCollection
        rather than picking one fragment.


        `tier` generalises the geometry before it is served, for callers that
        do not need every vertex: Highland is 45,124 of them. A tier is the
        side of the smallest square of detail kept, and the rule is
        Visvalingam-Whyatt, dropping the vertex whose triangle with its
        neighbours is smallest until none below the tier's threshold remains.
        Triangles are measured in the EPSG:6933 equal-area projection, so a
        tier means the same thing anywhere in the country. A part or hole
        smaller than the threshold is dropped whole rather than left as a
        triangle, and `properties.generalisation` reports the vertex and part
        counts both before and after.


        A tier bounds the size of feature dropped; it does not promise that no
        vertex moves further than its tolerance, since the same deviation
        spans a larger triangle the further apart its neighbours lie. Each area
        is generalised on its own, so above `full` two neighbours drawn
        together may disagree along the border they share. Ask for `full` where
        borders must meet exactly. This is still per-request simplification,
        not the vector tiles the full proposal describes.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: The official source code for this area on this boundary release.
        - name: tier
          in: query
          required: false
          schema:
            type: string
            enum: [full, high, medium, low]
            default: full
          description: >
            The generalisation tier, as the side in metres of the smallest
            square of detail kept: `full` (every vertex), `high` (10 m),
            `medium` (100 m), `low` (1000 m).
      responses:
        "200":
          description: The matching area as a GeoJSON Feature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaGeometryEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:24a500c55416bd7d58c28b1fc8cc4931d4a2fd831addafa3116556a91f2c4857"
                data:
                  type: Feature
                  id: constituency/2024-07-uk-bgc/E14001262
                  properties:
                    id: constituency/2024-07-uk-bgc/E14001262
                    geography: constituency
                    boundaryRelease: 2024-07-uk-bgc
                    code: E14001262
                    name: Halifax
                    generalisation:
                      tier: full
                      toleranceM: 0
                      minEffectiveAreaM2: 0
                      vertices: 1204
                      verticesAtFullResolution: 1204
                      parts: 1
                      partsAtFullResolution: 1
                    geometrySource: { sourceCrs: "EPSG:4326" }
                  geometry:
                    type: Polygon
                    coordinates: [[[-1.9269, 53.7874], [-1.9146, 53.7815]]]
                meta:
                  nextCursor: null
        "400":
          description: The `tier` requested is not one of the named tiers.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: >
            Either no compiled area matches that identity, the area exists but
            no feature for its code was found in the raw geometry source, or
            every part of it is smaller than the requested tier keeps.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/GeometryUnavailable"

  /areas/{geography}/{release}/{code}/geometry/metadata:
    get:
      operationId: getAreaGeometryMetadata
      summary: Measure one area's geometry without transferring its coordinates
      description: >
        Returns the bounding box, centroid, label point, area and perimeter of
        an area's geometry, so a caller can size, place or label an area
        without downloading its rings. The same source, reprojection and
        declared grid corrections apply as for the geometry itself, and
        `geometrySource` records them.


        Area is ellipsoidal, taken through EPSG:6933 (WGS 84 / NSIDC EASE-Grid
        2.0 Global), a Lambert cylindrical equal-area projection on the WGS 84
        ellipsoid, so projected area is area on the ellipsoid and no correction
        is applied; holes are subtracted. Perimeter sums every ring, holes
        included, each edge's ground length coming from the ellipsoid's radii
        of curvature at its mid-latitude. The centroid is the centre of area in
        that same projection, inverted back to WGS 84.


        `labelPoint` is guaranteed to lie inside the geometry: the centroid
        where that falls within the area, otherwise the midpoint of the widest
        run of interior found on latitudes sampled across the bounding box.
        `labelPointMethod` says which was used, so a caller can tell a centre of
        mass from a point merely known to be inside.


        These figures describe the boundary as that release publishes it, at its
        own generalisation. They are not a published land-area statistic: a
        coastline-clipped boundary still encloses inland water, so they differ
        from the ONS Standard Area Measurement that `population-density` uses as
        its denominator. The `method` block repeats this with every response.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: The official source code for this area on this boundary release.
      responses:
        "200":
          description: The area's measurements, with the method that produced them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaGeometryMetadataEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:24a500c55416bd7d58c28b1fc8cc4931d4a2fd831addafa3116556a91f2c4857"
                data:
                  id: localAuthority/2023-05-uk-bgc-v2/E06000046
                  geography: localAuthority
                  boundaryRelease: 2023-05-uk-bgc-v2
                  code: E06000046
                  name: Isle of Wight
                  boundingBox: [-1.5874, 50.5753, -1.0703, 50.7671]
                  centroid: [-1.2977, 50.6746]
                  labelPoint: [-1.2977, 50.6746]
                  labelPointMethod: centroid
                  area:
                    m2: 379890000
                    hectares: 37989
                    km2: 379.89
                  perimeter:
                    m: 188700
                    km: 188.7
                  geometryExtent:
                    parts: 2
                    rings: 2
                    vertices: 1589
                  geometrySource: { sourceCrs: "EPSG:4326" }
                meta:
                  nextCursor: null
        "404":
          description: >
            Either no compiled area matches that identity, or the area exists
            but no feature for its code was found in the raw geometry source.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: >
            The area's geometry carries no polygon to measure, such as a
            release held only as points. It can still be served by the geometry
            endpoint; it is reported rather than measured as zero.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/GeometryUnavailable"

