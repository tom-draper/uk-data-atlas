                combinedAuthority,2025-12-en-bgc,E47000002,South Yorkshire,
            application/x-ndjson:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

