openapi: 3.1.0
info:
  title: UK Data Atlas API
  version: "0.1.0"
  description: |
    This describes exactly the read-only routes the server implements and
    `pnpm start` serves. It is not the full public API proposed in
    `README.md`. Every data route is source-exact by default: it serves the
    published source code vintages and never chooses a geometry release on a
    caller's behalf. A caller may explicitly select a code-compatible release
    for a map join. Values are combined over areas only through
    `/data/{measure-id}/aggregate`, and regrouped onto other areas only through
    `/data/{measure-id}/convert` with a crosswalk the caller names, and each
    refuses a measure whose declared semantics do not allow it.

    Every successful response is wrapped in the envelope described by
    `Envelope`. Its `atlasRelease` field is the immutable `releaseId` from
    `GET /atlas-release`, so clients can identify the exact set of artifacts
    that produced a response.

    A data response carries four identities, and they are deliberately
    separate. The **source geography** and its **boundary year** are the
    publisher's own: `geography` and `boundaryYear` select one source
    partition. The **observation period** is the time the values describe:
    `period`. The **geometry release** is the caller's choice of boundaries to
    draw them on: the optional `release` on `/data/{measure-id}`, accepted only
    where every source code appears in it, which joins geometry by matching
    code and changes no value. A route that cannot join geometry refuses
    `release` rather than ignoring it. The **Atlas release** is the immutable
    build that produced the response: `atlasRelease` in every envelope.
    Converting values between geographies is a different operation, asked for
    explicitly at `/data/{measure-id}/convert` with a named crosswalk.

    Representations and paging work the same way everywhere. A JSON response
    is the `Envelope`, and its `meta.nextCursor` carries the next page, or
    `null` on the last. A cursor is opaque, belongs to the query that issued
    it, and any other value is refused with `invalid_cursor`; `limit` is 1 to
    500 unless an operation says otherwise. `format` chooses among a route's
    representations where it has more than one: `json`, `csv` or `ndjson` for
    observations, `csv` or `ndjson` for a lookup, served as
    `text/csv; charset=utf-8` and `application/x-ndjson; charset=utf-8`. A
    tabular page has nowhere to put a cursor, so a page that is not the last
    carries its successor in an RFC 8288 `Link` header with `rel="next"`.
    `Accept` is not negotiated. Every representation named here is served in
    the contract tests rather than only described.

    An error is always `application/problem+json`, whatever `format` the
    request asked for: a problem is not a representation of the resource that
    failed to serve. Every refusal a client should branch on carries a stable
    `code`, listed under `Problem`.

    Caching and conditional requests apply to every route. A `200` response
    carries a strong `ETag`, the SHA-256 of the exact bytes served, and
    `Cache-Control: public, max-age=300, must-revalidate`. A `GET` or `HEAD`
    whose `If-None-Match` matches that tag receives `304 Not Modified` with no
    body. `HEAD` is answered as `GET` without the body. Errors carry
    `Cache-Control: no-store` and no `ETag`. No `Last-Modified` is sent: a
    release records no build time, so the `ETag` is the only validator. A
    response can change only when the server loads a different Atlas release,
    and its `ETag` then changes with it.

    Versioning is by path and by release. Within `/v1` the contract only
    grows: an operation, parameter, status or response property is never
    removed, a parameter never becomes required and never accepts less. An
    operation to be withdrawn is first marked `deprecated` with
    `x-deprecated-since` and `x-sunset` dates, and every response it serves
    carries RFC 9745 `Deprecation` and RFC 8594 `Sunset` headers until then.
    `contract/v1-surface.json` locks this document's surface, and a test
    refuses any change that breaks it. What the data says is pinned
    separately: every response carries an `Atlas-Release` header naming the
    release that produced it, and a path under
    `/atlas-releases/{release-id}/` answers exactly as the unpinned path does,
    marked `immutable`, for as long as that release is served. A release no
    longer served is refused with `410` rather than answered from another.

    Any operation may also answer with a problem that is not in its own list,
    because it comes from the server rather than the route. `429` means the
    client has spent its requests: each client has a bucket, described by
    the IETF draft `RateLimit-Policy` and `RateLimit` headers on every
    response, and a refusal carries `Retry-After` in seconds. `414` means the
    request target is longer than the server accepts. `500` means the route
    failed unexpectedly, and carries a `requestId`. Every response carries
    `X-Request-Id`, echoing a well-formed one the client sent, so a failure
    can be found in the server's logs. None of these is cached.
  license:
    name: Proposal; no licence has been assigned yet
tags:
  - name: "Start here"
    description: "The first calls to make: what the API serves, which places a name could mean, a measure's answer for a named place, and what the Atlas can serve for one area."
  - name: "Map"
    description: "Draw a correct map: source-exact observations with an explicitly chosen boundary release, the geometry to join them to, and the areas at a point, in a box, beside or overlapping one another."
  - name: "Trend"
    description: "Analyse a measure within one source partition: an area's series, change between periods, rankings, comparisons, and aggregation or conversion only where they are declared valid."
  - name: "Sync"
    description: "Keep a copy in step: whole observation exports, bulk lookup tables, and the immutable Atlas releases that pin them, with comparisons between releases."
  - name: "Geography"
    description: "Resolve and relate areas: boundary releases, area identities and their history, parents and children, crosswalks, code translation and curated named locations."
  - name: "Data catalogue"
    description: "What data exists: source datasets with their input hashes, and measures with their semantics, code compatibility, coverage and quality."
  - name: "Governance"
    description: "Why a result can be trusted: release validation and waived exceptions, relationship candidates awaiting review, attribution and citation."
servers:
  - url: http://127.0.0.1:3001/v1
    description: Local development server (pnpm start)
paths:
  /:
    get:
      operationId: getRoot
      tags: ["Start here"]
      summary: API discovery
      description: Lists the currently implemented resource paths.
      responses:
        "200":
          description: Discovery document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootEnvelope"
              x-example-request: "/v1"
              example:
                apiVersion: v1
                atlasRelease: "sha256:9edc254c5d4cd0a90fc5d3b2544e5f64946d6d0e6a8b68860e3aa6f0ac8d0912"
                data:
                  name: UK Data Atlas API
                  links:
                    - /v1/openapi.yaml
                    - /v1/geographies
                    - /v1/map-resources
                    - /v1/map-resources/{geography}/{release}
                    - /v1/map-resources/{geography}/{release}.pmtiles
                    - /v1/map-resources/{geography}/{release}/tiles.json
                    - /v1/map-resources/{geography}/{release}/tiles/{z}/{x}/{y}.mvt
                    - /v1/map-resources/{geography}/{release}/features
                    - /v1/map-resources/{geography}/{release}/join/{measure-id}
                    - /v1/atlas-releases/{release-id}/map-resources/{geography}/{release}
                    - /v1/boundary-releases
                    - /v1/boundary-releases:resolve
                    - /v1/boundary-releases/{geography}/{release}
                    - /v1/geography-inventory
                    - /v1/datasets
                    - /v1/datasets/{dataset-id}
                    - /v1/measures
                    - /v1/measures/{measure-id}
                    - /v1/measures/{measure-id}/compatibility
                    - /v1/measures/{measure-id}/coverage
                    - /v1/measures/{measure-id}/quality
                    - /v1/data/{measure-id}
                    - /v1/data/{measure-id}/series
                    - /v1/data/{measure-id}/rankings
                    - /v1/data/{measure-id}/compare
                    - /v1/data/{measure-id}/aggregate
                    - /v1/areas
                    - /v1/areas/{geography}/{release}/{code}
                    - /v1/areas/{geography}/{release}/{code}/relationships
                    - /v1/areas/{geography}/{release}/{code}/capabilities
                    - /v1/areas/{geography}/{release}/{code}/citation
                    - /v1/areas/{geography}/{release}/{code}/geometry
                    - /v1/crosswalks
                    - /v1/crosswalks/{crosswalk-id}
                    - /v1/crosswalks/{crosswalk-id}/records
                    - /v1/relationship-candidates
                    - /v1/validation
                    - /v1/validation/boundary-releases/{geography}/{release}
                    - /v1/validation/crosswalks/{crosswalk-id}
                    - /v1/exports
                    - /v1/exports/{export-id}
                    - /v1/atlas-release
                    - /v1/atlas-releases
                    - /v1/atlas-releases/{release-id}
                    - /v1/atlas-releases/compare
                meta:
                  nextCursor: null

  /openapi.yaml:
    get:
      operationId: getOpenapiDescription
      tags: ["Start here"]
      summary: The OpenAPI description of this API
      description: >
        Returns this document, so a client can read the binding contract from
        the running API rather than the repository. The response is the YAML
        document itself; `Accept` is not negotiated on any route, and a
        route's representations are chosen with `format` where it offers
        more than one.
      responses:
        "200":
          description: The OpenAPI 3.1 description.
          content:
            application/yaml:
              schema:
                type: string
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /atlas-releases/{release-id}/map-resources/{geography}/{release}:
    get:
      operationId: getPinnedMapResource
      tags: ["Sync"]
      summary: A map resource pinned to the Atlas release that produced it
      description: >
        The same descriptor as the unpinned path, answered with
        `Cache-Control: public, max-age=31536000, immutable`: the bytes are a
        function of that release alone, so there is nothing to revalidate.
        This is the form a production map should cite, and every link in the
        answer stays pinned, so a renderer configured from the pinned TileJSON
        fetches pinned tiles too.


        Any path below the release id is served this way, including
        `tiles.json`, `tiles/{z}/{x}/{y}.mvt`, the `.pmtiles` archive, the
        GeoParquet `features` and a join table. Only the release the server currently holds can be
        answered: the archive keeps release manifests, not the data files
        behind them, so a release that is recorded but no longer served is
        refused with `410` rather than quietly answered from the current one.
        A copy a client already holds stays correct, which is what pinning
        bought it.
      parameters:
        - name: release-id
          in: path
          required: true
          schema: { type: string }
          description: >
            The Atlas release to pin to, the `sha256:` hash from
            `GET /v1/atlas-release`.
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
      responses:
        "200":
          description: The map resource descriptor, pinned and immutable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapResourceEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: >
            The release is recorded but its artifacts are no longer served.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /map-resources:
    get:
      operationId: listMapResources
      tags: ["Geography"]
      summary: List the boundary releases published as map resources
      description: >
        A map resource is one boundary release prepared for drawing: tiles
        whose borders are compiled once and shared, so neighbours cannot be
        drawn two different ways. Releases are published deliberately rather
        than every release being tiled, so this list is short.
      responses:
        "200":
          description: One entry per published map resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapResourceListEnvelope"
              x-example-request: "/v1/map-resources"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /map-resources/{geography}/{release}:
    get:
      operationId: getMapResource
      tags: ["Geography"]
      summary: Describe one map resource, its tiles and what they were made from
      description: >
        The only document a client needs to read to draw this release. It
        carries the tile and archive URLs, the zoom ladder and the tier behind
        each zoom, the content hash of the archive, the publisher file the
        shapes were compiled from, and the attribution to display beside the
        map.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
      responses:
        "200":
          description: The map resource descriptor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapResourceEnvelope"
              x-example-request: "/v1/map-resources/localAuthority/2023-05-uk-bgc-v2"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /map-resources/{geography}/{release}/tiles.json:
    get:
      operationId: getMapResourceTileJson
      tags: ["Geography"]
      summary: The TileJSON a renderer is configured with
      description: >
        TileJSON 3.0 for this resource, including the attribution a map must
        display. A tile cannot carry a licence, so a client handed only a tile
        URL would have nothing to show; this is the document that supplies it.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
      responses:
        "200":
          description: TileJSON 3.0 describing the tile endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TileJsonEnvelope"
              x-example-request: "/v1/map-resources/localAuthority/2023-05-uk-bgc-v2/tiles.json"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /map-resources/{geography}/{release}/features:
    get:
      operationId: getMapResourceFeatures
      tags: ["Geography"]
      summary: Every area of one tier as a GeoParquet file
      description: >
        The flat form of the resource, for a warehouse or a GIS that holds
        features rather than tiles: GeoParquet 1.1 with one row per area,
        carrying the same `id`, `code` and `name` as the tiles, its shape as
        WKB in OGC:CRS84, and a `bbox` covering column a reader can filter
        on. Each tier is compiled from the same shared-arc generalisation the
        tiles are drawn from, so neighbours share their borders exactly, and
        the ids are the ones a join table publishes, so values join by `id`
        or `code` without reading a tile. Every tier is published, `full`
        included, and its size and SHA-256 are listed under `features` in the
        descriptor. A coarse tier keeps every border shared but is not
        guaranteed to be a valid polygon everywhere, as the descriptor's
        `generalisation` says. The file's `uk-data-atlas` metadata names the
        resource, tier, attribution and publisher file hash, so a copy loaded
        on its own is still citable. GeoJSON is not offered.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - name: tier
          in: query
          required: true
          schema:
            type: string
            enum: [full, high, medium, low]
          description: >
            The detail to download. `full` is the release's own geometry; each
            coarser tier drops detail smaller than 10, 100 or 1,000 metres.
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [geoparquet]
            default: geoparquet
          description: The representation. GeoParquet is the only one served.
      responses:
        "200":
          description: The GeoParquet file.
          content:
            application/vnd.apache.parquet:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /map-resources/{geography}/{release}/tiles/{z}/{x}/{y}.mvt:
    get:
      operationId: getMapResourceTile
      tags: ["Geography"]
      summary: One vector tile of a boundary release
      description: >
        A Mapbox Vector Tile carrying the `boundaries` layer, gzipped as the
        archive stores it. Each feature has the area's `code`, its `name` and
        a stable integer id a renderer can hold state against. Values are not
        in the tile: one tileset serves every measure, and a value is joined
        in the renderer. A tile inside the published zooms that covers no area
        is answered `204`, which is an ordinary answer rather than a failure;
        a zoom the resource does not publish is `404`, and a renderer should
        over-zoom past the last one instead.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - name: z
          in: path
          required: true
          description: Zoom level, within the range the descriptor publishes.
          schema:
            type: integer
            minimum: 0
        - name: x
          in: path
          required: true
          description: Tile column at this zoom.
          schema:
            type: integer
            minimum: 0
        - name: y
          in: path
          required: true
          description: Tile row at this zoom, counted from the north.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The tile, gzipped.
          content:
            application/vnd.mapbox-vector-tile:
              schema:
                type: string
                format: binary
        "204":
          description: No area falls in this tile.
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /map-resources/{geography}/{release}/join/{measure-id}:
    get:
      operationId: getMapResourceJoin
      tags: ["Geography"]
      summary: One measure's values, numbered to match this resource's tiles
      description: >
        The values a renderer joins to the tiles, as `id`, `code` and `value`.
        The `id` is the same integer the tile carries, so a renderer sets
        feature state by it without reading the geometry. Values are joined to
        this release by matching area code and are never converted: a measure
        whose source codes are not all in this release is refused with
        `incompatible_geometry`, and the refusal names the releases that would
        carry it. Keeping values out of the tiles is what lets one tileset
        serve every measure, and lets a corrected value invalidate a small
        table rather than a whole pyramid.


        With `format=parquet` the same table is served as a Parquet file with
        `id`, `code`, `value` and `status` columns, for a warehouse to join to
        the GeoParquet `features`. Everything the JSON envelope says about the
        table, from the Atlas release to the join rule and provenance, travels
        in the file's `uk-data-atlas` metadata.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - $ref: "#/components/parameters/MeasureId"
        - name: period
          in: query
          required: true
          description: The observation period the values describe.
          schema:
            type: string
        - name: geography
          in: query
          description: >
            The measure's source geography, where it publishes more than one
            partition. Without it an ambiguous request is refused with the
            partitions listed rather than one being chosen by catalogue order.
          schema:
            type: string
        - name: boundaryYear
          in: query
          description: The measure's source boundary year, alongside `geography`.
          schema:
            type: integer
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, parquet]
            default: json
          description: >
            `json` for the envelope a renderer reads, `parquet` for the same
            rows as a Parquet file.
      responses:
        "200":
          description: The values, numbered as the tiles number their features.
          content:
            application/vnd.apache.parquet:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: "#/components/schemas/MapResourceJoinEnvelope"
              x-example-request: "/v1/map-resources/localAuthority/2023-05-uk-bgc-v2/join/population-estimate?period=2022&geography=localAuthority&boundaryYear=2023"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            The measure's source codes are not all in this release, so its
            values cannot be drawn on it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/IncompatibleGeometryProblem"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /map-resources/{geography}/{release}.pmtiles:
    get:
      operationId: getMapResourceArchive
      tags: ["Geography"]
      summary: The whole tile pyramid as one PMTiles archive
      description: >
        Every tile of the resource in a single PMTiles v3 file, for an offline
        map, a CDN or a warehouse. Its SHA-256 is the `contentHash` the
        descriptor publishes, so a drawing made from it can be tied to the
        Atlas release that produced it.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
      responses:
        "200":
          description: The PMTiles archive.
          content:
            application/vnd.pmtiles:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /geographies:
    get:
      operationId: listGeographies
      tags: ["Geography"]
      summary: List geography types with their latest boundary release
      responses:
        "200":
          description: One entry per geography type present in the boundary registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeographySummaryListEnvelope"
              x-example-request: "/v1/geographies"
              example:
                apiVersion: v1
                atlasRelease: "sha256:9edc254c5d4cd0a90fc5d3b2544e5f64946d6d0e6a8b68860e3aa6f0ac8d0912"
                data:
                  - id: constituency
                    latestRelease: 2024-07-uk-bgc
                    releaseCount: 1
                meta:
                  nextCursor: null

  /boundary-releases:
    get:
      operationId: listBoundaryReleases
      tags: ["Geography"]
      summary: List every compiled boundary release
      responses:
        "200":
          description: The full boundary registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoundaryReleaseListEnvelope"
              x-example-request: "/v1/boundary-releases"
              example:
                apiVersion: v1
                atlasRelease: sha256:5c4aa4529cbfbd5e4c844c55cddba1ef04a7bf76f3eaa085a357fff401af6d0c
                data:
                  - id: 2025-12-en-bgc
                    geography: combinedAuthority
                    title: Combined authorities, December 2025 (England, generalised, clipped)
                    description: English combined authorities and combined county authorities. ONS reports some local area statistics against these, including the life expectancy series held here.
                    temporalCoverage: "2025"
                    coverage:
                      countries:
                        - GB-ENG
                    source:
                      publisher: Office for National Statistics
                      url: https://geoportal.statistics.gov.uk/
                      retrievedAt: 2026-09-06
                      licence:
                        name: Open Government Licence v3.0
                        url: http://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
                    metadataHash: sha256:6674a5e354661262ca18eebe9667e39774396aa2794caf8e954bd2a2e6b05e50
                meta:
                  nextCursor: null

  /boundary-releases:resolve:
    get:
      operationId: resolveBoundaryReleaseForDate
      tags: ["Geography"]
      summary: Select the boundary release to use for a date
      description: >
        Returns the latest release of a geography dated on or before `date`
        that covers `country` when one is given, as an exact release id rather
        than a moving `latest` alias. Releases are snapshots dated to a month,
        so a day narrows nothing, and the answer is the latest snapshot at that
        date rather than a statement of which boundaries were legally in force.

        `previous` and `next` are the neighbouring releases covering the same
        country; a change after the selected release shows first in `next`.
        `sameMonth` is true when the date falls in the release's own month, so
        a change that month may lie either side of it. `notCovering` lists
        later releases passed over because they miss the country.

        Releases of the same month are told apart only where one is plainly
        better: a subset derived from another is set aside for its source, and
        without `country` a release covering fewer countries is set aside.
        Each is listed in `setAside` with its reason. Variants differing in any
        other way, such as clipping, are a 409 listing each in `choices`.
      parameters:
        - name: geography
          in: query
          required: true
          schema: { type: string }
          description: The geography to resolve a release for, e.g. `ward`.
        - name: date
          in: query
          required: true
          schema: { type: string }
          description: A calendar date as `YYYY-MM-DD`, or a month as `YYYY-MM`.
        - name: country
          in: query
          required: false
          schema:
            type: string
            enum: [GB-ENG, GB-NIR, GB-SCT, GB-WLS]
          description: >
            Restricts the answer to releases covering this country, so a Great
            Britain release is passed over for Northern Ireland.
      responses:
        "200":
          description: The selected release, its neighbours and the basis of the choice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              x-example-request: "/v1/boundary-releases:resolve?geography=localAuthority&date=2023-06-30"
              example:
                apiVersion: v1
                atlasRelease: sha256:5c4aa4529cbfbd5e4c844c55cddba1ef04a7bf76f3eaa085a357fff401af6d0c
                data:
                  geography: localAuthority
                  date: 2023-06-30
                  month: 2023-06
                meta:
                  nextCursor: null
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          description: >
