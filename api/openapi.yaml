openapi: 3.1.0
info:
  title: UK Data Atlas API
  version: "0.1.0"
  description: |
    This describes exactly the read-only routes implemented in `src/routes.ts`
    and served by `pnpm start`. It is not the full public API proposed in
    `README.md`: it does not yet cover measures, data retrieval, named
    locations, or write-side aggregation. Those remain proposal, not
    contract, until they are implemented and added here.

    Every successful response is wrapped in the envelope described by
    `Envelope`. Its `atlasRelease` field is the immutable `releaseId` from
    `GET /atlas-release`, so clients can identify the exact set of artifacts
    that produced a response.
  license:
    name: Proposal; no licence has been assigned yet
servers:
  - url: http://127.0.0.1:3001/v1
    description: Local development server (pnpm start)
paths:
  /:
    get:
      operationId: getRoot
      summary: API discovery
      description: Lists the currently implemented resource paths.
      responses:
        "200":
          description: Discovery document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:9edc254c5d4cd0a90fc5d3b2544e5f64946d6d0e6a8b68860e3aa6f0ac8d0912"
                data:
                  name: UK Data Atlas API
                  links:
                    - /v1/geographies
                    - /v1/boundary-releases
                    - /v1/boundary-releases/{type}/{release}
                    - /v1/geography-inventory
                    - /v1/areas
                    - /v1/areas/{type}/{release}/{code}
                    - /v1/areas/{type}/{release}/{code}/relationships
                    - /v1/areas/{type}/{release}/{code}/geometry
                    - /v1/crosswalks
                    - /v1/crosswalks/{crosswalk-id}
                    - /v1/crosswalks/{crosswalk-id}/records
                    - /v1/relationship-candidates
                    - /v1/validation
                    - /v1/validation/boundary-releases/{type}/{release}
                    - /v1/validation/crosswalks/{crosswalk-id}
                    - /v1/atlas-release
                meta:
                  nextCursor: null

  /geographies:
    get:
      operationId: listGeographies
      summary: List geography types with their latest boundary release
      responses:
        "200":
          description: One entry per geography type present in the boundary registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeographySummaryListEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:9edc254c5d4cd0a90fc5d3b2544e5f64946d6d0e6a8b68860e3aa6f0ac8d0912"
                data:
                  - id: constituency
                    latestRelease: 2024-07-uk-bgc
                    releaseCount: 1
                meta:
                  nextCursor: null

  /boundary-releases:
    get:
      operationId: listBoundaryReleases
      summary: List every compiled boundary release
      responses:
        "200":
          description: The full boundary registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoundaryReleaseListEnvelope"

  /boundary-releases/{geography}/{release}:
    get:
      operationId: getBoundaryRelease
      summary: Get one boundary release's metadata
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
      responses:
        "200":
          description: The matching boundary release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoundaryReleaseEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:9edc254c5d4cd0a90fc5d3b2544e5f64946d6d0e6a8b68860e3aa6f0ac8d0912"
                data:
                  id: 2024-07-uk-bgc
                  geography: constituency
                  title: Westminster parliamentary constituencies, July 2024 (United Kingdom, generalised, clipped)
                  description: Westminster parliamentary constituencies as published for July 2024, covering the United Kingdom. Generalised to 20 m and clipped to the coastline.
                  temporalCoverage: "2024"
                  coverage:
                    countries: [GB-ENG, GB-NIR, GB-SCT, GB-WLS]
                  source:
                    publisher: Office for National Statistics
                    url: https://geoportal.statistics.gov.uk/
                    licence:
                      name: Open Government Licence v3.0
                      url: http://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
                  metadataHash: "sha256:cb36a990db1b57ae973ebe88874fae7f560a12721fa784cf5e52a9fd5e8466f3"
                meta:
                  nextCursor: null
        "404":
          $ref: "#/components/responses/NotFound"

  /geography-inventory:
    get:
      operationId: getGeographyInventory
      summary: Report area identity and relationship (crosswalk) coverage per boundary release
      description: >
        For every boundary release, states whether an area identity artifact
        has been compiled and which published crosswalks reference it, or an
        explicit reason why neither is available yet. This is the coverage
        report described in the README's domain model, not a promise that
        every release is fully supported.
      responses:
        "200":
          description: The current geography inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeographyInventoryEnvelope"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /areas:
    get:
      operationId: listAreas
      summary: List or search compiled area identities
      description: >
        Searches official codes, names and supplied aliases case-insensitively.
        Exact code matches take precedence over prefix matches, so a bare code
        can safely resolve to every matching geography/release identity. Name,
        alias and non-exact code queries use prefix matching.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Official code, name or alias prefix. Omit to list areas.
        - name: geography
          in: query
          required: false
          schema:
            type: string
          description: Restrict results to one geography type.
        - name: release
          in: query
          required: false
          schema:
            type: string
          description: Restrict results to one boundary release.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor from the previous response's nextCursor.
      responses:
        "200":
          description: A cursor-paginated page of matching area identities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaListEnvelope"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /areas/{geography}/{release}/{code}:
    get:
      operationId: getArea
      summary: Get one compiled area by its full identity
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: The official source code for this area on this boundary release.
      responses:
        "200":
          description: The matching compiled area.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:9edc254c5d4cd0a90fc5d3b2544e5f64946d6d0e6a8b68860e3aa6f0ac8d0912"
                data:
                  id: constituency/2024-07-uk-bgc/E14001262
                  geography: constituency
                  boundaryRelease: 2024-07-uk-bgc
                  code: E14001262
                  name: Halifax
                meta:
                  nextCursor: null
        "404":
          $ref: "#/components/responses/NotFound"

  /areas/{geography}/{release}/{code}/relationships:
    get:
      operationId: getAreaRelationships
      summary: Get published relationships for one compiled area
      description: >
        Returns only relationships from published crosswalks. A
        clean-containment mapping is represented as within from child to parent
        and contains in reverse. An official historical lookup is represented
        as successor from source to target and predecessor in reverse. An
        area-overlap mapping is represented as overlaps in both directions,
        with the shared area and its share of each side.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: The official source code for this area on this boundary release.
      responses:
        "200":
          description: The area identity and its published relationship edges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaRelationshipsEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /areas/{geography}/{release}/{code}/geometry:
    get:
      operationId: getAreaGeometry
      summary: Get one compiled area's raw geometry as a GeoJSON Feature
      description: >
        Serves the area's own geometry straight from its raw, cached WGS84
        source GeoJSON, not a generalised or simplified derivative. A code
        that maps to more than one feature fragment in the source (e.g. an
        area split across islands) is returned as a single GeometryCollection
        rather than picking one fragment. This is a raw geometry lookup, not
        yet the tiled or simplified delivery the full proposal describes.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: The official source code for this area on this boundary release.
      responses:
        "200":
          description: The matching area as a GeoJSON Feature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaGeometryEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:24a500c55416bd7d58c28b1fc8cc4931d4a2fd831addafa3116556a91f2c4857"
                data:
                  type: Feature
                  id: constituency/2024-07-uk-bgc/E14001262
                  properties:
                    id: constituency/2024-07-uk-bgc/E14001262
                    geography: constituency
                    boundaryRelease: 2024-07-uk-bgc
                    code: E14001262
                    name: Halifax
                  geometry:
                    type: Polygon
                    coordinates: [[[-1.9269, 53.7874], [-1.9146, 53.7815]]]
                meta:
                  nextCursor: null
        "404":
          description: >
            Either no compiled area matches that identity, or the area exists
            but no feature for its code was found in the raw geometry source.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/GeometryUnavailable"

  /crosswalks:
    get:
      operationId: listCrosswalks
      summary: List published crosswalks
      responses:
        "200":
          description: The current crosswalk inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrosswalkSummaryListEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:9edc254c5d4cd0a90fc5d3b2544e5f64946d6d0e6a8b68860e3aa6f0ac8d0912"
                data:
                  - id: constituency-2010-to-2024-official-lookup-v2
                    from: { geography: constituency, boundaryRelease: "2010" }
                    to: { geography: constituency, boundaryRelease: 2024-07-uk-bgc }
                    method: official-lookup
                    quality: publisher-supplied
                    weighting: { status: not-provided }
                    recordCount: 650
                    artifact: crosswalks/constituency-2010-to-2024-official-lookup-v2.json
                    contentHash: "sha256:ce61b3f59c495498e9a7cfd7fb4ff6d3d742cffa8b27150a58c27b6f099b038d"
                  - id: ward-to-local-authority-2025-05-uk-bgc-v2-clean-containment
                    from: { geography: ward, boundaryRelease: 2025-05-uk-bgc-v2 }
                    to: { geography: localAuthority, boundaryRelease: 2025-05-uk-bgc-v2 }
                    method: clean-containment
                    quality: publisher-supplied
                    weighting: { status: not-applicable }
                    recordCount: 8405
                    artifact: crosswalks/ward-to-local-authority-2025-05-uk-bgc-v2-clean-containment.json
                    contentHash: "sha256:4416aac5cac4b092189ed22665ad149bdd3b370a0dab1b75529993932f51fab3"
                  - id: constituency-2024-07-uk-bgc-to-local-authority-2024-05-uk-bgc-area-overlap
                    from: { geography: constituency, boundaryRelease: 2024-07-uk-bgc }
                    to: { geography: localAuthority, boundaryRelease: 2024-05-uk-bgc }
                    method: area-overlap
                    quality: derived
                    weighting: { status: provided, basis: area, normalisation: per-source }
                    recordCount: 650
                    artifact: crosswalks/constituency-2024-07-uk-bgc-to-local-authority-2024-05-uk-bgc-area-overlap.json
                    contentHash: "sha256:e989fe1713b8239eb60455db37c25a72915e16950591c46256b815b4fbc3aca7"
                meta:
                  nextCursor: null
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /crosswalks/{crosswalkId}:
    get:
      operationId: getCrosswalk
      summary: Get one crosswalk's metadata
      description: >
        Returns the crosswalk's method, quality, weighting, endpoints,
        provenance and validation facts, but not its full record set. Fetch
        `/crosswalks/{crosswalkId}/records` for the mappings themselves.
      parameters:
        - $ref: "#/components/parameters/CrosswalkId"
      responses:
        "200":
          description: The matching crosswalk's metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrosswalkMetadataEnvelope"
              examples:
                officialLookup:
                  value:
                    apiVersion: v1
                    atlasRelease: "sha256:9edc254c5d4cd0a90fc5d3b2544e5f64946d6d0e6a8b68860e3aa6f0ac8d0912"
                    data:
                      schemaVersion: 1
                      contentHash: "sha256:ce61b3f59c495498e9a7cfd7fb4ff6d3d742cffa8b27150a58c27b6f099b038d"
                      id: constituency-2010-to-2024-official-lookup-v2
                      method: official-lookup
                      quality: publisher-supplied
                      weighting: { status: not-provided }
                      from: { geography: constituency, boundaryRelease: "2010" }
                      to: { geography: constituency, boundaryRelease: 2024-07-uk-bgc }
                      provenance:
                        input: "boundaries/constituency/2024-07-uk-bgc/Westminster_PCON_(2010)_to_future_Westminster_PCON_(2024)_Lookup_in_the_UK_(V2).geojson"
                        inputHash: "sha256:62e1ac00a3a6cce21055d623e7141e814e7212014a37fab0b0a3d693cf0e82a3"
                      validation:
                        sourceNameConflicts:
                          - code: N06000004
                            names: [Belfast North, Belfast West]
                    meta:
                      nextCursor: null
                areaOverlap:
                  value:
                    apiVersion: v1
                    atlasRelease: "sha256:c51e3f4ef14b77972061b9c8f08a838975d700adba9d2372c5d1bbbe8edd27a2"
                    data:
                      schemaVersion: 1
                      id: constituency-2024-07-uk-bgc-to-local-authority-2024-05-uk-bgc-area-overlap
                      method: area-overlap
                      quality: derived
                      weighting: { status: provided, basis: area, normalisation: per-source }
                      from: { geography: constituency, boundaryRelease: 2024-07-uk-bgc }
                      to: { geography: localAuthority, boundaryRelease: 2024-05-uk-bgc }
                      provenance:
                        inputs:
                          - side: from
                            input: boundaries/constituency/2024-07-uk-bgc/Westminster_Parliamentary_Constituencies_July_2024_Boundaries_UK_BGC_-8097874740651686118.geojson
                            inputHash: "sha256:d3ac7aea554e63864a030baf6b5b2069cb8b1870e16a611ae21df6ad23b04383"
                          - side: to
                            input: boundaries/local-authority/2024-05-uk-bgc/Local_Authority_Districts_May_2024_Boundaries_UK_BGC_-6307115499537197728.geojson
                            inputHash: "sha256:a54c16257bac529d380d7f9e9a3449186fda563ee426e565153a08e60d4afa3a"
                        areaProjection: EPSG:6933
                        clipping: polygon-clipping@0.15.7
                      validation:
                        sourceNameConflicts: []
                        endpoints:
                          from: { status: verified, availableAreaCount: 650, referencedCodeCount: 650 }
                          to: { status: verified, availableAreaCount: 361, referencedCodeCount: 361 }
                        overlap:
                          candidatePairCount: 3600
                          intersectingPairCount: 2329
                          sliverPairCount: 1381
                          sliverWidthM: 100
                          widestSliverWidthM: 15.1
                          narrowestOverlapWidthM: 332.1
                          minimumCoverage: 0.99
                          minimumSourceCoverage: 0.99606
                          minimumTargetCoverage: 0.997111
                      contentHash: "sha256:e989fe1713b8239eb60455db37c25a72915e16950591c46256b815b4fbc3aca7"
                    meta:
                      nextCursor: null
        "404":
          $ref: "#/components/responses/NotFound"

  /crosswalks/{crosswalkId}/records:
    get:
      operationId: listCrosswalkRecords
      summary: List (optionally filtered) records for one crosswalk
      parameters:
        - $ref: "#/components/parameters/CrosswalkId"
        - name: source
          in: query
          required: false
          schema:
            type: string
          description: >
            Filter to the record whose source code matches exactly. Omit to
            return a cursor-paginated list. A source lookup returns at most
            one record and has no next cursor.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          description: Maximum records to return when source is omitted.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor from the previous response's nextCursor.
      responses:
        "200":
          description: >
            One page of matching records, or an empty array if `source`
            matched nothing. Bulk consumers should prefer downloading the
            static crosswalk artifact until an export endpoint exists.
            Records of an `area-overlap` crosswalk also carry each source's
            area and coverage and each target's weight, overlap area and
            shares.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrosswalkRecordListEnvelope"
              examples:
                officialLookup:
                  value:
                    apiVersion: v1
                    atlasRelease: "sha256:9edc254c5d4cd0a90fc5d3b2544e5f64946d6d0e6a8b68860e3aa6f0ac8d0912"
                    data:
                      - source: { code: N06000004, labels: [Belfast North, Belfast West] }
                        targets:
                          - { code: N05000002, labels: [Belfast North] }
                          - { code: N05000003, labels: [Belfast South and Mid Down] }
                          - { code: N05000004, labels: [Belfast West] }
                          - { code: N05000014, labels: [South Antrim] }
                    meta:
                      nextCursor: null
                areaOverlap:
                  value:
                    apiVersion: v1
                    atlasRelease: "sha256:c51e3f4ef14b77972061b9c8f08a838975d700adba9d2372c5d1bbbe8edd27a2"
                    data:
                      - source:
                          code: E14001067
                          labels: [Arundel and South Downs]
                          areaM2: 835415269
                          coverage: 0.999884
                        targets:
                          - code: E07000224
                            labels: [Arun]
                            weight: 0.122779
                            overlapAreaM2: 102559824
                            sourceShare: 0.122765
                            targetShare: 0.463915
                          - code: E07000225
                            labels: [Chichester]
                            weight: 0.614952
                            overlapAreaM2: 513680634
                            sourceShare: 0.614881
                            targetShare: 0.652975
                          - code: E07000227
                            labels: [Horsham]
                            weight: 0.262269
                            overlapAreaM2: 219077810
                            sourceShare: 0.262238
                            targetShare: 0.413031
                    meta:
                      nextCursor: null
        "404":
          $ref: "#/components/responses/NotFound"

  /relationship-candidates:
    get:
      operationId: listRelationshipCandidates
      summary: List discovered relationship candidates and their coverage gaps
      description: >
        Scans every compiled area release's raw source for extra code/name
        property pairs beyond the one already used for its own identity, and
        reports whether a matching compiled target release exists. A
        candidate already covered by a published crosswalk carries that
        crosswalk's id in `publishedCrosswalkId`. This is a discovery and gap
        report, not an instruction to auto-publish every `eligible` candidate
        as a crosswalk without review — see the `status` values below.
      responses:
        "200":
          description: The discovered relationship candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipCandidateListEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:24a500c55416bd7d58c28b1fc8cc4931d4a2fd831addafa3116556a91f2c4857"
                data:
                  - id: parish-2019-04-ew-bgc-to-local-authority-unavailable
                    input: boundaries/parish/2019-04-ew-bgc/Parishes_and_Non_Civil_Parished_Areas_April_2019_GCB_EW_2022_7767177223882237005.geojson
                    from:
                      geography: parish
                      boundaryRelease: 2019-04-ew-bgc
                      codeProperty: parncp19cd
                      nameProperty: parncp19nm
                    to:
                      geography: localAuthority
                      codeProperty: lad19cd
                      nameProperty: lad19nm
                    status: not-available
                    validation:
                      endpoints:
                        from: { status: verified, availableAreaCount: 11556, referencedCodeCount: 11556 }
                        to: { status: not-available, reason: "No compiled target release has lad19cd/lad19nm fields." }
                      relationship:
                        sourceFeatureCount: 11556
                        sourceCodeCount: 11556
                        targetCodeCount: 339
                        multiTargetSourceCount: 0
                        missingValueFeatureCount: 0
                      reasons:
                        - "No compiled target release has lad19cd/lad19nm fields."
                meta:
                  nextCursor: null
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /validation:
    get:
      operationId: getValidationReport
      summary: Report every release gate, including waived exceptions
      description: >
        The build checks each boundary release, each crosswalk and the links
        between the Atlas's own artifacts, recomputing what it can from the
        published artifacts rather than trusting each compiler's claims. A
        check either passes or is waived: the build fails on any exception
        without a recorded reason, and on any waiver that no longer matches
        an exception. Waived checks carry what was found and why it was
        accepted.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            enum: [passed, waived]
          description: Return only resources with this status.
      responses:
        "200":
          description: The validation report for the current Atlas release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReportEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:c51e3f4ef14b77972061b9c8f08a838975d700adba9d2372c5d1bbbe8edd27a2"
                data:
                  schemaVersion: 1
                  inputs:
                    boundaryRegistry: "sha256:9edc254c5d4cd0a90fc5d3b2544e5f64946d6d0e6a8b68860e3aa6f0ac8d0912"
                    crosswalkInventory: "sha256:07f782b1d99b89a7f0f0958a407ab006bc32adb1a3b6d1ac2a4ab59594b7812b"
                    waivers: "sha256:22f9a3221fcbc126afc2ebc2ad8dce12f02c4c82a536aadf6bb3ed73ded348de"
                  summary:
                    resourceCount: 77
                    checkCount: 316
                    passedCount: 287
                    waivedCount: 29
                    coverage:
                      boundaryReleases: 67
                      areaIdentities: 67
                      servableGeometry: 40
                      withRelationships: 14
                      crosswalks: 9
                      weightedCrosswalks: 1
                  resources:
                    - id: atlas
                      kind: atlas
                      status: passed
                      checks:
                        - id: registry-links
                          status: passed
                        - id: release-coverage
                          status: passed
                          measured: { boundaryReleaseCount: 67 }
                meta:
                  nextCursor: null
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /validation/boundary-releases/{geography}/{release}:
    get:
      operationId: getBoundaryReleaseValidation
      summary: Get one boundary release's checks
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
      responses:
        "200":
          description: The boundary release's checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResourceEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:c51e3f4ef14b77972061b9c8f08a838975d700adba9d2372c5d1bbbe8edd27a2"
                data:
                  id: boundary-releases/ward/2016-12-gb-bgc
                  kind: boundary-release
                  status: waived
                  checks:
                    - id: licence-recorded
                      status: passed
                    - id: area-identities
                      status: passed
                      measured: { areaCount: 8668 }
                    - id: geometry-servable
                      status: waived
                      detail: Geometry is EPSG:27700, and only WGS84 geometry is served.
                      measured: { crs: "EPSG:27700" }
                      waiver:
                        reason: Published by the ONS in British National Grid (EPSG:27700). The geometry endpoint serves WGS84 only and the API has no reprojection step yet. Identities and crosswalks for these releases do not depend on it.
                    - id: candidates-reviewed
                      status: passed
                meta:
                  nextCursor: null
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /validation/crosswalks/{crosswalkId}:
    get:
      operationId: getCrosswalkValidation
      summary: Get one crosswalk's checks
      description: >
        Every crosswalk is checked for artifact integrity, resolvable
        endpoints, consistent source names and at least one target per
        source. Clean containment must give each source exactly one parent.
        Area overlap must have weights summing to 1, the coverage its adapter
        requires, and clear separation between slivers and real overlaps.
      parameters:
        - $ref: "#/components/parameters/CrosswalkId"
      responses:
        "200":
          description: The crosswalk's checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResourceEnvelope"
              example:
                apiVersion: v1
                atlasRelease: "sha256:c51e3f4ef14b77972061b9c8f08a838975d700adba9d2372c5d1bbbe8edd27a2"
                data:
                  id: crosswalks/constituency-2024-07-uk-bgc-to-local-authority-2024-05-uk-bgc-area-overlap
                  kind: crosswalk
                  status: passed
                  checks:
                    - id: artifact-integrity
                      status: passed
                      measured: { recordCount: 650 }
                    - id: endpoints-verified
                      status: passed
                    - id: source-names-consistent
                      status: passed
                    - id: targets-present
                      status: passed
                    - id: weights-sum-to-one
                      status: passed
                      measured: { maxDeviation: 0.000001, tolerance: 0.00001 }
                    - id: area-coverage
                      status: passed
                      measured:
                        minimumCoverage: 0.99
                        minimumSourceCoverage: 0.99606
                        minimumTargetCoverage: 0.997111
                    - id: sliver-separation
                      status: passed
                      measured:
                        sliverWidthM: 100
                        widestSliverWidthM: 15.1
                        narrowestOverlapWidthM: 332.1
                        sliverPairCount: 1381
                meta:
                  nextCursor: null
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /atlas-release:
    get:
      operationId: getAtlasRelease
      summary: Get the current immutable atlas release manifest
      description: >
        References the boundary registry, derived boundaries, area
        inventory, geometry source registry, crosswalk inventory,
        relationship-candidate inventory, geography inventory, validation
        report and source inventory by content hash, plus a single
        `releaseId` hash of that set. Rebuilding without changing any input reproduces the same
        `releaseId`.
      responses:
        "200":
          description: The current atlas release manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtlasReleaseEnvelope"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

components:
  parameters:
    Geography:
      name: geography
      in: path
      required: true
      schema:
        type: string
      description: A geography type id, e.g. `constituency` or `ward`.
    Release:
      name: release
      in: path
      required: true
      schema:
        type: string
      description: A boundary release id, e.g. `2024-07-uk-bgc`.
    CrosswalkId:
      name: crosswalkId
      in: path
      required: true
      schema:
        type: string
      description: A crosswalk id, e.g. `constituency-2010-to-2024-official-lookup-v2`.

  responses:
    NotFound:
      description: No resource matches that identity.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidQuery:
      description: A query parameter is malformed or its cursor is not valid for this result set.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CatalogueUnavailable:
      description: The referenced build artifact has not been built yet.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    GeometryUnavailable:
      description: >
        The area exists but its geometry could not be loaded, e.g. its source
        is not yet WGS84-ready.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

    Envelope:
      type: object
      required: [apiVersion, atlasRelease, data, meta]
      properties:
        apiVersion:
          type: string
          const: v1
        atlasRelease:
          type: string
          description: >
            The immutable `/atlas-release` `releaseId` for the artifacts that
            produced this response.
        meta:
          type: object
          required: [nextCursor]
          properties:
            nextCursor:
              oneOf:
                - type: string
                - type: "null"
              description: Opaque cursor for the next page, or null at the end.

    RootDocument:
      type: object
      required: [name, links]
      properties:
        name:
          type: string
        links:
          type: array
          items:
            type: string

    RootEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/RootDocument"

    GeographySummary:
      type: object
      required: [id, latestRelease, releaseCount]
      properties:
        id:
          type: string
        latestRelease:
          type: string
        releaseCount:
          type: integer

    GeographySummaryListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/GeographySummary"

    BoundaryRelease:
      type: object
      required: [id, geography, title, coverage, source, metadataHash]
      properties:
        id:
          type: string
        geography:
          type: string
        title:
          type: string
        description:
          type: string
        temporalCoverage:
          type: string
        coverage:
          type: object
          required: [countries]
          properties:
            countries:
              type: array
              items:
                type: string
        source:
          type: object
          required: [publisher, url, licence]
          properties:
            publisher:
              type: string
            url:
              type: string
              format: uri
            retrievedAt:
              type: string
              format: date
            licence:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                url:
                  type: string
                  format: uri
        metadataHash:
          type: string

    BoundaryReleaseListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/BoundaryRelease"

    BoundaryReleaseEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/BoundaryRelease"

    AreaIdentityCoverage:
      oneOf:
        - type: object
          required: [status, recordCount, artifact]
          properties:
            status:
              const: available
            recordCount:
              type: integer
            artifact:
              type: string
        - type: object
          required: [status, reason]
          properties:
            status:
              const: not-compiled
            reason:
              type: string

    GeographyRelationship:
      type: object
      required: [id, direction, counterpart, method, quality, weighting]
      properties:
        id:
          type: string
        direction:
          enum: [from, to]
        counterpart:
          type: object
          required: [geography, boundaryRelease]
          properties:
            geography:
              type: string
            boundaryRelease:
              type: string
        method:
          $ref: "#/components/schemas/CrosswalkMethod"
        quality:
          $ref: "#/components/schemas/CrosswalkQuality"
        weighting:
          $ref: "#/components/schemas/CrosswalkWeighting"

    RelationshipCoverage:
      oneOf:
        - type: object
          required: [status, crosswalks]
          properties:
            status:
              const: available
            crosswalks:
              type: array
              items:
                $ref: "#/components/schemas/GeographyRelationship"
        - type: object
          required: [status, reason]
          properties:
            status:
              const: not-compiled
            reason:
              type: string

    GeographyReleaseInventory:
      type: object
      required:
        - id
        - geography
        - countries
        - inputFormats
        - areaIdentities
        - relationships
      properties:
        id:
          type: string
        geography:
          type: string
        countries:
          type: array
          items:
            type: string
        inputFormats:
          type: array
          items:
            type: string
        areaIdentities:
          $ref: "#/components/schemas/AreaIdentityCoverage"
        relationships:
          $ref: "#/components/schemas/RelationshipCoverage"

    GeographyInventory:
      type: object
      required:
        - schemaVersion
        - contentHash
        - boundaryRegistryHash
        - releases
        - geographies
      properties:
        schemaVersion:
          const: 1
        contentHash:
          type: string
        boundaryRegistryHash:
          type: string
        releases:
          type: array
          items:
            $ref: "#/components/schemas/GeographyReleaseInventory"
        geographies:
          type: array
          items:
            type: object
            required: [id, countries, releaseCount]
            properties:
              id:
                type: string
              countries:
                type: array
                items:
                  type: string
              releaseCount:
                type: integer

    GeographyInventoryEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/GeographyInventory"

    Area:
      type: object
      required: [id, geography, boundaryRelease, code, name]
      properties:
        id:
          type: string
        geography:
          type: string
        boundaryRelease:
          type: string
        code:
          type: string
        name:
          type: string
        aliases:
          type: array
          items:
            type: string

    AreaRelationship:
      type: object
      required: [relation, counterpart, crosswalk]
      properties:
        relation:
          enum: [within, contains, successor, predecessor, overlaps]
        overlap:
          description: >
            Present only for `overlaps` relationships. Each share is seen from
            this area's side: `shareOfArea` is the overlap as a share of this
            area and `shareOfCounterpart` as a share of the counterpart.
          type: object
          required: [areaM2, shareOfArea, shareOfCounterpart]
          properties:
            areaM2:
              type: integer
            shareOfArea:
              type: number
            shareOfCounterpart:
              type: number
        counterpart:
          type: object
          required: [id, geography, boundaryRelease, code, labels]
          properties:
            id:
              type: string
            geography:
              type: string
            boundaryRelease:
              type: string
            code:
              type: string
            labels:
              type: array
              items:
                type: string
        crosswalk:
          type: object
          required: [id, method, quality, weighting]
          properties:
            id:
              type: string
            method:
              $ref: "#/components/schemas/CrosswalkMethod"
            quality:
              $ref: "#/components/schemas/CrosswalkQuality"
            weighting:
              $ref: "#/components/schemas/CrosswalkWeighting"

    AreaWithRelationships:
      allOf:
        - $ref: "#/components/schemas/Area"
        - type: object
          required: [relationships]
          properties:
            relationships:
              type: array
              items:
                $ref: "#/components/schemas/AreaRelationship"

    GeoJsonGeometry:
      type: object
      description: >
        A GeoJSON geometry object as read from the raw cached source, or a
        GeometryCollection when the source represents one area code as more
        than one feature fragment.
      required: [type]
      properties:
        type:
          type: string
        coordinates:
          description: Present on every geometry type except GeometryCollection.
        geometries:
          type: array
          items:
            $ref: "#/components/schemas/GeoJsonGeometry"
          description: Present only when type is GeometryCollection.

    AreaGeometry:
      type: object
      required: [type, id, properties, geometry]
      properties:
        type:
          const: Feature
        id:
          type: string
        properties:
          $ref: "#/components/schemas/Area"
        geometry:
          $ref: "#/components/schemas/GeoJsonGeometry"

    AreaGeometryEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AreaGeometry"

    AreaRelationshipsEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AreaWithRelationships"

    AreaListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Area"

    AreaEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Area"

    CrosswalkSide:
      type: object
      required: [geography, boundaryRelease]
      properties:
        geography:
          type: string
        boundaryRelease:
          type: string

    CrosswalkMethod:
      description: >
        `official-lookup` and `clean-containment` read an explicit code pair
        from a published file. `area-overlap` intersects the two releases'
        boundary geometries and weights each source by the area it shares
        with each target.
      enum: [official-lookup, clean-containment, area-overlap]

    CrosswalkQuality:
      description: >
        `publisher-supplied` mappings restate a publisher's own
        correspondence. `derived` mappings are computed by the Atlas.
      enum: [publisher-supplied, derived]

    CrosswalkWeighting:
      oneOf:
        - type: object
          required: [status]
          properties:
            status:
              enum: [not-provided, not-applicable]
        - type: object
          description: >
            Each record's target weights are shares of the source's area
            covered by its published targets, and sum to 1 within rounding.
          required: [status, basis, normalisation]
          properties:
            status:
              const: provided
            basis:
              const: area
            normalisation:
              const: per-source

    CrosswalkSummary:
      type: object
      required:
        - id
        - from
        - to
        - method
        - quality
        - weighting
        - recordCount
        - artifact
        - contentHash
      properties:
        id:
          type: string
        from:
          $ref: "#/components/schemas/CrosswalkSide"
        to:
          $ref: "#/components/schemas/CrosswalkSide"
        method:
          $ref: "#/components/schemas/CrosswalkMethod"
        quality:
          $ref: "#/components/schemas/CrosswalkQuality"
        weighting:
          $ref: "#/components/schemas/CrosswalkWeighting"
        recordCount:
          type: integer
        artifact:
          type: string
        contentHash:
          type: string

    CrosswalkSummaryListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/CrosswalkSummary"

    CrosswalkMetadata:
      type: object
      required:
        - schemaVersion
        - contentHash
        - id
        - method
        - quality
        - weighting
        - from
        - to
        - provenance
        - validation
      properties:
        schemaVersion:
          const: 1
        contentHash:
          type: string
        id:
          type: string
        method:
          $ref: "#/components/schemas/CrosswalkMethod"
        quality:
          $ref: "#/components/schemas/CrosswalkQuality"
        weighting:
          $ref: "#/components/schemas/CrosswalkWeighting"
        from:
          $ref: "#/components/schemas/CrosswalkSide"
        to:
          $ref: "#/components/schemas/CrosswalkSide"
        provenance:
          oneOf:
            - type: object
              description: The one published file the code pairs are read from.
              required: [input, inputHash]
              properties:
                input:
                  type: string
                inputHash:
                  type: string
            - type: object
              description: >
                The two boundary geometries an `area-overlap` crosswalk
                intersects, how areas were measured, and the clipping library
                that computed each intersection.
              required: [inputs, areaProjection, clipping]
              properties:
                inputs:
                  type: array
                  items:
                    type: object
                    required: [side, input, inputHash]
                    properties:
                      side:
                        enum: [from, to]
                      input:
                        type: string
                      inputHash:
                        type: string
                areaProjection:
                  const: EPSG:6933
                  description: >
                    Lambert cylindrical equal-area on the WGS 84 ellipsoid, so
                    every area is an ellipsoidal area in square metres.
                clipping:
                  type: string
                  description: Clipping library and version, e.g. `polygon-clipping@0.15.7`.
        validation:
          type: object
          required: [sourceNameConflicts, endpoints]
          properties:
            overlap:
              $ref: "#/components/schemas/AreaOverlapValidation"
            sourceNameConflicts:
              type: array
              items:
                type: object
                required: [code, names]
                properties:
                  code:
                    type: string
                  names:
                    type: array
                    items:
                      type: string
            endpoints:
              type: object
              required: [from, to]
              properties:
                from:
                  $ref: "#/components/schemas/CrosswalkEndpointValidation"
                to:
                  $ref: "#/components/schemas/CrosswalkEndpointValidation"

    CrosswalkEndpointValidation:
      oneOf:
        - type: object
          required: [status, availableAreaCount, referencedCodeCount]
          properties:
            status:
              const: verified
            availableAreaCount:
              type: integer
            referencedCodeCount:
              type: integer
        - type: object
          required: [status, reason]
          properties:
            status:
              const: not-available
            reason:
              type: string

    AreaOverlapValidation:
      type: object
      description: >
        Present only for `area-overlap` crosswalks. Two independently
        generalised boundaries leave narrow slivers where they disagree. A
        pair whose widest intersecting piece is narrower than `sliverWidthM`
        (twice its area over its perimeter) is dropped as a sliver. The build
        fails unless every sliver is under half that width and every kept
        overlap at least twice it, and unless every source and target area is
        at least `minimumCoverage` covered by kept overlaps.
      required:
        - candidatePairCount
        - intersectingPairCount
        - sliverPairCount
        - sliverWidthM
        - widestSliverWidthM
        - narrowestOverlapWidthM
        - minimumCoverage
        - minimumSourceCoverage
        - minimumTargetCoverage
      properties:
        candidatePairCount:
          type: integer
          description: Pairs whose bounding boxes meet, and so were clipped.
        intersectingPairCount:
          type: integer
        sliverPairCount:
          type: integer
        sliverWidthM:
          type: number
        widestSliverWidthM:
          type: [number, "null"]
        narrowestOverlapWidthM:
          type: number
        minimumCoverage:
          type: number
        minimumSourceCoverage:
          type: number
        minimumTargetCoverage:
          type: number

    CrosswalkMetadataEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CrosswalkMetadata"

    CrosswalkArea:
      type: object
      required: [code, labels]
      properties:
        code:
          type: string
        labels:
          type: array
          items:
            type: string
          description: >
            Non-canonical name candidates. More than one entry means the
            source disagreed with itself about this area's name; it is not
            an alias list to pick from arbitrarily.

    CrosswalkRecord:
      type: object
      required: [source, targets]
      properties:
        source:
          $ref: "#/components/schemas/CrosswalkArea"
        targets:
          type: array
          items:
            $ref: "#/components/schemas/CrosswalkArea"

    AreaOverlapRecord:
      type: object
      description: >
        One `area-overlap` source with the targets it shares area with, after
        slivers are dropped. Areas are ellipsoidal square metres.
      required: [source, targets]
      properties:
        source:
          allOf:
            - $ref: "#/components/schemas/CrosswalkArea"
            - type: object
              required: [areaM2, coverage]
              properties:
                areaM2:
                  type: integer
                coverage:
                  type: number
                  description: Share of the source's area covered by its targets.
        targets:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/CrosswalkArea"
              - type: object
                required:
                  [weight, overlapAreaM2, sourceShare, targetShare]
                properties:
                  weight:
                    type: number
                    description: >
                      Share of the source's covered area. A record's weights
                      sum to 1 within rounding, so they apportion a whole
                      source quantity across its targets.
                  overlapAreaM2:
                    type: integer
                  sourceShare:
                    type: number
                    description: Overlap as a share of the whole source area.
                  targetShare:
                    type: number
                    description: Overlap as a share of the whole target area.

    CrosswalkRecordListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                anyOf:
                  - $ref: "#/components/schemas/CrosswalkRecord"
                  - $ref: "#/components/schemas/AreaOverlapRecord"

    RelationshipCandidateSide:
      type: object
      required: [geography, boundaryRelease, codeProperty, nameProperty]
      properties:
        geography:
          type: string
        boundaryRelease:
          type: string
        codeProperty:
          type: string
        nameProperty:
          type: string

    RelationshipCandidateTarget:
      type: object
      required: [codeProperty, nameProperty]
      properties:
        geography:
          type: string
        boundaryRelease:
          type: string
        codeProperty:
          type: string
        nameProperty:
          type: string
      description: >
        `boundaryRelease` (and sometimes `geography`) are present only when
        exactly one compiled area release already uses this code/name
        property pair.

    RelationshipCandidateEndpointStatus:
      oneOf:
        - type: object
          required: [status, availableAreaCount, referencedCodeCount]
          properties:
            status:
              const: verified
            availableAreaCount:
              type: integer
            referencedCodeCount:
              type: integer
        - type: object
          required: [status, reason]
          properties:
            status:
              const: not-available
            reason:
              type: string

    RelationshipCandidate:
      type: object
      required: [id, input, from, to, status, validation]
      properties:
        id:
          type: string
        input:
          type: string
        from:
          $ref: "#/components/schemas/RelationshipCandidateSide"
        to:
          $ref: "#/components/schemas/RelationshipCandidateTarget"
        status:
          enum: [eligible, needs-review, not-available]
        publishedCrosswalkId:
          type: string
          description: Set when a published crosswalk already covers this candidate.
        validation:
          type: object
          required: [endpoints, relationship, reasons]
          properties:
            endpoints:
              type: object
              required: [from, to]
              properties:
                from:
                  $ref: "#/components/schemas/RelationshipCandidateEndpointStatus"
                to:
                  $ref: "#/components/schemas/RelationshipCandidateEndpointStatus"
            relationship:
              type: object
              required:
                - sourceFeatureCount
                - sourceCodeCount
                - targetCodeCount
                - multiTargetSourceCount
                - missingValueFeatureCount
              properties:
                sourceFeatureCount:
                  type: integer
                sourceCodeCount:
                  type: integer
                targetCodeCount:
                  type: integer
                multiTargetSourceCount:
                  type: integer
                missingValueFeatureCount:
                  type: integer
            reasons:
              type: array
              items:
                type: string

    RelationshipCandidateListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/RelationshipCandidate"

    ValidationCheck:
      type: object
      required: [id, status]
      properties:
        id:
          enum:
            - registry-links
            - release-coverage
            - licence-recorded
            - area-identities
            - geometry-servable
            - candidates-reviewed
            - artifact-integrity
            - endpoints-verified
            - source-names-consistent
            - targets-present
            - single-parent
            - weights-sum-to-one
            - area-coverage
            - sliver-separation
        status:
          enum: [passed, waived]
        detail:
          type: string
          description: What the check found. Present on every waived check.
        measured:
          type: object
          description: Figures the check measured, whether it passed or not.
          additionalProperties:
            type: [number, string, "null"]
        waiver:
          type: object
          required: [reason]
          properties:
            reason:
              type: string

    ValidationResource:
      type: object
      required: [id, kind, status, checks]
      properties:
        id:
          type: string
          description: >
            `atlas` for checks across the Atlas's own artifacts; otherwise
            the validated resource's API path, such as
            `crosswalks/{crosswalkId}`.
        kind:
          enum: [atlas, boundary-release, crosswalk]
        status:
          enum: [passed, waived]
          description: waived when any of its checks is waived.
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ValidationCheck"

    ValidationReport:
      type: object
      required: [schemaVersion, contentHash, inputs, summary, resources]
      properties:
        schemaVersion:
          const: 1
        contentHash:
          type: string
        inputs:
          type: object
          description: Content hashes of the artifacts and waivers the checks read.
          additionalProperties:
            type: string
        summary:
          type: object
          required: [resourceCount, checkCount, passedCount, waivedCount, coverage]
          properties:
            resourceCount:
              type: integer
            checkCount:
              type: integer
            passedCount:
              type: integer
            waivedCount:
              type: integer
            coverage:
              type: object
              description: How many boundary releases each capability reaches.
              required:
                - boundaryReleases
                - areaIdentities
                - servableGeometry
                - withRelationships
                - crosswalks
                - weightedCrosswalks
              properties:
                boundaryReleases:
                  type: integer
                areaIdentities:
                  type: integer
                servableGeometry:
                  type: integer
                withRelationships:
                  type: integer
                crosswalks:
                  type: integer
                weightedCrosswalks:
                  type: integer
        resources:
          type: array
          items:
            $ref: "#/components/schemas/ValidationResource"

    ValidationReportEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ValidationReport"

    ValidationResourceEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ValidationResource"

    AtlasReleaseArtifactRef:
      type: object
      required: [id, path, contentHash]
      properties:
        id:
          type: string
        path:
          type: string
        contentHash:
          type: string

    AtlasRelease:
      type: object
      required: [schemaVersion, releaseId, artifacts]
      properties:
        schemaVersion:
          const: 1
        releaseId:
          type: string
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/AtlasReleaseArtifactRef"

    AtlasReleaseEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AtlasRelease"
