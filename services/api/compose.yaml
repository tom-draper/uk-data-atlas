services:
  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - atlas-cache:/app/data/build
      - atlas-usage:/var/lib/atlas-usage
      - ../../data/build/atlas.sqlite:/app/data/build/atlas.sqlite:ro
      - ../../data/build/atlas-assets:/app/data/build/atlas-assets:ro
      - ../../data/build/artifacts:/app/data/build/artifacts:ro
    environment:
      ATLAS_WORKERS: "2"
      ATLAS_TRUSTED_PROXY_HOPS: ${ATLAS_TRUSTED_PROXY_HOPS:-0}
      ATLAS_MAP_ASSET_BASE_URL: ${ATLAS_MAP_ASSET_BASE_URL:-}
      ATLAS_MAP_TILE_BASE_URL: ${ATLAS_MAP_TILE_BASE_URL:-}
      ATLAS_METRICS_TOKEN: ${ATLAS_METRICS_TOKEN:-}
      ATLAS_USAGE_DIR: /var/lib/atlas-usage
    stop_grace_period: 15s

volumes:
  atlas-cache:
  atlas-usage:
