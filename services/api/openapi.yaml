  /relationships:
    get:
      operationId: queryRelationships
      tags: ["Geography"]
      summary: Discover, assess and plan published geography relationships
      x-likely-refusal:
        status: 400
        when:
          "A conversion names a release other than as geography/release, or a
          coverage question omits its geography or release."
        x-example-request: "/v1/relationships?from=ward"
      description: >
        The front door for relationship evidence in the boundary archive. Supply
        `from={geography}/{release}` to discover every published conversion from
        one exact release. Add `to={geography}/{release}` to assess the paths
        for a `purpose`, their coverage, trust and permitted operations. Add
        `operation` to select the best published path for that intended
        operation, without translating any codes or values.


        Alternatively, supply `geography` and `release` to report how fully a
        release is covered by its published relationships. `relation` limits
        that report to one relationship kind. These two query shapes are
        deliberately separate: conversion is directional between exact releases,
        whereas coverage is an audit of one release's evidence.
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string }
          description: The release to discover or convert from, as `{geography}/{release}`.
        - name: to
          in: query
          required: false
          schema: { type: string }
          description: The release to assess a conversion to, as `{geography}/{release}`.
        - name: purpose
          in: query
          required: false
          schema:
            type: string
            enum: [identity, membership, apportion]
            default: membership
          description: >
            What the conversion is for, as on `/translations`. Only applies with
            `to`.
        - name: operation
          in: query
          required: false
          schema:
            type: string
            enum:
              [
                identity-join,
                code-translation,
                containment-aggregation,
                membership-join,
                weighted-allocation,
              ]
          description:
            Select the best published path for this intended conversion
            operation.
        - name: measure
          in: query
          required: false
          schema: { type: string }
          description:
            Preflight this measure against an exact conversion's relationship
            purpose.
        - {
            name: geography,
            in: query,
            required: false,
            schema: { type: string },
          }
        - {
            name: release,
            in: query,
            required: false,
            schema: { type: string },
          }
        - name: relation
          in: query
          required: false
          schema:
            {
              type: string,
              enum:
                [
                  within,
                  contains,
                  successor,
                  predecessor,
                  split-from,
                  merged-from,
                  equivalent-to,
                  overlaps,
                ],
            }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description:
            Published relationship paths and evidence, a selected conversion
            plan, or release-level relationship coverage.
          content:
            application/json:
              schema: { type: object }
              examples:
