        ward, and "Newport" is thirteen codes across Wales, the Isle of Wight
        and Shropshire. This never chooses among them.


        Names match with case, accents, punctuation and the ampersand set aside,
        so "Brighton & Hove" and "Ynys Mon" find what was published, and an
        alias matches as well as a name. An administrative title is set aside
        too, so "Bristol" finds the authority published as "Bristol, City of",
        reported as `exact-without-title`. Names that merely begin with the
        query follow, as `prefix`, once equal names leave room: "Richmond" lists
        its wards and parish first, then Richmond upon Thames. A bare area code,
        or a place reference, is looked up directly.


        A place held in several releases is returned once, with its releases
        newest first. Equal matches are listed headline geographies first, then
        wards and smaller areas; that is a presentation order and asserts
        nothing about which was meant. Curated named locations appear with their
        member codes, or the codes active on `asOf`.


        A unit postcode, typed in any case and with or without its space, leads
        the candidates as a place of its own: kind `postcode`, a place reference
        such as `postcode/SW1A1AA`, its centroid as `point`, and an `href` to
        `/postcodes/{postcode}`, which places it in areas. Nothing is placed
        here, so a search stays as fast as a name lookup. Pass the reference as
        `place` to `/data/{measure-id}/value` to answer a measure for the
        postcode. A query that reads as a postcode district or sector, or a unit
        postcode the directory does not hold or this API may not serve, carries
        a `postcodeHint` saying so.


        Add `geography` or `release` to resolve only exact area identities in
        that scope. `date`, with a geography, selects the latest published
        release on or before that date; `country` can narrow that selection.
      parameters:
        - name: q
          in: query
          required: true
          description:
            A place name, an area code, a unit postcode, or a place reference
            such as `localAuthority/E08000003` or `postcode/SW1A1AA`.
          schema:
            type: string
          example: Manchester
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 10
          description: How many candidate places to return, 1 to 500.
        - name: asOf
          in: query
          required: false
          schema: { type: string, format: date }
          description:
            Select the member codes effective on this date for curated named
            locations. Omit it to return the complete dated definition.
        - name: geography
          in: query
          required: false
          schema: { type: string }
          description: Restrict an exact area lookup to one geography type.
        - name: release
          in: query
          required: false
          schema: { type: string }
          description: Restrict an exact area lookup to one boundary release.
        - name: date
          in: query
          required: false
          schema: { type: string }
          description:
            Calendar date (`YYYY-MM-DD`) or month (`YYYY-MM`) that selects a
            release. Requires `geography` and cannot be combined with `release`.
        - name: country
          in: query
          required: false
          schema: { enum: [GB-ENG, GB-NIR, GB-SCT, GB-WLS] }
          description: Restrict a date-selected release to one country.
      responses:
        "200":
          description: The candidate places, best match first. Empty when nothing matches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              x-example-request: "/v1/places?q=Bristol"
              example:
                apiVersion: v1
                atlasRelease:
                  "sha256:24a500c55416bd7d58c28b1fc8cc4931d4a2fd831addafa3116556a91\
                  f2c4857"
                data:
                  query: Bristol
                  candidates:
                    - place: localAuthority/E06000023
                      kind: area
                      name: Bristol, City of
                      geography: localAuthority
                      code: E06000023
                      match: exact-without-title
                      boundaryReleases: [2025-12-uk-bgc, 2023-05-uk-bgc-v2]
                    - place: majorTownAndCity/J01000015
                      kind: area
                      name: Bristol
                      geography: majorTownAndCity
                      code: J01000015
                      match: exact
                      boundaryReleases: [2015-12-ew-bgc]
                meta:
                  nextCursor: null
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /postcodes/{postcode}:
    get:
      operationId: resolvePostcode
      tags: ["Start here"]
      summary: Find where a postcode is and the areas containing it
      x-likely-refusal:
        status: 400
        when: "A postcode district or sector is given rather than a full unit postcode."
        x-example-request: "/v1/postcodes/SW1A"
      description: >
        Looks a unit postcode up in the ONS Postcode Directory and places its
        centroid in each requested geography, through the same point lookup as
        `/areas:contains`. The postcode is read in any case, with or without its
        space.


        With no `geography` or `release`, the postcode is placed in its local
        authority, ward and Westminster constituency. With no `date`, each
        release is the latest dated on or before the directory's edition, and
        `dateBasis` says which was used. Terminated postcodes are served, with
        the month they were terminated.


        A postcode is placed by a single centroid, and its addresses can fall on
        both sides of a boundary. The centroid's positional quality comes from
        the directory; where the directory states an accuracy it becomes the
        point's uncertainty and counts towards `positionalToleranceM`. Where it
        does not, as for centroids ONS imputed or set at a postcode sector's
        mean, `caution` says that `nearBoundary` may understate the risk. A
        postcode with no grid reference, such as one in the Channel Islands or
        the Isle of Man, is described but placed in no area.


        Northern Ireland postcodes are licensed by Land and Property Services
        for internal business use only and are refused with 451. The source's
        required attribution is returned with every answer.


        `view=compact` returns only the postcode, its WGS 84 point, each area it
        is placed in and the attribution, for callers that do not need the
        provenance and tolerances; it is a fraction of the size.
      parameters:
        - name: postcode
          in: path
          required: true
          schema: { type: string }
          description: A full unit postcode, such as `SW1A 1AA` or `sw1a1aa`.
        - $ref: "#/components/parameters/PointLookupGeography"
        - $ref: "#/components/parameters/PointLookupRelease"
        - $ref: "#/components/parameters/PointLookupDate"
        - $ref: "#/components/parameters/PostcodeView"
      responses:
        "200":
          description: The postcode, its centroid and the areas containing it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostcodeLookupEnvelope"
              x-example-request: "/v1/postcodes/SW1A1AA"
              example:
                apiVersion: v1
                atlasRelease: sha256:9e5c1f2b00f6d7becc55f3e569310568fdcbd59cbdf754f70f5dfc8cb2d4a8e8
                data:
                  postcode: SW1A 1AA
                  status: live
                  introduced: "1980-01"
                  userType: large
                  country: E92000001
                  centroid:
                    crs: EPSG:27700
                    easting: 529090
                    northing: 179645
                    positionalQuality:
                      indicator: 1
                      description:
                        Within the building of the matched address closest to the postcode
                        mean.
                      accuracyM: 0.5
                  point:
                    lng: -0.141588
                    lat: 51.501009
                    crs: EPSG:4326
                    precision:
                      uncertaintyM: 2.5
                      basis: decimal-places-and-transformation
                  date: "2026-08"
                  dateBasis: directory-edition
                  pointCountry:
                    code: GB-ENG
                    determinedBy: area-code
                  boundaryRule: included
                  results:
                    - geography: localAuthority
                      boundaryRelease: 2026-05-uk-bgc
                      status: matched
                      matches:
                        - id: localAuthority/2026-05-uk-bgc/E09000033
                          code: E09000033
                          name: Westminster
                          nearBoundary: false
                    - geography: ward
                      boundaryRelease: 2026-05-uk-bgc
                      status: matched
                      matches:
                        - id: ward/2026-05-uk-bgc/E05013806
                          code: E05013806
                          name: St James's
                          nearBoundary: false
                    - geography: constituency
                      boundaryRelease: 2024-07-uk-bgc
                      status: matched
                      matches:
                        - id: constituency/2024-07-uk-bgc/E14001172
                          code: E14001172
                          name: Cities of London and Westminster
                          nearBoundary: false
                  source:
                    title: ONS Postcode Directory (August 2026)
                    edition: "2026-08"
                    publisher: Office for National Statistics
        "400":
          description: >
            The postcode is not a UK postcode, or names a district or sector
            rather than a unit; or the geography, release or date is malformed
            as for `/areas:contains`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: >
            The postcode is not in the directory edition served, or a pinned
            release or geography is unknown.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "451":
          description:
            The postcode is in Northern Ireland, which this API is not licensed
            to serve.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /postcodes:batch:
    post:
      operationId: resolvePostcodes
      x-rate-limit-cost: 5
      tags: ["Start here"]
      summary: Find where each of a batch of postcodes is and the areas containing it
      x-likely-refusal:
        status: 400
        when: "The body gives no postcode, or more than 100."
        x-example-request: "/v1/postcodes:batch"
      description: >
        The `/postcodes/{postcode}` lookup for up to 100 postcodes at once. Send
        them in the JSON body's `postcodes` array. The releases are chosen once
        for the whole batch, as for a single postcode: the default geographies
        as at the directory's edition unless query `geography`, `release` or
        `date` say otherwise.


        Each postcode has its own entry, in the order given, with a `status`:
        `placed`, with its areas; `not-placed`, for a postcode the directory
        gives no grid reference; `invalid`, for text that is not a unit
        postcode; `not-found`, for one the directory edition does not hold; and
        `not-served`, for a Northern Ireland postcode, which this API is not
        licensed to serve. None of these fails the batch. Only a problem with
        the request itself does, such as no postcodes, too many, or a malformed
        date.


        Placed centroids are tested together, so each release's geometry is read
        once for the batch, and release-wide provenance is given once in
        `releases`. `summary` counts each postcode status and each lookup
        outcome. `view=compact` keeps the entries and summary but gives each
        postcode only its record, point and areas, as for a single postcode.
      parameters:
        - $ref: "#/components/parameters/PointLookupGeography"
        - $ref: "#/components/parameters/PointLookupRelease"
        - $ref: "#/components/parameters/PointLookupDate"
        - $ref: "#/components/parameters/PostcodeView"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [postcodes]
              properties:
                postcodes:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string }
            example:
              postcodes: [SW1A1AA, M11AE, CF101EP, BT11AA]
      responses:
        "200":
          description: Each postcode's entry, and a summary of the batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostcodeBatchEnvelope"
              x-example-request: "/v1/postcodes:batch?geography=localAuthority"
              example:
                apiVersion: v1
                atlasRelease: sha256:9e5c1f2b00f6d7becc55f3e569310568fdcbd59cbdf754f70f5dfc8cb2d4a8e8
                data:
                  date: "2026-08"
                  dateBasis: directory-edition
                  boundaryRule: included
                  releases:
                    - geography: localAuthority
                      boundaryRelease: 2026-05-uk-bgc
                  summary:
                    postcodes: 4
                    placed: 3
                    notPlaced: 0
                    invalid: 0
                    notFound: 0
                    notServed: 1
                    lookups: 3
                    matched: 3
                    noMatch: 0
                    outsideCoverage: 0
                    unresolved: 0
                    nearBoundary: 0
                  postcodes:
                    - index: 0
                      input: SW1A1AA
                      status: placed
                      postcode:
                        postcode: SW1A 1AA
                        status: live
                      results:
                        - geography: localAuthority
                          boundaryRelease: 2026-05-uk-bgc
                          status: matched
                          matches:
                            - id: localAuthority/2026-05-uk-bgc/E09000033
                              name: Westminster
                              nearBoundary: false
                    - index: 1
                      input: M11AE
                      status: placed
                      results:
                        - geography: localAuthority
                          status: matched
                          matches:
                            - id: localAuthority/2026-05-uk-bgc/E08000003
                              name: Manchester
                    - index: 2
                      input: CF101EP
                      status: placed
                      results:
                        - geography: localAuthority
                          status: matched
                          matches:
                            - id: localAuthority/2026-05-uk-bgc/W06000015
                              name: Cardiff
                    - index: 3
                      input: BT11AA
                      status: not-served
                      detail:
                        Northern Ireland postcodes are licensed by Land and Property Services
                        for internal business use only, so this API does not
                        serve them.
        "400":
          description: >
            No postcode is given, more than 100 are, or the geography, release
            or date is malformed as for `/areas:contains`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: A pinned release or a geography is unknown.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /data/{measure-id}/value:
    get:
      operationId: getMeasureValueForPlace
      tags: ["Start here"]
      summary: Answer a measure for a place by name (by-place dispatcher)
      x-likely-refusal:
        status: 422
        code: place_not_served
        when:
          "The name matches places, but the measure answers none. Each candidate
          says why."
        x-example-request: "/v1/data/house-price-median/value?place=North%20West"
      description: >
        A deliberately narrow convenience for a place-name question, not the
        primary way to fetch one observation: it resolves the name and
        dispatches to a route that already serves that kind of place. Ask
        `/data/{measure-id}` for observations, or `/data/{measure-id}/series`
        for one area's values, when the area is already known.


        It answers "what is the population of the North West?" in one call. The
        place may be a name, an area code or a place reference from `/places`;
        the period may be omitted, in which case the latest the chosen partition
        publishes is used and the answer says so. Where a name may mean several
        places, `GET /v1/places?q=Newport` lists them first, and a candidate's
        place reference asks about that one alone: `GET
        /v1/data/population/value?place=localAuthority/W06000022`.


        Nothing is computed here. Each place the name could mean is put to the
        route that already serves that kind of place: `series` for an area,
        `aggregate` for a curated location or a country. The value, its
        provenance and every refusal are exactly what that route gives, and
        `via` names the call that gives the answer directly, for citing or
        repeating.


        The candidate is chosen by what the measure can answer rather than by
        guessing what was meant. Places matching the name exactly are tried
        first; names merely beginning with it only when no exact match answers.
        Answers resting on the same partition, period and area codes are the
        same ground reached two ways and count once, keeping the publisher's own
        observation over an aggregate of one member: Manchester the authority
        and Manchester the curated location of that authority give one answer.
        The other places the name matched are listed in `otherMatches`, answered
        or not.


        When the name gives more than one distinct answer, the usual geography
        tier chooses the most likely match. `question.placeDefaulted` says this
        happened and `otherMatches` lists every alternative with its answer or
        refusal. "Newport", for example, defaults to the Welsh authority over
        wards of the same name. When the name matches places but the measure
        answers none, the response is a 422 with a `candidates` member saying
        why for each, such as a median, which cannot be summed over a region.


        Give `postcode` instead of `place` to answer for where a unit postcode
        is: `GET /v1/data/imd-decile/value?postcode=M1 1AE`. The postcode's
        centroid is placed in the areas the data was published for, as drawn for
        the data's own boundary year rather than today's, in a boundary release
        holding that partition's codes; `boundaryMatch` names it. With no
        `geography`, the finest geography the measure is published on is tried
        first, and a coarser one only where a finer does not cover the
        postcode's country or has no value there; `passedOver` says why, and
        `otherGeographies` gives the request for each other geography. A
        centroid on a shared boundary whose areas answer differently is a 409
        with `choices`, and a postcode no geography answers is a 422 with a
        `candidates` member saying why for each.
      parameters:
        - $ref: "#/components/parameters/MeasureId"
        - name: place
          in: query
          required: false
          schema:
            type: string
          example: North West
          description: >
            A place name, an area code, a unit postcode, or a place reference
            such as `localAuthority/E08000003` or `postcode/SW1A1AA` from `GET
            /v1/places`. One of `place` or `postcode` is required.
        - name: postcode
          in: query
          required: false
          schema:
            type: string
          example: SW1A 1AA
          description: >
            A full unit postcode, in any case and with or without its space.
            Refused as `/postcodes/{postcode}` refuses it.
        - name: geography
          in: query
          required: false
          schema:
            type: string
          description: >
            The source geography to answer from, or with `postcode`, the
            geography to answer in, such as `lsoa` or `localAuthority`. Omit for
            the finest that answers.
        - name: codeYear
          in: query
          required: false
          schema: { type: string, pattern: "^\\d{4}$" }
          description: >
            With `postcode`, the boundary year of the partition to answer from.
            Omit for the newest.
        - name: period
          in: query
          required: false
          description: A published period. Omit for the latest.
          schema:
            type: string
        - name: datasetId
          in: query
          schema: { type: string }
          description: Select the published dataset to answer from.
        - name: from
          in: query
          schema: { type: string }
          description: Exact source geography/release for a membership crosswalk.
        - name: crosswalk
          in: query
          schema: { type: string }
          description: Membership crosswalk to sum values onto an area.
        - name: path
          in: query
          schema: { type: string }
          description: Membership relationship path, in place of crosswalk.
      x-refused-query-parameters: [release, conversion, aggregate]
      responses:
        "200":
          description: The answer, the place it is for, and the route that gives it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              x-example-request: "/v1/data/population/value?place=North%20West&period=2022"
              example:
                apiVersion: v1
                atlasRelease:
                  "sha256:24a500c55416bd7d58c28b1fc8cc4931d4a2fd831addafa3116556a91\
                  f2c4857"
                data:
                  measure:
                    id: population
                    label: Population estimate
                    valueKind: count
                    unit: people
                  question:
                    { place: North West, period: "2022", placeDefaulted: false }
                  answer:
                    period: "2022"
                    periodDefaulted: false
                    status: derived
                    value: 7526285
                    unit: people
                  place:
                    place: location/north-west
                    kind: named-location
                    name: North West
                    geography: named-location
                    code: north-west
                    match: exact
                  method: aggregate
                  via: /v1/data/population/value?place=location/north-west&geography=localAuthority&codeYear=2023&period=2022
                  otherMatches:
                    - place: region/E12000002
                      kind: area
                      name: North West
                      geography: region
                      code: E12000002
                      match: exact
                      served: false
                      reason: population is not published for region areas.
                meta:
                  nextCursor: null
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          description:
            No published measure has that id, or no place is called or coded
            that.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >
            The name gives more than one distinct answer. `choices` lists each
            place with its answer and the request that asks about it alone.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: >
            The name matches places, but the measure answers none of them.
            `candidates` says why for each.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/PlaceNotServedProblem"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /data/{measure-id}/change:
    get:
      operationId: getSourceExactMeasureChange
      x-refused-query-parameters: [release, conversion, aggregate]
      tags: ["Trend"]
      summary: Rank areas by change between two periods of one measure partition
      x-likely-refusal:
        status: 400
        when:
          "The partition cannot be chosen: the measure is published on several
          geographies and neither `geography` nor `place` picks one."
        x-example-request: "/v1/data/population/change?startPeriod=2011"
      description: >
        Returns how each area changed between two periods, ranked: the question
        "where did population grow fastest between 2011 and 2022?" Pass `place`
        for one area, which keeps its rank among all of them, so "Manchester
        grew 13.2%, 42nd of 361" is a single call.


        Change is measured inside one source partition, never across two. The
        publisher restates every period of a partition on a single set of codes,
        so an area code names the same ground at the start and the end. Pairing
        periods from partitions on different codes would pair areas that are not
        the same place, so it is not offered. A partition that cannot be chosen
        returns a 400 listing the partitions and how many periods each has.


        The geography may be left out when `place` names an area, by name or
        code, or the measure is published on one geography. The boundary year
        and periods may be left out too: the newest partition is used, ending at
        its latest period and starting at the latest one before the end that
        does not overlap it. What was chosen is returned in `defaults`.


        `by=absolute` ranks the end value less the start, in the measure's unit.
        `by=relative` ranks that as a proportion of the start, and is refused
        for a ratio: change in a share is read in points, and a rise in coverage
        from 2% to 3% is not usefully called 50%. An area whose start is zero
        has no relative change and is left out of a relative ranking, counted in
        `coverage.withoutRelativeChange`. Currency is nominal and not adjusted
        for inflation.


        Some changes are refused outright. A rank or decile is a position among
        the other areas rather than a quantity, so a move in it is not change in
        the area. A partition publishing one period has nothing to change
        between. Rolling windows that share years, such as life expectancy for
        2017-2019 and 2018-2020, are refused because most of the apparent change
        is the same data counted twice.


        Where the publisher gives intervals, each record says whether the start
        and end intervals overlap. Intervals that do not overlap mean the change
        is unlikely to be chance; intervals that do overlap do not show that it
        is. Areas with a value in only one period are listed in
        `coverage.onlyAtStart` and `coverage.onlyAtEnd` rather than paired with
        anything.
      parameters:
        - $ref: "#/components/parameters/MeasureId"
        - name: geography
          in: query
          required: false
          schema:
            type: string
          description: >
            The geography of the source partition the change is measured inside.
            Both periods come from that one partition.
        - $ref: "#/components/parameters/OptionalSourceCodeYear"
        - name: startPeriod
          in: query
          required: false
          schema:
            type: string
          example: "2011"
          description: >
            The period the change is measured from. Left out, the latest period
            before `endPeriod` that does not overlap it.
        - name: endPeriod
          in: query
          required: false
          description: >
            A published period of the partition after `startPeriod`. Left out,
            the partition's latest period.
          schema:
            type: string
          example: "2022"
        - name: by
          in: query
          required: false
          schema:
            enum: [absolute, relative]
            default: absolute
          description: >
            Whether change is the difference in the published unit, or that
            difference as a proportion of the start value.
        - name: order
          in: query
          required: false
          description: "`desc` puts the largest rise first, `asc` the largest fall."
          schema:
            enum: [asc, desc]
            default: desc
        - $ref: "#/components/parameters/Place"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description:
            Cursor-paginated competition ranks of change for the source
            partition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              x-example-request:
                "/v1/data/population/change?geography=localAuthority&codeYea\
                r=2023&startPeriod=2011&endPeriod=2022&by=relative&limit=1"
              example:
                apiVersion: v1
                atlasRelease:
                  "sha256:24a500c55416bd7d58c28b1fc8cc4931d4a2fd831addafa3116556a91\
                  f2c4857"
                data:
                  startPeriod: "2011"
                  endPeriod: "2022"
                  change:
                    direction: end-minus-start
                    basis: relative
                    order: desc
                    unit: proportion
                    interpretation: Change in the source-published unit.
                  coverage:
                    areasRanked: 361
