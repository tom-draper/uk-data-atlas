            - id: 2011-12-ew-bgc
              href: /v1/boundary-releases/ward/2011-12-ew-bgc

    AreaNotInReleaseProblem:
      description: >
        The release is published and compiled but does not hold the code;
        `presentIn` lists releases that do. A caller can act on `presentIn`
        instead of reading the detail. Produced by `GET
        /v1/areas/ward/2016-12-gb-bgc/E05013830`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, absence, presentIn]
          properties:
            status:
              enum: [404]
            code:
              const: area_not_in_release
      examples:
        - type: https://api.ukdataatlas.com/problems/not-found
          title: Not Found
          status: 404
          detail:
            E05013830 is held only by newer releases of this geography, so it had
            not come into use by this release.
          code: area_not_in_release
          absence: not-yet-current
          presentIn:
            - boundaryRelease: 2021-12-uk-bgc
              name: Garforth & Swillington
              href: /v1/areas/ward/2021-12-uk-bgc/E05013830
            - boundaryRelease: 2022-12-uk-bgc
              name: Garforth & Swillington
              href: /v1/areas/ward/2022-12-uk-bgc/E05013830
            - boundaryRelease: 2023-05-uk-bgc
              name: Garforth & Swillington
              href: /v1/areas/ward/2023-05-uk-bgc/E05013830
            - boundaryRelease: 2023-12-uk-bgc
              name: Garforth & Swillington
              href: /v1/areas/ward/2023-12-uk-bgc/E05013830
            - boundaryRelease: 2024-05-uk-bgc
