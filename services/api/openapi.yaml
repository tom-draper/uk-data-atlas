    AmbiguousPlaceProblem:
      description: >
        The place name means more than one place, and the measure answers them
        differently; `choices` carries each answer and the request that asks
        about it alone. Produced by `GET
        /v1/data/population/series?place=Newport`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, choices]
          properties:
            status:
              enum: [409]
            code:
              const: ambiguous_place
      examples:
        - type: https://api.ukdataatlas.com/problems/ambiguous-place
          title: Ambiguous Place
          status: 409
          detail:
            '"Newport" names 4 areas population is published for. Ask again with the
            code of the one meant.'
          code: ambiguous_place
          choices:
            - place: localAuthority/W06000022
              kind: area
              name: Newport
              geography: localAuthority
              code: W06000022
              match: exact
              ask: /v1/data/population/series?place=W06000022&geography=localAuthority
            - place: ward/E05009866
              kind: area
              name: Newport
              geography: ward
              code: E05009866
              match: exact
              ask: /v1/data/population/series?place=E05009866&geography=ward
            - place: ward/E05009922
              kind: area
              name: Newport
              geography: ward
              code: E05009922
              match: exact
              ask: /v1/data/population/series?place=E05009922&geography=ward
            - place: ward/E05012432
              kind: area
              name: Newport
              geography: ward
              code: E05012432
              match: exact
              ask: /v1/data/population/series?place=E05012432&geography=ward

    MapJoinBudgetProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [links]
          properties:
            title:
              type: string
              const: Map Join Budget Exceeded
            status:
              type: integer
              const: 422
            links:
              type: object
              required: [data]
              properties:
                data:
                  type: string
                  description: Paginated source observations for the requested partition and period.

    IncompatibleGeometryProblem:
      description: >
        The requested boundary release does not hold every source area code of
        the partition, so no geometry join is offered. The refusal names the
        releases that would carry it in `alternatives.releases`, and
        `/v1/documents/measure-{measure-id}.json` has the full evidence.
        Produced by `GET
        /v1/data/population?period=2022&geography=ward&codeYear=2023&release=2016-12-gb-bgc`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code]
          properties:
            status:
              enum: [422]
            code:
              const: incompatible_geometry
      examples:
        - type: https://api.ukdataatlas.com/problems/operation-not-supported
          title: Operation Not Supported
          status: 422
          detail:
            2016-12-gb-bgc does not hold every source area code for this partition
            of population, so its values cannot be drawn on it. Inspect
            /v1/documents/measure-population.json.
          code: incompatible_geometry
          alternatives:
            releases:
              - 2023-05-uk-bgc
              - 2023-12-uk-bgc

    InvalidFormatProblem:
      description: >
        The `format` asked for is not one this route serves. Produced by `GET
        /v1/data/population?period=2022&geography=ward&codeYear=2023&format=xml`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code]
          properties:
            status:
              enum: [400]
            code:
              const: invalid_format
      examples:
        - type: https://api.ukdataatlas.com/problems/invalid-query
          title: Invalid Query
          status: 400
          detail: format must be one of json, csv or ndjson.
          code: invalid_format

    InvalidCursorProblem:
      description: >
        The cursor is not one this API issued, or does not belong to the query
        it was sent with. Ask for the first page again and follow
        `meta.nextCursor`. Produced by `GET /v1/areas?cursor=not-a-cursor`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code]
          properties:
            status:
              enum: [400]
            code:
              const: invalid_cursor
      examples:
        - type: https://api.ukdataatlas.com/problems/invalid-query
          title: Invalid Query
          status: 400
          detail: cursor is invalid.
          code: invalid_cursor

    UnknownQueryParameterProblem:
      description: >
        The operation does not declare the supplied query parameter. Produced by
        `GET /v1/areas?geogaphy=ward`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, parameter]
          properties:
            status:
              enum: [400]
            code:
              const: unknown_query_parameter
            parameter:
              type: string
            suggestion:
              type: string
      examples:
        - type: https://api.ukdataatlas.com/problems/unknown-query-parameter
          title: Unknown Query Parameter
          status: 400
          detail: This operation does not accept the query parameter geogaphy.
          code: unknown_query_parameter
          parameter: geogaphy
          suggestion: geography

    NoReleaseForDateProblem:
      description: >
        No release of the geography was in force on the date; `earliest` names
        the first there is. A caller can act on `earliest` or `undated` instead
        of reading the detail. Produced by `GET
        /v1/boundary-releases:resolve?geography=ward&date=1990-01-01`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, absence]
          properties:
            status:
              enum: [404]
            code:
              const: no_release_for_date
      examples:
        - type: https://api.ukdataatlas.com/problems/not-found
          title: Not Found
          status: 404
          detail: The earliest ward boundary release is dated 2011-12, after 1990-01.
          code: no_release_for_date
          absence: before-first-release
          earliest:
            id: 2011-12-ew-bgc
            month: 2011-12
            title: Wards, December 2011 (England and Wales, generalised, clipped)
            countries:
              - GB-ENG
              - GB-WLS
            href: /v1/boundary-releases/ward/2011-12-ew-bgc

    AmbiguousReleaseProblem:
      description: >
        More than one release of the geography is dated that month and they
        differ in more than coverage; `choices` lists them. A caller can act on
        `choices` instead of reading the detail. Produced by `GET
        /v1/boundary-releases:resolve?geography=ward&date=2019-12-15&country=GB-ENG`,
        where both December 2019 ward releases cover England.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, choices]
          properties:
            status:
              enum: [409]
            code:
              const: ambiguous_release
      examples:
        - type: https://api.ukdataatlas.com/problems/ambiguous-release
          title: Ambiguous Release
          status: 409
          detail:
            2 ward boundary releases are dated 2019-12 and differ in more than
            coverage. Choose one by id; each is listed in choices.
          code: ambiguous_release
          choices:
            - id: 2019-12-gb-bgc
              month: 2019-12
              title: Wards, December 2019 (Great Britain, generalised, clipped)
              countries:
                - GB-ENG
                - GB-SCT
                - GB-WLS
              href: /v1/boundary-releases/ward/2019-12-gb-bgc
            - id: 2019-12-uk-bgc
              month: 2019-12
              title: Wards, December 2019 (United Kingdom, generalised, clipped)
              countries:
                - GB-ENG
                - GB-NIR
                - GB-SCT
                - GB-WLS
              href: /v1/boundary-releases/ward/2019-12-uk-bgc

    Envelope:
      type: object
      required: [apiVersion, atlasRelease, data, meta]
      properties:
        apiVersion:
          type: string
