              match: prefix
              served: false
              reason: house-price-median is not published for localAuthority areas.
            - place: constituency/E14000855
              kind: area
              name: North West Cambridgeshire
              geography: constituency
              code: E14000855
              match: prefix
              served: false
              reason: house-price-median is not published for constituency areas.
            - place: constituency/E14001401
              kind: area
              name: North West Cambridgeshire
              geography: constituency
              code: E14001401
              match: prefix
              served: false
              reason: house-price-median is not published for constituency areas.
            - place: constituency/E14000856
              kind: area
              name: North West Durham
              geography: constituency
              code: E14000856
              match: prefix
              served: false
              reason: house-price-median is not published for constituency areas.
            - place: constituency/E14001402
              kind: area
              name: North West Essex
