                        periods:
                          - "2022"
                        sourceGeography:
                          type: ward
                          codeYear: 2023
                        coverage:
                          kind: partial
                          countries:
                            - GB-ENG
                          recordCount: 7608
                          note:
                            Published source records are available for England and Wales only; this
                            endpoint does not infer Scottish or Northern Irish
                            values.
                    availability:
                      sourceExact: true
