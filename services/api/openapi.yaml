  /boundary-releases:resolve:
    get:
      operationId: resolveBoundaryReleaseForDate
      tags: ["Geography"]
      summary: Select the boundary release to use for a date
      x-likely-refusal:
        status: 404
        code: no_release_for_date
        when:
          "The date is before the earliest release of that geography. The refusal
          gives the earliest date that resolves."
        x-example-request: "/v1/boundary-releases:resolve?geography=ward&date=1990-01-01"
      description: >
        Returns the latest release of a geography dated on or before `date` that
        covers `country` when one is given, as an exact release id rather than a
        moving `latest` alias. Releases are snapshots dated to a month, so a day
        narrows nothing, and the answer is the latest snapshot at that date
        rather than a statement of which boundaries were legally in force.

        `previous` and `next` are the neighbouring releases covering the same
        country; a change after the selected release shows first in `next`.
        `sameMonth` is true when the date falls in the release's own month, so a
        change that month may lie either side of it. `notCovering` lists later
        releases passed over because they miss the country.

        Releases of the same month are told apart only where one is plainly
        better: a subset derived from another is set aside for its source, and
        without `country` a release covering fewer countries is set aside. Each
        is listed in `setAside` with its reason. A deprecated release is never
        chosen while its replacement, which is not itself deprecated, is dated
        on or before the date and covers the country; it is set aside for it.
        Where no such replacement applies the deprecated release is chosen, and
        the response carries its `Deprecation` headers. Variants differing in
        any other way, such as clipping, are a 409 listing each in `choices`.
      parameters:
        - name: geography
          in: query
          required: true
          schema: { type: string }
          description: The geography to resolve a release for, e.g. `ward`.
        - name: date
          in: query
          required: true
          schema: { type: string }
          description: A calendar date as `YYYY-MM-DD`, or a month as `YYYY-MM`.
        - name: country
          in: query
          required: false
          schema:
            type: string
            enum: [GB-ENG, GB-NIR, GB-SCT, GB-WLS]
          description: >
            Restricts the answer to releases covering this country, so a Great
            Britain release is passed over for Northern Ireland.
      responses:
        "200":
          description: The selected release, its neighbours and the basis of the choice.
          headers:
            Deprecation:
              $ref: "#/components/headers/ReleaseDeprecation"
            Sunset:
              $ref: "#/components/headers/ReleaseSunset"
            Link:
              $ref: "#/components/headers/ReleaseSuccessorLink"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              x-example-request:
                "/v1/boundary-releases:resolve?geography=localAuthority&date\
                =2023-06-30"
              example:
                apiVersion: v1
                atlasRelease: sha256:5c4aa4529cbfbd5e4c844c55cddba1ef04a7bf76f3eaa085a357fff401af6d0c
                data:
                  geography: localAuthority
                  date: 2023-06-30
                  month: 2023-06
                meta:
                  nextCursor: null
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          description: >
            No release can be selected: `code` is `unsupported_geography` for an
            unknown geography, otherwise `no_release_for_date` with `absence`
            saying whether the date precedes the first release, no release
            covers the country, or none is dated to a month.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >
            Several releases share the selected month and differ in more than
            coverage; `choices` lists them.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /boundary-releases:compare:
    get:
      operationId: compareBoundaryReleases
      tags: ["Geography"]
      summary: Compare two releases of one geography without inferring geography
        change from codes
      x-likely-refusal:
        status: 400
        when:
          "One of geography, from or to is omitted, or from and to name the same
          release."
        x-example-request: "/v1/boundary-releases:compare?geography=ward&from=2023-05-uk-bgc"
      description: >
        Compares the two compiled code sets, with identifiers present in only
        one release kept distinct from a claim that an area was added or
        removed. Shared codes are called continuous only where a published
        extent-continuity crosswalk measured their geometry. A code only one
        release holds is listed under `continuity.recoded` where that crosswalk
        found the same extent under a new code in the other. Its changed,
        indeterminate and unmeasured findings remain review evidence, not
        conversion claims. Other published crosswalks between the releases are
        named separately with their directional code cardinality and bounded
        split/merge-shaped examples. These describe published records, not a
        legal boundary-change finding, and need no runtime polygon comparison.
      parameters:
        - name: geography
          in: query
          required: true
          schema: { type: string }
          description: The shared geography family of both releases.
        - name: from
          in: query
          required: true
          schema: { type: string }
          description: The earlier or source release id.
        - name: to
          in: query
          required: true
          schema: { type: string }
          description: The later or target release id.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
          description:
            Maximum sample identifiers or continuity findings in each bounded
            list.
      responses:
        "200":
          description: Release-level code, continuity and crosswalk evidence.
          content:
            application/json:
              schema: { type: object }
              x-example-request:
                "/v1/boundary-releases:compare?geography=ward&from=2023-05-u\
                k-bgc&to=2024-12-uk-bgc"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

