        x-example-request: "/v1/areas:containsBatch"
      description: >
        The `areas:contains` lookup for up to 100 points at once, each given in
        the JSON body's `points` array as `{lng},{lat}` or
        `{lng},{lat},{accuracy}` in the default WGS 84, as
        `point={easting},{northing}` with `crs=EPSG:27700` or `EPSG:29902`, or
        as one Ordnance Survey reference such as `point=TQ3000080000` with
        `crs=EPSG:27700`. Geographies, release selection and statuses are
        exactly as for a single point.


        Release-wide facts, including selection, coverage, resolution and
        geometry provenance, are given once in `releases`. Each point then lists
        its country and, per release in the same order, its status and matches;
        a match carries `corrections` only where a declared grid correction
        moved that area. `summary` counts the lookups by outcome and how many
        have a match near a boundary.


        Every release is read once for all the points, so the cost of a batch
        grows with its points rather than with its points times its geographies.
        This is a bounded convenience for a caller's own point dataset, not a
        bulk geocoder: for more points, page through them in batches.
