    BoundaryRelease:
      type: object
      required: [id, geography, title, coverage, source, metadataHash]
      properties:
        id:
          type: string
        geography:
          type: string
        title:
          type: string
        description:
          type: string
        temporalCoverage:
          type: string
        coverage:
          type: object
          required: [countries]
          properties:
            countries:
              type: array
              items:
                type: string
        source:
          type: object
          required: [publisher, url, licence]
          properties:
            publisher:
              type: string
            url:
              type: string
              format: uri
            retrievedAt:
              type: string
              format: date
            licence:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                url:
                  type: string
                  format: uri
        metadataHash:
          type: string
        deprecation:
          $ref: "#/components/schemas/BoundaryReleaseDeprecation"

    BoundaryReleaseDeprecation:
      type: object
      description: >
        Present on a release that has been superseded. The release stays
        published and is not chosen by date or `latest` while its replacement
        covers the date; clients should move to `replacedBy` before `sunset`.
      required: [deprecated, replacedBy, reason]
      properties:
        deprecated:
          type: string
          format: date
          description: The date the release was deprecated.
        sunset:
          type: string
          format: date
          description: >
            The date after which the release may be removed. Absent until one
            is set.
        replacedBy:
          type: string
          description: The id of the release, of the same geography, to use instead.
        reason:
          type: string

    BoundaryReleaseListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/BoundaryRelease"

    BoundaryReleaseEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/BoundaryRelease"
                - type: object
                  required: [downloads]
                  properties:
                    downloads:
                      $ref: "#/components/schemas/BoundaryReleaseDownloads"

    BoundaryReleaseDownloads:
      description: >
        Where to get the whole release: its vector tiles, every generalisation
        tier as GeoParquet, and the `medium` and `low` tiers as GeoJSON. A
        release whose areas are not a coverage, because some edge lies on more
        than two of them, cannot be tiled or generalised with shared borders:
        it is `untiled`, with the reason, and downloadable whole as GeoParquet
        at `full` detail only. A release
        with no readable geometry is `unavailable`. Either stays available area
        by area.
      oneOf:
        - type: object
          required:
            [status, mapResource, pmtiles, tileJson, geojson, geoparquet]
          properties:
            status:
              type: string
              const: available
            mapResource:
              type: string
              description: The descriptor, with sizes, hashes and attribution.
            pmtiles:
              type: string
            tileJson:
              type: string
            geojson:
              type: object
              description: The download for the `medium` and `low` tiers.
              additionalProperties:
                type: string
            geoparquet:
              type: object
              description: The download for each tier, `full`, `high`, `medium` and `low`.
              additionalProperties:
                type: string
        - type: object
          required: [status, reason, geoparquet]
          properties:
            status:
              type: string
              const: untiled
            reason:
              type: string
            geoparquet:
              type: object
              description: The download at `full` detail.
              additionalProperties:
                type: string
        - type: object
          required: [status, reason]
          properties:
            status:
              type: string
              const: unavailable
            reason:
              type: string

    AreaIdentityCoverage:
      oneOf:
        - type: object
          required: [status, recordCount, artifact]
          properties:
            status:
              const: available
            recordCount:
              type: integer
            artifact:
              type: string
        - type: object
          required: [status, reason]
          properties:
            status:
              const: unsupported
            reason:
              type: string

