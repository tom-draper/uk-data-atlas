                description:
                  type: string
                attribution:
                  type: string
                scheme:
                  type: string
                format:
                  type: string
                tiles:
                  type: array
                  items:
                    type: string
                minzoom:
                  type: integer
                maxzoom:
                  type: integer
                bounds:
                  type: array
                  items:
                    type: number
