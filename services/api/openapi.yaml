  /data/{measure-id}/convert:
    get:
      operationId: convertSourceExactMeasure
      x-refused-query-parameters: [release]
      tags: ["Trend"]
      summary: Regroup an extensive measure through a published crosswalk or
        relationship path
      x-likely-refusal:
        status: 400
        when:
          "Neither `crosswalk` nor `path` is named. This route never chooses a
          conversion path; `/v1/relationships` finds the published ones."
        x-example-request: "/v1/data/population/convert?period=2022&geography=ward&codeYear=2023"
      description: >
        Converts a source partition onto another geography or code vintage using
        the crosswalk, or the published relationship path, the caller names.
        Exactly one of `crosswalk` and `path` is required. The route never
        selects a conversion path: `GET /crosswalks` lists the published
        crosswalks and `GET /relationships` the published paths, and the
        response repeats each crosswalk's method, quality, weighting and content
        hash.


        A `path` carries values through every one of its steps in order, in the
        direction each step declares. Weights multiply along the path, so a
        source split at one step and split again at the next is apportioned by
        the product of the two published weights. A path is refused as a whole
        if any step would drop a value or split one without a weight.


        The crosswalk decides the target areas, so this route selects no
        geometry release: passing `release` is refused rather than ignored. Ask
        `/data/{measure-id}` with a compatible `release` to join geometry to
        source-exact values instead.

        Only a measure declared extensive may be converted, because conversion
        works by adding values up. An intensive measure is rejected: a share or
        a rank cannot be regrouped by summing, and weighting one by area
        produces a number with no meaning.

        The reported `method` distinguishes the outcomes. Across a path it
        describes every step together: `exact` only if no step splits a source,
        and `population-weighted` only if every splitting step is. `exact` means
        every source area sits wholly within one target, so the conversion is a
        regrouping and the partition total is unchanged. `area-weighted` means
        some sources were split in proportion to overlapping area, which is an
        estimate that assumes the measure is spread evenly across each source.
        `population-weighted` means they were split by where each source's
        residents live, counted from the crosswalk's population building blocks,
        which assumes the measure follows resident population.

        A source code the crosswalk does not carry, or a split source with no
        published weight, is rejected rather than partially converted.
      parameters:
        - $ref: "#/components/parameters/MeasureId"
        - name: crosswalk
          in: query
          required: false
          schema:
            type: string
          description: >
            A crosswalk id returned by `GET /crosswalks`, applied forward.
            Required unless `path` is named; naming both is refused.
        - name: path
          in: query
          required: false
          schema:
            type: string
          description: >
            A relationship path id returned by `GET /relationships`, applied
            through every step. Required unless `crosswalk` is named; naming
            both is refused.
        - $ref: "#/components/parameters/SourcePeriod"
        - $ref: "#/components/parameters/SourceGeography"
        - $ref: "#/components/parameters/SourceCodeYear"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: >
            Cursor-paginated derived values on the crosswalk's target areas,
            with the conversion method and the crosswalk's own provenance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              x-example-request:
                "/v1/data/population/convert?period=2022&geography=ward&code\
                Year=2023&crosswalk=ward-2023-05-uk-bgc-to-local-authority-2023\
                -05-uk-bgc-v2-clean-containment&limit=1"
              example:
                apiVersion: v1
