          type: integer

    MapResourceSummary:
      type: object
      required: [id, geography, boundaryRelease, title, href]
      properties:
        id:
          type: string
          description: The boundary release identity, `{geography}/{release}`.
        geography:
          type: string
        boundaryRelease:
          type: string
        title:
          type: string
        href:
          type: string

    MapResourceListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/MapResourceSummary"

    MapResourceTiles:
      type: object
      required:
        - artifact
        - href
        - format
        - tileFormat
        - layer
        - minZoom
        - maxZoom
        - zooms
        - tileCount
        - bytes
        - contentHash
      properties:
        artifact:
          type: string
        href:
          type: string
        format:
          type: string
          const: pmtiles-3
        tileFormat:
          type: string
          const: mvt-2.1
        layer:
          type: string
        minZoom:
          type: integer
        maxZoom:
          type: integer
        zooms:
          type: array
          description: Which generalisation tier each band of zooms is drawn from.
          items:
            type: object
            required: [minZoom, maxZoom, tier, toleranceM]
            properties:
              minZoom:
                type: integer
              maxZoom:
                type: integer
              tier:
                type: string
              toleranceM:
                type: number
        tileCount:
          type: integer
        bytes:
          type: integer
        contentHash:
          type: string
          description: SHA-256 of the archive, so a cited map can be checked.

    MapResource:
      type: object
      required:
        - id
        - geography
        - boundaryRelease
        - title
        - topology
        - areaCount
        - arcCount
        - bounds
        - tiles
        - tiers
        - features
        - generalisation
        - geometrySource
        - attribution
      properties:
        id:
          type: string
        geography:
          type: string
        boundaryRelease:
          type: string
        title:
          type: string
        topology:
          type: string
          const: shared-arc
          description: >
            Borders are compiled once and shared by the two areas along them, so
            a tier cannot draw the same border two ways.
        areaCount:
          type: integer
        arcCount:
          type: integer
          description: Distinct boundary arcs the release decomposes into.
        bounds:
          type: array
          description: West, south, east and north, in degrees.
          items:
            type: number
          minItems: 4
          maxItems: 4
        tiles:
          $ref: "#/components/schemas/MapResourceTiles"
        tiers:
          type: array
          items:
            type: object
            required: [tier, toleranceM, coordinates, refinedArcs]
            properties:
              tier:
                type: string
              toleranceM:
                type: number
              coordinates:
                type: integer
              refinedArcs:
                type: integer
                description: >
                  Arcs given back detail because a ring built from them enclosed
                  nothing at this tier, so no part leaves the map.
        features:
          type: array
          description: >
            Every tier as a whole-release download in GeoParquet, and the
            `medium` and `low` tiers in GeoJSON too, compiled from the same
            shared-arc generalisation as the tiles.
          items:
            type: object
            required:
              [
                tier,
                toleranceM,
                format,
                href,
                rowCount,
                coordinates,
                bytes,
                contentHash,
              ]
            properties:
              tier:
                type: string
                enum: [full, high, medium, low]
              toleranceM:
                type: number
              format:
                type: string
                enum: [geoparquet-1.1, geojson]
              artifact:
                type: string
                description:
                  The stored file. Absent for `full`, which is written from the
                  geometry store when asked for.
              href:
                type: string
              rowCount:
                type: integer
                description: One row per area in the release.
              coordinates:
                type: integer
                description:
                  Coordinates across the tier's shared arcs, each border counted
                  once.
              bytes:
                type: integer
              contentHash:
                type: string
                description:
                  SHA-256 of the file served at `href`, once any content encoding is
                  undone.
              gzipBytes:
                type: integer
                description:
                  "Present when the file is stored gzipped, as GeoJSON is: its size
                  as sent with `Content-Encoding: gzip`."
        generalisation:
          type: object
          description: The terms the tiers were compiled on, in plain words.
          additionalProperties:
            type: string
        geometrySource:
          type: object
          description: The publisher file behind the shapes, and how it was transformed.
        attribution:
          type: object
          required: [text, publisher, sourceUrl, licence, href]
          properties:
            text:
              type: string
              description: Ready to display beside the map.
            publisher:
              type: string
            sourceUrl:
              type: string
            licence:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Reproduced as the publisher states it, not interpreted.
                url:
                  type: string
            href:
              type: string

    MapResourceJoin:
      type: object
      required:
        [
          measure,
          period,
          sourceGeography,
          join,
          layer,
          areasWithoutValue,
          values,
