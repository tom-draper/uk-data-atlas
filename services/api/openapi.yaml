openapi: 3.1.0
info:
  title: UK Data Atlas API
  version: "0.1.0"
  description: |
    This describes exactly the read-only routes the server implements and
    `pnpm start` serves. It is not the full public API proposed in
    `README.md`. Every data route is source-exact by default: it serves the
    published source code vintages and never chooses a geometry release on a
    caller's behalf. A caller may explicitly select a code-compatible release
    for a map join. Values are combined over areas only through
    `/data/{measure-id}/value`, and regrouped onto other areas only through
    `/data/{measure-id}/convert` with a crosswalk the caller names, and each
    refuses a measure whose declared semantics do not allow it.

    Every successful response is wrapped in the envelope described by
    `Envelope`. Its `atlasRelease` field is the immutable `releaseId` from
    `GET /atlas-release`, so clients can identify the exact set of artifacts
    that produced a response.

    A data response carries four identities, and they are deliberately
    separate. The **source geography** and its **boundary year** are the
    publisher's own: `geography` and `codeYear` select one source
    partition. The **observation period** is the time the values describe:
    `period`. The **geometry release** is the caller's choice of boundaries to
    draw them on: the optional `release` on `/data/{measure-id}`, accepted only
    where every source code appears in it, which joins geometry by matching
    code and changes no value. A route that cannot join geometry refuses
    `release` rather than ignoring it. The **Atlas release** is the immutable
    build that produced the response: `atlasRelease` in every envelope.
    Converting values between geographies is a different operation, asked for
    explicitly at `/data/{measure-id}/convert` with a named crosswalk.

    Representations and paging work the same way everywhere. A JSON response
    is the `Envelope`, and its `meta.nextCursor` carries the next page, or
    `null` on the last. A cursor is opaque, belongs to the query that issued
    it, and any other value is refused with `invalid_cursor`; `limit` is 1 to
    500 unless an operation says otherwise. `format` chooses among a route's
    representations where it has more than one: `json`, `csv` or `ndjson` for
    observations, `csv` or `ndjson` for a lookup, served as
    `text/csv; charset=utf-8` and `application/x-ndjson; charset=utf-8`. A
    tabular page has nowhere to put a cursor, so a page that is not the last
    carries its successor in an RFC 8288 `Link` header with `rel="next"`.
    `Accept` is not negotiated. Every representation named here is served in
    the contract tests rather than only described.

    An error is always `application/problem+json`, whatever `format` the
    request asked for: a problem is not a representation of the resource that
    failed to serve. Every refusal a client should branch on carries a stable
    `code`, listed under `Problem`.

    Caching and conditional requests apply to every route. A `200` response
    carries a strong `ETag`, the SHA-256 of the exact bytes served, and
    `Cache-Control: public, max-age=300, must-revalidate`. A `GET` or `HEAD`
    whose `If-None-Match` matches that tag receives `304 Not Modified` with no
    body. `HEAD` is answered as `GET` without the body. Errors carry
    `Cache-Control: no-store` and no `ETag`. No `Last-Modified` is sent: a
    release records no build time, so the `ETag` is the only validator. A
    response can change only when the server loads a different Atlas release,
    and its `ETag` then changes with it.

    Versioning is by path and by release. Within `/v1` the contract only
    grows: an operation, parameter, status or response property is never
    removed, a parameter never becomes required and never accepts less. An
    operation to be withdrawn is first marked `deprecated` with
    `x-deprecated-since` and `x-sunset` dates, and every response it serves
    carries RFC 9745 `Deprecation` and RFC 8594 `Sunset` headers until then.
    A boundary release is retired the same way. One that has been superseded
    carries a `deprecation` record (when it was deprecated, optionally when it
    may be removed, the release that replaces it and why) in
    `/v1/boundary-releases`, and every response about it carries `Deprecation`
    and `Sunset` headers and a `Link` header with `rel="successor-version"`
    naming the replacement. `/v1/boundary-releases:resolve` and `latest` never
    choose it while its replacement covers the date. It stays published until
    its sunset has passed.
    `contract/v1-surface.json` locks this document's surface, and a test
    refuses any change that breaks it. What the data says is pinned
    separately: every response carries an `Atlas-Release` header naming the
    current compiled release that produced it. The API retains no historic
    releases or archived release artifacts.

    Any operation may also answer with a problem that is not in its own list,
    because it comes from the server rather than the route. `429` means the
    client has spent its allowance on the responding worker: each client has
    an independent bucket per worker, described by
    the IETF draft `RateLimit-Policy` and `RateLimit` headers on every
    response, and a refusal carries `Retry-After` in seconds. A request
    costs one from the bucket, except where an operation declares
    `x-rate-limit-cost`: those that read many areas' shapes, or take a
    batch, cost that many. These headers describe only the responding worker,
    not a deployment-wide quota. Worker and instance counts multiply the
    possible total allowance, and restarting a worker resets its buckets.
    Use a shared reverse-proxy or API-gateway limit when a deployment-wide
    quota is required. `414` means the
    request target is longer than the server accepts. `503 Server Busy` means
    the worker has reached its concurrent request limit. It carries
    `Retry-After: 1`; retry with backoff. The server does not queue excess
    requests. `500` means the route
    failed unexpectedly, and carries a `requestId`. Every response carries
    `X-Request-Id`, echoing a well-formed one the client sent, so a failure
    can be found in the server's logs. None of these is cached.
  license:
    name: Proposal; no licence has been assigned yet
tags:
  - name: "Start here"
    description:
      "The first calls to make: what the API serves, which places a name
      could mean, a measure's answer for a named place, and what the Atlas can
      serve for one area."
  - name: "Map"
    description:
      "Draw a correct map: source-exact observations with an explicitly
      chosen boundary release, the geometry to join them to, and the areas at a
      point, in a box, beside or overlapping one another."
  - name: "Trend"
    description:
      "Analyse a measure within one source partition: an area's series,
      change between periods, rankings, comparisons, and aggregation or
      conversion only where they are declared valid."
  - name: "Sync"
    description: "Keep a copy in step: whole observation exports, bulk lookup
      tables, and the current Atlas release manifest that identifies them."
  - name: "Geography"
    description:
      "Resolve and relate areas: boundary releases, area identities and
      their history, parents and children, crosswalks, code translation and
      curated named locations."
  - name: "Terrain"
    description:
      "Discover terrain products and their availability. Terrain values,
      raster tiles and contours are only served when a versioned source is
      published with its coordinate and vertical-reference metadata."
  - name: "Data catalogue"
    description: "What data exists: source datasets with their input hashes, and
      measures with their semantics, code compatibility, coverage and quality."
  - name: "Governance"
    description: "Why a result can be trusted: release validation and waived
      exceptions, relationship candidates awaiting review, attribution and
      citation."
x-glossary:
  - term: Area
    meaning: "One official, versioned identity: `{geography}/{release}/{code}`."
  - term: Place
    meaning: "An ambiguous name-resolution result from `/places`; it is never
      silently chosen."
  - term: Curated area collection
    meaning: "A named set of areas served by `/locations`: an official area ONS
      defines (its `kind` and `source` say which) or an editorial grouping. Not
      a generic geographic `location`."
  - term: Source geography
    meaning: "The geography and code vintage on the publisher's observation."
  - term: Geometry release
    meaning: "The caller-selected boundary release used only to join compatible
      geometry for a map."
  - term: Observation period
    meaning: "The time period the measure describes."
  - term: Atlas release
    meaning: "The immutable published Atlas artifact set that produced the response."
x-endpoint-chooser:
  - need: resolve a name or inspect possible meanings
    start: ["/places"]
  - need: inspect one exact official identity
    start: ["/areas/{geography}/{release}/{code}"]
  - need: get its geometry, relationships or citation
    start:
      [
        "/areas/{geography}/{release}/{code}/geometry",
        "/areas/{geography}/{release}/{code}/relationships",
        "/areas/{geography}/{release}/{code}",
      ]
  - need: draw a whole release as a map, or load its features into a warehouse
    start:
      [
        "/map-resources/{geography}/{release}",
        "/map-resources/{geography}/{release}/features",
      ]
  - need: render values or download source-exact observations
    start:
      [
        "/data/{measure-id}",
        "/map-resources/{geography}/{release}/join/{measure-id}",
      ]
  - need: see a trend, ranking, comparison or change
    start:
      [
        "/data/{measure-id}/series",
        "/data/{measure-id}/rankings",
        "/data/{measure-id}/compare",
        "/data/{measure-id}/change",
      ]
  - need: translate an identifier through a published crosswalk
    start: ["/translations"]
  - need: convert values under a declared measure/method rule
    start: ["/data/{measure-id}/convert"]
  - need: validate a supplied code/name or discover releases
    start: ["/areas:validate", "/boundaries", "/boundary-releases"]
  - need: cite, attribute or inspect the published release
    start:
      [
        "/areas/{geography}/{release}/{code}",
        "/attribution",
        "/atlas-release",
        "/documents/{document-id}.json",
      ]
x-quick-starts:
  - id: correct-map
    title: Correct map
    audience: GIS or product engineer
    promise: Draw UK boundaries and values without a code/geometry mismatch, and
      cite their current release.
    steps:
      - title: Resolve the place
        explain:
          A name is not an area. Every place it could mean comes back with its
          geography and code, and none is chosen for you.
        request: "/v1/places?q=Birmingham"
      - title: Find the boundaries published for drawing
        explain:
          A map resource is one boundary release compiled so neighbours share
          their borders exactly.
        request: "/v1/map-resources"
      - title: Read the descriptor
        explain:
          The one document a map needs. It gives the tile and archive URLs, the
          zoom ladder, every content hash and the attribution.
        request: "/v1/map-resources/localAuthority/2023-05-uk-bgc-v2"
      - title: Configure the renderer
        explain:
          TileJSON 3.0 for MapLibre or any other renderer. The tiles carry each
          area's code, name and a stable integer id, and no values.
        request: "/v1/map-resources/localAuthority/2023-05-uk-bgc-v2/tiles.json"
      - title: Fetch values numbered for the tiles
        explain:
          The join table carries the same integer ids as the tiles, so a renderer
          sets feature state without reading any geometry. The source partition
          is named, never guessed.
        request:
          "/v1/map-resources/localAuthority/2023-05-uk-bgc-v2/join/population?pe\
          riod=2022&geography=localAuthority&codeYear=2023"
      - title: See a join refused, not a wrong map
        explain:
          The deprivation rank is published on LSOAs, which this release does not
          hold. The refusal names the releases that would carry it.
        request:
          "/v1/map-resources/localAuthority/2023-05-uk-bgc-v2/join/imd-rank?peri\
          od=2025"
        status: 422
      - title: Or take the features flat
        explain: The same shapes as GeoParquet, with the same ids, for a GIS or
          warehouse that draws features rather than tiles.
        request:
          "/v1/map-resources/localAuthority/2023-05-uk-bgc-v2/features?tier=medi\
          um"
      - title: Attribute the map
        explain:
          The licence and publisher text to display, for both the boundaries and
          the values.
        request:
          "/v1/attribution?measure=population&boundaryRelease=localAuthority/202\
          3-05-uk-bgc-v2"
  - id: defensible-trend
    title: Defensible trend
    audience: Analyst or consultant
    promise:
      Compare a measure through time on one set of codes, with the refusals
      and caveats visible.
    steps:
      - title: Read the measure
        explain:
          Its aggregation kind and source partitions say what it can be used for
          before any value is fetched.
        request: "/v1/measures/population"
      - title: Take one area's series
        explain:
          Source-exact, within one partition, so the code means the same place in
          every period.
        request:
          "/v1/data/population/series?place=E08000025&geography=localAuthority&c\
          odeYear=2023"
      - title: Rank the change
        explain:
          The same change against every other area in the partition, so a figure
          is put in context rather than quoted alone.
        request:
          "/v1/data/population/change?geography=localAuthority&codeYear=2023&sta\
          rtPeriod=2011&endPeriod=2022&by=relative&place=E08000025"
      - title: See a median refused, not averaged
        explain:
          A median of medians is not a median, so the API refuses to combine one
          over areas.
        request:
          "/v1/data/house-price-median/value?period=2022&geography=ward&codeYear\
          =2020&place=E92000001"
        status: 422
      - title: Keep geometry out of the trend
        explain:
          A boundary release selects shapes for a map. It is refused on a trend,
          because it would suggest the values were moved onto it.
        request:
          "/v1/data/population/change?geography=localAuthority&codeYear=2023&sta\
          rtPeriod=2011&endPeriod=2022&release=2023-05-uk-bgc-v2"
        status: 422
      - title: Quote the caveat
        explain:
          Each partition's coverage note travels with the measure, ready to quote
          beside the figure.
        request: "/v1/documents/measure-population.json"
  - id: reliable-sync
    title: Reliable sync
    audience: Data engineer
    promise:
      Ingest current data into an existing stack, verify it, and refetch only
      what changed.
    steps:
      - title: Record the Atlas release
        explain:
          Every response names the release that produced it. Record it beside
          every table you load.
        request: "/v1/atlas-release"
      - title: Keep the manifest to compare against
        explain:
          The API keeps no history, so keep this manifest. Its `resources` give a
          fingerprint for every dataset, measure, crosswalk, export and lookup,
          which changes exactly when that resource does. On the next run,
          compare the kept fingerprints with the current ones and fetch only the
          exports and lookups that were added or changed.
        request: "/v1/atlas-release"
      - title: List the whole-partition exports
        explain:
          Each export is one immutable source partition, with its record count,
          schema, content hash and the datasets to attribute.
        request: "/v1/exports"
      - title: Download a partition and check its hash
        explain:
          The artifact's `contentHash` is the hash of its content without that
          field, so it can be recomputed rather than trusted. Send the ETag back
          as `If-None-Match` on the next run and an unchanged export answers 304
          with no body.
        request: "/v1/exports/total-jobs-observations"
      - title: Load boundaries into the warehouse
        explain:
          Every area of a release as GeoParquet, with a bbox covering column.
          DuckDB, BigQuery and GeoPandas read it directly.
        request: "/v1/map-resources/localAuthority/2023-05-uk-bgc-v2/features?tier=full"
      - title: Take the reference tables
        explain:
          Area identities, crosswalks and named-location membership as whole CSV
          or NDJSON files.
        request: "/v1/lookups/areas-localAuthority-2023-05-uk-bgc-v2?format=ndjson"
servers:
  - url: http://127.0.0.1:3001/v1
    description: Local development server (pnpm start)
paths:
  /:
    get:
      operationId: getRoot
      tags: ["Start here"]
      summary: API discovery
      x-likely-refusal:
        when: "Takes no input, so nothing is refused but the server-wide rate limit."
      description: Lists the currently implemented resource paths.
      responses:
        "200":
          description: Discovery document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootEnvelope"
              x-example-request: "/v1"
              example:
                apiVersion: v1
                atlasRelease:
                  "sha256:9edc254c5d4cd0a90fc5d3b2544e5f64946d6d0e6a8b68860e3aa6f0a\
                  c8d0912"
                data:
                  name: UK Data Atlas API
                  links:
                    - /v1/openapi.yaml
                    - /v1/docs
                    - /v1/boundaries
                    - /v1/map-resources
                    - /v1/map-resources/{geography}/{release}
                    - /v1/map-resources/{geography}/{release}.pmtiles
                    - /v1/map-resources/{geography}/{release}/tiles.json
                    - /v1/map-resources/{geography}/{release}/tiles/{z}/{x}/{y}.mvt
                    - /v1/map-resources/{geography}/{release}/features
                    - /v1/map-resources/{geography}/{release}/join/{measure-id}
                    - /v1/boundary-releases
                    - /v1/boundary-releases:resolve
                    - /v1/boundary-releases/{geography}/{release}
                    - /v1/documents/{document-id}.json
                    - /v1/datasets
                    - /v1/datasets/{dataset-id}
                    - /v1/measures
                    - /v1/measures/{measure-id}
                    - /v1/data/{measure-id}
                    - /v1/data/{measure-id}/series
                    - /v1/data/{measure-id}/rankings
                    - /v1/data/{measure-id}/compare
                    - /v1/areas
                    - /v1/areas/{geography}/{release}/{code}
                    - /v1/areas/{geography}/{release}/{code}/relationships
                    - /v1/areas/{geography}/{release}/{code}/geometry
                    - /v1/crosswalks
                    - /v1/crosswalks/{crosswalk-id}
                    - /v1/crosswalks/{crosswalk-id}/records
                    - /v1/exports
                    - /v1/exports/{export-id}
                    - /v1/atlas-release
                meta:
                  nextCursor: null

  /documents/{document-id}.json:
    get:
      operationId: getEvidenceDocument
      x-likely-refusal:
        status: 404
        when: The document id is not published.
        x-example-request: /v1/documents/unknown.json
      tags: ["Governance"]
      summary: Download an immutable build evidence document
      description: >
        Build artifacts that explain release coverage, reviewed conversion
        validation and other evidence are published as immutable JSON documents,
        rather than query endpoints. Available document ids are
        `analysis-geography-validation`, `corrections`, `geography-health`,
        `geography-inventory`, `measure-compatibility`,
        `relationship-candidates`, `relationship-repairs`, `validation-report`
        and `measure-{measure-id}` for each measure, such as
        `measure-population`.
      parameters:
        - name: document-id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9-]+$"
            description:
              A document id from a measure or release's documents links, without
              the .json suffix.
      responses:
        "200":
          description: The exact JSON build artifact.
          content:
            application/json:
              x-example-request: /v1/documents/geography-inventory.json
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"

  /openapi.yaml:
    get:
      operationId: getOpenapiDescription
      tags: ["Start here"]
      summary: The OpenAPI description of this API
      x-likely-refusal:
        status: 503
        when:
          "Takes no input. Refused only when the server was started without its
          OpenAPI document."
      description: >
        Returns this document, so a client can read the binding contract from
        the running API rather than the repository. The response is the YAML
        document itself; `Accept` is not negotiated on any route, and a route's
        representations are chosen with `format` where it offers more than one.
      responses:
        "200":
          description: The OpenAPI 3.1 description.
          content:
            application/yaml:
              schema:
                type: string
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /docs:
    get:
      operationId: getDocumentation
      tags: ["Start here"]
      summary: The human documentation landing page
      x-likely-refusal:
        status: 503
        when:
          "Takes no input. Refused only when the server was started without its
          OpenAPI description."
      description: >
        An HTML page rendered from this document: an endpoint chooser that
        starts from the job, the glossary of the identities a response carries,
        three copy-paste quick starts for a correct map, a defensible trend and
        a reliable sync, and every operation grouped by task with its most
        likely refusal. It is read from `x-endpoint-chooser`, `x-glossary`,
        `x-quick-starts` and each operation's `x-likely-refusal`, so it cannot
        describe a route this document does not, and every quick start request
        is sent as a contract test.
      responses:
        "200":
          description: The documentation page.
          content:
            text/html:
              schema:
                type: string
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /map-resources:
    get:
      operationId: listMapResources
      tags: ["Geography"]
      summary: List the boundary releases published as map resources
      x-likely-refusal:
        status: 503
        when:
          "Takes no input. Refused only when the server was started without map
          resources built."
      description: >
        A map resource is one boundary release prepared for drawing: tiles whose
        borders are compiled once and shared, so neighbours cannot be drawn two
        different ways. Releases are published deliberately rather than every
        release being tiled: most are, but a release served only as area
        records, such as the 2022 Scottish data zones, is not listed.
      responses:
        "200":
          description: One entry per published map resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapResourceListEnvelope"
              x-example-request: "/v1/map-resources"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /map-resources/{geography}/{release}:
    get:
      operationId: getMapResource
      tags: ["Geography"]
      summary: Describe one map resource, its tiles and what they were made from
      x-likely-refusal:
        status: 404
        when:
          "The boundary release is published but could not be compiled into a map
          resource, for example because its areas overlap.
          `/v1/boundary-releases/{geography}/{release}` says why under
          `downloads`, and `/v1/map-resources` lists the ones that are."
        x-example-request: "/v1/map-resources/ward/2017-12-gb-bgc"
      description: >
        The only document a client needs to read to draw this release. It
        carries the tile and archive URLs, the zoom ladder and the tier behind
        each zoom, the content hash of the archive, the publisher file the
        shapes were compiled from, and the attribution to display beside the
        map.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
      responses:
        "200":
          description: The map resource descriptor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapResourceEnvelope"
              x-example-request: "/v1/map-resources/localAuthority/2023-05-uk-bgc-v2"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /map-resources/{geography}/{release}/tiles.json:
    get:
      operationId: getMapResourceTileJson
      tags: ["Geography"]
      summary: The TileJSON a renderer is configured with
      x-likely-refusal:
        status: 404
        when:
          "The boundary release is published but could not be compiled into a map
          resource, for example because its areas overlap.
          `/v1/boundary-releases/{geography}/{release}` says why under
          `downloads`, and `/v1/map-resources` lists the ones that are."
        x-example-request: "/v1/map-resources/ward/2017-12-gb-bgc/tiles.json"
      description: >
        TileJSON 3.0 for this resource, including the attribution a map must
        display. A tile cannot carry a licence, so a client handed only a tile
        URL would have nothing to show; this is the document that supplies it.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
      responses:
        "200":
          description: TileJSON 3.0 describing the tile endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TileJsonEnvelope"
              x-example-request: "/v1/map-resources/localAuthority/2023-05-uk-bgc-v2/tiles.json"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /map-resources/{geography}/{release}/features:
    get:
      operationId: getMapResourceFeatures
      tags: ["Geography"]
      summary: A whole boundary release as one GeoParquet or GeoJSON file
      x-likely-refusal:
        status: 400
        when:
          "No `tier` is given. The detail is the caller's to choose: `full`, `high`,
          `medium` or `low`."
        x-example-request: "/v1/map-resources/localAuthority/2023-05-uk-bgc-v2/features"
      description: >
        The flat form of the resource, for a warehouse or a GIS that holds
        features rather than tiles: GeoParquet 1.1 with one row per area,
        carrying the same `id`, `code` and `name` as the tiles, its shape as WKB
        in OGC:CRS84, and a `bbox` covering column a reader can filter on. Each
        tier is compiled from the same shared-arc generalisation the tiles are
        drawn from, so neighbours share their borders exactly, and the ids are
        the ones a join table publishes, so values join by `id` or `code`
        without reading a tile. Every tier is published, `full` included, and
        its size and SHA-256 are listed under `features` in the descriptor. The
        `full` file is not stored: it is written from the geometry store when
        asked for, and is the same file, byte for byte, each time. The first
        request for a large release can take a few seconds. A
        coarse tier keeps every border shared but is not guaranteed to be a
        valid polygon everywhere, as the descriptor's `generalisation` says. The
        file's `uk-data-atlas` metadata names the resource, tier, attribution
        and publisher file hash, so a copy loaded on its own is still citable.

        `format=geojson` returns the same features as an RFC 7946
        FeatureCollection, for the tools that open GeoJSON directly. It is
        published at the `medium` and `low` tiers only; `full` and `high` are
        GeoParquet only, and asking for them as GeoJSON answers 404. Each
        feature has the same `id`, and `code` and `name` properties; coordinates
        are written to six decimal places, about 0.1 m. The file is stored
        gzipped, so a client sending `Accept-Encoding: gzip` receives it with
        `Content-Encoding: gzip` and one that does not receives it decoded. The
        two encodings have different `ETag`s, and the descriptor's `bytes` and
        `contentHash` describe the decoded GeoJSON.

        The GeoParquet file honours byte-range requests, so DuckDB, GDAL or any
        reader that fetches Parquet over HTTP can read its footer and only the
        row groups it needs. The GeoJSON is always sent whole.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - name: tier
          in: query
          required: true
          schema:
            type: string
            enum: [full, high, medium, low]
          description: >
            The detail to download. `full` is the release's own geometry; each
            coarser tier drops detail smaller than 10, 100 or 1,000 metres.
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [geoparquet, geojson]
            default: geoparquet
          description: The representation, GeoParquet 1.1 or GeoJSON.
        - $ref: "#/components/parameters/ByteRange"
      responses:
        "200":
          description: The GeoParquet or GeoJSON file.
          headers:
            Deprecation:
              $ref: "#/components/headers/ReleaseDeprecation"
            Sunset:
              $ref: "#/components/headers/ReleaseSunset"
            Link:
              $ref: "#/components/headers/ReleaseSuccessorLink"
          content:
            application/vnd.apache.parquet:
              schema:
                type: string
                format: binary
            application/geo+json:
              schema:
                type: string
                format: binary
        "206":
          $ref: "#/components/responses/PartialContent"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /map-resources/{geography}/{release}/tiles/{z}/{x}/{y}.mvt:
    get:
      operationId: getMapResourceTile
      tags: ["Geography"]
      summary: One vector tile of a boundary release
      x-likely-refusal:
        status: 404
        when:
          "The zoom is past the last one the descriptor publishes. A renderer should
          over-zoom rather than request it."
        x-example-request:
          "/v1/map-resources/localAuthority/2023-05-uk-bgc-v2/tiles/13\
          /4000/2600.mvt"
      description: >
        A Mapbox Vector Tile carrying the `boundaries` layer, gzipped as the
        archive stores it. Each feature has the area's `code`, its `name` and a
        stable integer id a renderer can hold state against. Values are not in
        the tile: one tileset serves every measure, and a value is joined in the
        renderer. A tile inside the published zooms that covers no area is
        answered `204`, which is an ordinary answer rather than a failure; a
        zoom the resource does not publish is `404`, and a renderer should
        over-zoom past the last one instead.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - name: z
          in: path
          required: true
          description: Zoom level, within the range the descriptor publishes.
          schema:
            type: integer
            minimum: 0
        - name: x
          in: path
          required: true
          description: Tile column at this zoom.
          schema:
            type: integer
            minimum: 0
        - name: y
          in: path
          required: true
          description: Tile row at this zoom, counted from the north.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The tile, gzipped.
          content:
            application/vnd.mapbox-vector-tile:
              schema:
                type: string
                format: binary
        "204":
          description: No area falls in this tile.
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /map-resources/{geography}/{release}/join/{measure-id}:
    get:
      operationId: getMapResourceJoin
      tags: ["Geography"]
      summary: One measure's values, numbered to match this resource's tiles
      x-likely-refusal:
        status: 422
        code: incompatible_geometry
        when:
          "The measure is published on areas this release does not hold, so its
          values cannot be drawn on it. The refusal names the releases that
          would carry it."
        x-example-request:
          "/v1/map-resources/localAuthority/2023-05-uk-bgc-v2/join/imd\
          -rank?period=2025"
      description: >
        The values a renderer joins to the tiles, as `id`, `code` and `value`.
        The `id` is the same integer the tile carries, so a renderer sets
        feature state by it without reading the geometry. Values are joined to
        this release by matching area code and are never converted: a measure
        whose source codes are not all in this release is refused with
        `incompatible_geometry`, and the refusal names the releases that would
        carry it. Keeping values out of the tiles is what lets one tileset serve
        every measure, and lets a corrected value invalidate a small table
        rather than a whole pyramid.


        With `format=parquet` the same table is served as a Parquet file with
        `id`, `code`, `value` and `status` columns, for a warehouse to join to
        the GeoParquet `features`. Everything the JSON envelope says about the
        table, from the Atlas release to the join rule and provenance, travels
        in the file's `uk-data-atlas` metadata.

        Both formats accept at most 250,000 source records and 16 MiB of
        uncompressed column payload. The byte budget counts 20 bytes per numeric
        row for id, value and string-length prefixes, plus the UTF-8 code and
        status bytes. Oversized joins return `422 Map Join Budget Exceeded`
        before output rows or columns are built, with no partial table and a
        `links.data` URL for paginated source observations. Source artifact
        parsing and record materialisation occur before this check; this is
        not a heap or RSS ceiling.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - $ref: "#/components/parameters/MeasureId"
        - name: period
          in: query
          required: true
          description: The observation period the values describe.
          schema:
            type: string
        - name: geography
          in: query
          description: >
            The measure's source geography, where it publishes more than one
            partition. Without it an ambiguous request is refused with the
            partitions listed rather than one being chosen by catalogue order.
          schema:
            type: string
        - name: codeYear
          in: query
          description: The measure's source boundary year, alongside `geography`.
          schema:
            type: integer
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, parquet]
            default: json
          description: >
            `json` for the envelope a renderer reads, `parquet` for the same
            rows as a Parquet file.
      responses:
        "200":
          description: The values, numbered as the tiles number their features.
          content:
            application/vnd.apache.parquet:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: "#/components/schemas/MapResourceJoinEnvelope"
              x-example-request:
                "/v1/map-resources/localAuthority/2023-05-uk-bgc-v2/join/pop\
                ulation?period=2022&geography=localAuthority&codeYear=2023"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            The source codes cannot be drawn on this release, or the join
            exceeds its record or uncompressed column-byte budget.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/IncompatibleGeometryProblem"
                  - $ref: "#/components/schemas/MapJoinBudgetProblem"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /map-resources/{geography}/{release}.pmtiles:
    get:
      operationId: getMapResourceArchive
      tags: ["Geography"]
      summary: The whole tile pyramid as one PMTiles archive
      x-likely-refusal:
        status: 404
        when:
          "The boundary release is published but could not be compiled into a map
          resource, for example because its areas overlap.
          `/v1/boundary-releases/{geography}/{release}` says why under
          `downloads`, and `/v1/map-resources` lists the ones that are."
        x-example-request: "/v1/map-resources/ward/2017-12-gb-bgc.pmtiles"
      description: >
        Every tile of the resource in a single PMTiles v3 file, for an offline
        map, a CDN or a warehouse. Its SHA-256 is the `contentHash` the
        descriptor publishes, so a drawing made from it can be tied to the Atlas
        release that produced it.

        It can also be read in place: the archive honours byte-range requests,
        so a map library such as MapLibre with the `pmtiles` protocol can draw
        from this URL directly, fetching only the tiles in view.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - $ref: "#/components/parameters/ByteRange"
      responses:
        "200":
          description: The PMTiles archive.
          headers:
            Deprecation:
              $ref: "#/components/headers/ReleaseDeprecation"
            Sunset:
              $ref: "#/components/headers/ReleaseSunset"
            Link:
              $ref: "#/components/headers/ReleaseSuccessorLink"
          content:
            application/vnd.pmtiles:
              schema:
                type: string
                format: binary
        "206":
          $ref: "#/components/responses/PartialContent"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /boundaries:
