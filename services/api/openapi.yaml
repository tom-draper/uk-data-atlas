    TerrainPointEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TerrainPoint"

    TerrainPoint:
      type: object
      required: [status, x, y, interpolation, unit, value, source]
      properties:
        status:
          type: string
          enum: [ok, outside_coverage, nodata]
        x: { type: number }
        y: { type: number }
        interpolation:
          type: string
          enum: [bilinear, nearest]
        unit:
          const: metres
        value:
          type:
            - number
            - "null"
        source:
          type: object
          required:
            [
              id,
              version,
              tileHash,
              contentHash,
              crs,
              horizontalDatum,
              verticalDatum,
              resolutionMetres,
              noData,
              uncertainty,
              coverage,
            ]
          properties:
            id: { type: string }
            version: { type: string }
            provenance: { type: string, enum: [local, remote-preview] }
            tileHash: { type: string }
            contentHash: { type: string }
            crs: { const: "EPSG:27700" }
            horizontalDatum: { const: OSGB36 }
            horizontalTransformation: { const: OSTN15 }
            verticalDatum: { const: ODN }
            verticalModel: { const: OSGM15 }
            resolutionMetres: { type: number, exclusiveMinimum: 0 }
            noData:
              type:
                - number
                - "null"
            uncertainty:
              type: object
              required: [metric, valueMetres]
              properties:
                metric:
                  type: string
                  enum: [rmse, stated_accuracy]
                valueMetres: { type: number, minimum: 0 }
            coverage:
              type: object
              required: [kind, bbox, footprintHash]
              properties:
                kind: { const: bbox }
                bbox:
                  type: array
                  minItems: 4
                  maxItems: 4
                  items: { type: number }
                footprintHash: { type: string }

    RootDocument:
      type: object
      required: [name, links]
      properties:
        name:
