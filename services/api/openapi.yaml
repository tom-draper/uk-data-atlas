            them as having no data rather than as zero.
        values:
          type: array
          items:
            type: object
            required: [id, code, value, status]
            properties:
              id:
                type: integer
                description: The tile feature id this value belongs to.
              code:
                type: string
              value:
                type: number
              status:
                type: string
                description: >
                  `observed` where a publisher reported it, `derived` where this
                  API computed it.
        provenance:
          type: object
          required: [artifact, contentHash, measure]
          properties:
            artifact:
              type: string
            contentHash:
              type: string
            measure:
              type: string

