            - id: 2024-05-uk-bgc
              href: /v1/boundary-releases/ward/2024-05-uk-bgc
            - id: 2023-12-uk-bgc
              href: /v1/boundary-releases/ward/2023-12-uk-bgc
            - id: 2023-05-uk-bgc
              href: /v1/boundary-releases/ward/2023-05-uk-bgc
            - id: 2022-12-uk-bgc
              href: /v1/boundary-releases/ward/2022-12-uk-bgc
            - id: 2021-12-uk-bgc
              href: /v1/boundary-releases/ward/2021-12-uk-bgc
            - id: 2020-12-uk-bgc
              href: /v1/boundary-releases/ward/2020-12-uk-bgc
            - id: 2019-12-uk-bgc
              href: /v1/boundary-releases/ward/2019-12-uk-bgc
            - id: 2019-12-gb-bgc
              href: /v1/boundary-releases/ward/2019-12-gb-bgc
            - id: 2018-12-uk-bgc
              href: /v1/boundary-releases/ward/2018-12-uk-bgc
