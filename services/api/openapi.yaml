  /areas:near:
    get:
      operationId: findNearestAreas
      x-rate-limit-cost: 5
      tags: ["Map"]
      summary: Rank the areas nearest a point by distance
      x-likely-refusal:
        status: 400
        when: "The coordinate is incomplete or out of range."
        x-example-request: "/v1/areas:near?lng=-2.24"
      description: >
        Returns up to `limit` areas of each requested geography whose published
        geometry lies within `within` metres of the point, nearest first.
        Releases are selected exactly as for `areas:contains`.


        The coordinate forms are the same as `areas:contains`: default WGS 84
        `lng`/`lat` (`lon` and `longitude` are also accepted for longitude),
        British National Grid `easting`/`northing` or an Ordnance Survey
        `gridref` with `crs=EPSG:27700`, or Irish Grid metres with
        `crs=EPSG:29902`.


        This is a distance answer, labelled `relation: distance`, and never a
        containment one. An area at zero metres has the point on or inside it,
        but only `areas:contains` makes that claim, with its boundary rule and
        tolerance. Use this route where containment has nothing to say: a point
        offshore or in an estuary that a generalised boundary leaves out, or a
        site for which the nearest few areas all matter.


        Distances are to the nearest part of each area's geometry, measured on
        the WGS 84 ellipsoid in a plane tangent at the point, which within the
        50 km this route reaches departs from the geodesic by less than a tenth
        of a percent. They carry the coordinate's own uncertainty, given in
        `point.precision`. `matched` counts every area within the distance, and
        `truncated` says whether `limit` cut it.
      parameters:
        - name: lng
          in: query
          required: false
          schema: { type: string, pattern: "^[+-]?\\d+(\\.\\d+)?$" }
          description: Longitude in WGS 84 decimal degrees, -180 to 180.
        - $ref: "#/components/parameters/PointLookupLongitudeAlias"
        - $ref: "#/components/parameters/PointLookupLongitudeLongAlias"
        - name: lat
          in: query
          required: false
          schema: { type: string, pattern: "^[+-]?\\d+(\\.\\d+)?$" }
          description: Latitude in WGS 84 decimal degrees, -90 to 90.
        - $ref: "#/components/parameters/PointLookupCrs"
        - $ref: "#/components/parameters/PointLookupEasting"
        - $ref: "#/components/parameters/PointLookupNorthing"
        - $ref: "#/components/parameters/PointLookupGridReference"
        - $ref: "#/components/parameters/PointLookupGeography"
        - $ref: "#/components/parameters/PointLookupRelease"
        - $ref: "#/components/parameters/PointLookupDate"
        - $ref: "#/components/parameters/PointLookupAccuracy"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 10, default: 1 }
          description: How many areas to return per geography, 1 to 10.
        - name: within
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50000, default: 1000 }
          description: The furthest an area may be, in whole metres, up to 50 km.
      responses:
        "200":
          description: Each requested geography's nearest areas, with their distances.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearestAreasEnvelope"
              x-example-request:
                "/v1/areas:near?lng=-0.5800&lat=54.5100&geography=ward&date=\
                2025-06-01&limit=2&within=5000"
              example:
                apiVersion: v1
                atlasRelease: sha256:da4898229392e8fa52cd5098cf24c52f11abf454b0adcab178c6c82e30032c15
                data:
                  point:
                    lng: -0.58
                    lat: 54.51
                    crs: EPSG:4326
                  date: "2025-06-01"
                  within: 5000
                  limit: 2
                  relation: distance
                  results:
                    - geography: ward
                      boundaryRelease: 2025-05-uk-bgc-v2
                      selection:
                        policy: latest-release-dated-on-or-before
                        date: "2025-06-01"
                      status: found
                      matched: 4
                      truncated: true
                      nearest:
                        - rank: 1
                          id: ward/2025-05-uk-bgc-v2/E05014272
                          code: E05014272
                          name: Esk Valley & Coast
                          distanceM: 2372.3
        "400":
          description: >
            The point, `limit`, `within` or `accuracy` is malformed or out of
            range, or the geographies and releases are refused as for
            `areas:contains`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /areas/{geography}/{release}/{code}:
    get:
      operationId: getArea
      tags: ["Geography"]
      summary: Get one compiled area by its full identity
      description: >
        Where precompiled postcode placements cover this boundary release, the
        area also includes live and terminated unit-postcode counts from the ONS
        Postcode Directory edition shown in `postcodes.edition`.


        `include` expands the area with any of four reports, each under its own
        key:


        `capabilities` reports geometry, published relationship and crosswalk
        edges, direct-code named-location membership, and every measure's
        capability for this exact area, each in the capability vocabulary
        described by `CapabilityStatus`: `available`, `partial`,
        `requires-conversion`, `unsupported` or `not-built`, with a `reason` on
        every status but `available`. A measure is `available` when a source
        partition published on this release has a value for the area in every
        period, and `partial` when it has one in only some periods or its codes
        only partly join the release. It `requires-conversion` when no partition
        is published on the release but a published crosswalk converts one onto
        it: each entry in `conversions` names the crosswalk, the source
        partition and period, and a ready `href` to the convert route. A
        conversion is only offered after that exact conversion has been run on
        the source's latest period and accepted, and only if it reaches this
        area. A measure whose values do not add over areas is never offered a
        conversion. `capabilities.data.measures` lists the available, partial
        and convertible measures; `capabilities.data.counts` counts every
        measure by status, the unsupported ones included. Compatibility is based
        on area-code membership only and does not assert equal geometry.


        `citation` returns what a caller needs to cite the area as served by
        this Atlas release: the immutable Atlas release, the content hash of the
        area identity artifact, the boundary release's publisher, licence and
        metadata hash, geometry provenance, the validation results for the
        release and any cited crosswalk, and an attribution block. Name a
        `measure` to cite the observation artifacts, with their content hashes,
        that hold a value for this area in a source partition assessed against
        this exact boundary release. Only those partitions' datasets are
        attributed, together with any dataset a derived measure is calculated
        from. Name a `crosswalk` to cite one that publishes a relationship for
        this area. A resource that supplies nothing for the area is refused with
        `422` rather than cited. The citation hashes the whole geometry source
        file; `include=metrics` supplies the per-area `geometryHash`. The boundary release's
        `metadataHash` pins its metadata, which names the source file but does
        not hash its contents. The envelope's top-level `atlasRelease` is the
        release of the API response itself: use `citation.identity.contentHash`
        for the compiled area identity, `citation.boundary.metadataHash` for the
        boundary metadata, and the hashes under `citation.measures`,
        `citation.crosswalks` and `citation.geometry` for the other artifacts
        that support a cited result.


        `metrics` measures the area's geometry without transferring its
        coordinates: its bounding box, centroid, label point, area and
        perimeter. The same source, reprojection and declared grid corrections
        apply as for the geometry itself, and `metrics.geometrySource` records
        them. Area is ellipsoidal, taken through EPSG:6933 (WGS 84 / NSIDC
        EASE-Grid 2.0 Global), a Lambert cylindrical equal-area projection on
        the WGS 84 ellipsoid, so projected area is area on the ellipsoid and no
        correction is applied; holes are subtracted. Perimeter sums every ring,
        holes included, each edge's ground length coming from the ellipsoid's
        radii of curvature at its mid-latitude. The centroid is the centre of
        area in that same projection, inverted back to WGS 84. `labelPoint` is
        guaranteed to lie inside the geometry: the centroid where that falls
        within the area, otherwise the midpoint of the widest run of interior
        found on latitudes sampled across the bounding box; `labelPointMethod`
        says which was used. These figures describe the boundary as that release
        publishes it, at its own generalisation. They are not a published
        land-area statistic: a coastline-clipped boundary still encloses inland
        water, so they differ from the ONS Standard Area Measurement that
        `population-density` uses as its denominator. The `method` block repeats
        this with every response. An area whose geometry carries no polygon to
        measure, such as a release held only as points, is refused with `422`
        rather than measured as zero. `geometrySource.validity` carries the
        build-time validity report for the full WGS84 geometry. Invalid geometry
        is not repaired; measurements from it may be unreliable. An unmeasurable
        geometry's `422` response also carries `geometrySource` and its report.
        If measurement throws after geometry is loaded, the `503` problem
        retains that provenance and report too.
      x-likely-refusal:
        status: 404
        code: area_not_in_release
        when:
          "The code is real but not in this release. `presentIn` lists the releases
          that hold it."
        x-example-request: "/v1/areas/ward/2016-12-gb-bgc/E05013830"
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: The official source code for this area on this boundary release.
        - name: include
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum: [dossier, capabilities, citation, metrics]
          style: form
          explode: false
          description: >
            Optional comma-separated expansions. `dossier` adds boundary
            evidence, availability and verified-resource links without repeating
            the area identity; `capabilities`, `citation` and `metrics` are
            described above.
        - name: measure
          in: query
          required: false
          schema:
            type: array
            items: { type: string }
          description: >
            With `include=citation`, a measure id from `GET /measures`, or one
            of its aliases, to cite. Repeatable.
        - name: crosswalk
          in: query
          required: false
          schema:
            type: array
            items: { type: string }
          description: >
            With `include=citation`, a crosswalk id from `GET /crosswalks` to
            cite. Repeatable.
      responses:
        "200":
          description: The matching compiled area.
          headers:
            Deprecation:
              $ref: "#/components/headers/ReleaseDeprecation"
            Sunset:
              $ref: "#/components/headers/ReleaseSunset"
            Link:
              $ref: "#/components/headers/ReleaseSuccessorLink"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaEnvelope"
              x-example-request: "/v1/areas/constituency/2024-07-uk-bgc/E14001262"
              example:
                apiVersion: v1
                atlasRelease:
                  "sha256:9edc254c5d4cd0a90fc5d3b2544e5f64946d6d0e6a8b68860e3aa6f0a\
                  c8d0912"
                data:
                  id: constituency/2024-07-uk-bgc/E14001262
                  geography: constituency
                  boundaryRelease: 2024-07-uk-bgc
                  code: E14001262
                  name: Halifax
                  postcodes:
                    live: 3412
                    terminated: 1412
                    largeUser: 123
                    edition: "2026-08"
                meta:
                  nextCursor: null
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            With `include=citation`, a named measure holds no observation for
            this area in a source assessed against this boundary release, or a
            named crosswalk publishes no relationship for it. With
            `include=metrics`, the area's geometry carries no polygon to
            measure.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >
            An `include` needs an artifact this deployment has not built: the
            data catalogue and crosswalk inventory for `citation`, or geometry
            for `metrics`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /areas/{geography}/{release}/{code}/relationships:
    get:
      operationId: getAreaRelationships
      tags: ["Geography"]
      summary: Get published relationships for one compiled area
      x-likely-refusal:
        status: 404
        code: area_not_in_release
        when:
          "The code is real but not in this release. `presentIn` lists the releases
          that hold it."
        x-example-request: "/v1/areas/ward/2016-12-gb-bgc/E05013830/relationships"
      description: >
        Returns only relationships from published crosswalks. A
        clean-containment mapping is represented as within from child to parent
        and contains in reverse. An official historical lookup is represented as
        successor from source to target and predecessor in reverse; a
        one-to-many lookup is split-from on each new area and a many-to-one
        lookup is merged-from on the new area. An extent-continuity crosswalk is
        equivalent-to in both directions. An area-overlap mapping is represented
        as overlaps in both directions, with the shared area and its share of
        each side.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: The official source code for this area on this boundary release.
      responses:
        "200":
          description: The area identity and its published relationship edges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaRelationshipsEnvelope"
              x-example-request:
                "/v1/areas/localAuthority/2023-05-uk-bgc-v2/E08000025/relati\
                onships"
              example:
                apiVersion: v1
                atlasRelease: sha256:5c4aa4529cbfbd5e4c844c55cddba1ef04a7bf76f3eaa085a357fff401af6d0c
                data:
                  id: localAuthority/2023-05-uk-bgc-v2/E08000025
                  geography: localAuthority
                  boundaryRelease: 2023-05-uk-bgc-v2
                  code: E08000025
                  name: Birmingham
                  relationships:
                    - relation: contains
                      counterpart:
                        id: ward/2023-05-uk-bgc/E05011118
                        geography: ward
                        boundaryRelease: 2023-05-uk-bgc
                        code: E05011118
                        labels:
                          - Acocks Green
                      crosswalk:
                        id: ward-2023-05-uk-bgc-to-local-authority-2023-05-uk-bgc-v2-clean-containment
                        method: clean-containment
                        quality: publisher-supplied
                        weighting:
                          status: not-applicable
                meta:
                  nextCursor: null
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /areas/{geography}/{release}/{code}/history:
    get:
      operationId: getAreaHistory
      tags: ["Geography"]
      summary: Explain a code's published historical relationships and same-code
        continuity
      x-likely-refusal:
        status: 404
        code: area_not_in_release
        when:
          "The code is real but not in this release. `presentIn` lists the releases
          that hold it."
        x-example-request: "/v1/areas/ward/2016-12-gb-bgc/E05013830/history"
      description: >
        Returns a bounded traversal of published historical relationships plus
        every other release of the same geography that contains the same code.
        Each lineage entry names the area the walk stood on as `from` and the
        area it reached as `counterpart`. A link a crosswalk publishes from both
        ends is one edge and is reported once, whichever end the walk reaches it
        from. Same-code continuity is not evidence of unchanged geometry or a
        one-to-one historical equivalent.
      parameters:
        - $ref: "#/components/parameters/Geography"
        - $ref: "#/components/parameters/Release"
        - $ref: "#/components/parameters/AreaCode"
        - name: depth
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
          description: Maximum number of declared historical edges to follow.
      responses:
        "200":
          description: Area history, including a warning about same-code continuity.
          content:
            application/json:
              schema: { type: object }
              x-example-request: "/v1/areas/localAuthority/2023-05-uk-bgc-v2/E08000025/history"
              example:
                apiVersion: v1
                atlasRelease: sha256:5c4aa4529cbfbd5e4c844c55cddba1ef04a7bf76f3eaa085a357fff401af6d0c
                data:
                  id: localAuthority/2023-05-uk-bgc-v2/E08000025
                  geography: localAuthority
                  boundaryRelease: 2023-05-uk-bgc-v2
                  code: E08000025
                  name: Birmingham
                  relationships:
                    - relation: predecessor
                      counterpart:
                        id: localAuthority/2022-12-uk-bgc-v2/E08000025
                        geography: localAuthority
                        boundaryRelease: 2022-12-uk-bgc-v2
                        code: E08000025
                        labels: [Birmingham]
                      crosswalk:
                        id: local-authority-2022-12-uk-bgc-v2-to-2023-05-uk-bgc-v2-official-lookup
                        method: official-lookup
                        quality: publisher-supplied
                        weighting:
                          status: not-provided
                  lineage:
                    - relation: predecessor
                      depth: 1
