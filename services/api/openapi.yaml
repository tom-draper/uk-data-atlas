              schema: { type: object }
        "400":
          $ref: "#/components/responses/InvalidQuery"

  /locations/{location-id}:
    get:
      operationId: getNamedLocation
      tags: ["Geography"]
      summary: Get one curated area collection's definition
      x-likely-refusal:
        status: 404
        when:
          "The id is guessed rather than listed. `/v1/locations?q=` searches them by
          name."
        x-example-request: "/v1/locations/wessex"
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - name: asOf
          in: query
          schema: { type: string, format: date }
          description:
            Select the member codes effective on this date. Omit it to return
            the complete dated definition.
        - name: include
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum: [capabilities]
          style: form
          explode: false
          description: >
            `capabilities` lists, under `capabilities`, the compiled releases
            where the location's member codes can be read directly (`direct`),
            plus each materialised crosswalk view into those members (`members`)
            and out to its parents (`parents`). A view is a link with the exact
            geography, release and crosswalk to request; the API never chooses a
            crosswalk silently. A `partial` direct view contains some, but not
            all, listed member codes. A `not-built` result identifies a
            deployment that has not loaded the projection inventory.
      responses:
        "200":
          description: The location's definition, source codes and bounds.
          content:
            application/json:
              schema: { type: object }
              x-example-request: "/v1/locations/london"
              example:
                apiVersion: v1
                atlasRelease: sha256:5c4aa4529cbfbd5e4c844c55cddba1ef04a7bf76f3eaa085a357fff401af6d0c
                data:
                  id: london
                  label: London
                  kind: region
                  source:
                    publisher: Office for National Statistics
                    lookup: local-authority-to-region/2025-04-en
                    code: E12000007
                  definitionRevision: 2
                  memberGeography: localAuthority
                  memberCodes:
                    - E09000001
                  validity: { from: null, to: null }
                  bbox:
                    - -0.5
                meta:
                  nextCursor: null
        "404":
          $ref: "#/components/responses/NotFound"

  /locations/{location-id}/comparison:
    get:
      operationId: compareNamedLocationMembership
      tags: ["Geography"]
      summary: Compare a named location's direct membership between two dates
      x-likely-refusal:
        status: 400
        when:
          "A date is missing or is a year rather than a calendar date. `from` and
          `to` are both YYYY-MM-DD."
        x-example-request: "/v1/locations/lancashire/comparison?from=1974&to=2026-01-01"
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Retained, added and removed direct member codes.
          content:
            application/json:
              schema: { type: object }
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"

  /locations/{location-id}/geometry:
    get:
      operationId: getNamedLocationGeometry
      tags: ["Geography"]
      summary: Get a curated area's compiled GeoJSON geometry
      x-likely-refusal:
        status: 404
        when: "The location id is not listed by `/v1/locations`."
        x-example-request: "/v1/locations/nowhere/geometry"
      description: >
        Returns the compiled union geometry for the location's fully resolved
        member release. It is unavailable rather than estimated when no such
        geometry has been built.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: The location as a GeoJSON Feature.
          content:
            application/json:
              schema: { type: object }
              x-example-request: "/v1/locations/greater-manchester/geometry"
              example:
                apiVersion: v1
                atlasRelease: sha256:5c4aa4529cbfbd5e4c844c55cddba1ef04a7bf76f3eaa085a357fff401af6d0c
                data:
                  type: Feature
                  id: greater-manchester
                  properties:
                    id: greater-manchester
                    label: Greater Manchester
                    memberGeography: localAuthority
                    boundaryRelease: 2026-05-uk-bgc
                    bbox: [-2.73, 53.33, -1.91, 53.69]
                  geometry:
                    type: MultiPolygon
                    coordinates:
                      [
                        [
                          [
                            [-2.73, 53.33],
                            [-1.91, 53.33],
                            [-1.91, 53.69],
                            [-2.73, 53.33],
                          ],
                        ],
                      ]
                meta:
                  nextCursor: null
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogueUnavailable"

  /locations/{location-id}/members:
    get:
      operationId: getNamedLocationMembers
      tags: ["Geography"]
      summary: Resolve a named location's members in one geography and release
      x-likely-refusal:
        status: 400
        when:
          "No `release` is given. Members are resolved in one named release, never
          the latest by default."
        x-example-request: "/v1/locations/north-west/members"
      description: >
        `release` is required because location definitions may include legacy
        codes. Missing members are returned explicitly; this route never applies
        an implicit historical conversion. A `coverage` object counts resolved
        and unresolved members and classifies each unresolved code against the
        compiled releases of its geography as `superseded`, `not-yet-current`,
        `absent-from-release` or `unknown`, naming the releases that are the
        evidence. The classification is relative to the requested release and
        reports code membership only; it asserts nothing about geometry.


        A location declares the geography of its member codes, so asking for
        that geography matches them directly and `membership` is
        `direct-code-match`. Any other geography has to be reached through a
        published crosswalk, named with `via`: the wards of North Wales, the
        constituencies of Merseyside. Asking without `via` returns a 400 that
        lists the crosswalks published for that geography and release, so the
        choice is the caller's and is made from what exists.


        What membership means depends on the crosswalk named, and the response
        says which. Through a `clean-containment` crosswalk it is
        `fully-contained`: the publisher places each area wholly inside one
        parent, so no area is counted in part. Through an `area-overlap`
        crosswalk it is `weighted-overlap`: an area straddling the edge of the
        location carries the `weight` lying inside and is marked `partial`, and
        `partialMembers` counts them. Shares in two members of the same location
        are added, so an area split between them is whole and not partial.


        Each member names the defining area it was found `through`, and
        `parentBoundaryRelease` names the release the location's own codes were
        resolved against, which is the release the crosswalk ends at rather than
        the one asked for. Each member's `relation` is `within` when the whole
        area lies inside the location and `partly-within` when only its `weight`
        does; only the first may be counted whole.


        `reach` says which of the location's authorities the crosswalk places
        any area under. A crosswalk covering fewer countries than the location
        spans, such as LSOAs for a Scottish city, leaves authorities in
        `unreached`, and the members under them are missing from the answer
        rather than absent from the ground.
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - name: geography
          in: query
          schema:
            type: string
          description: >
            The geography to resolve members in. Omit it to use the location's
            declared `memberGeography`; any other geography requires `via`.
        - name: release
          in: query
          required: true
          schema: { type: string }
          description: >
            The boundary release to resolve members in, which fixes the vintage
            of the codes returned.
        - name: via
          in: query
          required: false
          schema: { type: string }
          description: >
            The published crosswalk to resolve through, required for any
            geography other than the location's `memberGeography`. Omit it to be
            told which are available.
          example: ward-2023-05-uk-bgc-to-local-authority-2023-05-uk-bgc-v2-clean-containment
        - name: asOf
          in: query
          schema: { type: string, format: date }
          description: >
            Select member codes effective on this date. Date selection is
            currently available for direct member-code matches only, not a
            crosswalk projection.
      responses:
        "400":
          description: >
            `release` is missing, or a geography other than the location's
            `memberGeography` was asked for without `via`. The detail lists the
            crosswalks published for that geography and release.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: >
            Resolved members, explicitly unresolved codes, and the coverage that
            explains each one.
          content:
            application/json:
              schema: { type: object }
              x-example-request:
                "/v1/locations/north-wales/members?geography=ward&release=20\
                24-12-uk-bgc&via=ward-2024-12-uk-bgc-to-local-authority-2024-12\
                -uk-bgc-clean-containment"
              example:
                apiVersion: v1
                atlasRelease: sha256:5c4aa4529cbfbd5e4c844c55cddba1ef04a7bf76f3eaa085a357fff401af6d0c
                data:
                  location:
                    id: north-wales
                    label: North Wales
                    kind: editorial-grouping
                    definitionRevision: 1
                    memberGeography: localAuthority
                    memberCodes:
                      - W06000001
                    validity: { from: null, to: null }
                    bbox:
                      - -4.8
                  geography: ward
                  boundaryRelease: 2024-12-uk-bgc
                  reach:
                    memberCount: 6
                    reachedCount: 6
                    unreached: []
                    complete: true
                meta:
                  nextCursor: null
        "404":
          $ref: "#/components/responses/NotFound"

  /locations/{location-id}/parents:
    get:
      operationId: getNamedLocationParents
      tags: ["Geography"]
      summary: Find the areas of a coarser geography a named location covers or meets
      x-likely-refusal:
        status: 400
        when: "`geography` is given without `release`."
        x-example-request: "/v1/locations/north-west/parents?geography=localAuthority"
      description: >
        The other direction from `members`: which regions, counties, combined
        authorities or countries a location lies in, and whether it takes in
        each one whole. A location is defined by codes in its declared
        `memberGeography`, so a parent geography is reached through a published
        crosswalk out of that geography, named with `via`; asking without it
        lists the crosswalks published for that geography and release.


        Each parent's `relation` is `covers` when the location takes in all of
        it and `intersects` when it takes in only part. Through a containment or
        membership lookup that is decided by count, and `parentMemberCount` says
        how many authorities the publisher places in the parent. Through an
        area-overlap crosswalk it is decided by area, and `coveredShare` is the
        share of the parent the location's members cover, with 0.99 or more
        counting as cover. `members` lists the location's own authorities in
        each parent.


        `locationWithin` names the single parent holding every member, and is
        null when the members fall in several parents or the crosswalk places
        any of them in none. Those are listed in `unplaced`: a Welsh authority
        under an English region lookup, or a district outside every combined
        authority. `coverage` classifies the location's codes against the
        authority release the crosswalk starts from, exactly as on `members`.


        Every answer is compiled in advance for each location and crosswalk, so
        this reads a projection rather than walking a crosswalk per request.
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - name: geography
          in: query
          required: true
          schema: { type: string }
          description: The coarser geography to find parents in, such as `region`.
        - name: release
          in: query
          required: true
          schema: { type: string }
          description: The boundary release of that geography.
        - name: via
          in: query
          required: false
          schema: { type: string }
          description: >
            The published crosswalk from the location's declared
            `memberGeography` to that geography. Omit it to be told which are
            available.
      responses:
        "200":
          description:
            The parents the location covers or meets, and any members placed in
            none.
          content:
            application/json:
              schema: { type: object }
              x-example-request:
                "/v1/locations/greater-manchester/parents?geography=combined\
                Authority&release=2025-12-en-bgc&via=local-authority-2025-12-uk\
                -bgc-to-combined-authority-2025-12-en-bgc-official-lookup"
              example:
                apiVersion: v1
                atlasRelease: sha256:5c4aa4529cbfbd5e4c844c55cddba1ef04a7bf76f3eaa085a357fff401af6d0c
                data:
                  geography: combinedAuthority
                  boundaryRelease: 2025-12-en-bgc
                  via:
                    id: local-authority-2025-12-uk-bgc-to-combined-authority-2025-12-en-bgc-official-lookup
                    method: clean-containment
                    quality: publisher-supplied
                  memberGeography: localAuthority
                  memberBoundaryRelease: 2025-12-uk-bgc
                  locationWithin:
                    id: combinedAuthority/2025-12-en-bgc/E47000001
                    code: E47000001
                    name: Greater Manchester
                  parents:
                    - id: combinedAuthority/2025-12-en-bgc/E47000001
                      code: E47000001
                      name: Greater Manchester
                      relation: covers
                      members:
                        - id: localAuthority/2025-12-uk-bgc/E08000003
                          code: E08000003
                          name: Manchester
                      parentMemberCount: 10
                  unplaced: []
                meta:
                  nextCursor: null
        "400":
          description: >
            `geography` or `release` is missing, or `via` is not given; the
            detail lists the crosswalks published for that geography and
            release.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    ByteRange:
      name: Range
      in: header
      required: false
      schema:
        type: string
        example: bytes=0-16383
      description: >
        One byte range of the file, as `bytes=start-end`, `bytes=start-` or
        `bytes=-length`. This is how a PMTiles client reads an archive: the
        header, then a directory, then only the tiles it needs. Several ranges
        in one request are not supported and get the whole file, as does an
        `If-Range` that no longer matches the ETag. Files stored gzipped (the
        GeoJSON downloads) are always sent whole.
    PointLookupCrs:
      name: crs
      in: query
      required: false
      schema:
        enum: [EPSG:4326, EPSG:27700, EPSG:29902]
        default: EPSG:4326
      description: >
        The input coordinate reference system. The default `EPSG:4326` uses
        `lng` and `lat`; `EPSG:27700` uses British National Grid `easting` and
        `northing` or an Ordnance Survey `gridref`; `EPSG:29902` uses Irish Grid
        `easting` and `northing`.
    CoordinateTargetCrs:
      name: to
      in: query
      required: false
      schema:
        enum: [EPSG:4326, EPSG:27700, EPSG:29902]
        default: EPSG:4326
      description: >
        The requested output CRS. `point` is always WGS 84; choose a national
        grid here to add `target` with easting and northing. The API rejects a
        point that falls outside its supported range for the requested grid.
    BritishGridReferenceDigits:
      name: gridrefDigits
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 5, default: 5 }
      description: >
        With `to=EPSG:27700`, the maximum number of digits per coordinate in
        `target.gridReference`. The API may return fewer digits when the input
        or transformation uncertainty requires a coarser cell. It is invalid
        with another target CRS.
    PointLookupEasting:
      name: easting
      in: query
      required: false
      schema: { type: string, pattern: "^[+-]?\\d+(\\.\\d+)?$" }
      description: >
        Easting in grid metres. Required with `crs=EPSG:27700` or
        `crs=EPSG:29902`; do not combine it with WGS 84 `lng`/`lat`.
    PointLookupNorthing:
      name: northing
      in: query
      required: false
      schema: { type: string, pattern: "^[+-]?\\d+(\\.\\d+)?$" }
      description: >
        Northing in grid metres. Required with `crs=EPSG:27700` or
        `crs=EPSG:29902`; do not combine it with WGS 84 `lng`/`lat`.
    PointLookupGridReference:
      name: gridref
      in: query
      required: false
      schema:
        { type: string, pattern: "^[A-Za-z]{2}(?:[\\s-]*\\d[\\d\\s-]*)?$" }
      description: >
        A two-letter Ordnance Survey National Grid reference, followed by an
        even number of digits from 2 to 10, for example `TQ 30000 80000`. Use
        only with `crs=EPSG:27700`; do not combine it with `easting` or
        `northing`. A grid reference denotes a square, represented by its cell
        centre with the cell's half-diagonal included in uncertainty.
    PointLookupLongitudeAlias:
      name: lon
      in: query
      required: false
      schema: { type: string, pattern: "^[+-]?\\d+(\\.\\d+)?$" }
      description: Alias for `lng`, the WGS 84 longitude in decimal degrees.
    PointLookupLongitudeLongAlias:
      name: longitude
      in: query
      required: false
      schema: { type: string, pattern: "^[+-]?\\d+(\\.\\d+)?$" }
      description: Alias for `lng`, the WGS 84 longitude in decimal degrees.
    PointLookupGeography:
      name: geography
      in: query
      required: false
      schema:
        type: array
        maxItems: 4
        items: { type: string }
      style: form
      explode: true
      description: >
        A geography to look the point up in. Repeat it or give a comma-separated
        list, up to four in total. A geography named only in a pinned `release`
        need not be repeated here.
    PointLookupRelease:
      name: release
      in: query
      required: false
      schema:
        type: array
        items: { type: string }
      style: form
      explode: true
      description: >
        A release to pin, as `{geography}/{release}`, such as
        `ward/2025-12-uk-bgc`, or `ward/latest` for its newest unambiguous
        published release. A bare release id is accepted when exactly one
        geography is requested. A pinned release is used whatever `date` says.
    PointLookupDate:
      name: date
      in: query
      required: false
      schema: { type: string, pattern: "^\\d{4}-\\d{2}(-\\d{2})?$" }
      description: >
        A calendar date as `YYYY-MM-DD`, or a month as `YYYY-MM`. Every
        geography without a pinned release uses the latest release dated on or
        before it; without a date it uses the newest unambiguous published
        release. The country boundaries used to place a point that matches
        nothing are chosen the same way.
    PostcodeView:
      name: view
      in: query
      required: false
      schema: { enum: [full, compact], default: full }
      description: >
        `full` explains each answer: the centroid's positional quality, the
        transformation, each release's selection, resolution and provenance, and
        each match's distance to its boundary. `compact` gives only the
        postcode, its WGS 84 point, each area's id, code, name and
        `nearBoundary`, any `caution`, and the source's attribution.
    PointLookupAccuracy:
      name: accuracy
      in: query
      required: false
      schema: { type: number, exclusiveMinimum: 0, maximum: 100000 }
      description: >
        How far the true position may lie from the coordinate, in metres, such
        as a GPS fix's reported accuracy. Without it, uncertainty is half the
        coordinate's last written decimal place, which overstates it where a
        client drops trailing zeros.
    Geography:
      name: geography
      in: path
      required: true
      schema:
        type: string
      description: A geography type id, e.g. `constituency` or `ward`.
    Release:
      name: release
      in: path
      required: true
      schema:
        type: string
      description: >
        A boundary release id, e.g. `2024-07-uk-bgc`, or `latest` for the
        geography's newest release: the one `/boundary-releases:resolve` chooses
        for the furthest date. A response to `latest` names the release it read
        in `Content-Location`. A geography whose newest month holds several
        releases that differ in more than coverage, or that has a release whose
        id and registry metadata supply no date, is refused with `409` and the releases that could
        be newest.
    CrosswalkId:
      name: crosswalk-id
      in: path
      required: true
      schema:
        type: string
      description: A crosswalk id, e.g. `constituency-2010-to-2024-official-lookup-v2`.
    MeasureId:
      name: measure-id
      in: path
      required: true
      schema:
        type: string
      description: >
        A measure id from `GET /v1/measures`, such as `population`, or one of
        its `aliases`, such as `house-prices`. An alias is read as the id it
        names, and the response's `Content-Location` header gives the request it
        was read as. Case, spaces and punctuation are set aside, so `House
        Prices` is `house-prices`.
    AreaCode:
      name: code
      in: path
      required: true
      schema:
        type: string
      description: An area's official code in that release, e.g. `E05000932`.
    ExportId:
      name: export-id
      in: path
      required: true
      schema:
        type: string
      description: An export id from `GET /v1/exports`; one source partition of one measure.
    LocationId:
      name: location-id
      in: path
      required: true
      schema:
        type: string
      description: A curated named location id from `GET /v1/locations`, e.g.
        `greater-manchester`.
    SourceGeography:
      name: geography
      in: query
      required: true
      schema:
        enum:
          [
            ward,
            localAuthority,
            constituency,
            lsoa,
            msoa,
            dataZone,
            superOutputArea,
          ]
      description: >
        The geography the publisher observed the values on. With `codeYear` it
        selects one source partition of the measure; it never converts values
        onto another geography.
    PlaceSourceGeography:
      name: geography
      in: query
      required: false
      schema:
        enum:
          [
            ward,
            localAuthority,
            constituency,
            lsoa,
            msoa,
            dataZone,
            superOutputArea,
          ]
      description: >
        The geography the publisher observed the values on. With `codeYear` it
        selects one source partition of the measure; it never converts values
        onto another geography. It may be left out when `place` is a reference
        such as `localAuthority/E08000035`, which names it.
    OptionalSourceGeography:
      name: geography
      in: query
      required: false
      schema:
        enum:
          [
            ward,
            localAuthority,
            constituency,
            lsoa,
            msoa,
            dataZone,
            superOutputArea,
          ]
      description: >
        The geography the publisher observed the values on, selecting one source
        partition with `codeYear`. It may be left out when an area named in the
        request is published on one geography of the measure, or when the
        measure is published on only one; geographies are never chosen between,
        so a measure published on several otherwise needs it. A selected
        geography is returned in `defaults`.
    OptionalSourceCodeYear:
      name: codeYear
      in: query
      required: false
      schema:
        type: integer
      description: >
        The year of the boundaries the values are published on. Left out, the
        geography's newest partition is used and returned in `defaults`, unless
        two datasets share it, when `datasetId` must choose.
    OptionalSourcePeriod:
      name: period
      in: query
      required: false
      schema:
        type: string
      description: >
        The observation period as the partition publishes it. Left out, the
        partition's latest period is used and returned in `defaults`.
    SourceCodeYear:
      name: codeYear
      in: query
      required: true
      schema:
        type: integer
      description: >
        The year of the boundaries the values are published on: `2023` with
        `geography=localAuthority` means local authorities as they were in 2023.
        It names the publisher's area set, not one boundary release; a year can
        have several releases (May and December), and `release` chooses which to
        draw where a route offers it.
    Place:
      name: place
      in: query
      required: false
      schema:
        type: string
      description: >
        The area, as its name, its code in the source partition, such as
        `E08000035`, or a place reference from `/places`, such as
        `localAuthority/E08000035`, which also names its geography. A name is
        read among the areas the measure is published for; one that means
        several is a 409 listing each. A postcode, or a larger place the measure
        is summed over, is answered by `/data/{measure-id}/value`.
    SourcePeriod:
      name: period
      in: query
      required: true
      schema:
        type: string
      description: >
        The observation period as the partition publishes it, e.g. `2022`,
        `2026-04` or `year-ending-2026-03`. A measure's periods are listed in
        its catalogue entry.
    PageCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: >
        The `meta.nextCursor` of the previous page. A cursor is opaque and
        belongs to the query that issued it.
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
      description: How many records to return, 1 to 500.

  headers:
    ReleaseDeprecation:
      description: >
        Present when the boundary release this response is about is deprecated.
        An RFC 9745 structured date, `@` and the Unix time it was deprecated.
        The release's `deprecation` record has the reason.
      schema:
        type: string
        example: "@1792972800"
    ReleaseSunset:
      description: >
        Present when a deprecated boundary release has a sunset date: an RFC
        8594 HTTP date after which it may be removed.
      schema:
        type: string
        example: Thu, 01 Apr 2027 00:00:00 GMT
    ReleaseSuccessorLink:
      description: >
        Present when the boundary release this response is about is deprecated.
        An RFC 8288 link with `rel="successor-version"` to the release that
        replaces it. A response that has its own `Link` relations carries both,
        comma separated.
      schema:
        type: string
        example: '</v1/boundary-releases/lsoa/2001-12-ew-bgc-v2>; rel="successor-version"'

  responses:
    PartialContent:
      description: >
        The requested byte range. `Content-Range` says which bytes these are and
        how long the whole file is; the ETag is the whole file's.
      headers:
        Content-Range:
          schema:
            type: string
            example: bytes 0-16383/684673
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    RangeNotSatisfiable:
      description: >
        The range starts past the end of the file. `Content-Range` gives the
        file's length as `bytes */length`.
      headers:
        Content-Range:
          schema:
            type: string
            example: bytes */684673
    AmbiguousArea:
      description: >
        An area name means more than one area the measure is published for.
        `choices` lists each, with `ask`, the same request with that area's code
        and geography in place of the name.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/AmbiguousPlaceProblem"
    NotFound:
      description: No resource matches that identity.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidQuery:
      description:
        A query parameter is malformed or its cursor is not valid for this
        result set.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CatalogueUnavailable:
      description: The referenced build artifact has not been built yet.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    GeometryUnavailable:
      description: >
        The area exists but its geometry cannot be served: no raw source is
        declared, or its CRS has no transformation to WGS84.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    CapabilityStatus:
      type: string
      enum: [available, partial, requires-conversion, unsupported, not-built]
      description: >
        The one vocabulary every capability answer uses. `available`: served
        directly and completely for what was asked. `partial`: served directly
        for only part of it. `requires-conversion`: not served directly, but a
        published conversion path answers it, and the answer names that path.
        `unsupported`: nothing the Atlas publishes answers it. `not-built`: this
        deployment has not built the artifact that would say. Every status but
        `available` carries a `reason`.

    Capability:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/CapabilityStatus"
        reason:
          type: string
          description: Why the status is not `available`; present on every other status.

    Problem:
      type: object
      description: >
        RFC 9457 Problem Details. Some routes add extension members: a value
        request for an ambiguous place name adds `choices`, one whose place the
        measure cannot answer adds `candidates`, every area route whose area
        identity resolves to nothing says why through `code` and `absence`, and
        a refused conversion does the same.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        geometrySource:
          $ref: "#/components/schemas/GeometrySource"
        choices:
          type: array
          description: >
            On a 409 Ambiguous Place: each place the name could mean, with its
            answer and the request that asks about it alone, as an object. On a
            refusal from an area's children routes: each release the children
            are published in, as a `{geography}/{release}` string.
          items:
            type: [object, string]
        candidates:
          type: array
          description: >
            On a 422 Place Not Served: each place the name matched, and why the
            measure does not answer it.
          items:
            type: object
        rejectedCount:
          type: integer
          description: Total rejected input rows for supplied-count conversion.
        rejected:
          type: array
          maxItems: 1000
          description: The first rejected rows in input order. No conversion was applied.
          items:
            type: object
            required: [index, area, reason, validation]
            properties:
              index: { type: integer }
              area: { type: string }
              reason: { type: string }
              validation: { type: object }
        code:
          type: string
          enum:
            - place_not_served
            - unsupported_geography
            - unknown_release
            - area_not_in_release
            - aggregation_not_supported
            - conversion_not_available
            - partial_coverage
            - ambiguous_place
            - incompatible_geometry
            - invalid_format
            - invalid_cursor
            - unknown_query_parameter
            - no_release_for_date
            - ambiguous_release
          description: >
            On a 404 from an area or boundary release route:
            `unsupported_geography` when the geography is not published or the
            release's area identities are not compiled, `unknown_release` when
            the geography has no release with that id, and `area_not_in_release`
            when the release does not hold the code. On a 422 from an aggregate
            or a conversion: `aggregation_not_supported` when the measure's
            values do not add over areas or its weights cannot be used,
            `conversion_not_available` when the named crosswalk or source
            release cannot carry the partition without dropping, splitting or
            assuming values, and `partial_coverage` when a named location or a
            weight partition leaves out areas the sum would need. A partial
            country or region total is not refused; it is a 200 whose coverage
            says so. From a value request for a place: `ambiguous_place` when
            the name means several places the measure answers differently. From
            an observation request: `incompatible_geometry` when the chosen
            boundary release does not hold every source code. On a 400:
            `invalid_format` for a `format` the route does not serve,
            `invalid_cursor` for a cursor this API did not issue or that belongs
            to another query, and `unknown_query_parameter` when the operation
            does not declare a supplied parameter. From a release resolution:
            `no_release_for_date` and `ambiguous_release`.
        absence:
          type: string
          enum:
            - unknown-geography
            - unknown-release
            - release-not-compiled
            - superseded
            - not-yet-current
            - absent-from-release
            - unknown
            - crosswalk-geography-mismatch
            - source-areas-not-mapped
            - unweighted-split
            - before-first-release
            - country-not-covered
            - no-dated-release
          description: >
            Which absence left the area or conversion unresolved. For a
            conversion, the crosswalk starts at another geography, does not map
            some source areas, or splits some across targets with no published
            weight. For an area, a code is `superseded` when only older releases
            of the geography hold it, `not-yet-current` when only newer ones do,
            `absent-from-release` when releases on both sides or undated
            releases hold it, and `unknown` when no compiled release does. The
            classification uses code membership only: a superseded code may have
            been abolished, merged or recoded, and none of those is claimed.
        parameter:
          type: string
          description: The query parameter the operation does not declare.
        suggestion:
          type: string
          description: The closest declared query parameter, when one is unambiguous.
        presentIn:
          type: array
          description: >
            With `area_not_in_release`: the compiled releases that do hold the
            code, with the name it carries in each.
          items:
            type: object
            required: [boundaryRelease, name, href]
            properties:
              boundaryRelease: { type: string }
              name: { type: string }
              href: { type: string }
        areaCount:
          type: integer
          description: >
            With `source-areas-not-mapped` or `unweighted-split`: how many
            source areas the conversion could not carry.
        areaSample:
          type: array
          items: { type: string }
          description: The first of those source area codes, at most ten.
        availableReleases:
          type: array
          description: With `unknown-release`, the releases published for the geography.
          items:
            type: object
            required: [id, href]
            properties:
              id: { type: string }
              href: { type: string }
        links:
          type: object
          additionalProperties: { type: string }
          description: >
            With `unknown-geography`, the geography list; with
            `release-not-compiled`, the boundary release.

    UnsupportedGeographyProblem:
      description: >
        The geography is not published, or the release's area identities are not
        compiled. A caller can act on `links` instead of reading the detail.
        Produced by `GET /v1/areas/nowhere/2024-12-uk-bgc/E05000932`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, absence]
          properties:
            status:
              enum: [404]
            code:
              const: unsupported_geography
      examples:
        - type: https://api.ukdataatlas.com/problems/not-found
          title: Not Found
          status: 404
          detail: No boundary release is published for the geography nowhere.
          code: unsupported_geography
          absence: unknown-geography
          links:
            boundaries: /v1/boundaries

    UnknownReleaseProblem:
      description: >
        The geography is published but no release of it has that id;
        `availableReleases` lists those that do exist. A caller can act on
        `availableReleases` instead of reading the detail. Produced by `GET
        /v1/areas/ward/1999-12-uk-bgc/E05000932`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, absence, availableReleases]
          properties:
            status:
              enum: [404]
            code:
              const: unknown_release
      examples:
        - type: https://api.ukdataatlas.com/problems/not-found
          title: Not Found
          status: 404
          detail: No ward boundary release is published as 1999-12-uk-bgc.
          code: unknown_release
          absence: unknown-release
          availableReleases:
            - id: 2026-05-uk-bgc
              href: /v1/boundary-releases/ward/2026-05-uk-bgc
            - id: 2025-12-uk-bgc
