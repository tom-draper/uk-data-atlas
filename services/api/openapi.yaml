                        type: integer
                      crosswalkCount:
                        type: integer

    GeographyInventoryEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/GeographyInventory"

    Area:
      type: object
      required: [id, geography, boundaryRelease, code, name]
      properties:
        id:
          type: string
        geography:
          type: string
        boundaryRelease:
          type: string
        code:
          type: string
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
    AreaInRelease:
      type: object
      description: >
        An area listed under a response that already states its geography and
        boundary release, which are not repeated for each area.
      required: [id, code, name]
      properties:
        id:
          type: string
        geography:
          type: string
        boundaryRelease:
          type: string
        code:
          type: string
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
    AreaDetail:
      allOf:
        - $ref: "#/components/schemas/Area"
        - type: object
          properties:
            postcodes:
              $ref: "#/components/schemas/AreaPostcodeCounts"
            dossier:
              type: object
              description: >
                Present only with `include=dossier`; boundary evidence,
                availability and links for this exact area identity.
            capabilities:
              type: object
              description: >
                Present only with `include=capabilities`; what the API can serve
                for this exact area: `geometry`, `relationships`,
                `namedLocations` and `data`.
            citation:
              type: object
              description: >
                Present only with `include=citation`; the artifacts that serve
                this area, pinned by content hash, with their attribution and
                licences.
            metrics:
              $ref: "#/components/schemas/AreaMetrics"

    AreaPostcodeCounts:
      type: object
      description: >
        Unit postcode centroid counts for this area, compiled from the ONS
        Postcode Directory. `live` is the number with no termination date;
        `terminated` is retained historical directory records; `largeUser` is
        the live subset marked as serving a single large user. A postcode on a
        shared area boundary may be counted in each area it touches.
      required: [live, terminated, largeUser, edition]
      properties:
        live:
          type: integer
          minimum: 0
        terminated:
          type: integer
          minimum: 0
        largeUser:
          type: integer
          minimum: 0
        edition:
          type: string
          description: The ONS Postcode Directory edition used for the counts.

    AreaRelationship:
      type: object
      required: [relation, counterpart, crosswalk]
      properties:
        relation:
          enum:
            [
              within,
              contains,
              successor,
              predecessor,
              split-from,
              merged-from,
              equivalent-to,
              overlaps,
            ]
        overlap:
          description: >
            Present only for `overlaps` relationships. Each share is seen from
            this area's side: `shareOfArea` is the overlap as a share of this
            area and `shareOfCounterpart` as a share of the counterpart.
          type: object
          required: [areaM2, shareOfArea, shareOfCounterpart]
          properties:
            areaM2:
              type: integer
            shareOfArea:
              type: number
            shareOfCounterpart:
              type: number
        counterpart:
          type: object
          required: [id, geography, boundaryRelease, code, labels]
          properties:
            id:
              type: string
            geography:
              type: string
            boundaryRelease:
              type: string
            code:
              type: string
            labels:
              type: array
              items:
                type: string
        crosswalk:
          type: object
          required: [id, method, quality, weighting]
          properties:
            id:
              type: string
            method:
              $ref: "#/components/schemas/CrosswalkMethod"
            quality:
              $ref: "#/components/schemas/CrosswalkQuality"
            weighting:
              $ref: "#/components/schemas/CrosswalkWeighting"

    AreaWithRelationships:
      allOf:
        - $ref: "#/components/schemas/Area"
        - type: object
          required: [relationships]
          properties:
            relationships:
              type: array
              items:
                $ref: "#/components/schemas/AreaRelationship"
            childSelection:
              description: >
                Present on the children route. `contemporary` selects the child
                release current at the parent's release month; `release` records
                an exact child geography/release filter.
              oneOf:
                - type: object
                  required: [kind]
                  properties:
                    kind: { const: contemporary }
                    geography: { type: string }
                - type: object
                  required: [kind, geography, release]
                  properties:
                    kind: { const: release }
                    geography: { type: string }
                    release: { type: string }

    GeoJsonGeometry:
      type: object
      description: >
        A GeoJSON geometry object as read from the raw cached source, or a
        GeometryCollection when the source represents one area code as more than
        one feature fragment.
      required: [type]
      properties:
        type:
          type: string
        coordinates:
          description: Present on every geometry type except GeometryCollection.
        geometries:
          type: array
          items:
            $ref: "#/components/schemas/GeoJsonGeometry"
          description: Present only when type is GeometryCollection.

    AreaGeometry:
      type: object
      required: [type, id, properties, geometry]
      properties:
        type:
          const: Feature
        id:
          type: string
        properties:
          allOf:
            - $ref: "#/components/schemas/Area"
            - type: object
              required: [generalisation, geometrySource]
              properties:
                generalisation:
                  $ref: "#/components/schemas/Generalisation"
                geometrySource:
                  $ref: "#/components/schemas/GeometrySource"
        geometry:
          $ref: "#/components/schemas/GeoJsonGeometry"

    AreaNeighbours:
      allOf:
        - $ref: "#/components/schemas/Area"
        - type: object
          required:
            [
              id,
              geography,
              boundaryRelease,
              touches,
              border,
              method,
              neighbours,
            ]
          properties:
            id: { type: string }
            geography: { type: string }
            boundaryRelease: { type: string }
            touches:
              type: string
              enum: [edge, any]
            border:
              type: object
              required:
                [perimeterM, sharedBorderM, unsharedBorderM, pointOnlyTouches]
              properties:
                perimeterM: { type: number }
                sharedBorderM:
                  type: number
                  description: Border shared with the neighbours returned.
                unsharedBorderM:
                  type: number
                  description: >
                    The remainder: coastline, a national boundary, or a border
                    with an area outside this release. Nothing for a landlocked
                    area.
                pointOnlyTouches:
                  type: integer
                  description: >
                    Areas meeting only at a point, counted whether or not
                    `touches` returned them.
            method:
              type: object
              required: [rule, sharedBorder, unshared, limits]
              properties:
                rule: { type: string }
                sharedBorder: { type: string }
                unshared: { type: string }
                limits: { type: string }
            neighbours:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/AreaInRelease"
                  - type: object
                    required:
                      [
                        id,
                        touch,
                        sharedBorderM,
                        shareOfPerimeter,
                        sharedEdges,
                        sharedVertices,
                      ]
                    properties:
                      id: { type: string }
                      touch:
                        type: string
                        enum: [edge, point]
                      sharedBorderM:
                        type: number
                        description: Zero for a point touch.
                      shareOfPerimeter:
                        type: number
                        description: >
                          The shared border as a fraction of this area's own
                          perimeter.
                      sharedEdges: { type: integer }
                      sharedVertices: { type: integer }

    AreaNeighboursEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AreaNeighbours"

    AreaBoxSearch:
      type: object
      required:
        [
          bbox,
          geography,
          boundaryRelease,
          matched,
          returned,
          limit,
          truncated,
          relationRule,
          matches,
        ]
      properties:
        bbox:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
        geography: { type: string }
        boundaryRelease: { type: string }
        matched:
          type: integer
          description: Areas meeting the box, before the limit is applied.
        returned:
          type: integer
        limit:
          type: integer
        truncated:
          type: boolean
          description: Whether `matched` exceeded `limit`.
        relationRule:
          type: string
        geometry:
          type: string
          description: >
            Present only when no `tier` was asked for, saying how to get the
            coordinates.
        tier:
          type: string
          enum: [full, high, medium, low]
        toleranceM: { type: number }
        minEffectiveAreaM2: { type: number }
        generalisationMethod:
          type: object
          required: [rule, threshold, parts, sharedBorders]
          properties:
            rule: { type: string }
            threshold: { type: string }
            parts: { type: string }
            sharedBorders: { type: string }
        matches:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/AreaInRelease"
              - type: object
                required: [id, relation, boundingBox, geometrySource]
                properties:
                  id: { type: string }
                  relation:
                    type: string
                    enum: [within, overlaps]
                  boundingBox:
                    type: array
                    items: { type: number }
                    minItems: 4
                    maxItems: 4
                  geometrySource:
                    $ref: "#/components/schemas/GeometrySource"
                  generalisation:
                    type: object
                    description: Present only when a `tier` was asked for.
                    properties:
                      vertices: { type: integer }
                      verticesAtFullResolution: { type: integer }
                      parts: { type: integer }
                      partsAtFullResolution: { type: integer }
                  geometry:
                    $ref: "#/components/schemas/GeoJsonGeometry"

    AreaBoxSearchEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AreaBoxSearch"

    LookupPoint:
      type: object
      required: [lng, lat, crs, precision]
      properties:
        lng: { type: number }
        lat: { type: number }
        crs: { const: "EPSG:4326" }
        precision:
          type: object
          required: [decimalPlaces, uncertaintyM, basis]
          properties:
            decimalPlaces:
              oneOf:
                - type: object
                  required: [lng, lat]
                  properties:
                    lng: { type: integer }
                    lat: { type: integer }
                - type: object
                  required: [easting, northing]
                  properties:
                    easting: { type: integer }
                    northing: { type: integer }
                - type: object
                  required: [gridReference]
                  properties:
                    gridReference:
                      type: object
                      required: [easting, northing]
                      properties:
                        easting: { type: integer }
                        northing: { type: integer }
            uncertaintyM:
              type: number
              description: How far the true position may lie from the coordinate, in metres.
            basis:
              type: string
              enum:
                [
                  stated-accuracy,
                  decimal-places,
                  stated-accuracy-and-transformation,
                  decimal-places-and-transformation,
                  grid-reference-and-transformation,
                  stated-accuracy-and-grid-reference-and-transformation,
                ]
        input:
          type: object
          description:
            Present when British National Grid or Irish Grid input was
            transformed to WGS 84.
          required: [crs, easting, northing, transformation]
          properties:
            crs: { enum: [EPSG:27700, EPSG:29902] }
            easting: { type: number }
            northing: { type: number }
            gridReference:
              type: object
              description:
                Present when an Ordnance Survey National Grid reference was
                supplied.
              required: [value, cellSizeM, position]
              properties:
                value: { type: string, example: "TQ 30000 80000" }
                cellSizeM: { type: number }
                position: { const: cell-centre }
            transformation:
              type: object
              required: [name, epsg, accuracyM, areaOfUse]
              properties:
                name: { type: string }
                epsg: { type: string }
                accuracyM: { type: number }
                areaOfUse: { type: string }

    CoordinateConversion:
      type: object
      required: [point, targetCrs, note]
      properties:
        point:
          $ref: "#/components/schemas/LookupPoint"
        targetCrs: { enum: [EPSG:4326, EPSG:27700, EPSG:29902] }
        target:
          type: object
          description: >
            Present when `to` requests a national grid. The named EPSG
            transformation is used in its inverse direction from WGS 84.
          required: [crs, easting, northing, transformation, uncertaintyM]
          properties:
            crs: { enum: [EPSG:27700, EPSG:29902] }
            easting: { type: number }
            northing: { type: number }
            uncertaintyM:
              type: number
              description:
                Input uncertainty plus the transformation's stated accuracy, in
                metres.
            gridReference:
              type: object
              description: >
                A British National Grid cell containing the target coordinate,
                present only for an encodable EPSG:27700 target. Its cell is no
                finer than the target uncertainty permits.
              required: [value, digits, cellSizeM, position]
              properties:
                value: { type: string, example: "TQ 3000 8000" }
                digits: { type: integer, minimum: 1, maximum: 5 }
                cellSizeM: { type: number }
                position: { const: containing-cell }
            transformation:
              type: object
              required: [name, epsg, accuracyM, areaOfUse, direction]
              properties:
                name: { type: string }
                epsg: { type: string }
                accuracyM: { type: number }
                areaOfUse: { type: string }
                direction: { const: inverse }
        note: { type: string }

    CoordinateConversionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CoordinateConversion"

    PointCountry:
      type: object
      description: >
        The UK country the point lies in. `area-code` reads it from a matched
        area's GSS code; `country-boundary` tests the point against a country
        release, and a null `code` there means no UK country contains it.
      required: [code, determinedBy]
      properties:
        code:
          type: ["string", "null"]
          enum: [GB-ENG, GB-NIR, GB-SCT, GB-WLS, null]
        determinedBy:
          type: string
          enum: [area-code, country-boundary, undetermined]
        area: { type: string }
        boundaryRelease: { type: string }
        detail: { type: string }

    PointLookupRelease:
      type: object
      description: >
        A requested geography's release and how it was chosen. When no release
        could be read, `status` and `detail` say why and the release-wide
        members are absent.
      required: [geography, selection]
      properties:
        geography: { type: string }
        boundaryRelease: { type: string }
        href: { type: string }
        selection:
          type: object
          required: [policy]
          properties:
            policy:
              type: string
              enum: [pinned, latest-release-dated-on-or-before]
            date: { type: string }
            sameMonth: { type: boolean }
            next:
              oneOf:
                - $ref: "#/components/schemas/ReleaseReference"
                - type: "null"
        coverage:
          type: object
          required: [countries]
          properties:
            countries:
              type: array
              items: { type: string }
        boundaryResolution:
          type: object
          required: [generalisation]
          description: >
            How much the boundary's lines were generalised, read from the ONS
            release name. `undeclared` where the name does not say.
          properties:
            generalisation: { type: string }
            extent:
              type: string
              enum: [clipped-to-coastline, full-extent-of-realm]
            toleranceM: { type: number }
            basis: { const: ons-release-name }
        geometrySource:
          $ref: "#/components/schemas/GeometrySource"
        source:
          type: object
          properties:
            publisher: { type: string }
            licence:
              type: object
              properties:
                name: { type: string }
                url: { type: string }
        status:
          type: string
          description: >
            `ambiguous-release`, `no-release-for-date` or `geometry-unavailable`
            when no release could be read. The schema this is combined with
            lists every status a result may carry.
        detail: { type: string }
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseReference"
        earliest:
          $ref: "#/components/schemas/ReleaseReference"

    ReleaseReference:
      type: object
      required: [id, month, title, countries, href]
      properties:
        id: { type: string }
        month: { type: string }
        title: { type: string }
        countries:
          type: array
          items: { type: string }
        href: { type: string }
        deprecation:
          $ref: "#/components/schemas/BoundaryReleaseDeprecation"

    PointLookupResult:
      type: object
      required: [geography, status, matches]
      properties:
        geography: { type: string }
        boundaryRelease: { type: string }
        status:
          type: string
          enum:
            [
              matched,
              no-match,
              outside-coverage,
              ambiguous-release,
              no-release-for-date,
              geometry-unavailable,
            ]
        reason:
          type: string
          enum: [country-not-covered, outside-uk-boundaries]
        detail: { type: string }
        positionalToleranceM:
          type: number
          description: >
            Coordinate uncertainty, boundary generalisation and transformation
            accuracy added together, in metres.
        matches:
          type: array
          items:
            type: object
            required:
              [id, code, name, containment, distanceToBoundaryM, nearBoundary]
            properties:
              id: { type: string }
              code: { type: string }
              name: { type: string }
              aliases:
                type: array
                items: { type: string }
              containment:
                type: string
                enum: [interior, boundary]
              distanceToBoundaryM:
                type: number
                description: Metres from the point to the area's nearest edge.
              nearBoundary:
                type: boolean
                description: The edge lies within `positionalToleranceM`.
              geometrySource:
                $ref: "#/components/schemas/GeometrySource"
              corrections:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    description: { type: string }

    PointContainment:
      type: object
      required: [point, country, boundaryRule, results, note]
      properties:
        postcode:
          type: object
          description: Present when the point is a postcode's centroid.
          required: [postcode, status, href, source]
          properties:
            postcode: { type: string }
            status: { enum: [live, terminated] }
            href: { type: string }
            caution:
              type: string
              description:
                Present when the directory does not state how accurate the centroid
                is.
            source:
              type: object
              properties:
                title: { type: string }
                edition: { type: string }
                publisher: { type: string }
                licence: {}
                attribution: { type: string }
        point:
          $ref: "#/components/schemas/LookupPoint"
        date: { type: string }
        country:
          $ref: "#/components/schemas/PointCountry"
        boundaryRule: { const: included }
        results:
          type: array
          description: One per requested geography, in the order requested.
          items:
            allOf:
              - $ref: "#/components/schemas/PointLookupRelease"
              - $ref: "#/components/schemas/PointLookupResult"
        note: { type: string }

    PointContainmentEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/PointContainment"

    PostcodeLookup:
      type: object
      required:
        [
          postcode,
          status,
          introduced,
          userType,
          country,
          centroid,
          results,
          source,
        ]
      properties:
        postcode:
          type: string
          description: The postcode as the directory writes it, such as `SW1A 1AA`.
        status: { enum: [live, terminated] }
        introduced: { type: string, description: "YYYY-MM" }
        terminated: { type: string, description: "YYYY-MM, when terminated." }
        userType:
          enum: [small, large]
          description:
            A large user is a single address receiving enough mail for its own
            postcode.
        country:
          type: string
          description:
            The country code the directory assigns, including L93000001 for the
            Channel Islands and M83000003 for the Isle of Man.
        centroid:
          oneOf:
            - type: "null"
            - type: object
              required: [crs, easting, northing, positionalQuality]
              properties:
                crs: { enum: ["EPSG:27700", "EPSG:29902"] }
                easting: { type: integer }
                northing: { type: integer }
                positionalQuality:
                  type: object
                  required: [indicator, description, accuracyM]
                  properties:
                    indicator:
                      { type: integer, description: The directory's GRIDIND. }
                    description: { type: string }
                    accuracyM: { type: ["number", "null"] }
        point:
          $ref: "#/components/schemas/LookupPoint"
        date: { type: string }
        dateBasis: { enum: [requested, directory-edition] }
        pointCountry:
          $ref: "#/components/schemas/PointCountry"
        boundaryRule: { const: included }
        results:
          type: array
          description:
            One per requested geography, in the order requested; empty when the
            postcode has no centroid.
          items:
            allOf:
              - $ref: "#/components/schemas/PointLookupRelease"
              - $ref: "#/components/schemas/PointLookupResult"
        caution: { type: string }
        detail: { type: string }
        source:
          type: object
          required: [title, edition, publisher, licence, attribution]
          properties:
            title: { type: string }
            edition: { type: string }
            publisher: { type: string }
            licence:
              type: object
              properties:
                name: { type: string }
                url: { type: string }
            attribution:
              type: array
              items: { type: string }
        note: { type: string }

    PostcodeLookupEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              anyOf:
                - $ref: "#/components/schemas/PostcodeLookup"
                - $ref: "#/components/schemas/CompactPostcodeLookup"

    CompactPostcodeRecord:
      type: object
      required: [postcode, status, country]
      properties:
        postcode: { type: string }
        status: { enum: [live, terminated] }
        terminated: { type: string, description: "YYYY-MM, when terminated." }
        country: { type: string }

    CompactPointLookupResult:
      type: object
      required: [geography, status, matches]
      properties:
        geography: { type: string }
        boundaryRelease: { type: string }
        status:
          type: string
          enum:
            [
              matched,
              no-match,
              outside-coverage,
              ambiguous-release,
              no-release-for-date,
              geometry-unavailable,
            ]
        detail: { type: string }
        matches:
          type: array
          items:
            type: object
            required: [id, code, name, nearBoundary]
            properties:
              id: { type: string }
              code: { type: string }
              name: { type: string }
              nearBoundary: { type: boolean }

    CompactPostcodeSource:
      type: object
      required: [title, edition, attribution]
      properties:
        title: { type: string }
        edition: { type: string }
        attribution:
          type: array
          items: { type: string }

    CompactPostcodeLookup:
      description: A postcode lookup with `view=compact`.
      allOf:
        - $ref: "#/components/schemas/CompactPostcodeRecord"
        - type: object
          required: [point, results, source]
          properties:
            point:
              oneOf:
                - type: "null"
                - type: object
                  required: [lng, lat]
                  properties:
                    lng: { type: number }
                    lat: { type: number }
            date: { type: string }
            results:
              type: array
              items:
                $ref: "#/components/schemas/CompactPointLookupResult"
            caution: { type: string }
            detail: { type: string }
            source:
              $ref: "#/components/schemas/CompactPostcodeSource"

    PostcodeBatch:
      type: object
      required:
        [
          date,
          dateBasis,
          boundaryRule,
          releases,
          summary,
          postcodes,
          source,
          note,
        ]
      properties:
        date: { type: string }
        dateBasis: { enum: [requested, directory-edition] }
        boundaryRule: { const: included }
        releases:
          type: array
          items:
            $ref: "#/components/schemas/PointLookupRelease"
        summary:
          $ref: "#/components/schemas/PostcodeBatchSummary"
        postcodes:
          type: array
          items:
            type: object
            required: [index, input, status]
            properties:
              index: { type: integer }
              input: { type: string, description: The postcode as given. }
              status:
                { enum: [placed, not-placed, invalid, not-found, not-served] }
              detail: { type: string }
              postcode:
                description:
                  The directory's record, as `/postcodes/{postcode}` gives it, for a
                  placed or not-placed postcode.
                type: object
              point:
                $ref: "#/components/schemas/LookupPoint"
              pointCountry:
                $ref: "#/components/schemas/PointCountry"
              results:
                type: array
                description: One per entry in releases, in the same order.
                items:
                  $ref: "#/components/schemas/PointLookupResult"
              caution: { type: string }
        source:
          type: object
        note: { type: string }

    PostcodeBatchSummary:
      type: object
      required:
        [
          postcodes,
          placed,
          notPlaced,
          invalid,
          notFound,
          notServed,
          lookups,
          matched,
          noMatch,
          outsideCoverage,
          unresolved,
          nearBoundary,
        ]
      properties:
        postcodes: { type: integer }
        placed: { type: integer }
        notPlaced: { type: integer }
        invalid: { type: integer }
        notFound: { type: integer }
        notServed: { type: integer }
        lookups: { type: integer }
        matched: { type: integer }
        noMatch: { type: integer }
        outsideCoverage: { type: integer }
        unresolved: { type: integer }
        nearBoundary: { type: integer }

    CompactPostcodeBatch:
      type: object
      description: A postcode batch with `view=compact`.
      required: [date, releases, summary, postcodes, source]
      properties:
        date: { type: string }
        releases:
          type: array
          items:
            type: object
            required: [geography]
            properties:
              geography: { type: string }
              boundaryRelease: { type: string }
              status:
                type: string
                enum:
                  [ambiguous-release, no-release-for-date, geometry-unavailable]
              detail: { type: string }
        summary:
          $ref: "#/components/schemas/PostcodeBatchSummary"
        postcodes:
          type: array
          items:
            type: object
            required: [index, input, status]
            properties:
              index: { type: integer }
              input: { type: string }
              status:
                { enum: [placed, not-placed, invalid, not-found, not-served] }
              detail: { type: string }
              postcode:
                $ref: "#/components/schemas/CompactPostcodeRecord"
              point:
                type: object
                required: [lng, lat]
                properties:
                  lng: { type: number }
                  lat: { type: number }
              results:
                type: array
                description: One per entry in releases, in the same order.
                items:
                  $ref: "#/components/schemas/CompactPointLookupResult"
              caution: { type: string }
        source:
          $ref: "#/components/schemas/CompactPostcodeSource"

    PostcodeBatchEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              anyOf:
                - $ref: "#/components/schemas/PostcodeBatch"
                - $ref: "#/components/schemas/CompactPostcodeBatch"

    PointContainmentBatch:
      type: object
      required: [boundaryRule, releases, summary, points, note]
      properties:
        date: { type: string }
        boundaryRule: { const: included }
        releases:
          type: array
          items:
            $ref: "#/components/schemas/PointLookupRelease"
        summary:
          type: object
          required:
            [
              points,
              lookups,
              matched,
              noMatch,
              outsideCoverage,
              unresolved,
              nearBoundary,
            ]
          properties:
            points: { type: integer }
            lookups: { type: integer }
            matched: { type: integer }
            noMatch: { type: integer }
            outsideCoverage: { type: integer }
            unresolved:
              type: integer
              description:
                Lookups with no answer about the point, such as an ambiguous
                release.
            nearBoundary: { type: integer }
        points:
          type: array
          items:
            type: object
            required: [index, point, country, results]
            properties:
              index: { type: integer }
              point:
                $ref: "#/components/schemas/LookupPoint"
              country:
                $ref: "#/components/schemas/PointCountry"
              results:
                type: array
                description: One per entry in releases, in the same order.
                items:
                  $ref: "#/components/schemas/PointLookupResult"
        note: { type: string }

    PointContainmentBatchEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/PointContainmentBatch"

    NearestAreas:
      type: object
      required: [point, within, limit, relation, distanceMethod, results, note]
      properties:
        point:
          $ref: "#/components/schemas/LookupPoint"
        date: { type: string }
        within: { type: integer }
        limit: { type: integer }
        relation: { const: distance }
        distanceMethod: { type: string }
        results:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/PointLookupRelease"
              - type: object
                required: [nearest]
                properties:
                  status:
                    type: string
                    enum:
                      [
                        found,
                        none-within,
                        ambiguous-release,
                        no-release-for-date,
                        geometry-unavailable,
                      ]
                  matched: { type: integer }
                  truncated: { type: boolean }
                  nearest:
                    type: array
                    items:
                      type: object
                      required: [rank, id, code, name, distanceM]
                      properties:
                        rank: { type: integer }
                        id: { type: string }
                        code: { type: string }
                        name: { type: string }
                        distanceM:
                          type: number
                          description: >
                            Metres to the area, zero when the point is on or
                            inside it. Not a containment claim.
                        geometrySource:
                          $ref: "#/components/schemas/GeometrySource"
        note: { type: string }

    NearestAreasEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/NearestAreas"

    AreaChildrenGeometry:
      type: object
      required: [type, id, parent, collection, withoutGeometry, features]
      properties:
        type:
          const: FeatureCollection
        id:
          type: string
        parent:
          $ref: "#/components/schemas/Area"
        collection:
          type: object
          description: >
            What the collection holds and on what terms. `generalisationMethod`
            is present only above the `full` tier.
          required:
            [
              members,
              withGeometry,
              vertices,
              tier,
              toleranceM,
              minEffectiveAreaM2,
            ]
          properties:
            members:
              type: integer
              description: Areas the crosswalk names as contained by the parent.
            withGeometry:
              type: integer
              description: Of those, how many could be drawn.
            vertices:
              type: integer
            tier:
              type: string
              enum: [full, high, medium, low]
            toleranceM: { type: number }
            minEffectiveAreaM2: { type: number }
            generalisationMethod:
              type: object
              required: [rule, threshold, parts, sharedBorders]
              properties:
                rule: { type: string }
                threshold: { type: string }
                parts: { type: string }
                sharedBorders: { type: string }
        withoutGeometry:
          type: array
          description: >
            Members published as a relationship that could not be drawn, each
            with the reason. Empty when the collection is complete.
          items:
            type: object
            required: [id, geography, boundaryRelease, code, reason]
            properties:
              id: { type: string }
              geography: { type: string }
              boundaryRelease: { type: string }
              code: { type: string }
              reason: { type: string }
        features:
          type: array
          items:
            $ref: "#/components/schemas/AreaChildGeometryFeature"

    AreaChildGeometryFeature:
      type: object
      required: [type, id, properties, geometry]
      properties:
        type:
          const: Feature
        id:
          type: string
        properties:
          allOf:
            - $ref: "#/components/schemas/Area"
            - type: object
              required: [membership, generalisation, geometrySource]
              properties:
                membership:
                  type: object
                  description: >
                    The published crosswalk that places this area in the
                    collection.
                  required: [id, method, quality]
                  properties:
                    id: { type: string }
                    method: { type: string }
                    quality: { type: string }
                    weighting: { type: object }
                generalisation:
                  type: object
                  description: >
                    What the collection's tier cost this member. The tier itself
                    is stated once, on the collection.
                  required:
                    [
                      vertices,
                      verticesAtFullResolution,
                      parts,
                      partsAtFullResolution,
                    ]
                  properties:
                    vertices: { type: integer }
                    verticesAtFullResolution: { type: integer }
                    parts: { type: integer }
                    partsAtFullResolution: { type: integer }
                geometrySource:
                  $ref: "#/components/schemas/GeometrySource"
        geometry:
          $ref: "#/components/schemas/GeoJsonGeometry"

    AreaChildrenGeometryEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AreaChildrenGeometry"

    Generalisation:
      type: object
      description: >
        What was done to the geometry before it was served, and at what cost.
        `method` is present only above the `full` tier, where something was
        actually done; it includes the caveat that neighbours generalised
        separately may disagree along a shared border.
      required:
        [
          tier,
          toleranceM,
          minEffectiveAreaM2,
          vertices,
          verticesAtFullResolution,
          parts,
          partsAtFullResolution,
        ]
      properties:
        tier:
          type: string
          enum: [full, high, medium, low]
        toleranceM:
          type: number
          description: The side in metres of the smallest square of detail kept.
        minEffectiveAreaM2:
          type: number
          description: >
            The threshold actually applied, in square metres: a vertex is
            dropped when its triangle is smaller than this.
        vertices:
          type: integer
          description: Vertices in the geometry as served.
        verticesAtFullResolution:
          type: integer
        parts:
          type: integer
        partsAtFullResolution:
          type: integer
        method:
          type: object
          required: [rule, threshold, parts, sharedBorders]
          properties:
            rule: { type: string }
            threshold: { type: string }
            parts: { type: string }
            sharedBorders: { type: string }

    GeometrySource:
      type: object
      description: >
        Where the served WGS84 geometry came from. `transformation` is present
        only when the source was reprojected. Per-area compiled geometry carries
        `validity`; release-wide provenance and direct source reads omit it.
      required: [sourceCrs]
      properties:
        input:
          type: string
          description: Registered source file, preserved without validity repairs.
        inputHash:
          type: string
          description: SHA-256 of the registered source file's original bytes.
        validity:
          $ref: "#/components/schemas/GeometryValidity"
        sourceCrs:
          type: string
        transformation:
          type: object
          required: [name, epsg, accuracyM, areaOfUse]
          properties:
            name:
              type: string
            epsg:
              type: string
            accuracyM:
              type: number
              description: EPSG's stated accuracy within the area of use.
            areaOfUse:
              type: string
        corrections:
          type: array
          description: >
            Declared grid corrections that moved this area before it was
            reprojected, such as `northern-ireland-offset`.
          items:
            type: object
            required: [id, description]
            properties:
              id:
                type: string
              description:
                type: string

    GeometryValidity:
      type: object
      description: >
        Deterministic build-time validation of the full served geometry, after
        declared corrections and reprojection. Checks Polygon and MultiPolygon
        topology in planar WGS84 XY using JSTS IsValidOp, including
        self-intersections, holes, ring degeneracy and relationships between
        MultiPolygon parts. Z is ignored. This is not a geodesic, antimeridian,
        cross-area coverage or general GeoJSON/OGC conformance certificate.
        At most the first issue found by the checker is returned. Source geometry is
        never repaired by validation. A valid result applies only to these
        checks. More than 10,000 positions, or 10,000 polygon/ring components,
        yields `not-checked` with `position-limit`; GeometryCollection and
        non-polygon types are `unsupported-geometry`. Older stores without
        reports are `not-compiled`. Validator failures are `validator-error`,
        never a valid result. No topology validation runs during requests.
      required: [method, status]
      properties:
        method:
          type: object
          required: [validator, version, coordinates, positionLimit]
          properties:
            validator: { const: "jsts/IsValidOp" }
            version: { const: "2.12.1" }
            coordinates: { const: "WGS84-planar-XY" }
            positionLimit: { const: 10000 }
        status:
          type: string
          enum: [valid, invalid, not-checked]
        reason:
          type: string
          enum:
            [
              not-compiled,
              position-limit,
              unsupported-geometry,
              validator-error,
            ]
        issue:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            coordinate:
              type: array
              description: A finite XY location of the first issue, when available.
              minItems: 2
              maxItems: 2
              items: { type: number }
      oneOf:
        - properties:
            status: { const: valid }
        - required: [issue]
          properties:
            status: { const: invalid }
        - required: [reason]
          properties:
            status: { const: not-checked }

    AreaGeometryEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AreaGeometry"

    AreaMetrics:
      type: object
      description: >
        Present only with `include=metrics`; measurements of the area's
        published boundary, with the method that produced them.
      required:
        [
          boundingBox,
          centroid,
          labelPoint,
          labelPointMethod,
          area,
          perimeter,
          geometryExtent,
          method,
          geometrySource,
          geometryHash,
        ]
      properties:
        geometryHash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: >
            SHA-256 of the UTF-8 JSON serialization of the full WGS 84 geometry
            returned by the area's geometry route with tier=full. This identifies
            its coordinates and their order, not topological equivalence.
        boundingBox:
          type: array
          description: >
            [minLongitude, minLatitude, maxLongitude, maxLatitude] in WGS 84.
          items:
            type: number
          minItems: 4
          maxItems: 4
        centroid:
          type: array
          description: "[longitude, latitude] in WGS 84."
          items:
            type: number
          minItems: 2
          maxItems: 2
        labelPoint:
          type: array
          description: "[longitude, latitude] in WGS 84, always inside the geometry."
          items:
            type: number
          minItems: 2
          maxItems: 2
        labelPointMethod:
          type: string
          enum: [centroid, interior-span]
          description: >
            `centroid` when the centre of area lies inside the geometry,
            `interior-span` when it does not and a point inside was chosen
            instead.
        area:
          type: object
          description: One measurement, in three units.
          required: [m2, hectares, km2]
          properties:
            m2: { type: number }
            hectares: { type: number }
            km2: { type: number }
        perimeter:
          type: object
          required: [m, km]
          properties:
            m: { type: number }
            km: { type: number }
        geometryExtent:
          type: object
          description: >
            How much geometry stands behind the measurements: a mainland and its
            islands are many parts, and a ring of land has more rings than
            parts.
          required: [parts, rings, vertices]
          properties:
            parts: { type: integer }
            rings: { type: integer }
            vertices: { type: integer }
        method:
          type: object
          description: >
            The projection and rule behind each figure, carried with the
            response so a measurement can be read on its own.
          required: [area, perimeter, centroid, labelPoint, caveat]
          properties:
            area: { type: string }
            perimeter: { type: string }
            centroid: { type: string }
            labelPoint: { type: string }
            caveat: { type: string }
        geometrySource:
          $ref: "#/components/schemas/GeometrySource"

    AreaRelationshipsEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AreaWithRelationships"

    AreaListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Area"

    AreaEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AreaDetail"

    CrosswalkSide:
      type: object
      required: [geography, boundaryRelease]
      properties:
        geography:
          type: string
        boundaryRelease:
          type: string

    CrosswalkMethod:
      description: >
        `official-lookup` and `clean-containment` read an explicit code pair
        from a published file. `area-overlap` intersects the two releases'
        boundary geometries and weights each source by the area it shares with
        each target. `population-overlap` reweights an area-overlap crosswalk's
        pairs by the residents of the building blocks in each.
        `geometric-containment` derives a hierarchy from geometry where no
        publisher lookup carries it. `best-fit` names, for each child, the one
        parent holding most of its area where the two do not nest.
        `extent-continuity` pairs the codes two releases of one geography share,
        as identity only where their geometries differ by no more than
        generalisation slivers.
      enum:
        [
          official-lookup,
          clean-containment,
          area-overlap,
          population-overlap,
          geometric-containment,
          best-fit,
          extent-continuity,
        ]

    CrosswalkQuality:
      description: >
        `publisher-supplied` mappings restate a publisher's own correspondence.
        `derived` mappings are computed by the Atlas.
      enum: [publisher-supplied, derived]

    CrosswalkWeighting:
      oneOf:
        - type: object
          required: [status]
          properties:
            status:
              enum: [not-provided, not-applicable]
        - type: object
          description: >
            Each record's target weights are shares of the source's area covered
            by its published targets, and sum to 1 within rounding.
          required: [status, basis, normalisation]
          properties:
            status:
              const: provided
            basis:
              const: area
            normalisation:
              const: per-source
        - type: object
          description: >
            Each record's target weights are shares of the source's resident
            population living in each published target, counted from fine
            building blocks, and sum to 1 within rounding.
          required: [status, basis, normalisation, population, date, blocks]
          properties:
            status:
              const: provided
            basis:
              const: population
            normalisation:
              const: per-source
            population:
              type: string
              description: What was counted, such as Census 2021 usual residents.
            date:
              type: string
              description: The reference date of the count.
            blocks:
              $ref: "#/components/schemas/CrosswalkSide"

    SuppliedCountConversionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required:
                [
                  from,
                  to,
                  semantics,
                  input,
                  crosswalk,
                  method,
                  coverage,
                  inputTotal,
                  outputTotal,
                  records,
                  note,
                ]
              properties:
                from:
                  $ref: "#/components/schemas/CrosswalkSide"
                to:
                  $ref: "#/components/schemas/CrosswalkSide"
                semantics: { const: count }
                input:
                  type: object
                  required: [contentHash, rowCount, normalisedCount]
                  properties:
                    contentHash: { type: string }
                    rowCount: { type: integer }
                    normalisedCount: { type: integer }
                crosswalk:
                  type: object
                  required: [id, href, contentHash, method, quality, weighting]
                  properties:
                    id: { type: string }
                    href: { type: string }
                    contentHash: { type: string }
                    method:
                      $ref: "#/components/schemas/CrosswalkMethod"
                    quality:
                      $ref: "#/components/schemas/CrosswalkQuality"
                    weighting:
                      $ref: "#/components/schemas/CrosswalkWeighting"
                method:
                  type: string
                  enum: [exact, area-weighted, population-weighted]
                coverage:
                  type: object
                  required:
                    [
                      scope,
                      crosswalkSourceAreas,
                      sourceAreasSupplied,
                      targetsComplete,
                      targetsPartial,
                      targetsNotReached,
                    ]
                  properties:
                    scope: { const: published-crosswalk }
                    crosswalkSourceAreas: { type: integer }
                    sourceAreasSupplied: { type: integer }
                    sourceAreas: { type: integer }
                    targetsComplete: { type: integer }
                    targetsPartial: { type: integer }
                    targetsNotReached: { type: integer }
                inputTotal: { type: number }
                outputTotal: { type: number }
                records:
                  type: array
                  items:
                    type: object
                    required:
                      [areaCode, value, status, inputAreaCount, coverage]
                    properties:
                      areaCode: { type: string }
                      value: { type: number }
                      status: { const: derived }
                      inputAreaCount: { type: integer }
                      coverage:
                        type: object
                        required: [status, sourceCount, suppliedSourceCount]
                        properties:
                          status: { type: string, enum: [complete, partial] }
                          sourceCount: { type: integer }
                          suppliedSourceCount: { type: integer }
                note: { type: string }

    CrosswalkSummary:
      type: object
      required:
        - id
        - from
        - to
        - method
        - quality
        - weighting
        - recordCount
        - artifact
        - contentHash
      properties:
        id:
          type: string
        from:
          $ref: "#/components/schemas/CrosswalkSide"
        to:
          $ref: "#/components/schemas/CrosswalkSide"
        method:
          $ref: "#/components/schemas/CrosswalkMethod"
        quality:
          $ref: "#/components/schemas/CrosswalkQuality"
        weighting:
          $ref: "#/components/schemas/CrosswalkWeighting"
        recordCount:
          type: integer
        artifact:
          type: string
        contentHash:
          type: string

    CrosswalkSummaryListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/CrosswalkSummary"

    CrosswalkMetadata:
      type: object
      required:
        - schemaVersion
        - contentHash
        - id
        - method
        - quality
        - weighting
        - from
        - to
        - provenance
        - validation
      properties:
        schemaVersion:
          const: 1
        contentHash:
          type: string
        id:
          type: string
        method:
          $ref: "#/components/schemas/CrosswalkMethod"
        quality:
          $ref: "#/components/schemas/CrosswalkQuality"
        weighting:
          $ref: "#/components/schemas/CrosswalkWeighting"
        from:
          $ref: "#/components/schemas/CrosswalkSide"
        to:
          $ref: "#/components/schemas/CrosswalkSide"
        provenance:
          oneOf:
            - type: object
              description: The one published file the code pairs are read from.
              required: [input, inputHash]
              properties:
                input:
                  type: string
                inputHash:
                  type: string
            - type: object
              description: >
                The two boundary geometries an `area-overlap` crosswalk
                intersects, how areas were measured, and the clipping library
                that computed each intersection.
              required: [inputs, areaProjection, clipping]
              properties:
                inputs:
                  type: array
                  items:
                    type: object
                    required: [side, input, inputHash]
                    properties:
                      side:
                        enum: [from, to]
                      input:
                        type: string
                      inputHash:
                        type: string
                areaProjection:
                  const: EPSG:6933
                  description: >
                    Lambert cylindrical equal-area on the WGS 84 ellipsoid, so
                    every area is an ellipsoidal area in square metres.
                clipping:
                  type: string
                  description: Clipping library and version, e.g. `polygon-clipping@0.15.7`.
        validation:
          type: object
          required: [sourceNameConflicts, endpoints]
          properties:
            overlap:
              $ref: "#/components/schemas/AreaOverlapValidation"
            sourceNameConflicts:
              type: array
              items:
                type: object
                required: [code, names]
                properties:
                  code:
                    type: string
                  names:
                    type: array
                    items:
                      type: string
            endpoints:
              type: object
              required: [from, to]
              properties:
                from:
                  $ref: "#/components/schemas/CrosswalkEndpointValidation"
                to:
                  $ref: "#/components/schemas/CrosswalkEndpointValidation"

    CrosswalkEndpointValidation:
      oneOf:
        - type: object
          required: [status, availableAreaCount, referencedCodeCount]
          properties:
            status:
              const: verified
            availableAreaCount:
              type: integer
            referencedCodeCount:
              type: integer
        - type: object
          required: [status, reason]
          properties:
            status:
              const: not-available
            reason:
              type: string

    AreaOverlapValidation:
      type: object
      description: >
        Present only for `area-overlap` crosswalks. Two independently
        generalised boundaries leave narrow slivers where they disagree. A pair
        whose widest intersecting piece is narrower than `sliverWidthM` (twice
        its area over its perimeter) is dropped as a sliver. The build fails
        unless every sliver is under half that width and every kept overlap at
        least twice it, and unless every source and target area is at least
        `minimumCoverage` covered by kept overlaps.
      required:
        - candidatePairCount
        - intersectingPairCount
        - sliverPairCount
        - sliverWidthM
        - widestSliverWidthM
        - narrowestOverlapWidthM
        - minimumCoverage
        - minimumSourceCoverage
        - minimumTargetCoverage
      properties:
        candidatePairCount:
          type: integer
          description: Pairs whose bounding boxes meet, and so were clipped.
        intersectingPairCount:
          type: integer
        sliverPairCount:
          type: integer
        sliverWidthM:
          type: number
        widestSliverWidthM:
          type: [number, "null"]
        narrowestOverlapWidthM:
          type: number
        minimumCoverage:
          type: number
        minimumSourceCoverage:
          type: number
        minimumTargetCoverage:
          type: number

    CrosswalkMetadataEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CrosswalkMetadata"

    CrosswalkArea:
      type: object
      required: [code, labels]
      properties:
        code:
          type: string
        labels:
          type: array
          items:
            type: string
          description: >
            Non-canonical name candidates. More than one entry means the source
            disagreed with itself about this area's name; it is not an alias
            list to pick from arbitrarily.

    CrosswalkRecord:
      type: object
      required: [source, targets]
      properties:
        source:
          $ref: "#/components/schemas/CrosswalkArea"
        targets:
          type: array
          items:
            $ref: "#/components/schemas/CrosswalkArea"

    AreaOverlapRecord:
      type: object
      description: >
        One `area-overlap` source with the targets it shares area with, after
        slivers are dropped. Areas are ellipsoidal square metres.
      required: [source, targets]
      properties:
        source:
          allOf:
            - $ref: "#/components/schemas/CrosswalkArea"
            - type: object
              required: [areaM2, coverage]
              properties:
                areaM2:
                  type: integer
                coverage:
                  type: number
                  description: Share of the source's area covered by its targets.
        targets:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/CrosswalkArea"
              - type: object
                required: [weight, overlapAreaM2, sourceShare, targetShare]
                properties:
                  weight:
                    type: number
                    description: >
                      Share of the source's covered area. A record's weights sum
                      to 1 within rounding, so they apportion a whole source
                      quantity across its targets.
                  overlapAreaM2:
                    type: integer
                  sourceShare:
                    type: number
                    description: Overlap as a share of the whole source area.
                  targetShare:
                    type: number
                    description: Overlap as a share of the whole target area.

    CrosswalkRecordListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                anyOf:
                  - $ref: "#/components/schemas/CrosswalkRecord"
                  - $ref: "#/components/schemas/AreaOverlapRecord"

    RelationshipCandidateSide:
      type: object
      required: [geography, boundaryRelease, codeProperty, nameProperty]
      properties:
        geography:
          type: string
        boundaryRelease:
          type: string
        codeProperty:
          type: string
        nameProperty:
          type: string

    RelationshipCandidateTarget:
      type: object
      required: [codeProperty, nameProperty]
      properties:
        geography:
          type: string
        boundaryRelease:
          type: string
        codeProperty:
          type: string
        nameProperty:
          type: string
      description: >
        `boundaryRelease` (and sometimes `geography`) are present only when
        exactly one compiled area release already uses this code/name property
        pair.

    RelationshipCandidateEndpointStatus:
      oneOf:
        - type: object
          required: [status, availableAreaCount, referencedCodeCount]
          properties:
            status:
              const: verified
            availableAreaCount:
              type: integer
            referencedCodeCount:
              type: integer
        - type: object
          required: [status, reason]
          properties:
            status:
              const: not-available
            reason:
              type: string

    RelationshipCandidate:
      type: object
      required: [id, input, from, to, status, validation]
      properties:
        id:
          type: string
        input:
          type: string
        from:
          $ref: "#/components/schemas/RelationshipCandidateSide"
        to:
          $ref: "#/components/schemas/RelationshipCandidateTarget"
        status:
          enum: [eligible, needs-review, not-available]
        publishedCrosswalkId:
          type: string
          description: Set when a published crosswalk already covers this candidate.
        validation:
          type: object
          required: [endpoints, relationship, reasons]
          properties:
            endpoints:
              type: object
              required: [from, to]
              properties:
                from:
                  $ref: "#/components/schemas/RelationshipCandidateEndpointStatus"
                to:
                  $ref: "#/components/schemas/RelationshipCandidateEndpointStatus"
            relationship:
              type: object
              required:
                - sourceFeatureCount
                - sourceCodeCount
                - targetCodeCount
                - multiTargetSourceCount
                - missingValueFeatureCount
              properties:
                sourceFeatureCount:
                  type: integer
                sourceCodeCount:
                  type: integer
                targetCodeCount:
                  type: integer
                multiTargetSourceCount:
                  type: integer
                missingValueFeatureCount:
                  type: integer
            reasons:
              type: array
              items:
                type: string

    RelationshipCandidateListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/RelationshipCandidate"

    ValidationCheck:
      type: object
      required: [id, status]
      properties:
        id:
          enum:
            - registry-links
            - release-coverage
            - licence-recorded
            - area-identities
            - geometry-servable
            - geometry-positioned
            - candidates-reviewed
            - artifact-integrity
            - endpoints-verified
            - source-names-consistent
            - targets-present
            - single-parent
            - weights-sum-to-one
            - area-coverage
            - sliver-separation
            - continuity-extent
            - population-coverage
            - containment-verified
            - best-fit-verified
            - measure-definition
            - records-resolve
            - countries-declared
            - values-valid
            - components-sum-to-total
        status:
          enum: [passed, waived]
        detail:
          type: string
          description: What the check found. Present on every waived check.
        measured:
          type: object
          description: Figures the check measured, whether it passed or not.
          additionalProperties:
            type: [number, string, "null"]
        waiver:
          type: object
          required: [reason]
          properties:
            reason:
              type: string

    ValidationResource:
      type: object
      required: [id, kind, status, checks]
      properties:
        id:
          type: string
          description: >
            `atlas` for checks across the Atlas's own artifacts; otherwise the
            validated resource's API path, such as `crosswalks/{crosswalk-id}`.
            A measure source partition is identified by the export that serves
            it, as `exports/{export-id}`.
        kind:
          enum: [atlas, boundary-release, crosswalk, measure, measure-source]
        status:
          enum: [passed, waived]
          description: waived when any of its checks is waived.
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ValidationCheck"

    ValidationReport:
      type: object
      required: [schemaVersion, contentHash, inputs, summary, resources]
      properties:
        schemaVersion:
          const: 1
        contentHash:
          type: string
        inputs:
          type: object
          description: Content hashes of the artifacts and waivers the checks read.
          additionalProperties:
            type: string
        summary:
          type: object
          required:
            [resourceCount, checkCount, passedCount, waivedCount, coverage]
          properties:
            resourceCount:
              type: integer
            checkCount:
              type: integer
            passedCount:
              type: integer
            waivedCount:
              type: integer
            coverage:
              type: object
              description: >
                How many boundary releases each capability reaches.
                servableGeometry counts releases with servable geometry for at
                least some areas; their geometry-servable checks name any areas
                refused. measures and measureSources count the checked measures
                and their source partitions.
              required:
                - boundaryReleases
                - areaIdentities
                - servableGeometry
                - withRelationships
                - crosswalks
                - weightedCrosswalks
                - measures
                - measureSources
              properties:
                boundaryReleases:
                  type: integer
                areaIdentities:
                  type: integer
                servableGeometry:
                  type: integer
                withRelationships:
                  type: integer
                crosswalks:
                  type: integer
                weightedCrosswalks:
                  type: integer
                measures:
                  type: integer
                measureSources:
                  type: integer
        resources:
          type: array
          items:
            $ref: "#/components/schemas/ValidationResource"

    ExportField:
      type: object
      required: [name, type, required]
      properties:
        name:
          type: string
          description: A key of the manifest's `fields`.
        type:
          enum: [string, number, object]
        required:
          type: boolean
          description: True when every record in the artifact carries the field.

    ExportDataset:
      type: object
      required: [publisher, sourceUrl, licence, inputs, href]
      properties:
        publisher:
          type: string
        sourceUrl:
          type: string
        licence:
          type: object
          required: [name]
          properties:
            name:
              type: string
            url:
              type: string
        inputs:
          type: array
          items:
            type: object
            required: [path, sha256]
            properties:
              path:
                type: string
              sha256:
                type: string
        href:
          type: string

    BulkExport:
      type: object
      required:
        - id
        - measureId
        - datasetId
        - periods
        - sourceGeography
        - format
        - artifact
        - contentHash
        - bytes
        - href
        - recordCount
        - recordCountByPeriod
        - schema
        - provenance
      properties:
        id:
          type: string
        measureId:
          type: string
        datasetId:
          type: string
        periods:
          type: array
          items:
            type: string
        sourceGeography:
          type: object
          required: [type, codeYear]
          properties:
            type:
              type: string
            codeYear:
              type: integer
        format:
          const: json
        formats:
          type: array
          description: Prebuilt flat files of the named measure, schema version 1. Sizes are file bytes before HTTP compression; hashes identify those bytes.
          items:
            type: object
            required: [format, artifact, href, bytes, contentHash]
            properties:
              format: { enum: [csv, parquet] }
              artifact: { type: string }
              href: { type: string }
              bytes: { type: integer }
              contentHash: { type: string }
              gzipBytes:
                type: integer
                description:
                  "Present when the file is stored gzipped, as CSV is: its size
                  as sent with `Content-Encoding: gzip`. A stored-gzipped file
                  is not served in byte ranges."
        artifact:
          type: string
        contentHash:
          type: string
        bytes:
          type: integer
        href:
          type: string
        recordCount:
          type: integer
          description: Records in the artifact, counted from it.
        recordCountByPeriod:
          type: object
          additionalProperties:
            type: integer
        schema:
          type: object
          required: [version, layout, recordType, fields]
          description: >
            The artifact's shape, read from the artifact. `version` is the
            artifact's `schemaVersion`, which increments when a field is
            removed, renamed or changes type or meaning, or the layout changes.
          properties:
            version:
              type: integer
            layout:
              enum: [periods, single-period, table]
              description: >
                `table` is an artifact several measures share, such as a census
                table: one row per area, the area code and then a value for each
                measure in `measures` order, null where none is published. Each
                measure's JSON download contains the whole table. CSV and Parquet
                contain only the named measure.
            measures:
              type: array
              items: { type: string }
              description: For a `table`, the measure each value column serves, in order.
            recordType:
              enum: [numeric, categorical]
            fields:
              type: array
              items:
                $ref: "#/components/schemas/ExportField"
        provenance:
          type: object
          required: [measure, datasets]
          properties:
            measure:
              type: string
            datasets:
              type: array
              description: Each id is described in the manifest's `datasets`.
              items:
                type: object
                required: [id, role]
                properties:
                  id:
                    type: string
                  role:
                    enum: [source, derived-from]

    ExportManifest:
      type: object
      required:
        [schemaVersion, contentHash, dataCatalogHash, fields, datasets, exports]
      properties:
        schemaVersion:
          const: 1
        contentHash:
          type: string
        dataCatalogHash:
          type: string
        fields:
          type: object
          description: What each record field means.
          additionalProperties:
            type: string
        datasets:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ExportDataset"
        exports:
          type: array
          items:
            $ref: "#/components/schemas/BulkExport"
        note:
          type: string

    ExportManifestEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ExportManifest"

    LookupFormat:
      type: object
      required: [contentType, bytes, contentHash, href]
      properties:
        contentType:
          type: string
        bytes:
          type: integer
        contentHash:
          type: string
          description: SHA-256 of the rendered bytes, which a download is checked against.
        href:
          type: string

    LookupManifest:
      type: object
      required: [schemaVersion, contentHash, lookups]
      properties:
        schemaVersion:
          const: 1
        contentHash:
          type: string
        lookups:
          type: array
          items:
            type: object
            required: [id, kind, title, source, columns, rowCount, formats]
            properties:
              id:
                type: string
              kind:
                enum: [area-identities, crosswalk, named-location-members]
              title:
                type: string
              source:
                type: object
                required: [artifact, contentHash]
                properties:
                  artifact:
                    type: string
                  contentHash:
                    type: string
              columns:
                type: array
                items:
                  type: object
                  required: [name, type, required, description]
                  properties:
                    name:
                      type: string
                    type:
                      enum: [string, number, "string[]"]
                    required:
                      type: boolean
                      description: True when every row has a value, which the build checks.
                    description:
                      type: string
              rowCount:
                type: integer
              formats:
                type: object
                required: [csv, ndjson]
                properties:
                  csv:
                    $ref: "#/components/schemas/LookupFormat"
                  ndjson:
                    $ref: "#/components/schemas/LookupFormat"
        note:
          type: string

    LookupManifestEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/LookupManifest"

    ValidationReportEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ValidationReport"

    ValidationResourceEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ValidationResource"

    AtlasReleaseArtifactRef:
      type: object
      required: [id, path, contentHash]
      properties:
        id:
          type: string
        path:
          type: string
          description: On-disk path relative to the repository root.
        contentHash:
          type: string
          description: SHA-256 of the actual stored bytes.

    AtlasRelease:
      type: object
      required: [schemaVersion, releaseId, artifacts]
      properties:
        schemaVersion:
          const: 1
        releaseId:
          type: string
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/AtlasReleaseArtifactRef"

    AtlasReleaseEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AtlasRelease"
