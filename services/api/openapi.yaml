              name: Garforth & Swillington
              href: /v1/areas/ward/2025-12-uk-bgc/E05013830
            - boundaryRelease: 2026-05-uk-bgc
              name: Garforth & Swillington
              href: /v1/areas/ward/2026-05-uk-bgc/E05013830

    AggregationNotSupportedProblem:
      description: >
        The measure's values do not add over areas, or its weights cannot be
        used. Produced by `GET
        /v1/data/house-price-median/value?period=2022&geography=ward&codeYear=2020&place=E92000001`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code]
          properties:
            status:
              enum: [422]
            code:
              const: aggregation_not_supported
      examples:
        - type: https://api.ukdataatlas.com/problems/operation-not-supported
          title: Operation Not Supported
          status: 422
          detail:
            This measure is a median and cannot be combined over areas. A median of
            ward medians is not the median of the underlying sales, and no
            weight recovers it. Combining areas needs the sales themselves,
            which this source does not publish.
          code: aggregation_not_supported

    ConversionNotAvailableProblem:
      description: >
        The named crosswalk or source release cannot carry the partition without
        dropping, splitting or assuming values. Produced by `GET
        /v1/data/population/convert?period=2022&geography=ward&codeYear=2023&crosswalk=constituency-2010-to-2024-official-lookup-v2`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code]
          properties:
            status:
              enum: [422]
            code:
              const: conversion_not_available
      examples:
        - type: https://api.ukdataatlas.com/problems/operation-not-supported
          title: Operation Not Supported
          status: 422
          detail:
            That crosswalk starts at constituency, but this source partition is
            published on ward areas.
          code: conversion_not_available
          absence: crosswalk-geography-mismatch

    PartialCoverageProblem:
      description: >
        A named location or a weight partition leaves out areas the sum would
        need, so no partial sum is served. Produced by `GET
        /v1/data/total-jobs/value?period=2024&geography=localAuthority&codeYear=2023&place=location/belfast`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code]
          properties:
            status:
              enum: [422]
            code:
              const: partial_coverage
      examples:
        - type: https://api.ukdataatlas.com/problems/operation-not-supported
          title: Operation Not Supported
          status: 422
          detail:
            "The named location does not cover this source partition by direct code
            match: N09000003 (absent-from-release). No conversion or partial sum
            was applied."
          code: partial_coverage

    PlaceNotServedProblem:
      description: The place matched but the measure cannot answer any of its meanings.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, candidates]
          properties:
            status: { enum: [422] }
            code:
              const: place_not_served
      examples:
        - type: https://api.ukdataatlas.com/problems/place-not-served
          title: Place Not Served
          status: 422
          detail:
            '"North West" matched 12 places, and house-price-median answers none of
            them. Each candidate below says why.'
          code: place_not_served
          candidates:
            - place: region/E12000002
              kind: area
              name: North West
              geography: region
              code: E12000002
              match: exact
              served: false
              reason: house-price-median is not published for region areas.
            - place: location/north-west
              kind: named-location
              name: North West
              geography: named-location
              code: north-west
              match: exact
              definitionRevision: 2
              validity:
                from: null
                to: null
              served: false
              reason:
                house-price-median is not published for localAuthority, which this
                curated location is summed from.
            - place: nhsEnglandRegion/E40000010
              kind: area
              name: North West
              geography: nhsEnglandRegion
              code: E40000010
              match: exact
              served: false
              reason: house-price-median is not published for nhsEnglandRegion areas.
            - place: nhsEnglandRegion/E40000014
              kind: area
              name: North West
              geography: nhsEnglandRegion
              code: E40000014
              match: exact
              served: false
              reason: house-price-median is not published for nhsEnglandRegion areas.
            - place: localAuthority/31UH
              kind: area
              name: North West Leicestershire
