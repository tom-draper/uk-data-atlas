          required: [code, choices]
          properties:
            status: { enum: [409] }
            code:
              const: ambiguous_dimension
      examples:
        - type: https://api.ukdataatlas.com/problems/ambiguous-measure
          title: Ambiguous Measure
          status: 409
          detail:
            party-votes has 2 series for that request that are not parts of one
            breakdown. Choose one; each request is listed in choices.
          code: ambiguous_dimension
          choices:
            - dimensions:
                party: lab
              datasetId: general-election
