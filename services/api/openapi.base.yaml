components:
  parameters:
    ByteRange:
      name: Range
      in: header
      required: false
      schema:
        type: string
        example: bytes=0-16383
      description: >
        One byte range of the file, as `bytes=start-end`, `bytes=start-` or
        `bytes=-length`. This is how a PMTiles client reads an archive: the
        header, then a directory, then only the tiles it needs. Several ranges
        in one request are not supported and get the whole file, as does an
        `If-Range` that no longer matches the ETag. GeoJSON downloads are always
        sent whole.
    PointLookupCrs:
      name: crs
      in: query
      required: false
      schema:
        enum: [EPSG:4326, EPSG:27700, EPSG:29902]
        default: EPSG:4326
      description: >
        The input coordinate reference system. The default `EPSG:4326` uses
        `lng` and `lat`; `EPSG:27700` uses British National Grid `easting` and
        `northing` or an Ordnance Survey `gridref`; `EPSG:29902` uses Irish Grid
        `easting` and `northing`.
    CoordinateTargetCrs:
      name: to
      in: query
      required: false
      schema:
        enum: [EPSG:4326, EPSG:27700, EPSG:29902]
        default: EPSG:4326
      description: >
        The requested output CRS. `point` is always WGS 84; choose a national
        grid here to add `target` with easting and northing. The API rejects a
        point that falls outside its supported range for the requested grid.
    BritishGridReferenceDigits:
      name: gridrefDigits
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 5, default: 5 }
      description: >
        With `to=EPSG:27700`, the maximum number of digits per coordinate in
        `target.gridReference`. The API may return fewer digits when the input
        or transformation uncertainty requires a coarser cell. It is invalid
        with another target CRS.
    PointLookupEasting:
      name: easting
      in: query
      required: false
      schema: { type: string, pattern: "^[+-]?\\d+(\\.\\d+)?$" }
      description: >
        Easting in grid metres. Required with `crs=EPSG:27700` or
        `crs=EPSG:29902`; do not combine it with WGS 84 `lng`/`lat`.
    PointLookupNorthing:
      name: northing
      in: query
      required: false
      schema: { type: string, pattern: "^[+-]?\\d+(\\.\\d+)?$" }
      description: >
        Northing in grid metres. Required with `crs=EPSG:27700` or
        `crs=EPSG:29902`; do not combine it with WGS 84 `lng`/`lat`.
    PointLookupGridReference:
      name: gridref
      in: query
      required: false
      schema:
        { type: string, pattern: "^[A-Za-z]{2}(?:[\\s-]*\\d[\\d\\s-]*)?$" }
      description: >
        A two-letter Ordnance Survey National Grid reference, followed by an
        even number of digits from 2 to 10, for example `TQ 30000 80000`. Use
        only with `crs=EPSG:27700`; do not combine it with `easting` or
        `northing`. A grid reference denotes a square, represented by its cell
        centre with the cell's half-diagonal included in uncertainty.
    PointLookupLongitudeAlias:
      name: lon
      in: query
      required: false
      schema: { type: string, pattern: "^[+-]?\\d+(\\.\\d+)?$" }
      description: Alias for `lng`, the WGS 84 longitude in decimal degrees.
    PointLookupLongitudeLongAlias:
      name: longitude
      in: query
      required: false
      schema: { type: string, pattern: "^[+-]?\\d+(\\.\\d+)?$" }
      description: Alias for `lng`, the WGS 84 longitude in decimal degrees.
    PointLookupGeography:
      name: geography
      in: query
      required: false
      schema:
        type: array
        maxItems: 4
        items: { type: string }
      style: form
      explode: true
      description: >
        A geography to look the point up in. Repeat it or give a comma-separated
        list, up to four in total. A geography named only in a pinned `release`
        need not be repeated here.
    PointLookupRelease:
      name: release
      in: query
      required: false
      schema:
        type: array
        items: { type: string }
      style: form
      explode: true
      description: >
        A release to pin, as `{geography}/{release}`, such as
        `ward/2025-12-uk-bgc`, or `ward/latest` for its newest unambiguous
        published release. A bare release id is accepted when exactly one
        geography is requested. A pinned release is used whatever `date` says.
    PointLookupDate:
      name: date
      in: query
      required: false
      schema: { type: string, pattern: "^\\d{4}-\\d{2}(-\\d{2})?$" }
      description: >
        A calendar date as `YYYY-MM-DD`, or a month as `YYYY-MM`. Every
        geography without a pinned release uses the latest release dated on or
        before it; without a date it uses the newest unambiguous published
        release. The country boundaries used to place a point that matches
        nothing are chosen the same way.
    PostcodeView:
      name: view
      in: query
      required: false
      schema: { enum: [full, compact], default: full }
      description: >
        `full` explains each answer: the centroid's positional quality, the
        transformation, each release's selection, resolution and provenance, and
        each match's distance to its boundary. `compact` gives only the
        postcode, its WGS 84 point, each area's id, code, name and
        `nearBoundary`, any `caution`, and the source's attribution.
    PointLookupAccuracy:
      name: accuracy
      in: query
      required: false
      schema: { type: number, exclusiveMinimum: 0, maximum: 100000 }
      description: >
        How far the true position may lie from the coordinate, in metres, such
        as a GPS fix's reported accuracy. Without it, uncertainty is half the
        coordinate's last written decimal place, which overstates it where a
        client drops trailing zeros.
    Geography:
      name: geography
      in: path
      required: true
      schema:
        type: string
      description: A geography type id, e.g. `constituency` or `ward`.
    Release:
      name: release
      in: path
      required: true
      schema:
        type: string
      description: >
        A boundary release id, e.g. `2024-07-uk-bgc`, or `latest` for the
        geography's newest release: the one `/boundary-releases:resolve` chooses
        for the furthest date. A response to `latest` names the release it read
        in `Content-Location`. A geography whose newest month holds several
        releases that differ in more than coverage, or that has a release whose
        id and registry metadata supply no date, is refused with `409` and the
        releases that could be newest.
    CrosswalkId:
      name: crosswalk-id
      in: path
      required: true
      schema:
        type: string
      description: A crosswalk id, e.g. `constituency-2010-to-2024-official-lookup-v2`.
    MeasureId:
      name: measure-id
      in: path
      required: true
      schema:
        type: string
      description: >
        A measure id from `GET /v1/measures`, such as `population` or
        `recorded-crimes`, or one of its `aliases`, such as `house-prices`. An
        alias is read as the id it names, and the response's `Content-Location`
        header gives the request it was read as. Case, spaces and punctuation
        are set aside, so `House Prices` is `house-prices`. A measure's
        breakdowns are chosen with dimension filters, not with the id:
        `recorded-crimes` with `offence=burglary`, not `crime-burglary`. Retired
        ids return a 404 with the canonical measure and members, in a path or in
        a `measure` query parameter.
    MeasureDataset:
      name: datasetId
      in: query
      required: false
      schema:
        type: string
      description: >
        With a `measure` query parameter, chooses between datasets that publish
        the same measure and members, such as `general-election` and
        `local-election` turnout. It applies to each listed measure that the
        dataset publishes.
    Dimensions:
      name: dimensions
      in: query
      required: false
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties:
          type: string
      description: >
        Dimension filters, by dimension id: `dimensions[offence]=burglary`. Each
        dimension is also its own query parameter, so `offence=burglary` is the
        same filter. `GET /v1/measures/{measure-id}` lists a measure's
        dimensions and their members. A filter takes one member, several
        separated by commas (`party=lab,con`), or `*` for every member. A
        dimension left out takes its total where the measure publishes one, such
        as `offence=total`, and the response states the member chosen in
        `defaults` and `dimensions`. Where no total is published, or the filter
        asks for several members, `/value` and `/series` answer every matching
        series at once, one `breakdown` entry each; an operation that answers
        one series refuses with `ambiguous_dimension` and lists a request for
        each in `choices`. Where two datasets publish the same measure and
        members, such as general and local election votes, the place's geography
        or `datasetId` chooses between them.
    AreaCode:
      name: code
      in: path
      required: true
      schema:
        type: string
      description: An area's official code in that release, e.g. `E05000932`.
    ExportId:
      name: export-id
      in: path
      required: true
      schema:
        type: string
      description: An export id from `GET /v1/exports`; one source partition of one measure.
    LocationId:
      name: location-id
      in: path
      required: true
      schema:
        type: string
      description: A curated named location id from `GET /v1/locations`, e.g.
        `greater-manchester`.
    SourceGeography:
      name: geography
      in: query
      required: true
      schema:
        enum:
          [
            ward,
            localAuthority,
            constituency,
            lsoa,
            msoa,
            dataZone,
            superOutputArea,
          ]
      description: >
        The geography the publisher observed the values on. With `codeYear` it
        selects one source partition of the measure; it never converts values
        onto another geography.
    PlaceSourceGeography:
      name: geography
      in: query
      required: false
      schema:
        enum:
          [
            ward,
            localAuthority,
            constituency,
            lsoa,
            msoa,
            dataZone,
            superOutputArea,
          ]
      description: >
        The geography the publisher observed the values on. With `codeYear` it
        selects one source partition of the measure; it never converts values
        onto another geography. It may be left out when `place` is a reference
        such as `localAuthority/E08000035`, which names it.
    OptionalSourceGeography:
      name: geography
      in: query
      required: false
      schema:
        enum:
          [
            ward,
            localAuthority,
            constituency,
            lsoa,
            msoa,
            dataZone,
            superOutputArea,
          ]
      description: >
        The geography the publisher observed the values on, selecting one source
        partition with `codeYear`. It may be left out when an area named in the
        request is published on one geography of the measure, or when the
        measure is published on only one; geographies are never chosen between,
        so a measure published on several otherwise needs it. A selected
        geography is returned in `defaults`.
    OptionalSourceCodeYear:
      name: codeYear
      in: query
      required: false
      schema:
        type: integer
      description: >
        The year of the boundaries the values are published on. Left out, the
        geography's newest partition is used and returned in `defaults`, unless
        two datasets share it, when `datasetId` must choose.
    OptionalSourcePeriod:
      name: period
      in: query
      required: false
      schema:
        type: string
      description: >
        The observation period as the partition publishes it. Left out, the
        partition's latest period is used and returned in `defaults`.
    SourceCodeYear:
      name: codeYear
      in: query
      required: true
      schema:
        type: integer
      description: >
        The year of the boundaries the values are published on: `2023` with
        `geography=localAuthority` means local authorities as they were in 2023.
        It names the publisher's area set, not one boundary release; a year can
        have several releases (May and December), and `release` chooses which to
        draw where a route offers it.
    Place:
      name: place
      in: query
      required: false
      schema:
        type: string
      description: >
        The area, as its name, its code in the source partition, such as
        `E08000035`, or a place reference from `/places`, such as
        `localAuthority/E08000035`, which also names its geography. A name is
        read among the areas the measure is published for; one that means
        several is a 409 listing each. A postcode, or a larger place the measure
        is summed over, is answered by `/data/{measure-id}/value`.
    SourcePeriod:
      name: period
      in: query
      required: true
      schema:
        type: string
      description: >
        The observation period as the partition publishes it, e.g. `2022`,
        `2026-04` or `year-ending-2026-03`. A measure's periods are listed in
        its catalogue entry.
    PageCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: >
        The `meta.nextCursor` of the previous page. A cursor is opaque and
        belongs to the query that issued it.
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
      description: How many records to return, 1 to 500.

  headers:
    ReleaseDeprecation:
      description: >
        Present when the boundary release this response is about is deprecated.
        An RFC 9745 structured date, `@` and the Unix time it was deprecated.
        The release's `deprecation` record has the reason.
      schema:
        type: string
        example: "@1792972800"
    ReleaseSunset:
      description: >
        Present when a deprecated boundary release has a sunset date: an RFC
        8594 HTTP date after which it may be removed.
      schema:
        type: string
        example: Thu, 01 Apr 2027 00:00:00 GMT
    ReleaseSuccessorLink:
      description: >
        Present when the boundary release this response is about is deprecated.
        An RFC 8288 link with `rel="successor-version"` to the release that
        replaces it. A response that has its own `Link` relations carries both,
        comma separated.
      schema:
        type: string
        example: '</v1/boundary-releases/lsoa/2001-12-ew-bgc-v2>;
          rel="successor-version"'

  responses:
    PartialContent:
      description: >
        The requested byte range. `Content-Range` says which bytes these are and
        how long the whole file is; the ETag is the whole file's.
      headers:
        Content-Range:
          schema:
            type: string
            example: bytes 0-16383/684673
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    RangeNotSatisfiable:
      description: >
        The range starts past the end of the file. `Content-Range` gives the
        file's length as `bytes */length`.
      headers:
        Content-Range:
          schema:
            type: string
            example: bytes */684673
    AmbiguousArea:
      description: >
        An area name means more than one area the measure is published for.
        `choices` lists each, with `ask`, the same request with that area's code
        and geography in place of the name.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/AmbiguousPlaceProblem"
    NotFound:
      description: No resource matches that identity.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidQuery:
      description:
        A query parameter is malformed or its cursor is not valid for this
        result set.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CatalogueUnavailable:
      description: The referenced build artifact has not been built yet.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    GeometryUnavailable:
      description: >
        The area exists but its geometry cannot be served: no raw source is
        declared, or its CRS has no transformation to WGS84.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    CapabilityStatus:
      type: string
      enum: [available, partial, requires-conversion, unsupported, not-built]
      description: >
        The one vocabulary every capability answer uses. `available`: served
        directly and completely for what was asked. `partial`: served directly
        for only part of it. `requires-conversion`: not served directly, but a
        published conversion path answers it, and the answer names that path.
        `unsupported`: nothing the Atlas publishes answers it. `not-built`: this
        deployment has not built the artifact that would say. Every status but
        `available` carries a `reason`.

    Capability:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/CapabilityStatus"
        reason:
          type: string
          description: Why the status is not `available`; present on every other status.

    Problem:
      type: object
      description: >
        RFC 9457 Problem Details. Some routes add extension members: a value
        request for an ambiguous place name adds `choices`, one whose place the
        measure cannot answer adds `candidates`, every area route whose area
        identity resolves to nothing says why through `code` and `absence`, and
        a refused conversion does the same.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        geometrySource:
          $ref: "#/components/schemas/GeometrySource"
        choices:
          type: array
          description: >
            On a 409 Ambiguous Place: each place the name could mean, with its
            answer and the request that asks about it alone, as an object. On an
            `ambiguous_dimension` or `no_matching_series` problem: each series
            of the measure, as an object with its `dimensions`, its `datasetId`
            where that tells it apart, its `label`, and the request that reads
            it as `href`. On a refusal from an area's children routes: each
            release the children are published in, as a `{geography}/{release}`
            string.
          items:
            type: [object, string]
        candidates:
          type: array
          description: >
            On a 422 Place Not Served: each place the name matched, and why the
            measure does not answer it.
          items:
            type: object
        rejectedCount:
          type: integer
          description: Total rejected input rows for supplied-count conversion.
        rejected:
          type: array
          maxItems: 1000
          description: The first rejected rows in input order. No conversion was applied.
          items:
            type: object
            required: [index, area, reason, validation]
            properties:
              index: { type: integer }
              area: { type: string }
              reason: { type: string }
              validation: { type: object }
        code:
          type: string
          enum:
            - place_not_served
            - unsupported_geography
            - unknown_release
            - area_not_in_release
            - aggregation_not_supported
            - conversion_not_available
            - partial_coverage
            - ambiguous_place
            - incompatible_geometry
            - invalid_format
            - invalid_cursor
            - unknown_query_parameter
            - no_release_for_date
            - ambiguous_release
            - unknown_dimension
            - unknown_dimension_member
            - unknown_filter_value
            - no_matching_series
            - ambiguous_dimension
          description: >
            On a 404 from an area or boundary release route:
            `unsupported_geography` when the geography is not published or the
            release's area identities are not compiled, `unknown_release` when
            the geography has no release with that id, and `area_not_in_release`
            when the release does not hold the code. On a 422 from an aggregate
            or a conversion: `aggregation_not_supported` when the measure's
            values do not add over areas or its weights cannot be used,
            `conversion_not_available` when the named crosswalk or source
            release cannot carry the partition without dropping, splitting or
            assuming values, and `partial_coverage` when a named location or a
            weight partition leaves out areas the sum would need. A partial
            country or region total is not refused; it is a 200 whose coverage
            says so. From a value request for a place: `ambiguous_place` when
            the name means several places the measure answers differently. From
            an observation request: `incompatible_geometry` when the chosen
            boundary release does not hold every source code. On a 400:
            `invalid_format` for a `format` the route does not serve,
            `invalid_cursor` for a cursor this API did not issue or that belongs
            to another query, and `unknown_query_parameter` when the operation
            does not declare a supplied parameter. From a release resolution:
            `no_release_for_date` and `ambiguous_release`. From a measure's
            dimension filters: `unknown_dimension` and `unknown_dimension_member`
            (400) for a dimension or member the measure does not have,
            `no_matching_series` (404) when no series has the members asked for,
            and `ambiguous_dimension` (409) when the request leaves several series
            and the operation answers one. From a catalogue listing's `theme`,
            `topic` or `module` filter: `unknown_filter_value` (400) for a value
            the registry does not hold, with the values it does.
        absence:
          type: string
          enum:
            - unknown-geography
            - unknown-release
            - release-not-compiled
            - superseded
            - not-yet-current
            - absent-from-release
            - unknown
            - crosswalk-geography-mismatch
            - source-areas-not-mapped
            - unweighted-split
            - before-first-release
            - country-not-covered
            - no-dated-release
          description: >
            Which absence left the area or conversion unresolved. For a
            conversion, the crosswalk starts at another geography, does not map
            some source areas, or splits some across targets with no published
            weight. For an area, a code is `superseded` when only older releases
            of the geography hold it, `not-yet-current` when only newer ones do,
            `absent-from-release` when releases on both sides or undated
            releases hold it, and `unknown` when no compiled release does. The
            classification uses code membership only: a superseded code may have
            been abolished, merged or recoded, and none of those is claimed.
        parameter:
          type: string
          description:
            The query parameter the operation does not declare, or on an
            `unknown_filter_value` problem the filter whose value is unknown.
        suggestion:
          type: string
          description: The closest declared query parameter, when one is unambiguous.
        presentIn:
          type: array
          description: >
            With `area_not_in_release`: the compiled releases that do hold the
            code, with the name it carries in each.
          items:
            type: object
            required: [boundaryRelease, name, href]
            properties:
              boundaryRelease: { type: string }
              name: { type: string }
              href: { type: string }
        areaCount:
          type: integer
          description: >
            With `source-areas-not-mapped` or `unweighted-split`: how many
            source areas the conversion could not carry.
        areaSample:
          type: array
          items: { type: string }
          description: The first of those source area codes, at most ten.
        availableReleases:
          type: array
          description: With `unknown-release`, the releases published for the geography.
          items:
            type: object
            required: [id, href]
            properties:
              id: { type: string }
              href: { type: string }
        dimensions:
          type: array
          items: { type: string }
          description: On an `unknown_dimension` problem, the dimensions the measure has.
        dimension:
          type: string
          description: On an `unknown_dimension_member` problem, the dimension the filter named.
        members:
          description: Available members for an unknown member or values accepted by an unknown filter.
          type: array
          items: { type: string }
        links:
          type: object
          additionalProperties: { type: string }
          description: >
            With `unknown-geography`, the geography list; with
            `release-not-compiled`, the boundary release.

    UnsupportedGeographyProblem:
      description: >
        The geography is not published, or the release's area identities are not
        compiled. A caller can act on `links` instead of reading the detail.
        Produced by `GET /v1/areas/nowhere/2024-12-uk-bgc/E05000932`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, absence]
          properties:
            status:
              enum: [404]
            code:
              const: unsupported_geography
      examples:
        - type: https://api.ukdataatlas.com/problems/not-found
          title: Not Found
          status: 404
          detail: No boundary release is published for the geography nowhere.
          code: unsupported_geography
          absence: unknown-geography
          links:
            boundaries: /v1/boundaries

    UnknownReleaseProblem:
      description: >
        The geography is published but no release of it has that id;
        `availableReleases` lists those that do exist. A caller can act on
        `availableReleases` instead of reading the detail. Produced by `GET
        /v1/areas/ward/1999-12-uk-bgc/E05000932`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, absence, availableReleases]
          properties:
            status:
              enum: [404]
            code:
              const: unknown_release
      examples:
        - type: https://api.ukdataatlas.com/problems/not-found
          title: Not Found
          status: 404
          detail: No ward boundary release is published as 1999-12-uk-bgc.
          code: unknown_release
          absence: unknown-release
          availableReleases:
            - id: 2026-05-uk-bgc
              href: /v1/boundary-releases/ward/2026-05-uk-bgc
            - id: 2025-12-uk-bgc
              href: /v1/boundary-releases/ward/2025-12-uk-bgc
            - id: 2025-05-uk-bgc-v2
              href: /v1/boundary-releases/ward/2025-05-uk-bgc-v2
            - id: 2024-12-uk-bgc
              href: /v1/boundary-releases/ward/2024-12-uk-bgc
            - id: 2024-05-uk-bgc
              href: /v1/boundary-releases/ward/2024-05-uk-bgc
            - id: 2023-12-uk-bgc
              href: /v1/boundary-releases/ward/2023-12-uk-bgc
            - id: 2023-05-uk-bgc
              href: /v1/boundary-releases/ward/2023-05-uk-bgc
            - id: 2022-12-uk-bgc
              href: /v1/boundary-releases/ward/2022-12-uk-bgc
            - id: 2021-12-uk-bgc
              href: /v1/boundary-releases/ward/2021-12-uk-bgc
            - id: 2020-12-uk-bgc
              href: /v1/boundary-releases/ward/2020-12-uk-bgc
            - id: 2019-12-uk-bgc
              href: /v1/boundary-releases/ward/2019-12-uk-bgc
            - id: 2019-12-gb-bgc
              href: /v1/boundary-releases/ward/2019-12-gb-bgc
            - id: 2018-12-uk-bgc
              href: /v1/boundary-releases/ward/2018-12-uk-bgc
            - id: 2017-12-gb-bgc
              href: /v1/boundary-releases/ward/2017-12-gb-bgc
            - id: 2016-12-gb-bgc
              href: /v1/boundary-releases/ward/2016-12-gb-bgc
            - id: 2015-12-gb-bgc
              href: /v1/boundary-releases/ward/2015-12-gb-bgc
            - id: 2011-12-ew-bgc
              href: /v1/boundary-releases/ward/2011-12-ew-bgc

    AreaNotInReleaseProblem:
      description: >
        The release is published and compiled but does not hold the code;
        `presentIn` lists releases that do. A caller can act on `presentIn`
        instead of reading the detail. Produced by `GET
        /v1/areas/ward/2016-12-gb-bgc/E05013830`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, absence, presentIn]
          properties:
            status:
              enum: [404]
            code:
              const: area_not_in_release
      examples:
        - type: https://api.ukdataatlas.com/problems/not-found
          title: Not Found
          status: 404
          detail:
            E05013830 is held only by newer releases of this geography, so it had
            not come into use by this release.
          code: area_not_in_release
          absence: not-yet-current
          presentIn:
            - boundaryRelease: 2021-12-uk-bgc
              name: Garforth & Swillington
              href: /v1/areas/ward/2021-12-uk-bgc/E05013830
            - boundaryRelease: 2022-12-uk-bgc
              name: Garforth & Swillington
              href: /v1/areas/ward/2022-12-uk-bgc/E05013830
            - boundaryRelease: 2023-05-uk-bgc
              name: Garforth & Swillington
              href: /v1/areas/ward/2023-05-uk-bgc/E05013830
            - boundaryRelease: 2023-12-uk-bgc
              name: Garforth & Swillington
              href: /v1/areas/ward/2023-12-uk-bgc/E05013830
            - boundaryRelease: 2024-05-uk-bgc
              name: Garforth & Swillington
              href: /v1/areas/ward/2024-05-uk-bgc/E05013830
            - boundaryRelease: 2024-12-uk-bgc
              name: Garforth & Swillington
              href: /v1/areas/ward/2024-12-uk-bgc/E05013830
            - boundaryRelease: 2025-05-uk-bgc-v2
              name: Garforth & Swillington
              href: /v1/areas/ward/2025-05-uk-bgc-v2/E05013830
            - boundaryRelease: 2025-12-uk-bgc
              name: Garforth & Swillington
              href: /v1/areas/ward/2025-12-uk-bgc/E05013830
            - boundaryRelease: 2026-05-uk-bgc
              name: Garforth & Swillington
              href: /v1/areas/ward/2026-05-uk-bgc/E05013830

    AggregationNotSupportedProblem:
      description: >
        The measure's values do not add over areas, or its weights cannot be
        used. Produced by `GET
        /v1/data/house-price-median/value?period=2022&geography=ward&codeYear=2020&place=E92000001`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code]
          properties:
            status:
              enum: [422]
            code:
              const: aggregation_not_supported
      examples:
        - type: https://api.ukdataatlas.com/problems/operation-not-supported
          title: Operation Not Supported
          status: 422
          detail:
            This measure is a median and cannot be combined over areas. A median of
            ward medians is not the median of the underlying sales, and no
            weight recovers it. Combining areas needs the sales themselves,
            which this source does not publish.
          code: aggregation_not_supported

    ConversionNotAvailableProblem:
      description: >
        The named crosswalk or source release cannot carry the partition without
        dropping, splitting or assuming values. Produced by `GET
        /v1/data/population/convert?period=2022&geography=ward&codeYear=2023&crosswalk=constituency-2010-to-2024-official-lookup-v2`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code]
          properties:
            status:
              enum: [422]
            code:
              const: conversion_not_available
      examples:
        - type: https://api.ukdataatlas.com/problems/operation-not-supported
          title: Operation Not Supported
          status: 422
          detail:
            That crosswalk starts at constituency, but this source partition is
            published on ward areas.
          code: conversion_not_available
          absence: crosswalk-geography-mismatch

    PartialCoverageProblem:
      description: >
        A named location or a weight partition leaves out areas the sum would
        need, so no partial sum is served. Produced by `GET
        /v1/data/total-jobs/value?period=2024&geography=localAuthority&codeYear=2023&place=location/belfast`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code]
          properties:
            status:
              enum: [422]
            code:
              const: partial_coverage
      examples:
        - type: https://api.ukdataatlas.com/problems/operation-not-supported
          title: Operation Not Supported
          status: 422
          detail:
            "The named location does not cover this source partition by direct code
            match: N09000003 (absent-from-release). No conversion or partial sum
            was applied."
          code: partial_coverage

    PlaceNotServedProblem:
      description: The place matched but the measure cannot answer any of its meanings.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, candidates]
          properties:
            status: { enum: [422] }
            code:
              const: place_not_served
      examples:
        - type: https://api.ukdataatlas.com/problems/place-not-served
          title: Place Not Served
          status: 422
          detail:
            '"North West" matched 12 places, and house-price-median answers none of
            them. Each candidate below says why.'
          code: place_not_served
          candidates:
            - place: region/E12000002
              kind: area
              name: North West
              geography: region
              code: E12000002
              match: exact
              served: false
              reason: house-price-median is not published for region areas.
            - place: location/north-west
              kind: named-location
              name: North West
              geography: named-location
              code: north-west
              match: exact
              definitionRevision: 2
              validity:
                from: null
                to: null
              served: false
              reason:
                house-price-median is not published for localAuthority, which this
                curated location is summed from.
            - place: nhsEnglandRegion/E40000010
              kind: area
              name: North West
              geography: nhsEnglandRegion
              code: E40000010
              match: exact
              served: false
              reason: house-price-median is not published for nhsEnglandRegion areas.
            - place: nhsEnglandRegion/E40000014
              kind: area
              name: North West
              geography: nhsEnglandRegion
              code: E40000014
