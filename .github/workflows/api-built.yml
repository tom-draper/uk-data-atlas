name: Built API verification

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: built-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  built-api:
    name: Build and contract-test API
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify committed browser data
        run: pnpm data:verify-precompiled
      - name: Build API data from the pinned raw release
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm --dir services/api build:data
      - name: Build API runtime
        run: pnpm --dir services/api build:runtime
      - name: Run built API contract suite
        run: pnpm --dir services/api test
      - name: Typecheck API
        run: pnpm --dir services/api typecheck
