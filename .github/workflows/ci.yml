name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The build-dependent API suite downloads the pinned raw-data release
      # weekly in api-built.yml; keep pull-request feedback quick.
      - run: pnpm check
      - name: Test API release compilation with fixture artifacts
        if: github.event_name == 'pull_request'
        run: pnpm --dir services/api exec tsx --test tests/built/atlasRelease.test.ts

  website-build:
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-
      - name: Build the production website
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm build
