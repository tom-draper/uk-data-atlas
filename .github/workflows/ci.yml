name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only checks that need no generated data run here. Generating it takes
      # the 1.3 GB source release and hours, so tests that read it run locally
      # through pnpm check:full, and the website is built on the server. The
      # parity checks run in pnpm data:verify; pnpm check tests their logic,
      # and any pipeline run here (CI is set) switches them on.
      - run: pnpm --dir services/api generate:openapi --check
      - run: pnpm check
      # Ids are never changed once assigned (docs/stable-ids.md): a change may
      # add registry files and lines but not edit what its base has. A shallow
      # fetch of the base is enough, since only its files are read.
      - name: Id registries only grow
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base to compare with."
          else
            git fetch --no-tags --depth=1 origin "$BASE"
            pnpm ids check --base FETCH_HEAD
          fi
