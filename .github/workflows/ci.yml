name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only checks that need no generated data run here. Generating it takes
      # the 1.3 GB source release and hours, so tests that read it run locally
      # through pnpm check:full, and the website is built on the server.
      - run: pnpm --dir services/api generate:openapi --check
      - run: pnpm check
