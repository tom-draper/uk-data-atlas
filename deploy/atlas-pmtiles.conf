# Content-addressed archives retain their bytes across deployments.
location ~ "^/data/boundaries/([A-Za-z0-9_-]+)/([A-Za-z0-9_-]+)/([a-f0-9]{64})\.pmtiles$" {
    alias /var/www/uk-data-atlas/boundaries/$1/$2/$3.pmtiles;
    default_type application/octet-stream;
    sendfile on;
    gzip off;
    etag on;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Compatibility alias for the first content-hashed release.
location ~ ^/data/boundaries/([A-Za-z0-9_-]+)/([A-Za-z0-9_-]+)/boundaries\.pmtiles$ {
    alias /var/www/uk-data-atlas/boundaries/$1/$2/boundaries.pmtiles;
    default_type application/octet-stream;
    sendfile on;
    gzip off;
    etag on;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}
