map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# API requests can contain locations in their path, query or headers.
log_format atlas_api '$time_iso8601 status=$status bytes=$body_bytes_sent '
                     'duration=$request_time upstream_status=$upstream_status';

# Keep direct requests to the server IP available over HTTP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 128.140.0.185 _;
    include snippets/atlas-pmtiles.conf;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ukdataatlas.com www.ukdataatlas.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.ukdataatlas.com;
    access_log /var/log/nginx/atlas-api-access.log atlas_api;
    error_log /dev/null;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ukdataatlas.com www.ukdataatlas.com;
    ssl_certificate /etc/letsencrypt/live/ukdataatlas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ukdataatlas.com/privkey.pem;
    include snippets/atlas-pmtiles.conf;
    include snippets/atlas-tls.conf;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.ukdataatlas.com;
    access_log /var/log/nginx/atlas-api-access.log atlas_api;
    # Nginx can include the full request line in proxy errors.
    error_log /dev/null;
    ssl_certificate /etc/letsencrypt/live/api.ukdataatlas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ukdataatlas.com/privkey.pem;
    include snippets/atlas-tls.conf;
    # The API accepts bodies up to 8 MB, which /fix sends for a long column.
    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
