map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Keep direct requests to the server IP available over HTTP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 128.140.0.185 _;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ukdataatlas.com www.ukdataatlas.com api.ukdataatlas.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ukdataatlas.com www.ukdataatlas.com;
    ssl_certificate /etc/letsencrypt/live/ukdataatlas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ukdataatlas.com/privkey.pem;
    include snippets/atlas-tls.conf;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.ukdataatlas.com;
    ssl_certificate /etc/letsencrypt/live/api.ukdataatlas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ukdataatlas.com/privkey.pem;
    include snippets/atlas-tls.conf;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
